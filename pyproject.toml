[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mina-island-reassembly"
version = "0.9.0"
description = "Island community reassembly analyses for Palmer Archipelago penguins"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mina-palmer = "mina.palmer:main"
mina-longterm = "mina.longterm:main"
mina-network = "mina.network:main"
mina-lter = "mina.lter:main"
mina-mechanism = "mina.mechanism:main"
mina-weather = "mina.weather:main"
mina-colony-network = "mina.colony_network:main"
mina-large-groups = "mina.large_groups:main"
mina-synthesis = "mina.synthesis:main"\nmina-spatial-triangulation = "mina.spatial_triangulation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
