[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mina-island-reassembly"
version = "0.15.0"
description = "Island community reassembly analyses for Palmer Archipelago penguins"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]
figures = ["matplotlib>=3.8,<4"]

[project.scripts]
mina-palmer = "mina.palmer:main"
mina-longterm = "mina.longterm:main"
mina-network = "mina.network:main"
mina-lter = "mina.lter:main"
mina-mechanism = "mina.mechanism:main"
mina-weather = "mina.weather:main"
mina-colony-network = "mina.colony_network:main"
mina-large-groups = "mina.large_groups:main"
mina-synthesis = "mina.synthesis:main"
mina-spatial-triangulation = "mina.spatial_triangulation:main"
mina-figure-data = "mina.figure_data:main"
mina-figures = "mina.figures:main"
mina-manuscript-guard = "mina.manuscript_guard:main"
mina-jae-guard = "mina.jae_guard:main"
mina-neff-permutation = "mina.neff_permutation:main"
mina-neff-coupling = "mina.neff_coupling:main"
mina-neff-circular-shift = "mina.neff_circular_shift:main"
mina-hierarchical-variability = "mina.hierarchical_variability:main"
mina-neff-momentum = "mina.neff_momentum:main"
mina-hierarchy-component-audit = "mina.hierarchy_component_audit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
