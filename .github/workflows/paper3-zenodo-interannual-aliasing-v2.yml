name: paper3-zenodo-interannual-aliasing-v2

on:
  push:
    branches: [research/emperor-mobile-islands-v1]
    paths:
      - "contracts/PAPER3_ZENODO_SEASON_REFERENCE_SEMANTIC_V2.json"
      - "contracts/PAPER3_ZENODO_INTERANNUAL_ALIASING_V2.json"
      - "scripts/validate_emperor_zenodo_season_reference_from_v1.py"
      - "scripts/run_paper3_zenodo_interannual_aliasing_v2.py"
      - "tests/test_emperor_zenodo_season_reference_from_v1.py"
      - "tests/test_paper3_zenodo_interannual_aliasing_v2.py"
      - ".github/workflows/paper3-zenodo-interannual-aliasing-v2.yml"
  pull_request:
    paths:
      - "contracts/PAPER3_ZENODO_SEASON_REFERENCE_SEMANTIC_V2.json"
      - "contracts/PAPER3_ZENODO_INTERANNUAL_ALIASING_V2.json"
      - "scripts/validate_emperor_zenodo_season_reference_from_v1.py"
      - "scripts/run_paper3_zenodo_interannual_aliasing_v2.py"
      - "tests/test_emperor_zenodo_season_reference_from_v1.py"
      - "tests/test_paper3_zenodo_interannual_aliasing_v2.py"
      - ".github/workflows/paper3-zenodo-interannual-aliasing-v2.yml"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy pyproj
      - run: python -m unittest tests.test_emperor_zenodo_season_reference_from_v1 tests.test_paper3_zenodo_interannual_aliasing_v2 -v

      - name: Download frozen V1 source-feature artifact
        run: |
          mkdir -p build/source build/out
          gh run download 37209896612 \
            -n paper3-emperor-zenodo-route-semantic-v1 \
            -D build/source
          test -f build/source/PAPER3_ZENODO_ROUTE_COLONY_POINTS_V1.csv

      - name: Validate corrected season-reference semantics
        run: |
          python scripts/validate_emperor_zenodo_season_reference_from_v1.py \
            --contract contracts/PAPER3_ZENODO_SEASON_REFERENCE_SEMANTIC_V2.json \
            --features-csv build/source/PAPER3_ZENODO_ROUTE_COLONY_POINTS_V1.csv \
            --out-json build/out/PAPER3_ZENODO_SEASON_REFERENCE_SEMANTIC_RESULT_V2.json \
            --out-seasons-csv build/out/PAPER3_ZENODO_SEASON_REFERENCE_POINTS_V2.csv
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("build/out/PAPER3_ZENODO_SEASON_REFERENCE_SEMANTIC_RESULT_V2.json").read_text())
          assert x["decision"]["semantic_gate_passed"] is True
          assert x["decision"]["movement_outcomes_opened"] is False
          assert x["summary"]["colony_seasons"] == 30
          assert x["summary"]["invariant_seasons"] == 30
          PY

      - name: Run frozen interannual aliasing curve
        run: |
          python scripts/run_paper3_zenodo_interannual_aliasing_v2.py \
            --semantic-json build/out/PAPER3_ZENODO_SEASON_REFERENCE_SEMANTIC_RESULT_V2.json \
            --seasons-csv build/out/PAPER3_ZENODO_SEASON_REFERENCE_POINTS_V2.csv \
            --contract contracts/PAPER3_ZENODO_INTERANNUAL_ALIASING_V2.json \
            --out-json build/out/PAPER3_ZENODO_INTERANNUAL_ALIASING_RESULT_V2.json \
            --out-anchors-csv build/out/PAPER3_ZENODO_ANNUAL_ANCHORS_V2.csv \
            --out-transitions-csv build/out/PAPER3_ZENODO_INTERANNUAL_TRANSITIONS_V2.csv
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("build/out/PAPER3_ZENODO_INTERANNUAL_ALIASING_RESULT_V2.json").read_text())
          assert x["support"]["annual_anchors"] == 30
          assert x["support"]["consecutive_transitions"] == 27
          assert set(x["aliasing_curve"]) == {"0.5","1","2","5","10"}
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper3-zenodo-interannual-aliasing-v2
          path: |
            build/out/PAPER3_ZENODO_SEASON_REFERENCE_SEMANTIC_RESULT_V2.json
            build/out/PAPER3_ZENODO_SEASON_REFERENCE_POINTS_V2.csv
            build/out/PAPER3_ZENODO_INTERANNUAL_ALIASING_RESULT_V2.json
            build/out/PAPER3_ZENODO_ANNUAL_ANCHORS_V2.csv
            build/out/PAPER3_ZENODO_INTERANNUAL_TRANSITIONS_V2.csv
          if-no-files-found: warn
