name: JNCC V35 primary seabird sites to RSPB predator islands centroid support (NO COUNT FIT)

on:
  push:
    branches: [research/jncc-v32-mechanism-contract]
    paths:
      - 'contracts/JNCC_ORIGINAL_PREDATOR_ISLAND_POINT_PROXIMITY_V35.md'
      - 'scripts/audit_jncc_rpsb_predator_point_proximity_v35.py'
      - 'scripts/audit_jncc_predator_island_source_v33.py'
      - 'tests/test_jncc_rpsb_predator_point_proximity_v35.py'
      - '.github/workflows/seabird-jncc-predator-proximity-v35.yml'
  pull_request:
    paths:
      - 'contracts/JNCC_ORIGINAL_PREDATOR_ISLAND_POINT_PROXIMITY_V35.md'
      - 'scripts/audit_jncc_rpsb_predator_point_proximity_v35.py'
      - 'scripts/audit_jncc_predator_island_source_v33.py'
      - 'tests/test_jncc_rpsb_predator_point_proximity_v35.py'
      - '.github/workflows/seabird-jncc-predator-proximity-v35.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict_source_only_centroid_proximity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original JNCC/RSPB spatial source readers
        run: python -m pip install pytest requests numpy scipy pyproj
      - name: Test false RSPB physical-island joins are not promoted
        run: python -m pytest -q tests/test_jncc_rpsb_predator_point_proximity_v35.py tests/test_jncc_predator_island_source_v33.py
      - name: Inspect original site geometry and mixed-centroid supports without opening animal count magnitudes
        run: |
          python scripts/audit_jncc_rpsb_predator_point_proximity_v35.py \
            --out /tmp/JNCC_2014_RSPB_2017_PREDATOR_CENTROID_SUPPORT_V35.json
      - name: Upload read-only geographic metadata support receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jncc-rspb-v35-no-seabird-counts-geographic-source-support
          path: /tmp/JNCC_2014_RSPB_2017_PREDATOR_CENTROID_SUPPORT_V35.json
          if-no-files-found: warn
