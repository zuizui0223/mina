name: Ross Island six subsite 1999 2001 2024 NZ source comparison
on:
  push:
    branches:
      - research/island-recovery-stage-mechanism-gate-v1
    paths:
      - 'contracts/ROSS_2026_AERIAL_SIX_SITE_PROPORTIONAL_RECOVERY_V14.json'
      - 'scripts/audit_ross_2026_six_site_recovery_benchmark_v14.py'
      - 'tests/test_ross_2026_six_site_recovery_benchmark_v14.py'
      - '.github/workflows/ross-six-site-2026-nz-census-contrast-v14.yml'
  pull_request:
    paths:
      - 'contracts/ROSS_2026_AERIAL_SIX_SITE_PROPORTIONAL_RECOVERY_V14.json'
      - 'scripts/audit_ross_2026_six_site_recovery_benchmark_v14.py'
      - 'tests/test_ross_2026_six_site_recovery_benchmark_v14.py'
      - '.github/workflows/ross-six-site-2026-nz-census-contrast-v14.yml'
jobs:
  source-fixed-six-unit-contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test matching six actual sites and reject filled source data
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_ross_2026_six_site_recovery_benchmark_v14.py
      - name: Original MD5 verified NZ 2026 XLSX descriptive 6-subsite panel
        run: |
          python scripts/audit_ross_2026_six_site_recovery_benchmark_v14.py \
            --out /tmp/ross_six_site_2026_nz_source_counts.json
      - name: Ensure same denominators, lack of identity, and no biological causality
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ross_six_site_2026_nz_source_counts.json'))
          assert d['status']=='ROSS_ISLAND_SIX_NAMED_SITE_PAIR_CENSUS_DESCRIPTIVE_NO_CAUSAL_IMMIGRATION'
          assert d['source_six_site_breeding_pair_totals']=={'1999':207411,'2001':94798,'2024':310423}
          assert d['same_named_site_count']==6
          assert d['source_explicit_zeros']==2
          assert d['source_missing_entries']==1192
          assert d['single_Ross_Island_six_subsites_not_six_independent_islands']
          assert d['regional_pair_growth_not_individual_migration']
          assert not d['georeferenced_2024_Cape_Barne_census_observation']
          assert not d['posterior_demographic_nest_recruitment_model_fitted']
          assert d['no_new_causal_island_effect']
          assert d['frozen_PR189_unmodified']
          print('SIX_2026_SITE_EXTERNAL_COUNT_AUDIT_PASS_NO_CAUSAL_ISSUE')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ross-six-subsite-paired-counts-NZ-2026-md5-gated-v14
          path: /tmp/ross_six_site_2026_nz_source_counts.json
          retention-days: 30
          if-no-files-found: ignore
