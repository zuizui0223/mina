name: unified-network-concentration-step6-manuscript-figures

on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - "research/network_concentration_unified_v1/render_step6_manuscript_figures.py"
      - ".github/workflows/unified-network-concentration-step6-manuscript-figures.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-locked-figures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/climate-penguin-progress
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fixed plotting libraries
        run: |
          python -m pip install numpy==2.2.6 matplotlib==3.10.7 Pillow==11.3.0
          python -m py_compile research/network_concentration_unified_v1/render_step6_manuscript_figures.py
      - name: Render 3 scientific figures from already-verified source outcomes
        run: |
          python research/network_concentration_unified_v1/render_step6_manuscript_figures.py
      - name: Verify figure files, sample sizes and no new inferential calculations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          b=Path("research/network_concentration_unified_v1")
          a=json.loads((b/"outputs/STEP6_FIGURES_QA.json").read_text())
          assert a["status"]=="SOURCE_VERIFIED_DESCRIPTIVE_MANUSCRIPT_FIGURES"
          assert a["sample_N"]==663 and a["positive_N"]==436
          assert a["species_count"]==17 and a["no_new_inference"] is True
          assert len(a["figures"])==3
          for x in a["figures"]:
            assert x["png_width"]>=1100 and x["png_height"]>=500
            assert (b/"figures"/(x["stem"]+".png")).is_file()
            assert (b/"figures"/(x["stem"]+".svg")).is_file()
          print("PASS: same original source outcomes, three checked figures")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mina-step6-manuscript-figures-source-verified
          retention-days: 90
          path: |
            research/network_concentration_unified_v1/figures/*.png
            research/network_concentration_unified_v1/figures/*.svg
            research/network_concentration_unified_v1/figures/FIGURE_CAPTIONS_V0_1.md
            research/network_concentration_unified_v1/outputs/STEP6_FIGURES_QA.json
      - name: Commit derived figures only to Draft PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            research/network_concentration_unified_v1/figures/ \
            research/network_concentration_unified_v1/outputs/STEP6_FIGURES_QA.json
          if git diff --cached --quiet; then
            echo "Figures unchanged"
          else
            git commit -m "Step6: render verified species/network support and H3/H4 manuscript figures"
            git push origin HEAD:codex/climate-penguin-progress
          fi
