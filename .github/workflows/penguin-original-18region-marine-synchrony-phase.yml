name: Penguin 18-region original marine PC1/PC2 28-year synchrony, phase and unique-cell audit
on:
  push:
    branches: [analysis/penguin-decade-redistribution-v1-20261110]
    paths:
      - 'research/climate-penguin/macro_panantarctic_v1/analyze_original_18region_marine_time_synchrony.py'
      - 'research/climate-penguin/macro_panantarctic_v1/unit_test_18region_marine_time_synchrony.py'
      - 'research/climate-penguin/macro_panantarctic_v1/REGIONAL_MARINE_SYNCHRONY_CONTRACT_20261112.md'
      - '.github/workflows/penguin-original-18region-marine-synchrony-phase.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-18-source-region-climate-synchrony-and-cell-weight-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install immutable original marine physical PCA numerical source dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Verify 28-year source geographic weighting, 1993–2000 early era, EOF signed phases and fixed 1,000-offset reference
        run: |
          python -m py_compile research/climate-penguin/macro_panantarctic_v1/analyze_original_18region_marine_time_synchrony.py
          python research/climate-penguin/macro_panantarctic_v1/unit_test_18region_marine_time_synchrony.py -v
      - name: Reuse exact source-verified 588 Antarctic colony 1993–2020 SIC salinity thetao 18-region annual climate and source region-year panels
        uses: actions/download-artifact@v4
        with:
          name: penguin-original-588-colony-18-region-1993-2020-marine-axis-and-breeding-composition-v1
          run-id: 42961084667
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/previous_original_588_18region
      - name: Reproduce source 18-region×28-year PC1 and calculate real PC2 temporal synchronization with unique marine grid cell weighting
        run: |
          CLIMATE="$(find build/previous_original_588_18region -name 'original_588_site_1993_2020_actual_SIC_SSS_SST_PC1.csv' -print -quit)"
          REGION="$(find build/previous_original_588_18region -name 'original_18region_28yr_marine_PC1_timeseries.csv' -print -quit)"
          TRENDS="$(find build/previous_original_588_18region -name 'original_18region_marine_1993_2020_temporal_trends.csv' -print -quit)"
          test -s "$CLIMATE" && test -s "$REGION" && test -s "$TRENDS"
          python research/climate-penguin/macro_panantarctic_v1/analyze_original_18region_marine_time_synchrony.py \
            --climate "$CLIMATE" \
            --original-region-year "$REGION" \
            --original-region-trends "$TRENDS" \
            --out research/climate-penguin/macro_panantarctic_v1/region_marine_synchrony_outputs
      - name: Archive exact 588 colony 18 region/year site vs native cell-weight source modes and 1000 phase reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: penguin-original-18region-marine-28year-synchrony-cell-weight-and-phase-reference-v1
          path: research/climate-penguin/macro_panantarctic_v1/region_marine_synchrony_outputs/
          if-no-files-found: warn
