name: paper2-published-guano-scene-crosswalk

on:
  push:
    branches: [research/antarctic-island-ecology-v1]
    paths:
      - "contracts/PAPER2_PUBLISHED_GUANO_SCENE_CROSSWALK_V1.json"
      - "scripts/crosswalk_published_guano_source_scenes.py"
      - "tests/test_published_guano_scene_crosswalk.py"
      - ".github/workflows/paper2-published-guano-scene-crosswalk.yml"
  pull_request:
    paths:
      - "contracts/PAPER2_PUBLISHED_GUANO_SCENE_CROSSWALK_V1.json"
      - "scripts/crosswalk_published_guano_source_scenes.py"
      - "tests/test_published_guano_scene_crosswalk.py"
      - ".github/workflows/paper2-published-guano-scene-crosswalk.yml"
  workflow_dispatch:

jobs:
  crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas requests
      - run: python -m unittest tests.test_published_guano_scene_crosswalk -v
      - name: Crosswalk published PANGAEA source scenes
        run: |
          mkdir -p build/out
          python scripts/crosswalk_published_guano_source_scenes.py \
            --contract contracts/PAPER2_PUBLISHED_GUANO_SCENE_CROSSWALK_V1.json \
            --out-csv build/out/PAPER2_PUBLISHED_GUANO_SCENE_CROSSWALK_V1.csv \
            --out-json build/out/PAPER2_PUBLISHED_GUANO_SCENE_CROSSWALK_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper2-published-guano-scene-crosswalk-v1
          path: build/out/*
          if-no-files-found: warn
