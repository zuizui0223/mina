name: Seabird V28 JNCC revised 2024 two-census source structure
on:
  push:
    branches: [research/seabird-island-generality-v1]
    paths:
      - 'contracts/JNCC_TWO_CENSUSES_SOURCE_V28.md'
      - 'scripts/audit_jncc_two_censuses_source_v28.py'
      - 'tests/test_jncc_two_censuses_source_v28.py'
      - '.github/workflows/seabird-jncc-two-censuses-v28.yml'
  pull_request:
    paths:
      - 'contracts/JNCC_TWO_CENSUSES_SOURCE_V28.md'
      - 'scripts/audit_jncc_two_censuses_source_v28.py'
      - 'tests/test_jncc_two_censuses_source_v28.py'
      - '.github/workflows/seabird-jncc-two-censuses-v28.yml'
  workflow_dispatch:
jobs:
  official_JNCC_revised_two_censuses:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tests and HTTP source retrieval library
        run: python -m pip install pytest requests
      - name: Test Office XML reader no original count magnitude exposure
        run: python -m pytest -q tests/test_jncc_two_censuses_source_v28.py
      - name: Download JNCC 2024 revision and inspect original worksheets and source headers only
        run: |
          python scripts/audit_jncc_two_censuses_source_v28.py \
            --out /tmp/JNCC_2024_REVISED_TWO_CENSUSES_V28_SOURCE_QA.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jncc-original-2024-two-census-headers-only-v28
          path: /tmp/JNCC_2024_REVISED_TWO_CENSUSES_V28_SOURCE_QA.json
