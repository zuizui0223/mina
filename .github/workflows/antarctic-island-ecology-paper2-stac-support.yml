name: antarctic-island-ecology-paper2-stac-support

on:
  push:
    branches: [research/antarctic-island-ecology-v1]
    paths:
      - "scripts/audit_dynamic_habitat_stac_support.py"
      - "tests/test_dynamic_habitat_stac_support.py"
      - "contracts/ANTARCTIC_ISLAND_ECOLOGY_PAPER2_STAC_SUPPORT_V1.json"
      - ".github/workflows/antarctic-island-ecology-paper2-stac-support.yml"
  pull_request:
    paths:
      - "scripts/audit_dynamic_habitat_stac_support.py"
      - "tests/test_dynamic_habitat_stac_support.py"
      - "contracts/ANTARCTIC_ISLAND_ECOLOGY_PAPER2_STAC_SUPPORT_V1.json"
      - ".github/workflows/antarctic-island-ecology-paper2-stac-support.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas requests
      - name: Unit tests
        run: python -m unittest tests.test_dynamic_habitat_stac_support -v
      - name: Download frozen outcome-blind source artifacts
        run: |
          mkdir -p build/forcing build/options
          gh run download 36517700369 -n paper2-forcing-support-audit-v1 -D build/forcing
          gh run download 36489980162 -n antarctic-breeding-options-atlas-v1 -D build/options
          test -f build/forcing/PAPER2_FORCING_SUPPORT_UNITS_V1.csv
          test -f build/options/ANTARCTIC_PENGUIN_BREEDING_OPTIONS_ATLAS_V1.csv
      - name: Audit optical-imagery metadata support
        run: |
          python scripts/audit_dynamic_habitat_stac_support.py \
            --forcing-csv build/forcing/PAPER2_FORCING_SUPPORT_UNITS_V1.csv \
            --atlas-csv build/options/ANTARCTIC_PENGUIN_BREEDING_OPTIONS_ATLAS_V1.csv \
            --contract contracts/ANTARCTIC_ISLAND_ECOLOGY_PAPER2_STAC_SUPPORT_V1.json \
            --out-csv build/PAPER2_DYNAMIC_HABITAT_STAC_SUPPORT_V1.csv \
            --out-json build/PAPER2_DYNAMIC_HABITAT_STAC_SUPPORT_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: antarctic-island-ecology-paper2-stac-support-v1
          path: |
            build/PAPER2_DYNAMIC_HABITAT_STAC_SUPPORT_V1.csv
            build/PAPER2_DYNAMIC_HABITAT_STAC_SUPPORT_RESULT_V1.json
