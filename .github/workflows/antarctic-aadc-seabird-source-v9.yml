name: Antarctic V9 AADC potential ice-free site and seabird survey source schema
on:
  push:
    branches: [research/antarctic-penguin-island-macro-v1]
    paths:
      - 'contracts/AADC_ALL_POTENTIAL_SITES_OCCUPANCY_V9.md'
      - 'scripts/audit_aadc_seabird_potential_sites_v9.py'
      - 'tests/test_aadc_seabird_potential_sites_v9.py'
      - '.github/workflows/antarctic-aadc-seabird-source-v9.yml'
  pull_request:
    paths:
      - 'contracts/AADC_ALL_POTENTIAL_SITES_OCCUPANCY_V9.md'
      - 'scripts/audit_aadc_seabird_potential_sites_v9.py'
      - 'tests/test_aadc_seabird_potential_sites_v9.py'
      - '.github/workflows/antarctic-aadc-seabird-source-v9.yml'
  workflow_dispatch:
jobs:
  original-source-metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-only dependencies
        run: python -m pip install pytest requests
      - name: Test original source safety and schema-only AADC workbook/zip readers
        run: python -m pytest -q tests/test_aadc_seabird_potential_sites_v9.py
      - name: Evaluate AADC exact source status; official SPA HTML is an expected SCIENTIFIC HOLD, not occupancy data
        run: |
          set +e
          python scripts/audit_aadc_seabird_potential_sites_v9.py \
            --out-json /tmp/AADC_POTENTIAL_ICEFREE_AND_BREEDING_OCCUPANCY_SOURCE_V9.json
          code=$?
          set -e
          V9_EXIT_CODE=$code python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('/tmp/AADC_POTENTIAL_ICEFREE_AND_BREEDING_OCCUPANCY_SOURCE_V9.json')
          r=json.loads(p.read_text())
          code=int(os.environ['V9_EXIT_CODE'])
          if r['status']=='AADC_ORIGINAL_POTENTIAL_SITES_AND_SURVEY_SCHEMA_VERIFIED':
              assert code==0
              print('SOURCE-ONLY PASS: authentic machine-readable AADC asset schemas checked.')
          else:
              assert r['status']=='HOLD_AADC_SOURCE_ACCESS_OR_SCHEMA'
              assert code==2
              assert len(r['records'])==2
              for key,item in r['records'].items():
                  assert item.get('format')=='AADC_HTML_DOWNLOAD_OR_AUTHENTICATION_LANDING', (key,item)
                  assert item.get('original_breeding_occurrences_read')==0
              print('EXPECTED SCIENTIFIC HOLD: both official direct-download URLs returned')
              print('generic AADC HTML application shells, NOT public colony/absence rows.')
              print('No original breeding occupancy outcomes were downloaded or fitted.')
          PY
      - name: Diagnose exact public AADC JavaScript app route ONCE without opening seabird data
        run: |
          python - <<'PY'
          import hashlib,re,requests
          url="https://data.aad.gov.au/assets/index-CvupLLiR.js"
          try:
              with requests.get(url,timeout=(15,30),stream=True,
                                headers={"User-Agent":"mina-AADC-public-web-API-diagnosis"}) as response:
                  response.raise_for_status()
                  if response.url!=url:
                      raise ValueError("Unexpected JS publisher redirect")
                  data=bytearray()
                  for chunk in response.iter_content(32768):
                      data.extend(chunk)
                      if len(data)>9000000:
                          raise ValueError("Publisher JS too large for bounded static route audit")
              source=data.decode("utf-8",errors="replace")
              result={"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()}
              for pattern in ("/eds/api/", "/api/dataset/", "/eds/", "object/download", "dataset/", "download"):
                  hits=list(re.finditer(re.escape(pattern),source,re.I))
                  result[pattern]={"total":len(hits),
                                   "first_contexts":[
                                      source[max(0,x.start()-60):min(len(source),x.end()+120)]
                                      for x in hits[:4]]}
              print("OFFICIAL_STATIC_PUBLIC_APP_ROUTE_DIAGNOSTIC",result)
              print("NO original AADC site/occupancy records were accessed.")
          except Exception as e:
              print("OFFICIAL_APP_ROUTE_UNAVAILABLE",type(e).__name__,str(e)[:250])
          PY
      - name: Check official public AADC REST index and resolved file manifests WITHOUT occupancy rows
        run: |
          python - <<'PY'
          import json,re,requests,urllib.parse
          host="data.aad.gov.au"
          url="https://"+host+"/eds/api/dataset?size=10000"
          def fetch_public(u,cap=30000000):
              with requests.get(u,timeout=(20,65),stream=True,
                                headers={"User-Agent":"mina-AADC-public-scientific-dataset-discovery/1.0",
                                         "Accept":"application/json"}) as r:
                  r.raise_for_status()
                  p=urllib.parse.urlparse(r.url)
                  if p.scheme!="https" or p.hostname!=host:
                      raise ValueError("SOURCE_STOP nonpublisher API redirect")
                  raw=bytearray()
                  for chunk in r.iter_content(32768):
                      raw.extend(chunk)
                      if len(raw)>cap:
                          raise ValueError("SOURCE_STOP oversize public metadata response")
              return json.loads(raw)
          try:
              obj=fetch_public(url)
              records=obj if isinstance(obj,list) else (
                  obj.get("datasets",obj.get("items",obj.get("data",[]))))
              if not isinstance(records,list):
                  raise ValueError("SOURCE_STOP public AADC dataset listing not a list")
              print("AADC_SOURCE_API_PUBLIC_INDEX",len(records),
                    "first_public_row_keys",list(records[0])[:30] if records else [])
              for wanted in ("4344","5959"):
                  matched=[row for row in records
                           if str(row.get("eds_id",""))==wanted]
                  print("AADC_SOURCE_EDS_ID",wanted,"matched",len(matched))
                  for one in matched:
                      uid=str(one.get("uuid",""))
                      if not re.fullmatch(
                          r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}",uid
                      ):
                          raise ValueError("SOURCE_STOP invalid uuid for "+wanted)
                      print("AADC_VERIFIED_PUBLIC_DATASET_ID",wanted,
                            {k:str(one.get(k,""))[:170] for k in
                             ("uuid","eds_id","title","name","doi","metadata_id")})
                      endpoint=("https://"+host+"/eds/api/dataset/"+
                                uid+"/objects?recursive=true&removeBasePath=true")
                      objects=fetch_public(endpoint,cap=2500000)
                      vals=objects if isinstance(objects,list) else (
                          objects.get("objects",objects.get("items",objects.get("data",[]))))
                      print("AADC_PUBLIC_OBJECT_LIST",wanted,
                            "count",len(vals) if isinstance(vals,list) else None,
                            "first_structure_keys",list(vals[0])[:20] if vals else [])
                      if isinstance(vals,list):
                          for row in vals[:40]:
                              if isinstance(row,dict):
                                  print("AADC_PUBLIC_OBJECT_NAME",wanted,
                                        str(row.get("key",row.get("name",
                                            row.get("prefix",""))))[:240])
              print("NO AADC BIOLOGICAL RESPONSE ROWS OPENED BY REST INDEX DIAGNOSIS")
          except Exception as error:
              print("AADC_PUBLIC_API_DISCOVERY_HOLD",type(error).__name__,
                    str(error)[:400])
              print("No occupancy ecology effects or source zeros inferred")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-AADC-seabird-potential-sites-source-schema-no-effects
          path: /tmp/AADC_POTENTIAL_ICEFREE_AND_BREEDING_OCCUPANCY_SOURCE_V9.json
