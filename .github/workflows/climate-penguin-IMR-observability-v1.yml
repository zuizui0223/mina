name: climate-penguin-IMR-yearwise-ice-observability-gate-v1
on:
  workflow_dispatch:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - "research/climate-penguin/inputs/IMR_yearwise_acoustic_coverage_2011_2026_v1.csv"
      - "research/climate-penguin/work/climate_penguin/imr_source_observability_2011_2026_v1.py"
      - "tests/test_imr_source_observability_2011_2026_v1.py"
      - ".github/workflows/climate-penguin-IMR-observability-v1.yml"
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install "scipy>=1.11,<2"
      - name: Source-observation 16-year count and missingness gates
        run: python -m unittest discover -s tests -p test_imr_source_observability_2011_2026_v1.py -v
      - name: Regenerate source-respecting acoustic sampling-availability state
        run: |
          python research/climate-penguin/work/climate_penguin/imr_source_observability_2011_2026_v1.py --coverage research/climate-penguin/inputs/IMR_yearwise_acoustic_coverage_2011_2026_v1.csv --acoustic research/climate-penguin/inputs/IMR_annual_overall_acoustic_2011_2025_v1.csv --2026-gate research/climate-penguin/inputs/IMR_2026_acoustic_nonestimable_and_penguin_observatory.json --out build/IMR_source_observability
      - uses: actions/upload-artifact@v4
        with:
          name: IMR-published-survey-observability-2011-2026-v1
          path: build/IMR_source_observability/decision.json
