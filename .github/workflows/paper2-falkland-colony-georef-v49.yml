name: Paper2 V49 Falkland original colony coordinates vs island centroids

on:
  push:
    branches: [research/antarctic-functional-archipelago-v1]
    paths:
      - 'contracts/PAPER2_FALKLAND_FIBD_ORIGINAL_COLONY_COORDINATE_V49.md'
      - 'scripts/audit_paper2_falkland_original_colony_georef_v49.py'
      - 'tests/test_paper2_falkland_original_colony_georef_v49.py'
      - '.github/workflows/paper2-falkland-colony-georef-v49.yml'
  pull_request:
    paths:
      - 'contracts/PAPER2_FALKLAND_FIBD_ORIGINAL_COLONY_COORDINATE_V49.md'
      - 'scripts/audit_paper2_falkland_original_colony_georef_v49.py'
      - 'tests/test_paper2_falkland_original_colony_georef_v49.py'
      - '.github/workflows/paper2-falkland-colony-georef-v49.yml'

permissions:
  contents: read

jobs:
  original_source_co_breeding_colony_geo:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source validation dependencies
        run: python -m pip install requests xlrd numpy pytest
      - name: Test source WGS84 colony-coordinate noncentroid geometry and source-gate validity
        run: python -m pytest -q tests/test_paper2_falkland_original_colony_georef_v49.py
      - name: Audit all real V47 69/63 co-breeding records' native FIG colony-position source
        run: |
          python scripts/audit_paper2_falkland_original_colony_georef_v49.py \
            --out /tmp/PAPER2_V49_FALKLAND_NATIVE_COLONY_GEOREFERENCE_QA.json
      - name: Preserve aggregate georeferencing provenance and no biological flight effect
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper2-v49-FIG-source-colony-geolocation-identifiability
          path: /tmp/PAPER2_V49_FALKLAND_NATIVE_COLONY_GEOREFERENCE_QA.json
          if-no-files-found: warn
