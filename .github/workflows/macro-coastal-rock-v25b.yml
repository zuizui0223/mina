name: V25b topology-validated coastal rock frame
on:
  push:
    branches: [analysis/pygoscelis-count-functional-sensitivity-20261126]
    paths: ['.github/workflows/macro-coastal-rock-v25b.yml']
permissions:
  contents: read
jobs:
  frame:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact geographic dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy pyproj==3.7.1 shapely==2.1.2 geopandas pyogrio rasterio
      - name: Diagnose and verify original topology before frame overlay
        run: |
          mkdir -p sources
          python research/macro_marine_land_footprint_v1/macro_rock_frame_v25b.py sources v25b_result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro-coastal-rock-v25b
          path: v25b_result/
          retention-days: 30
          if-no-files-found: warn
