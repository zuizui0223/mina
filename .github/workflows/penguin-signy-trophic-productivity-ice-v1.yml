name: penguin-signy-trophic-productivity-ice-v1
on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - 'research/climate-penguin/work/signy_trophic_productivity_ice_v1/**'
      - 'research/climate-penguin/outputs/signy_trophic_productivity_ice_v1/**'
      - 'tests/test_signy_trophic_productivity_ice_v1.py'
      - '.github/workflows/penguin-signy-trophic-productivity-ice-v1.yml'
  pull_request:
    paths:
      - 'research/climate-penguin/work/signy_trophic_productivity_ice_v1/**'
      - 'research/climate-penguin/outputs/signy_trophic_productivity_ice_v1/**'
      - 'tests/test_signy_trophic_productivity_ice_v1.py'
      - '.github/workflows/penguin-signy-trophic-productivity-ice-v1.yml'
permissions:
  contents: read
jobs:
  same-year-marine-land-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install publisher source parsing dependencies
        run: python -m pip install pandas lxml html5lib beautifulsoup4
      - name: Synthetic numerical and source guards
        run: python -m unittest discover -s tests -p test_signy_trophic_productivity_ice_v1.py -v
      - name: Acquire all six original BAS diet/stage archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/signy_diet_pub /tmp/signy_stage_pub
          curl -L --fail --retry 2 --max-time 120 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=eb421e6d-b93b-4174-904b-9a7b0b401403&output=zip.tree' -o /tmp/signy_diet_pub/adelie.zip
          curl -L --fail --retry 2 --max-time 120 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=95e38251-797c-495a-abc0-40a613599759&output=zip.tree' -o /tmp/signy_diet_pub/chinstrap.zip
          curl -L --fail --retry 2 --max-time 120 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=fb9bd975-e6fe-406c-84be-01e57d612b5e&output=zip.tree' -o /tmp/signy_diet_pub/gentoo.zip
          curl -L --fail --retry 2 --max-time 120 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=daf2c4fd-c1e3-4e65-851f-d11f02c5b69d&output=zip.tree' -o /tmp/signy_stage_pub/adelie.zip
          curl -L --fail --retry 2 --max-time 120 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=d0633a9b-8c56-4ae5-88bf-6ec6ba9017b9&output=zip.tree' -o /tmp/signy_stage_pub/chinstrap.zip
          curl -L --fail --retry 2 --max-time 120 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=883c6b40-024e-41e8-9c3e-2668a44b5751&output=zip.tree' -o /tmp/signy_stage_pub/gentoo.zip
      - name: Rebuild stomachs and breeding stages from SHA-pinned originals
        run: |
          python research/climate-penguin/work/signy_diet_climate_v1/analyze.py --source-dir /tmp/signy_diet_pub --out /tmp/signy_diet_source_checked
          python research/climate-penguin/work/climate_penguin/signy_trispecies_stage_source_v1.py --source-dir /tmp/signy_stage_pub --out /tmp/signy_stage_source_checked
      - name: Reproduce all 9! permutation and fixed-colony checks
        run: |
          SIGNY_SOURCE_DIET=/tmp/signy_diet_source_checked SIGNY_SOURCE_STAGE=/tmp/signy_stage_source_checked python -m unittest discover -s tests -p test_signy_trophic_productivity_ice_v1.py -v
          python research/climate-penguin/work/signy_trophic_productivity_ice_v1/analyze.py --diet-dir /tmp/signy_diet_source_checked --stage-dir /tmp/signy_stage_source_checked --out /tmp/signy_trophic_productivity_ice
      - uses: actions/upload-artifact@v4
        with:
          name: penguin-signy-trophic-productivity-ice-v1
          path: /tmp/signy_trophic_productivity_ice/
          retention-days: 30
