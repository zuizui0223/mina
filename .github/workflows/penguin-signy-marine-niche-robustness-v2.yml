name: penguin-signy-marine-niche-robustness-v2
on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - 'research/climate-penguin/work/signy_marine_niche_robustness_v2/**'
      - 'research/climate-penguin/outputs/signy_marine_niche_robustness_v2/**'
      - 'tests/test_signy_marine_niche_robustness_v2.py'
      - '.github/workflows/penguin-signy-marine-niche-robustness-v2.yml'
  pull_request:
    paths:
      - 'research/climate-penguin/work/signy_marine_niche_robustness_v2/**'
      - 'research/climate-penguin/outputs/signy_marine_niche_robustness_v2/**'
      - 'tests/test_signy_marine_niche_robustness_v2.py'
      - '.github/workflows/penguin-signy-marine-niche-robustness-v2.yml'
permissions:
  contents: read
jobs:
  check-ice-and-trophic-niche:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_signy_marine_niche_robustness_v2.py' -v
      - name: Obtain pinned original BAS stomach archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/signy_v2_original
          curl -L --fail --retry 2 --retry-delay 3 --max-time 120 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=eb421e6d-b93b-4174-904b-9a7b0b401403&output=zip.tree' -o /tmp/signy_v2_original/adelie.zip
          curl -L --fail --retry 2 --retry-delay 3 --max-time 120 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=95e38251-797c-495a-abc0-40a613599759&output=zip.tree' -o /tmp/signy_v2_original/chinstrap.zip
          curl -L --fail --retry 2 --retry-delay 3 --max-time 120 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=fb9bd975-e6fe-406c-84be-01e57d612b5e&output=zip.tree' -o /tmp/signy_v2_original/gentoo.zip
      - name: Rebuild source-pinned individual stomach observations
        run: python research/climate-penguin/work/signy_diet_climate_v1/analyze.py --source-dir /tmp/signy_v2_original --out /tmp/signy_v2_derived
      - name: Check all source counts and recompute 9-season permutation
        run: |
          SIGNY_DIET_DERIVED_DIR=/tmp/signy_v2_derived python -m unittest discover -s tests -p 'test_signy_marine_niche_robustness_v2.py' -v
          python research/climate-penguin/work/signy_marine_niche_robustness_v2/analyze.py --derived /tmp/signy_v2_derived --out /tmp/signy_v2_verified
      - name: Retain only 9-year aggregated ecological contrasts and receipts
        uses: actions/upload-artifact@v4
        with:
          name: signy-marine-niche-robustness-v2
          path: /tmp/signy_v2_verified/
          retention-days: 30
