name: penguin-scar-stranger-point-ice-v1
on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - 'research/climate-penguin/work/scar_stranger_point_ice_v1/**'
      - 'research/climate-penguin/outputs/scar_stranger_point_ice_v1/**'
      - 'tests/test_scar_stranger_point_ice_v1.py'
      - '.github/workflows/penguin-scar-stranger-point-ice-v1.yml'
  pull_request:
    paths:
      - 'research/climate-penguin/work/scar_stranger_point_ice_v1/**'
      - 'research/climate-penguin/outputs/scar_stranger_point_ice_v1/**'
      - 'tests/test_scar_stranger_point_ice_v1.py'
      - '.github/workflows/penguin-scar-stranger-point-ice-v1.yml'
permissions:
  contents: read
jobs:
  source-checked-independent-adelie:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_scar_stranger_point_ice_v1.py' -v
      - run: |
          curl -L --fail --retry 2 --max-time 180 'https://raw.githubusercontent.com/globalbioticinteractions/scar/1856664248be16b9dcee9ba56d2b23d87f3d9cd1/scar_diet.csv' -o /tmp/scar_original.csv
      - name: Original SCAR Adélie stomach source and three sea-ice proxy audit
        run: |
          python research/climate-penguin/work/scar_stranger_point_ice_v1/analyze.py --diet /tmp/scar_original.csv --out /tmp/stranger_point_climate
      - uses: actions/upload-artifact@v4
        with:
          name: penguin-scar-stranger-point-ice-v1
          path: /tmp/stranger_point_climate/
          retention-days: 30
