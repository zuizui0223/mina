name: Penguin original 23 versus 17 exact four-region growth-alignment diagnostic
on:
  push:
    branches: [analysis/penguin-decade-redistribution-v1-20261110]
    paths:
      - '.github/workflows/penguin-20261121-exact-fourregion-growth-alignment.yml'
      - 'research/climate-penguin/macro_panantarctic_v1/redistribution_marine_exposure_20261120/exact_four_region_growth_alignment_20261121.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-exact-four-regions:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check prior pre-outcome freeze and reproduce all 24 source-fixed assignments
        run: |
          test -s research/climate-penguin/macro_panantarctic_v1/redistribution_marine_exposure_20261120/FROZEN_FOUR_REGION_GROWTH_ALIGNMENT_DIAGNOSTIC_20261121_JA.md
          python -m py_compile research/climate-penguin/macro_panantarctic_v1/redistribution_marine_exposure_20261120/exact_four_region_growth_alignment_20261121.py
          python research/climate-penguin/macro_panantarctic_v1/redistribution_marine_exposure_20261120/exact_four_region_growth_alignment_20261121.py
      - name: Check frozen original cohort and exhaustive measurement identity
        run: |
          python - <<'PY'
          import json,csv
          from pathlib import Path
          root=Path("research/climate-penguin/macro_panantarctic_v1/redistribution_marine_exposure_20261120")
          d=json.loads((root/"FOUR_REGION_GROWTH_ASSIGNMENT_EXACT24_20261121.json").read_text())
          with (root/"FOUR_REGION_GROWTH_ASSIGNMENT_EXACT24_20261121.csv").open(newline="") as f: rows=list(csv.DictReader(f))
          assert len(rows)==48
          assert sum(x["identity"]=="True" for x in rows)==2
          assert d["not_an_inferential_p_value"] and d["no_adaptive_tracking_or_warming_causation"]
          assert d["post_outcome_frozen"]
          for label in ("parent23","complete17"):
              p=d[label]
              assert p["permutation_count"]==24
              assert p["between_ge_observed_count_including_identity"]>=1
              assert p["between_rank_from_highest_with_ties"]==p["between_ge_observed_count_including_identity"]
              assert p["between_values"]["max"]>=p["original_observed"]["between_region_pp"]
              assert abs(p["original_observed"]["nest_reallocation_component_pp"]-(p["original_observed"]["between_region_pp"]+p["original_observed"]["within_region_pp"]))<1e-10
          print("PASS 23/17 original-source identities, 4! exhaustive permutations per cohort, no ecological permutation p value")
          PY
      - name: Save exact conditional enumeration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: penguin-source-4reporting-regions-exact24-growth-ice-alignment
          path: |
            research/climate-penguin/macro_panantarctic_v1/redistribution_marine_exposure_20261120/FOUR_REGION_GROWTH_ASSIGNMENT_EXACT24_20261121.json
            research/climate-penguin/macro_panantarctic_v1/redistribution_marine_exposure_20261120/FOUR_REGION_GROWTH_ASSIGNMENT_EXACT24_20261121.csv
          if-no-files-found: warn
          retention-days: 30
