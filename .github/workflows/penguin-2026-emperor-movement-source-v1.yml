name: penguin-independent-2026-emperor-location-source-v1
on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - "research/climate-penguin/work/macdonald2026_true_emperor_movement_v1/**"
      - "research/climate-penguin/outputs/macdonald2026_true_emperor_movement_v1/**"
      - ".github/workflows/penguin-2026-emperor-movement-source-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  uk-polar-author-location-source:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch Macdonald et al. (2026) original UK Polar Data Centre shapefile archive and inspect
        run: python research/climate-penguin/work/macdonald2026_true_emperor_movement_v1/probe.py
      - name: Inspect original 24 geo-tracked shapefiles and provenance before calculating movement
        run: python research/climate-penguin/work/macdonald2026_true_emperor_movement_v1/inspect.py
      - name: Archive DOI landing metadata and tracking source ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macdonald2026-original-emperor-3colony-tracking
          path: |
            research/climate-penguin/outputs/macdonald2026_true_emperor_movement_v1/*.json
            research/climate-penguin/outputs/macdonald2026_true_emperor_movement_v1/*.zip
            research/climate-penguin/outputs/macdonald2026_true_emperor_movement_v1/*.html
            research/climate-penguin/outputs/macdonald2026_true_emperor_movement_v1/*.txt
          if-no-files-found: error
          retention-days: 45
