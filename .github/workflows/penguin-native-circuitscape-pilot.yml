name: Penguin native Circuitscape ocean resistance pilot
on:
  push:
    branches: [codex/penguin-circuitscape-feasibility-20261108]
    paths:
      - 'research/climate-penguin/warming_unified_v1/circuitscape_gate/build_circuit_inputs.py'
      - 'research/climate-penguin/warming_unified_v1/circuitscape_gate/run_native_circuitscape.jl'
      - 'research/climate-penguin/warming_unified_v1/circuitscape_gate/validate_circuit_results.py'
      - '.github/workflows/penguin-native-circuitscape-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-circuitscape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original satellite and independent Laplacian readers
        run: python -m pip install --disable-pip-version-check numpy xarray netCDF4 scipy
      - name: Compile frozen satellite grid and numerical validation scripts
        run: python -m py_compile research/climate-penguin/warming_unified_v1/circuitscape_gate/build_circuit_inputs.py research/climate-penguin/warming_unified_v1/circuitscape_gate/validate_circuit_results.py
      - name: Reconstruct frozen 25 km original ocean grids and six nodes
        run: python research/climate-penguin/warming_unified_v1/circuitscape_gate/build_circuit_inputs.py
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - name: Install native Julia Circuitscape.jl package in recorded project
        shell: bash
        run: |
          set -euo pipefail
          julia --startup-file=no --project=research/climate-penguin/warming_unified_v1/circuitscape_gate/circuit_outputs -e 'import Pkg; Pkg.add("Circuitscape"); Pkg.status()'
      - name: Compute actual Circuitscape pairwise effective resistances
        shell: bash
        run: |
          set -euo pipefail
          julia --startup-file=no --project=research/climate-penguin/warming_unified_v1/circuitscape_gate/circuit_outputs research/climate-penguin/warming_unified_v1/circuitscape_gate/run_native_circuitscape.jl
      - name: Independently validate full six-colony resistance matrices
        run: python research/climate-penguin/warming_unified_v1/circuitscape_gate/validate_circuit_results.py
      - name: Save actual native Circuitscape and source-pinned numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: penguin-osi-native-circuitscape-six-site-v1
          path: |
            research/climate-penguin/warming_unified_v1/circuitscape_gate/circuit_outputs/build_manifest.json
            research/climate-penguin/warming_unified_v1/circuitscape_gate/circuit_outputs/circuit_scenarios.tsv
            research/climate-penguin/warming_unified_v1/circuitscape_gate/circuit_outputs/Project.toml
            research/climate-penguin/warming_unified_v1/circuitscape_gate/circuit_outputs/Manifest.toml
            research/climate-penguin/warming_unified_v1/circuitscape_gate/circuit_outputs/inputs/*.asc
            research/climate-penguin/warming_unified_v1/circuitscape_gate/circuit_outputs/solves/*.out
            research/climate-penguin/warming_unified_v1/circuitscape_gate/circuit_outputs/solves/*.csv
            research/climate-penguin/warming_unified_v1/circuitscape_gate/circuit_outputs/solves/*cum_curmap.asc
            research/climate-penguin/warming_unified_v1/circuitscape_gate/circuit_outputs/comparison_summary.json
            research/climate-penguin/warming_unified_v1/circuitscape_gate/circuit_outputs/pairwise_effective_resistances.csv
            research/climate-penguin/warming_unified_v1/circuitscape_gate/circuit_outputs/scipy_independent_solver_crosscheck.csv
          if-no-files-found: warn
