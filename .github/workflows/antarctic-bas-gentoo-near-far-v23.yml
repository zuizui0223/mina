name: Antarctic V23 original BAS Gentoo near-versus-far spatial growth
on:
  push:
    branches: [research/antarctic-penguin-island-macro-v1]
    paths:
      - 'contracts/BAS_GENTOO_NEAR_FAR_REGION_V23.md'
      - 'scripts/compare_bas_gentoo_near_far_v23.py'
      - 'tests/test_bas_gentoo_near_far_v23.py'
      - '.github/workflows/antarctic-bas-gentoo-near-far-v23.yml'
  pull_request:
    paths:
      - 'contracts/BAS_GENTOO_NEAR_FAR_REGION_V23.md'
      - 'scripts/compare_bas_gentoo_near_far_v23.py'
      - 'tests/test_bas_gentoo_near_far_v23.py'
      - '.github/workflows/antarctic-bas-gentoo-near-far-v23.yml'
  workflow_dispatch:
jobs:
  original_BAS_within_provider_near_far:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source access and synthetic tests
        run: python -m pip install pytest requests
      - name: Check original-season, duplicate, missing and same-year guards
        run: python -m pytest -q tests/test_bas_gentoo_near_far_v23.py
      - name: Fetch 3 verified BAS original sources and fit V23 only after frozen V22 reproduction
        run: |
          python scripts/compare_bas_gentoo_near_far_v23.py \
            --json /tmp/BAS_GENTOO_NEAR_VS_FAR_V23.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-bas-3-island-near-far-gentoo-v23
          path: /tmp/BAS_GENTOO_NEAR_VS_FAR_V23.json
