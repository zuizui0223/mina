name: Penguin same-day SIC signal identifiability audit
on:
  push:
    branches: [codex/penguin-circuitscape-feasibility-20261108]
    paths:
      - 'research/climate-penguin/warming_unified_v1/circuitscape_signal_audit/**'
      - '.github/workflows/penguin-circuitscape-signal-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-day-signal:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original publisher data readers
        run: python -m pip install --disable-pip-version-check numpy scipy xarray netCDF4 'rasterio>=1.4,<1.6'
      - name: Verify pre-score source-only signal audit syntax
        run: |
          python -m py_compile research/climate-penguin/warming_unified_v1/circuitscape_gate/gps_same_day/build_original_days.py
          python -m py_compile research/climate-penguin/warming_unified_v1/circuitscape_signal_audit/analyze.py
      - name: Retrieve original BAS Chinstrap GPS V2 without deriving movement outcomes
        run: |
          mkdir -p build/chinstrap_gps_circuit_original
          curl -fsSL --retry 4 --retry-delay 7 --max-time 300 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=8f8ccba5-01af-4b00-8a3b-c3c85b24bf92&output=zip.tree' -o build/chinstrap_gps_circuit_original/original_gps.zip
      - name: Recreate original 45 OSI daily fields and pre-fixed island source geometries
        run: python research/climate-penguin/warming_unified_v1/circuitscape_gate/gps_same_day/build_original_days.py
      - name: Audit original physical SIC variability and GPS-matched distance-bin exposure
        run: python research/climate-penguin/warming_unified_v1/circuitscape_signal_audit/analyze.py
      - name: Archive source Sha and 6 independent island-year signal diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: penguin-original-45day-SIC-signal-identifiability-v1
          path: |
            research/climate-penguin/warming_unified_v1/circuitscape_signal_audit/outputs/*.csv
            research/climate-penguin/warming_unified_v1/circuitscape_signal_audit/outputs/*.json
            research/climate-penguin/warming_unified_v1/circuitscape_gate/gps_same_day/daily_outputs/original_frozen_gps_date_roster.json
            research/climate-penguin/warming_unified_v1/circuitscape_gate/gps_same_day/daily_outputs/original_45_daily_SIC_receipts.json
            research/climate-penguin/warming_unified_v1/circuitscape_gate/gps_same_day/daily_outputs/source_and_model_preflight.json
          if-no-files-found: warn
