name: antarctic-island-ecology-paper2d-full-pixel-qa

on:
  push:
    branches: [research/antarctic-island-ecology-v1]
    paths:
      - "scripts/run_antarctic_island_ecology_full_pixel_qa.py"
      - "scripts/aggregate_antarctic_island_ecology_full_pixel_qa.py"
      - "tests/test_antarctic_island_ecology_full_pixel_qa.py"
      - "contracts/ANTARCTIC_ISLAND_ECOLOGY_PAPER2D_FULL_PIXEL_QA_V1.json"
      - ".github/workflows/antarctic-island-ecology-paper2d-full-pixel-qa.yml"
  pull_request:
    paths:
      - "scripts/run_antarctic_island_ecology_full_pixel_qa.py"
      - "scripts/aggregate_antarctic_island_ecology_full_pixel_qa.py"
      - "tests/test_antarctic_island_ecology_full_pixel_qa.py"
      - "contracts/ANTARCTIC_ISLAND_ECOLOGY_PAPER2D_FULL_PIXEL_QA_V1.json"
      - ".github/workflows/antarctic-island-ecology-paper2d-full-pixel-qa.yml"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy requests rasterio pyproj planetary-computer
      - run: python -m unittest tests.test_antarctic_island_ecology_full_pixel_qa -v

  qa:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy requests rasterio pyproj planetary-computer
      - name: Download frozen optical and static-support artifacts
        run: |
          mkdir -p build/optical build/options build/aei
          gh run download 37186601157 -n antarctic-island-ecology-paper2-optical-catalog-v1 -D build/optical
          gh run download 36520281872 -n antarctic-breeding-options-hierarchy-v1 -D build/options
          test -f build/optical/ANTARCTIC_ISLAND_ECOLOGY_PAPER2_OPTICAL_CATALOG_UNITS_V1.csv
          test -f build/options/ANTARCTIC_PENGUIN_BREEDING_OPTIONS_HIERARCHY_V1.csv
      - name: Download frozen Antarctic Ecosystem Inventory raster
        run: |
          curl -L --fail --retry 5 --retry-delay 5 \
            'https://zenodo.org/records/11629115/files/AntarcticaEcosystemInventory_IceFreeLands_v1_int.tif?download=1' \
            -o build/aei/AntarcticaEcosystemInventory_IceFreeLands_v1_int.tif
          echo 'cde880d73f7f18b44aecf5690aa2dc92  build/aei/AntarcticaEcosystemInventory_IceFreeLands_v1_int.tif' | md5sum -c -
      - name: Run full local-pixel QA shard
        run: |
          mkdir -p build/shard
          python scripts/run_antarctic_island_ecology_full_pixel_qa.py \
            --optical-csv build/optical/ANTARCTIC_ISLAND_ECOLOGY_PAPER2_OPTICAL_CATALOG_UNITS_V1.csv \
            --options-csv build/options/ANTARCTIC_PENGUIN_BREEDING_OPTIONS_HIERARCHY_V1.csv \
            --aei-raster build/aei/AntarcticaEcosystemInventory_IceFreeLands_v1_int.tif \
            --shard-index ${{ matrix.shard }} \
            --n-shards 6 \
            --out-json build/shard/full_pixel_qa_result_shard${{ matrix.shard }}.json \
            --out-sites-csv build/shard/full_pixel_qa_sites_shard${{ matrix.shard }}.csv \
            --out-scenes-csv build/shard/full_pixel_qa_scenes_shard${{ matrix.shard }}.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper2d-full-pixel-qa-shard-${{ matrix.shard }}
          path: build/shard/*
          if-no-files-found: warn

  aggregate:
    needs: qa
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas
      - name: Download shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: paper2d-full-pixel-qa-shard-*
          path: build/shards
          merge-multiple: true
      - name: Download frozen source artifacts
        run: |
          mkdir -p build/optical build/options build/final
          gh run download 37186601157 -n antarctic-island-ecology-paper2-optical-catalog-v1 -D build/optical
          gh run download 36520281872 -n antarctic-breeding-options-hierarchy-v1 -D build/options
      - name: Aggregate frozen full-QA result
        run: |
          python scripts/aggregate_antarctic_island_ecology_full_pixel_qa.py \
            --shard-dir build/shards \
            --optical-csv build/optical/ANTARCTIC_ISLAND_ECOLOGY_PAPER2_OPTICAL_CATALOG_UNITS_V1.csv \
            --options-csv build/options/ANTARCTIC_PENGUIN_BREEDING_OPTIONS_HIERARCHY_V1.csv \
            --out-json build/final/ANTARCTIC_ISLAND_ECOLOGY_PAPER2D_FULL_PIXEL_QA_RESULT_V1.json \
            --out-sites-csv build/final/ANTARCTIC_ISLAND_ECOLOGY_PAPER2D_FULL_PIXEL_QA_SITES_V1.csv \
            --out-units-csv build/final/ANTARCTIC_ISLAND_ECOLOGY_PAPER2D_FULL_PIXEL_QA_UNITS_V1.csv \
            --out-scenes-csv build/final/ANTARCTIC_ISLAND_ECOLOGY_PAPER2D_FULL_PIXEL_QA_SCENES_V1.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: antarctic-island-ecology-paper2d-full-pixel-qa-v1
          path: build/final/*
          if-no-files-found: warn
