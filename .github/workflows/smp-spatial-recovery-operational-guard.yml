name: smp-spatial-recovery-operational-guard

on:
  push:
    branches: [research/smp-spatial-recovery-hysteresis-v1]
    paths:
      - "scripts/record_smp_raw_custody_v1.py"
      - "scripts/freeze_smp_spatial_recovery_stageb_v1.py"
      - "scripts/guarded_run_smp_spatial_recovery_stagec_v1.py"
      - "tests/test_smp_raw_custody.py"
      - "tests/test_smp_spatial_recovery_operational_guard.py"
      - "tests/test_smp_spatial_recovery_operational_guard_end_to_end.py"
      - ".github/workflows/smp-spatial-recovery-operational-guard.yml"
  pull_request:
    paths:
      - "scripts/freeze_smp_spatial_recovery_stageb_v1.py"
      - "scripts/guarded_run_smp_spatial_recovery_stagec_v1.py"
      - "tests/test_smp_spatial_recovery_operational_guard.py"
      - ".github/workflows/smp-spatial-recovery-operational-guard.yml"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy openpyxl
      - run: python -m unittest tests.test_smp_raw_custody tests.test_smp_spatial_recovery_operational_guard tests.test_smp_spatial_recovery_operational_guard_end_to_end -v
