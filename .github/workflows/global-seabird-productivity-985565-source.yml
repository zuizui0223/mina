name: Global seabird productivity 985565 source recovery
on:
  pull_request:
    paths:
      - '.github/workflows/global-seabird-productivity-985565-source.yml'
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Recover publisher version 1 and check schema
        run: |
          python - <<'PY'
          import urllib.request,pathlib,hashlib,json,csv,io,collections
          out=pathlib.Path('/tmp/seabird985565');out.mkdir()
          url='https://datadocs.bco-dmo.org/dataset/985565/file/KA4ARAOIrR1zLV/985565_v1_global_seabird_breeding_success.csv'
          receipt={'doi':'10.26008/1912/bco-dmo.985565.1','version':'2025-09-30','url':url,'status':'NOT_ACQUIRED'}
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'PublicScientificDataAudit/1.0'}),timeout=35) as r:
                  b=r.read(3000001); receipt['bytes']=len(b)
              assert len(b)<3000001
              rows=list(csv.DictReader(io.StringIO(b.decode('utf-8-sig'))))
              required={'year','site','latitude','longitude','species','breeding_success','n'}
              assert len(rows)>1000 and required.issubset(rows[0]),list(rows[0])
              (out/'985565_v1_global_seabird_breeding_success.csv').write_bytes(b)
              cape=[x for x in rows if 'shirreff' in x['site'].lower()]
              assert len(cape)>0
              receipt.update(status='ORIGINAL_PUBLISHER_CSV_ACQUIRED',sha256=hashlib.sha256(b).hexdigest(),headers=list(rows[0]),n_rows=len(rows),n_sites=len(set(x['site'] for x in rows)),n_species=len(set(x['species'] for x in rows)),cape_counts=dict(collections.Counter(x['species'] for x in cape)),cape_year_range=[min(int(x['year']) for x in cape),max(int(x['year']) for x in cape)])
              print(json.dumps(cape,ensure_ascii=False)[:3500])
          except Exception as e:receipt['error']=repr(e)
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2));print(json.dumps(receipt))
          if receipt['status']!='ORIGINAL_PUBLISHER_CSV_ACQUIRED':raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-seabird-productivity-985565
          path: /tmp/seabird985565/
          retention-days: 30
