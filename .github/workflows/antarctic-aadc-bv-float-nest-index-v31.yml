name: Antarctic V31 source-defined averaged occupied-nest index across two real islands
on:
  push:
    branches: [research/antarctic-penguin-island-macro-v1]
    paths:
      - 'contracts/AADC_BV_CONTINUOUS_OCCUPIED_NEST_INDEX_V31.md'
      - 'scripts/model_aadc_bv_float_nest_index_v31.py'
      - 'tests/test_aadc_bv_float_nest_index_v31.py'
      - '.github/workflows/antarctic-aadc-bv-float-nest-index-v31.yml'
  pull_request:
    paths:
      - 'contracts/AADC_BV_CONTINUOUS_OCCUPIED_NEST_INDEX_V31.md'
      - 'scripts/model_aadc_bv_float_nest_index_v31.py'
      - 'tests/test_aadc_bv_float_nest_index_v31.py'
      - '.github/workflows/antarctic-aadc-bv-float-nest-index-v31.yml'
  workflow_dispatch:
jobs:
  authentic_publisher_occupied_nest_index:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original AADC Excel and independent tests
        run: python -m pip install requests openpyxl xlrd pytest
      - name: Test documented averaged nest counts and exact prior source roster
        run: python -m pytest -q tests/test_aadc_bv_float_nest_index_v31.py
      - name: Reopen exact source only with publisher continuous nest-index measurement rule
        run: python scripts/model_aadc_bv_float_nest_index_v31.py --json /tmp/AADC_ORIGINAL_BV_CONTINUOUS_NEST_INDEX_V31.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-aadc-BV-two-real-islands-fractional-nest-index-v31
          path: /tmp/AADC_ORIGINAL_BV_CONTINUOUS_NEST_INDEX_V31.json
