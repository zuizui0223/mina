name: Penguin original Youngflesh isotope proxy reconstruction (not posterior DI)
on:
  push:
    branches: [analysis/penguin-decade-redistribution-v1-20261110]
    paths:
      - 'research/climate-penguin/macro_panantarctic_v1/diet_salinity_source_20261117/reconstruct_isotope_proxy.py'
      - '.github/workflows/penguin-20261117-original-isotope-PLSR5-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-locked-isotope-plsr:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Install isolated scientific dependencies
        run: python -m pip install --disable-pip-version-check 'numpy<3' 'pandas<3' 'scikit-learn>=1.4,<1.9' 'openpyxl>=3,<4'
      - name: Run synthetic and source schema unit test
        run: python research/climate-penguin/macro_panantarctic_v1/diet_salinity_source_20261117/reconstruct_isotope_proxy.py --self-test
      - name: Download 256 MB publisher ZIP, check exact source MD5, extract named original inputs
        run: |
          python - <<'PY'
          import hashlib,json,urllib.request,zipfile,shutil
          from pathlib import Path
          root=Path('build/youngflesh_original_plsr_input')
          root.mkdir(parents=True,exist_ok=True)
          ua={'User-Agent':'mina-original-diet-source-reproduction/0.3 (https://github.com/zuizui0223/mina)'}
          with urllib.request.urlopen(urllib.request.Request('https://zenodo.org/api/records/17409948',headers=ua),timeout=60) as r:
              rec=json.load(r)
          assert rec['id']==17409948
          info=next(f for f in rec['files'] if f['key']=='data.zip')
          assert info['size']==256425816
          assert info['checksum']=='md5:e29a2f68c84e3a515044d554540def2f'
          url=info['links'].get('content') or info['links']['self']
          raw=root/'publisher_raw.zip'
          md5=hashlib.md5()
          n=0
          with urllib.request.urlopen(urllib.request.Request(url,headers=ua),timeout=240) as src, raw.open('wb') as dest:
              while True:
                  chunk=src.read(1_048_576)
                  if not chunk:break
                  dest.write(chunk);md5.update(chunk);n+=len(chunk)
                  if n>256425816:raise ValueError('Publisher-size overrun')
          assert (n,md5.hexdigest())==(256425816,'e29a2f68c84e3a515044d554540def2f')
          needed=['L1/SIA_spectra.csv',
                  'L0/Landsat/landsat_reflectance_L457-2025-07-16.rds',
                  'L0/RSR/L4_TM_RSR.xlsx','L0/RSR/L5_TM_RSR.xlsx','L0/RSR/L7_ETM_RSR.xlsx']
          with zipfile.ZipFile(raw) as z:
              assert z.testzip() is None
              for item in needed:
                  with z.open(item) as src, (root/Path(item).name).open('wb') as out:
                      shutil.copyfileobj(src,out)
          raw.unlink()
          (root/'source_pin.json').write_text(json.dumps({'record_id':17409948,'file':'data.zip','bytes':n,'md5':md5.hexdigest(),
                                                        'members_extracted':needed},indent=2)+'\n')
          print('PASS: source-MD5 verified and extracted exact original lab, image and RSR inputs')
          PY
      - name: Convert original Landsat RDS to exact pixel-level six-band data in temporary workspace
        run: |
          Rscript --vanilla - <<'RS'
          root <- 'build/youngflesh_original_plsr_input'
          x <- readRDS(file.path(root,'landsat_reflectance_L457-2025-07-16.rds'))
          needed <- c('site_id','season','year','month','day','cell','satellite',
                      'blue','green','red','nir','swir1','swir2')
          stopifnot(all(needed %in% names(x)))
          d <- as.data.frame(setNames(lapply(needed,function(k) as.vector(x[[k]])), needed),
                             stringsAsFactors=FALSE)
          stopifnot(nrow(d) > 1000, all(!is.na(d$site_id)), all(!is.na(d$season)))
          write.csv(d,file.path(root,'original_landsat_pixels.csv'),row.names=FALSE)
          cat('SOURCE RDS PIXELS:',nrow(d),'sites:',length(unique(d$site_id)),'\n')
          RS
      - name: Reconstruct five-component isotope PLSR, independently validate calibration, retain day and season outputs
        run: |
          python research/climate-penguin/macro_panantarctic_v1/diet_salinity_source_20261117/reconstruct_isotope_proxy.py \
            --root build/youngflesh_original_plsr_input \
            --out build/youngflesh_isotope_results --nrep 100
      - name: Ensure source provenance and non-posterior DI scope
        run: |
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          root=Path('build/youngflesh_isotope_results')
          r=json.loads((root/'source_plsr5_d15N_proxy_receipt.json').read_text())
          assert r['status']=='SOURCE_LAB_SPECTRA_TO_LANDSAT_DELTA15N_PROXY_RECONSTRUCTED_NOT_ORIGINAL_DI'
          assert r['forward_diet_salinity_effect']=='NOT TESTED'
          d=pd.read_csv(root/'source_d15N_proxy_site_season.csv')
          assert d[['site_id','season']].duplicated().sum()==0
          assert d.predicted_d15N_season_day_equal.notna().all()
          assert d.n_observed_days.gt(0).all()
          print('PASS original input -> model -> strict one-row-per-season aggregate')
          PY
      - name: Preserve source-derived isotope summaries and independent calibration scores only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: penguin-original-youngflesh-isotope-plsr5-pilot-not-posteriorDI
          path: build/youngflesh_isotope_results/
          if-no-files-found: warn
          retention-days: 30
