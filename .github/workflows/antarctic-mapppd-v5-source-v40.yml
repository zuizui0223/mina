name: Antarctic V40 original MAPPPD5 macro source and NZ pedigree
on:
  push:
    branches: [research/antarctic-penguin-island-macro-v1]
    paths: ['contracts/MAPPPD_V5_SOURCE_DEDUP_MACRO_PANEL_V40.md','scripts/audit_mapppd_v5_macro_source_lineage_v40.py','tests/test_mapppd_v5_macro_source_lineage_v40.py','.github/workflows/antarctic-mapppd-v5-source-v40.yml']
  pull_request:
    paths: ['contracts/MAPPPD_V5_SOURCE_DEDUP_MACRO_PANEL_V40.md','scripts/audit_mapppd_v5_macro_source_lineage_v40.py','tests/test_mapppd_v5_macro_source_lineage_v40.py','.github/workflows/antarctic-mapppd-v5-source-v40.yml']
  workflow_dispatch:
jobs:
  exact_publisher_multi_site_source:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest requests
      - run: python -m pytest -q tests/test_mapppd_v5_macro_source_lineage_v40.py
      - run: python scripts/audit_mapppd_v5_macro_source_lineage_v40.py --out /tmp/MAPPPD5_SOURCE_MACRO_V40.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-mapppd-v5-site-stage-lineage-v40
          path: /tmp/MAPPPD5_SOURCE_MACRO_V40.json
