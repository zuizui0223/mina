name: Antarctic ASI verified-visit and rock candidate source support

on:
  push:
    branches: [analysis/postglacial-glims-sourcegate-20261119]
    paths:
      - scripts/audit_asi_glims_rock_candidate_source.py
      - tests/test_asi_glims_rock_candidate_source.py
      - .github/workflows/asi-glims-rock-candidate-source-gate.yml
  workflow_dispatch:

concurrency:
  group: asi-glims-rock-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install direct source-audit dependencies
        run: python -m pip install pandas pyproj
      - name: Synthetic state semantics and site-identity tests
        run: |
          python -m py_compile scripts/audit_asi_glims_rock_candidate_source.py
          python -m unittest discover -s tests -p test_asi_glims_rock_candidate_source.py -v
      - name: Download immutable publisher original ASI files and validate git blob hashes
        run: |
          mkdir -p build/asi build/rock
          base='https://raw.githubusercontent.com/lynch-lab/Schrimpf_etal_PolarBiology_Occupancy/f34545a163ee22eb557ac2cd8c01e219271787aa'
          curl --fail --location --silent --show-error --retry 2 --max-time 60 "$base/Raw_ASI_Data.csv" > build/asi/Raw_ASI_Data.csv
          curl --fail --location --silent --show-error --retry 2 --max-time 60 "$base/ESM_5.csv" > build/asi/ESM_5.csv
          test "$(git hash-object build/asi/Raw_ASI_Data.csv)" = 'b26be882f7a56e77287dbebd897e8762efafe7a3'
          test "$(git hash-object build/asi/ESM_5.csv)" = '44dfb41e696ed84cba54af356204e39f87561533'
      - name: Download frozen original GLIMS/SCAR source-site cohort
        run: |
          gh run download 44508816915 -n glims-scar-rocktime-source-support-20261119 -D build/rock
          test -f build/rock/GLIMS_SCAR_ROCKTIME_SITE_SUPPORT_20261119.csv
      - name: Source-only original ASI 25-site crosswalk and visit-state support
        run: |
          python -m scripts.audit_asi_glims_rock_candidate_source \
            --raw-asi-csv build/asi/Raw_ASI_Data.csv \
            --asi-site-csv build/asi/ESM_5.csv \
            --source-rock-site-csv build/rock/GLIMS_SCAR_ROCKTIME_SITE_SUPPORT_20261119.csv \
            --out-json build/ASI_GLIMS_SCAR_ROCK_ORIGINAL_SOURCE_SUPPORT_20261119.json \
            --out-crosswalk-csv build/ASI_GLIMS_SCAR_ROCK_SITE_CROSSWALK_20261119.csv \
            --out-panel-csv build/ASI_3PYGOSCELIS_OBSERVED_SITE_YEAR_STATES_20261119.csv
      - name: Preserve original source receipt without upgrading to ecological effect
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asi-original-visit-glims-rock-source-gate-20261119
          path: |
            build/ASI_GLIMS_SCAR_ROCK_ORIGINAL_SOURCE_SUPPORT_20261119.json
            build/ASI_GLIMS_SCAR_ROCK_SITE_CROSSWALK_20261119.csv
            build/ASI_3PYGOSCELIS_OBSERVED_SITE_YEAR_STATES_20261119.csv
          retention-days: 30
