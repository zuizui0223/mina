name: palmer-repro-performance-replication

on:
  push:
    branches:
      - analysis/palmer-repro-performance-replication-v1
    paths:
      - "scripts/fetch_pal_repro.py"
      - "src/mina/repro_performance_replication.py"
      - "tests/test_repro_performance_replication.py"
      - "contracts/PALMER_REPRO_PERFORMANCE_REPLICATION_V1.json"
      - "contracts/PALMER_REPRO_DATE_SENTINEL_REPAIR_V1.json"
      - ".github/workflows/palmer-repro-performance-replication.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Run frozen tests
        run: pytest -q tests/test_repro_performance_replication.py
      - name: Fetch frozen Palmer sources
        run: |
          python scripts/fetch_lter_census.py build/adelie_census.csv
          python scripts/fetch_pal_repro.py build/repro.csv
      - name: Run independent REPRO replication
        run: |
          python -m mina.repro_performance_replication \
            --adult-census build/adelie_census.csv \
            --repro build/repro.csv \
            --out build/repro_performance_replication.json \
            --permutations 100000
      - name: Print receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("build/repro_performance_replication.json").read_text())
          print("source_counts=",json.dumps(x["source_counts"],sort_keys=True))
          print("primary=",json.dumps(x["primary"],sort_keys=True))
          print("decision=",json.dumps(x["decision"],sort_keys=True))
          for name,v in x.get("sensitivities",{}).items():
              print(name,json.dumps(v,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: palmer-repro-performance-replication
          path: |
            build/adelie_census.csv
            build/repro.csv
            build/repro_performance_replication.json
