name: paper2-v2-source-sensitivity-recovery
concurrency:
  group: paper2-v2-source-sensitivity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [analysis/paper2-hierarchical-v2-clean]
    paths:
      - "scripts/simulate_paper2_v2_source_sensitivity_recovery.py"
      - "contracts/PAPER2_V2_OBSERVATION_SOURCE_RECOVERY_V1.json"
      - ".github/workflows/paper2-v2-source-sensitivity-recovery.yml"
  pull_request:
    paths:
      - "scripts/simulate_paper2_v2_source_sensitivity_recovery.py"
      - "contracts/PAPER2_V2_OBSERVATION_SOURCE_RECOVERY_V1.json"
      - ".github/workflows/paper2-v2-source-sensitivity-recovery.yml"
  workflow_dispatch:
jobs:
  recover:
    runs-on: ubuntu-22.04
    permissions: {actions: read, contents: read}
    env: {GH_TOKEN: "${{ github.token }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install numpy pandas pyreadr
      - run: python -m py_compile scripts/simulate_paper2_v2_source_sensitivity_recovery.py
      - run: |
          git clone --quiet https://github.com/CCheCastaldo/mapppdr.git build/mapppdr
          git -C build/mapppdr checkout --quiet 88c73a507e0921b2541c218c71eaf16721bc6502
          mkdir -p build/forcing build/options
          gh run download 36517700369 -n paper2-forcing-support-audit-v1 -D build/forcing
          gh run download 36520281872 -n antarctic-breeding-options-hierarchy-v1 -D build/options
      - name: Run V2 source sensitivity recovery
        run: |
          set +e
          python -m scripts.simulate_paper2_v2_source_sensitivity_recovery \
            --forcing-json build/forcing/PAPER2_FORCING_SUPPORT_AUDIT_RESULT_V1.json \
            --forcing-csv build/forcing/PAPER2_FORCING_SUPPORT_UNITS_V1.csv \
            --breeding-csv build/options/ANTARCTIC_PENGUIN_BREEDING_OPTIONS_HIERARCHY_V1.csv \
            --mapppdr-dir build/mapppdr \
            --out-json build/PAPER2_V2_SOURCE_SENSITIVITY_RECOVERY_RESULT_V1.json \
            --replicates 100
          status=$?
          echo "$status" > build/status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper2-v2-source-sensitivity-recovery
          path: |
            build/PAPER2_V2_SOURCE_SENSITIVITY_RECOVERY_RESULT_V1.json
            build/status.txt
      - name: Enforce source sensitivity gate
        run: |
          python - <<'PY'
          import json
          r=json.load(open("build/PAPER2_V2_SOURCE_SENSITIVITY_RECOVERY_RESULT_V1.json"))
          assert r["decision"]["observation_source_sensitivity_completed"] is True, r["decision"]
          assert r["decision"]["no_real_count_magnitudes_opened"] is True
          print("V2 source sensitivity gate passed.")
          PY
