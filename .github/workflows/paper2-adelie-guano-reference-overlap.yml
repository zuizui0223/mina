name: paper2-adelie-guano-reference-overlap

on:
  push:
    branches: [research/antarctic-island-ecology-v1]
    paths:
      - "contracts/PAPER2_ADELIE_GUANO_REFERENCE_OVERLAP_V1.json"
      - "scripts/audit_adelie_guano_reference_overlap.py"
      - ".github/workflows/paper2-adelie-guano-reference-overlap.yml"
  pull_request:
    paths:
      - "contracts/PAPER2_ADELIE_GUANO_REFERENCE_OVERLAP_V1.json"
      - "scripts/audit_adelie_guano_reference_overlap.py"
      - ".github/workflows/paper2-adelie-guano-reference-overlap.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas
      - name: Download frozen site artifacts
        run: |
          mkdir -p build/forcing build/options build/zips
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             https://api.github.com/repos/zuizui0223/mina/actions/artifacts/11012045716/zip -o build/zips/forcing.zip
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             https://api.github.com/repos/zuizui0223/mina/actions/artifacts/11000822448/zip -o build/zips/options.zip
          unzip -q build/zips/forcing.zip -d build/forcing
          unzip -q build/zips/options.zip -d build/options
      - name: Download published Landsat guano reference
        run: |
          curl -fL -H "Accept: text/tab-separated-values"             https://doi.org/10.1594/PANGAEA.804588             -o build/SCHWALLER_2013_PANGAEA_804588.tab
          test -s build/SCHWALLER_2013_PANGAEA_804588.tab
      - name: Audit reference overlap
        run: |
          python scripts/audit_adelie_guano_reference_overlap.py             --forcing-csv build/forcing/PAPER2_FORCING_SUPPORT_UNITS_V1.csv             --atlas-csv build/options/ANTARCTIC_PENGUIN_BREEDING_OPTIONS_ATLAS_V1.csv             --pangaea-tab build/SCHWALLER_2013_PANGAEA_804588.tab             --contract contracts/PAPER2_ADELIE_GUANO_REFERENCE_OVERLAP_V1.json             --out-csv build/PAPER2_ADELIE_GUANO_REFERENCE_OVERLAP_V1.csv             --out-json build/PAPER2_ADELIE_GUANO_REFERENCE_OVERLAP_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: paper2-adelie-guano-reference-overlap-v1
          path: |
            build/PAPER2_ADELIE_GUANO_REFERENCE_OVERLAP_V1.csv
            build/PAPER2_ADELIE_GUANO_REFERENCE_OVERLAP_RESULT_V1.json
