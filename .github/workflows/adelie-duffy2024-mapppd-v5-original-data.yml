name: adelie-duffy2024-mapppd-v5-original-data
on:
  push:
    branches: [analysis/adelie-polynya-44yr-macro-source-20261123]
    paths:
      - scripts/download_duffy2024_mapppd_v5.py
      - .github/workflows/adelie-duffy2024-mapppd-v5-original-data.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-data:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install basic original-data readers
        run: python -m pip install --no-cache-dir 'pandas>=2.0'
      - name: Get MD5-verified Duffy Figshare original archive and MAPPPD v5 all-count census file
        run: python scripts/download_duffy2024_mapppd_v5.py
      - name: Retain raw source and its audit for repeatable candidate study
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adelie-duffy2024-mapppd-v5-original-sources
          path: build/polynya44_data
          if-no-files-found: warn
          retention-days: 90
