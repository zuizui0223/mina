name: Penguin full 18-region 1993–2020 real SIC salinity seawater temperature and co-counted species macro axis
on:
  push:
    branches: [analysis/penguin-decade-redistribution-v1-20261110]
    paths:
      - 'research/climate-penguin/macro_panantarctic_v1/analyze_original_18region_marine_regime_1993_2020.py'
      - 'research/climate-penguin/macro_panantarctic_v1/unit_test_original_18region_marine_regime.py'
      - '.github/workflows/penguin-original-full-18region-marine-regime-1993-2020.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-595-original-marine-28year-18region-climate-regime:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source original geographic PCA and tabular validation dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<2.1' 'pandas>=2.1,<3' 'scipy>=1.10,<2' pyproj==3.7.1
      - name: Independent synthetic 18-region full 28year temporal and marine PCA math checks
        run: |
          python -m py_compile research/climate-penguin/macro_panantarctic_v1/analyze_original_18region_marine_regime_1993_2020.py
          python research/climate-penguin/macro_panantarctic_v1/unit_test_original_18region_marine_regime.py -v
      - name: Rebuild 595 original MAPPPD source colonies and 2456 genuinely recorded nests
        run: python research/climate-penguin/macro_panantarctic_v1/build.py
      - name: Reuse all genuine 1993–2020 Copernicus original 588 site×112 month source records
        uses: actions/download-artifact@v4
        with:
          name: penguin-original-595-colony-GLORYS12-1993-2020-18region-true-marine-months
          run-id: 42958013800
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/source_all18_regions_GLORYS
      - name: Reuse original publisher SHA-verified 595 site×30year×4month OSI SAF true nearshore SIC
        uses: actions/download-artifact@v4
        with:
          name: penguin-panantarctic-595site-original-1991-2020-monthly-ice
          run-id: 42612067836
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/source_full595_SIC
      - name: Fit original fixed 28-year 18-region physical PCA, climate trends, static vegetation and actual co-counted penguin composition
        run: |
          GLORYS="$(find build/source_all18_regions_GLORYS -name 'all_original_eligible_colony_GLORYS12_1993_2020_AugNov_monthly.csv' -print -quit)"
          SIC="$(find build/source_full595_SIC -name 'original_595_site_months_120_source_QA.csv' -print -quit)"
          test -s "$GLORYS" && test -s "$SIC"
          python research/climate-penguin/macro_panantarctic_v1/analyze_original_18region_marine_regime_1993_2020.py \
            --glorys-monthly "$GLORYS" \
            --osi-monthly "$SIC" \
            --atlas research/climate-penguin/macro_panantarctic_v1/outputs/panantarctic_595_site_inventory.csv \
            --original40-grid research/climate-penguin/outputs/climate_penguin/ocean_grid_support.csv \
            --counts research/climate-penguin/macro_panantarctic_v1/outputs/source_observed_2456.csv \
            --mapped-land research/climate-penguin/outputs/vegetation_response_v1/site_species_cohort.csv \
            --out research/climate-penguin/macro_panantarctic_v1/full18_marine_regime_outputs
      - name: Archive true original 18region×28year climate PCA, regional temporal direction, static vegetation and actual co-census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: penguin-original-full-18region-1993-2020-588site-glorys-osisaf-regime-and-cocensus
          path: research/climate-penguin/macro_panantarctic_v1/full18_marine_regime_outputs/
          if-no-files-found: warn
