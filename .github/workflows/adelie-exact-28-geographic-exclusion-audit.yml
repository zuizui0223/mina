name: adelie-exact-28-geographic-exclusion-audit
on:
  push:
    branches: [analysis/adelie-polynya-conservation-source-20261122]
    paths:
      - scripts/verify_adelie_28_site_source_geographic_gate.py
      - .github/workflows/adelie-exact-28-geographic-exclusion-audit.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  verify-original-strict-geography:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --no-cache-dir 'pandas>=2' 'numpy>=1.24' 'scipy>=1.11' 'pyproj>=3.6'
      - name: Download exactly the pre-existing frozen upstream source artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/sources
          for pair in \
            "14324288144 centroids" \
            "13669533413 atlas" \
            "13828472111 marine" \
            "14777168517 author" \
            "14777234122 frozen_sites" \
            "14326721399 novfeb"; do
            set -- $pair
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$1/zip" > "build/sources/$2.zip"
            unzip -tq "build/sources/$2.zip" >/dev/null
          done
      - name: Reproduce exact 28-site first-failed-rule partition (no isotope outcomes)
        shell: bash
        run: |
          python scripts/verify_adelie_28_site_source_geographic_gate.py \
            --centroids build/sources/centroids.zip --atlas build/sources/atlas.zip \
            --marine build/sources/marine.zip --author build/sources/author.zip \
            --pinned-sites build/sources/frozen_sites.zip --novfeb build/sources/novfeb.zip \
            --out build/28_site_geographic_gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adelie-exact-28-geographic-exclusion-audit
          path: build/28_site_geographic_gate
          if-no-files-found: warn
          retention-days: 90
