name: dynamic-habitat-imagery-support-audit

on:
  push:
    branches: [research/antarctic-island-ecology-v1]
    paths:
      - "data/PAPER2_DYNAMIC_HABITAT_SUPPORT_SEED_V1.csv"
      - "contracts/DYNAMIC_HABITAT_IMAGERY_SUPPORT_AUDIT_V1.json"
      - "scripts/audit_dynamic_habitat_imagery_support.py"
      - "tests/test_dynamic_habitat_imagery_support.py"
      - ".github/workflows/dynamic-habitat-imagery-support-audit.yml"
  pull_request:
    paths:
      - "data/PAPER2_DYNAMIC_HABITAT_SUPPORT_SEED_V1.csv"
      - "contracts/DYNAMIC_HABITAT_IMAGERY_SUPPORT_AUDIT_V1.json"
      - "scripts/audit_dynamic_habitat_imagery_support.py"
      - "tests/test_dynamic_habitat_imagery_support.py"
      - ".github/workflows/dynamic-habitat-imagery-support-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pandas pystac-client requests
      - name: Unit tests
        run: python -m unittest tests.test_dynamic_habitat_imagery_support -v
      - name: Run outcome-blind STAC support audit
        run: |
          mkdir -p build
          python scripts/audit_dynamic_habitat_imagery_support.py \
            --seed-csv data/PAPER2_DYNAMIC_HABITAT_SUPPORT_SEED_V1.csv \
            --out-json build/DYNAMIC_HABITAT_IMAGERY_SUPPORT_AUDIT_RESULT_V1.json \
            --out-csv build/DYNAMIC_HABITAT_IMAGERY_SUPPORT_AUDIT_SITES_V1.csv
      - uses: actions/upload-artifact@v4
        with:
          name: dynamic-habitat-imagery-support-audit-v1
          path: |
            build/DYNAMIC_HABITAT_IMAGERY_SUPPORT_AUDIT_RESULT_V1.json
            build/DYNAMIC_HABITAT_IMAGERY_SUPPORT_AUDIT_SITES_V1.csv
