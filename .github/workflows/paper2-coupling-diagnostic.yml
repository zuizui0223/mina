name: paper2-coupling-diagnostic

on:
  push:
    branches: [analysis/paper2-coupling-diagnostic-v1]
    paths:
      - "scripts/run_paper2_coupling_diagnostic.py"
      - "tests/test_paper2_coupling_diagnostic.py"
      - "contracts/PAPER2_COUPLING_DIAGNOSTIC_V1.json"
      - "results/PAPER2_FORCING_SUPPORT_AUDIT_RESULT_V1.json"
      - ".github/workflows/paper2-coupling-diagnostic.yml"
  pull_request:
    paths:
      - "scripts/run_paper2_coupling_diagnostic.py"
      - "tests/test_paper2_coupling_diagnostic.py"
      - "contracts/PAPER2_COUPLING_DIAGNOSTIC_V1.json"
      - "results/PAPER2_FORCING_SUPPORT_AUDIT_RESULT_V1.json"
      - ".github/workflows/paper2-coupling-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pandas scipy statsmodels pyreadr
      - name: Run diagnostic unit tests
        run: python -m unittest tests.test_paper2_coupling_diagnostic -v
      - name: Fetch pinned mapppdr
        run: |
          git clone --quiet https://github.com/CCheCastaldo/mapppdr.git build/mapppdr
          git -C build/mapppdr checkout --quiet 88c73a507e0921b2541c218c71eaf16721bc6502
      - name: Download frozen breeding-option artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/options
          gh run download 36491613166 \
            -n antarctic-breeding-options-hierarchy-v1 \
            -D build/options
          test -f build/options/ANTARCTIC_PENGUIN_BREEDING_OPTIONS_HIERARCHY_V1.csv
      - name: Download frozen terrain artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/terrain
          gh run download 36490682577 \
            -n antarctic-penguin-terrain-atlas-v1 \
            -D build/terrain
          test -f build/terrain/ANTARCTIC_PENGUIN_TERRAIN_ATLAS_V1.csv
      - name: Run empirical coupling diagnostic
        run: |
          python scripts/run_paper2_coupling_diagnostic.py \
            --mapppdr-dir build/mapppdr \
            --support-result results/PAPER2_FORCING_SUPPORT_AUDIT_RESULT_V1.json \
            --options-csv build/options/ANTARCTIC_PENGUIN_BREEDING_OPTIONS_HIERARCHY_V1.csv \
            --terrain-csv build/terrain/ANTARCTIC_PENGUIN_TERRAIN_ATLAS_V1.csv \
            --out-json build/PAPER2_COUPLING_DIAGNOSTIC_RESULT_V1.json \
            --out-site-csv build/PAPER2_EMPIRICAL_COUPLING_SITE_ESTIMATES_V1.csv \
            --permutations 5000
      - uses: actions/upload-artifact@v4
        with:
          name: paper2-coupling-diagnostic-v1
          path: |
            build/PAPER2_COUPLING_DIAGNOSTIC_RESULT_V1.json
            build/PAPER2_EMPIRICAL_COUPLING_SITE_ESTIMATES_V1.csv
