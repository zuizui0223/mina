name: smp-spatial-recovery-hysteresis-code

on:
  push:
    branches: [research/smp-spatial-recovery-hysteresis-v1]
    paths:
      - "contracts/SMP_SPATIAL_RECOVERY_STRUCTURE_V1.json"
      - "contracts/SMP_SPATIAL_RECOVERY_ZERO_SEMANTICS_V1.json"
      - "contracts/SMP_SPATIAL_RECOVERY_HYSTERESIS_STRUCTURE_V1.json"
      - "contracts/SMP_SPATIAL_RECOVERY_HYSTERESIS_SUPPORT_V1.json"
      - "contracts/SMP_SPATIAL_RECOVERY_HYSTERESIS_EFFECT_V1.json"
      - "scripts/finalize_smp_spatial_recovery_structure_v1.py"
      - "scripts/gate_smp_spatial_recovery_hysteresis_structure_v1.py"
      - "scripts/gate_smp_spatial_recovery_hysteresis_support_v1.py"
      - "scripts/run_smp_spatial_recovery_hysteresis_v1.py"
      - "tests/test_smp_spatial_recovery_hysteresis_structure.py"
      - "tests/test_smp_spatial_recovery_hysteresis.py"
      - "docs/ONE_PAPER_SPATIAL_RECOVERY_DECISION_TABLE_V1.md"
      - "docs/SMP_SPATIAL_RECOVERY_EXECUTION_MANIFEST_V1.md"
      - "docs/SMP_SPATIAL_RECOVERY_HYSTERESIS_LITERATURE_POSITION_V1.md"
      - "docs/REGISTERED_INTEGRATED_MANUSCRIPT_SPINE_HYSTERESIS_V1.md"
      - "docs/SMP_SPATIAL_RECOVERY_HYSTERESIS_PROTOCOL_V1.md"
      - "tests/test_smp_spatial_recovery_docs_contract.py"
      - "docs/SMP_SPATIAL_RECOVERY_HYSTERESIS_RUNBOOK_V1.md"
      - "docs/SMP_PROVIDER_EVIDENCE_LEDGER_V1.md"
      - "submission/SMP_ZERO_SEMANTICS_PROVIDER_CONFIRMATION_TEMPLATE_V1.json"
      - "tests/test_smp_spatial_recovery_end_to_end.py"
      - ".github/workflows/smp-spatial-recovery-hysteresis-code.yml"
  pull_request:
    paths:
      - "contracts/SMP_SPATIAL_RECOVERY_HYSTERESIS_STRUCTURE_V1.json"
      - "contracts/SMP_SPATIAL_RECOVERY_STRUCTURE_V1.json"
      - "contracts/SMP_SPATIAL_RECOVERY_ZERO_SEMANTICS_V1.json"
      - "contracts/SMP_SPATIAL_RECOVERY_HYSTERESIS_SUPPORT_V1.json"
      - "contracts/SMP_SPATIAL_RECOVERY_HYSTERESIS_EFFECT_V1.json"
      - "scripts/finalize_smp_spatial_recovery_structure_v1.py"
      - "scripts/gate_smp_spatial_recovery_hysteresis_structure_v1.py"
      - "scripts/gate_smp_spatial_recovery_hysteresis_support_v1.py"
      - "scripts/run_smp_spatial_recovery_hysteresis_v1.py"
      - "tests/test_smp_spatial_recovery_hysteresis_structure.py"
      - "tests/test_smp_spatial_recovery_hysteresis.py"
      - ".github/workflows/smp-spatial-recovery-hysteresis-code.yml"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy openpyxl
      - run: python -m py_compile scripts/gate_smp_spatial_recovery_hysteresis_structure_v1.py scripts/finalize_smp_spatial_recovery_structure_v1.py scripts/gate_smp_spatial_recovery_hysteresis_support_v1.py scripts/run_smp_spatial_recovery_hysteresis_v1.py
      - run: python -m unittest tests.test_smp_spatial_recovery_hysteresis_structure tests.test_smp_spatial_recovery_hysteresis tests.test_smp_spatial_recovery_docs_contract tests.test_smp_spatial_recovery_end_to_end -v
