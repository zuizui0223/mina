name: paper2-latent-factor-recovery

on:
  push:
    branches: [analysis/paper2-latent-factor-recovery-v1]
    paths:
      - "scripts/simulate_paper2_latent_factor_recovery.py"
      - "tests/test_paper2_latent_factor_recovery.py"
      - "contracts/PAPER2_LATENT_FACTOR_RECOVERY_V1.json"
      - ".github/workflows/paper2-latent-factor-recovery.yml"
  pull_request:
    paths:
      - "scripts/simulate_paper2_latent_factor_recovery.py"
      - "tests/test_paper2_latent_factor_recovery.py"
      - "contracts/PAPER2_LATENT_FACTOR_RECOVERY_V1.json"
      - ".github/workflows/paper2-latent-factor-recovery.yml"
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pandas
      - name: Run latent-factor recovery tests
        run: python -m unittest tests.test_paper2_latent_factor_recovery -v
      - name: Download frozen outcome-blind inputs
        run: |
          mkdir -p build/forcing build/options
          gh run download 36517700369 -n paper2-forcing-support-audit-v1 -D build/forcing
          gh run download 36520281872 -n antarctic-breeding-options-hierarchy-v1 -D build/options
      - name: Run latent-factor schedule recovery
        run: |
          python scripts/simulate_paper2_latent_factor_recovery.py \
            --forcing-json build/forcing/PAPER2_FORCING_SUPPORT_AUDIT_RESULT_V1.json \
            --forcing-csv build/forcing/PAPER2_FORCING_SUPPORT_UNITS_V1.csv \
            --breeding-csv build/options/ANTARCTIC_PENGUIN_BREEDING_OPTIONS_HIERARCHY_V1.csv \
            --out-json build/PAPER2_LATENT_FACTOR_RECOVERY_RESULT_V1.json \
            --replicates 100
      - uses: actions/upload-artifact@v4
        with:
          name: paper2-latent-factor-recovery-v1
          path: build/PAPER2_LATENT_FACTOR_RECOVERY_RESULT_V1.json
