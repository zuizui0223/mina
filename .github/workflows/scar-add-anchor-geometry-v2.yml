name: scar-add-anchor-geometry-v2

on:
  push:
    branches: [analysis/scar-add-anchor-geometry-v2]
    paths:
      - "scripts/diagnose_scar_add_anchor_geometry_v2.py"
      - ".github/workflows/scar-add-anchor-geometry-v2.yml"
  pull_request:
    paths:
      - "scripts/diagnose_scar_add_anchor_geometry_v2.py"
      - ".github/workflows/scar-add-anchor-geometry-v2.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests pyproj shapely
      - name: Diagnose representative anchor FIDs
        run: |
          python scripts/diagnose_scar_add_anchor_geometry_v2.py \
            --out build/scar_add_anchor_geometry_v2.json
      - uses: actions/upload-artifact@v4
        with:
          name: scar-add-anchor-geometry-v2
          path: build/scar_add_anchor_geometry_v2.json
