name: climate-penguin-chinstrap-TDR-GPS-krill-4tag-v3
on:
  workflow_dispatch:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - "research/climate-penguin/work/climate_penguin/chinstrap_tdr_krill_location_pilot_v3.py"
      - "tests/test_chinstrap_tdr_krill_location_pilot_v3.py"
      - ".github/workflows/climate-penguin-chinstrap-tdr-gps-krill-v3.yml"
jobs:
  verify-pilot:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install original source and TIFF readers
        run: python -m pip install "rasterio>=1.4,<1.6" numpy
      - name: Source fixed 4-tag unit guards
        run: python -m unittest discover -s tests -p test_chinstrap_tdr_krill_location_pilot_v3.py -v
      - name: Re-fetch BAS original TDR GPS and krill GAM
        run: |
          mkdir -p build/chinstrap_tdr_original
          curl -L --fail --retry 4 --retry-delay 5 --max-time 1200 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=da13e049-be2b-4345-bbdd-ab960cb24731&output=zip.tree' -o build/chinstrap_tdr_original/TDR_v2_original.zip
          curl -L --fail --retry 4 --retry-delay 5 --max-time 1200 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=8f8ccba5-01af-4b00-8a3b-c3c85b24bf92&output=zip.tree' -o build/chinstrap_tdr_original/GPS_v2_original.zip
          curl -L --fail --retry 4 --retry-delay 5 --max-time 1200 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=4fd0a1bf-da1a-4021-82eb-2fc513910e32&output=zip.tree' -o build/chinstrap_tdr_original/Freer_krill_original.zip
      - name: Run source 48 combinations and pilot model cell audit
        run: |
          python research/climate-penguin/work/climate_penguin/chinstrap_tdr_krill_location_pilot_v3.py --tdr-zip build/chinstrap_tdr_original/TDR_v2_original.zip --gps-zip build/chinstrap_tdr_original/GPS_v2_original.zip --krill-zip build/chinstrap_tdr_original/Freer_krill_original.zip --out build/chinstrap_tdr_krill_pilot --check-receipt
          python -m unittest discover -s tests -p test_chinstrap_tdr_krill_location_pilot_v3.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chinstrap-TDR-GPS-candidate-krill-cell-pilot-v3
          path: |
            build/chinstrap_tdr_krill_pilot/pilot_48_sensitivity_gps_krill_cells.csv
            build/chinstrap_tdr_krill_pilot/pilot_4_original_GPS_reference.csv
            build/chinstrap_tdr_krill_pilot/decision.json
