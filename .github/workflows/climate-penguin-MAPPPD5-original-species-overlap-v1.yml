name: climate-penguin-MAPPPD5-original-species-overlap-v1
on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - ".github/workflows/climate-penguin-MAPPPD5-original-species-overlap-v1.yml"
      - "research/climate-penguin/work/climate_penguin/audit_MAPPPD5_same_source_species_v1.py"
      - "research/climate-penguin/contracts/MAPPPD5_ORIGINAL_SPECIES_CROSSWALK_GATE_V1.md"
      - "tests/test_MAPPPD5_same_source_species_v1.py"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-source-comparable-species:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: pytest -q tests/test_MAPPPD5_same_source_species_v1.py
      - uses: actions/download-artifact@v4
        with:
          name: climate-penguin-original-MAPPPD5-381-ERA5-exploratory-v1
          run-id: 40868420083
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/original_381
      - name: Exact source citation/vantage and site-year species overlap source gate
        run: |
          python research/climate-penguin/work/climate_penguin/audit_MAPPPD5_same_source_species_v1.py \
            --original-381-dir "${{ runner.temp }}/original_381" \
            --out "${{ runner.temp }}/same_source_species"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: climate-penguin-MAPPPD5-same-source-species-gate-v1
          path: ${{ runner.temp }}/same_source_species/
          retention-days: 30
          if-no-files-found: warn
