name: recorded-chick-output-v9
on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - '.github/workflows/recorded-chick-output-v9.yml'
      - 'research/climate-penguin/work/climate_penguin/recorded_chick_output_v9.py'
      - 'research/climate-penguin/inputs/maxwell_official_report_records_v9.csv'
      - 'tests/test_recorded_chick_output_v9.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-stage-matched-neighbor-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full repository tests in normal dependency environment
        run: |
          python -m pip install -e '.[dev]'
          pytest
      - uses: actions/download-artifact@v4
        with:
          name: climate-penguin-mapppd-matched-species-growth-v1
          run-id: 40868828790
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/original-counts
      - uses: actions/download-artifact@v4
        with:
          name: maxwell-recent-primary-v9
          run-id: 40981148317
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/official-documents
      - name: Original nest/chick stage matching with separate official report checks
        run: |
          python research/climate-penguin/work/climate_penguin/recorded_chick_output_v9.py \
            --original-dir /tmp/original-counts --official-documents-dir /tmp/official-documents \
            --out /tmp/recorded-chick-output-v9
      - uses: actions/upload-artifact@v4
        with:
          name: recorded-chick-output-v9-original-source
          path: /tmp/recorded-chick-output-v9/
          retention-days: 30
          if-no-files-found: error
