name: palmer-hierarchical-variability

on:
  push:
    branches:
      - analysis/hierarchical-variability-v1
    paths:
      - "src/mina/hierarchical_variability.py"
      - "tests/test_hierarchical_variability.py"
      - "contracts/PALMER_HIERARCHICAL_VARIABILITY_V1.json"
      - ".github/workflows/palmer-hierarchical-variability.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/mina/hierarchical_variability.py"
      - "tests/test_hierarchical_variability.py"
      - "contracts/PALMER_HIERARCHICAL_VARIABILITY_V1.json"
      - ".github/workflows/palmer-hierarchical-variability.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Run hierarchical unit tests
        run: python -m pytest tests/test_hierarchical_variability.py
      - name: Fetch frozen LTER census
        run: python scripts/fetch_lter_census.py build/adelie_census.csv
      - name: Run hierarchical variability decomposition
        run: |
          mina-hierarchical-variability \
            --census build/adelie_census.csv \
            --out build/hierarchical_variability_result.json
      - name: Print hierarchy result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          x = json.loads(
              Path("build/hierarchical_variability_result.json").read_text()
          )
          p = x["raw_abundance_primary"]
          print("stable_roster_islands=", x["stable_roster_islands"])
          print("beta_within=", p["beta_within_islands"])
          print("beta_among=", p["beta_among_islands"])
          print("beta_total=", p["beta_total_subcolony_to_archipelago"])
          print("within_log_beta_share=", p["log_beta_share_within_islands"])
          print("decision=", json.dumps(x["decision"], sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: palmer-hierarchical-variability
          path: |
            build/adelie_census.csv
            build/hierarchical_variability_result.json
