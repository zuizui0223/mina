name: penguin-macro-count-climate-v1
on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - "research/climate-penguin/work/macro_count_climate_v1/**"
      - ".github/workflows/penguin-macro-count-climate-v1.yml"
  pull_request:
    paths:
      - "research/climate-penguin/work/macro_count_climate_v1/**"
      - ".github/workflows/penguin-macro-count-climate-v1.yml"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal RData and model dependencies
        run: python -m pip install numpy pandas pyreadr tabulate
      - name: Fetch frozen original MAPPPD
        shell: bash
        run: |
          git clone --quiet https://github.com/CCheCastaldo/mapppdr.git build/mapppdr
          git -C build/mapppdr checkout --quiet 88c73a507e0921b2541c218c71eaf16721bc6502
      - name: Compute 3-species same-method real counts and SIC associations
        run: |
          python research/climate-penguin/work/macro_count_climate_v1/analyze.py \
            --mapppdr build/mapppdr \
            --ice-csv research/climate-penguin/outputs/climate_penguin/macro_monthly_seaice_1991_2020.csv \
            --scenario-csv research/climate-penguin/outputs/cmip6_exposure_atlas_v1/site_scenario_exposure.csv \
            --out build/macro_count_climate_v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: penguin-macro-count-climate-v1
          path: build/macro_count_climate_v1
          if-no-files-found: warn
