name: maxwell-recent-primary-v9
on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - '.github/workflows/maxwell-recent-primary-v9.yml'
      - 'research/climate-penguin/work/climate_penguin/maxwell_primary_documents_v9.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  primary-monitoring-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Complete core repository tests
        run: |
          python -m pip install -e '.[dev]'
          pytest
      - run: python -m pip install pymupdf
      - name: Retrieve and render exact publisher sources without ecological inference
        run: python research/climate-penguin/work/climate_penguin/maxwell_primary_documents_v9.py --out /tmp/maxwell-primary-v9
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maxwell-recent-primary-v9
          path: /tmp/maxwell-primary-v9/
          retention-days: 30
          if-no-files-found: error
