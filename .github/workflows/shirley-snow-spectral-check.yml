name: Shirley snow spectral check
on:
  pull_request:
    paths:
      - '.github/workflows/shirley-snow-spectral-check.yml'
      - 'research/climate-penguin/multispecies_vegetation_20261124/acquire_shirley_snow_spectral_check.py'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet numpy rasterio requests planetary-computer pyproj
      - run: python research/climate-penguin/multispecies_vegetation_20261124/acquire_shirley_snow_spectral_check.py /tmp/shirley-spectral
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shirley-snow-spectral-check
          path: /tmp/shirley-spectral/
          retention-days: 14
