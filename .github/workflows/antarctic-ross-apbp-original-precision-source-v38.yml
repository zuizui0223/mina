name: Antarctic V38 original APBP exact Ross Sea colony georeference metadata
on:
  push:
    branches: [research/antarctic-penguin-island-macro-v1]
    paths:
      - 'contracts/ROSS_APBP_EXACT_GEOREFERENCE_SOURCE_V38.md'
      - 'scripts/audit_apbp_exact_ross_colony_georefs_v38.py'
      - 'tests/test_apbp_exact_ross_colony_georefs_v38.py'
      - '.github/workflows/antarctic-ross-apbp-original-precision-source-v38.yml'
  pull_request:
    paths:
      - 'contracts/ROSS_APBP_EXACT_GEOREFERENCE_SOURCE_V38.md'
      - 'scripts/audit_apbp_exact_ross_colony_georefs_v38.py'
      - 'tests/test_apbp_exact_ross_colony_georefs_v38.py'
      - '.github/workflows/antarctic-ross-apbp-original-precision-source-v38.yml'
  workflow_dispatch:
jobs:
  original_APBP_published_location_uncertainty_vs_NZ_names:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original source-only quality and test libraries
        run: python -m pip install requests pytest pyproj shapely pyshp
      - name: Assert original exact source locality and precision/ambiguity guards
        run: python -m pytest -q tests/test_apbp_exact_ross_colony_georefs_v38.py
      - name: Download source-locked APBP original DwC-A Event georeferences and crossmatch only exact NZ 33 colony names
        run: |
          python scripts/audit_apbp_exact_ross_colony_georefs_v38.py \
            --json /tmp/APBP_NZ_ROSS_EXACT_GEOREF_SOURCE_V38.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-APBP-v23-exact-Ross-NZ-colony-georeference-v38
          path: /tmp/APBP_NZ_ROSS_EXACT_GEOREF_SOURCE_V38.json
