name: spatial-recovery-ecology-si-preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/build_spatial_recovery_si_docx.py"
      - "scripts/build_spatial_recovery_path_state_figures.py"
      - "submission/SUPPLEMENT_SPATIAL_RECOVERY_PATH_STATE_V1.md"
      - ".github/workflows/spatial-recovery-ecology-si-preview.yml"
      - "pyproject.toml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[figures,submission]"
      - name: Build canonical figures
        run: |
          python scripts/build_spatial_recovery_path_state_figures.py \
            --outdir build/spatial_recovery_path_state_figures
      - name: Build Supporting Information DOCX
        run: |
          python scripts/build_spatial_recovery_si_docx.py \
            --supplement submission/SUPPLEMENT_SPATIAL_RECOVERY_PATH_STATE_V1.md \
            --figure-dir build/spatial_recovery_path_state_figures \
            --out build/Spatial_Recovery_Ecology_SUPPORTING_INFORMATION.docx
      - name: Structural SI audit
        run: |
          python - <<'PY'
          from docx import Document
          path="build/Spatial_Recovery_Ecology_SUPPORTING_INFORMATION.docx"
          doc=Document(path)
          text="\n".join(p.text for p in doc.paragraphs)
          assert "Figure S1." in text
          assert "Figure S2." in text
          assert "independent replication" in text
          assert len(doc.inline_shapes) == 2
          print("paragraphs=", len(doc.paragraphs))
          print("inline_shapes=", len(doc.inline_shapes))
          print("si_structural_audit=PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: spatial-recovery-ecology-supporting-information
          path: build/Spatial_Recovery_Ecology_SUPPORTING_INFORMATION.docx
