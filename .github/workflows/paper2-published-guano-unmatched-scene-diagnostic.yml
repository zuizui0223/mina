name: paper2-published-guano-unmatched-scene-diagnostic

on:
  push:
    branches: [research/antarctic-island-ecology-v1]
    paths:
      - "contracts/PAPER2_PUBLISHED_GUANO_UNMATCHED_SCENE_DIAGNOSTIC_V1.json"
      - "scripts/diagnose_published_guano_unmatched_scenes.py"
      - "tests/test_published_guano_unmatched_scenes.py"
      - ".github/workflows/paper2-published-guano-unmatched-scene-diagnostic.yml"
  pull_request:
    paths:
      - "contracts/PAPER2_PUBLISHED_GUANO_UNMATCHED_SCENE_DIAGNOSTIC_V1.json"
      - "scripts/diagnose_published_guano_unmatched_scenes.py"
      - "tests/test_published_guano_unmatched_scenes.py"
      - ".github/workflows/paper2-published-guano-unmatched-scene-diagnostic.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas requests
      - run: python -m unittest tests.test_published_guano_unmatched_scenes -v
      - run: |
          mkdir -p build/out
          python scripts/diagnose_published_guano_unmatched_scenes.py \
            --contract contracts/PAPER2_PUBLISHED_GUANO_UNMATCHED_SCENE_DIAGNOSTIC_V1.json \
            --out-json build/out/PAPER2_PUBLISHED_GUANO_UNMATCHED_SCENE_DIAGNOSTIC_RESULT_V1.json \
            --out-csv build/out/PAPER2_PUBLISHED_GUANO_UNMATCHED_SCENE_DIAGNOSTIC_V1.csv
      - uses: actions/upload-artifact@v4
        with:
          name: paper2-published-guano-unmatched-scene-diagnostic-v1
          path: build/out/*
