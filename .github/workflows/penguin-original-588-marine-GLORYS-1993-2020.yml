name: Penguin original 595-colony GLORYS salinity thetao 1993–2020 full 18-region marine source
on:
  push:
    branches: [analysis/penguin-decade-redistribution-v1-20261110]
    paths:
      - 'research/climate-penguin/macro_panantarctic_v1/extract_original_588_GLORYS_1993_2020.py'
      - 'research/climate-penguin/macro_panantarctic_v1/unit_test_extract_original_588_GLORYS_source.py'
      - '.github/workflows/penguin-original-588-marine-GLORYS-1993-2020.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-all-18-region-coastal-marine-1993-2020:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse exact proven historical GLORYS xarray Zarr v2 source dependency versions
        run: |
          python -m pip install --disable-pip-version-check "numpy>=1.26,<2.1" "pandas>=2.1,<3" "xarray>=2024.5,<2025" "zarr>=2.17,<3" "numcodecs<0.16" "fsspec>=2024.1,<2025" "dask[array]>=2024.3,<2025" "aiohttp>=3.9" pyproj==3.7.1
      - name: Check historical source-month and strict original value verification semantics
        run: |
          python -m py_compile research/climate-penguin/macro_panantarctic_v1/extract_original_588_GLORYS_1993_2020.py
          python research/climate-penguin/macro_panantarctic_v1/unit_test_extract_original_588_GLORYS_source.py -v
      - name: Rebuild original fixed-method 595 Antarctica penguin colony site source atlas
        run: python research/climate-penguin/macro_panantarctic_v1/build.py
      - name: Reuse source-verified original 595 site nearest GLORYS 2011-September wet-grid geography
        uses: actions/download-artifact@v4
        with:
          name: penguin-original-595-colony-GLORYS-wet-grid-2011-september-geo-source-gate
          run-id: 42957439858
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/original_595_GLORYS_source_geography
      - name: Re-extract genuine 1993–2020 original GLORYS salinity thetao for all eligible 595 sites and crosscheck 34 original source sites
        run: |
          MAPPING="$(find build/original_595_GLORYS_source_geography -name 'all_original_595_sites_frozen_GLORYS_nearest_2011_September_wet_ocean_cells.csv' -print -quit)"
          test -s "$MAPPING"
          python research/climate-penguin/macro_panantarctic_v1/extract_original_588_GLORYS_1993_2020.py \
            --geography "$MAPPING" \
            --atlas research/climate-penguin/macro_panantarctic_v1/outputs/panantarctic_595_site_inventory.csv \
            --manifest research/climate-penguin/outputs/climate_penguin/ocean_monthly_manifest.json \
            --old40 research/climate-penguin/outputs/climate_penguin/ocean_grid_support.csv \
            --old-ocean research/climate-penguin/outputs/climate_penguin/ocean_monthly_2011_2021.csv \
            --out research/climate-penguin/macro_panantarctic_v1/GLORYS_595_1993_2020_original_outputs
      - name: Archive original all-coast marine data, 18-region coverage, exact 34-source-value reproduction and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: penguin-original-595-colony-GLORYS12-1993-2020-18region-true-marine-months
          path: research/climate-penguin/macro_panantarctic_v1/GLORYS_595_1993_2020_original_outputs/
          if-no-files-found: warn
