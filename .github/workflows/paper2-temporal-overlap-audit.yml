name: paper2-temporal-overlap-audit

on:
  push:
    branches: [analysis/paper2-temporal-overlap-v1]
    paths:
      - "scripts/audit_paper2_temporal_overlap.py"
      - "contracts/PAPER2_TEMPORAL_OVERLAP_AUDIT_V1.json"
      - ".github/workflows/paper2-temporal-overlap-audit.yml"
  pull_request:
    paths:
      - "scripts/audit_paper2_temporal_overlap.py"
      - "contracts/PAPER2_TEMPORAL_OVERLAP_AUDIT_V1.json"
      - ".github/workflows/paper2-temporal-overlap-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas pyreadr
      - name: Fetch pinned mapppdr
        run: |
          git clone --quiet https://github.com/CCheCastaldo/mapppdr.git build/mapppdr
          git -C build/mapppdr checkout --quiet 88c73a507e0921b2541c218c71eaf16721bc6502
      - name: Audit temporal overlap
        run: |
          python scripts/audit_paper2_temporal_overlap.py \
            --mapppdr-dir build/mapppdr \
            --out-json build/PAPER2_TEMPORAL_OVERLAP_AUDIT_RESULT_V1.json \
            --out-csv build/PAPER2_TEMPORAL_OVERLAP_UNITS_V1.csv
      - uses: actions/upload-artifact@v4
        with:
          name: paper2-temporal-overlap-audit-v1
          path: |
            build/PAPER2_TEMPORAL_OVERLAP_AUDIT_RESULT_V1.json
            build/PAPER2_TEMPORAL_OVERLAP_UNITS_V1.csv
