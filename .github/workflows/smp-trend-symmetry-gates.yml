name: smp-trend-symmetry-gates

on:
  push:
    branches: [research/smp-trend-symmetry-v1]
    paths:
      - "contracts/SMP_TREND_SYMMETRY_SUPPORT_V1.json"
      - "contracts/SMP_TREND_BALANCE_GATE_V1.json"
      - "contracts/SMP_TREND_SYMMETRY_EFFECT_V1.json"
      - "scripts/gate_smp_trend_symmetry_support_v1.py"
      - "scripts/gate_smp_trend_balance_v1.py"
      - "tests/test_smp_trend_symmetry_gates.py"
      - ".github/workflows/smp-trend-symmetry-gates.yml"
  pull_request:
    paths:
      - "contracts/SMP_TREND_SYMMETRY_SUPPORT_V1.json"
      - "contracts/SMP_TREND_BALANCE_GATE_V1.json"
      - "contracts/SMP_TREND_SYMMETRY_EFFECT_V1.json"
      - "scripts/gate_smp_trend_symmetry_support_v1.py"
      - "scripts/gate_smp_trend_balance_v1.py"
      - "tests/test_smp_trend_symmetry_gates.py"
      - ".github/workflows/smp-trend-symmetry-gates.yml"
  workflow_dispatch:

jobs:
  unit:
    if: ${{ github.event_name != 'pull_request' || github.head_ref != 'research/smp-spatial-recovery-hysteresis-v1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy openpyxl
      - run: python -m unittest tests.test_smp_trend_symmetry_gates -v
