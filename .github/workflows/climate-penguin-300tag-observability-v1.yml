name: climate-penguin-source-300tag-observability-v1
on:
  workflow_dispatch:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - "research/climate-penguin/work/climate_penguin/chinstrap_300tag_observability_v1.py"
      - "tests/test_chinstrap_300tag_observability_v1.py"
      - "research/climate-penguin/work/climate_penguin/chinstrap_GPS_island_QA_krill_robustness_v1.py"
      - "tests/test_chinstrap_GPS_island_QA_krill_robustness_v1.py"
      - ".github/workflows/climate-penguin-300tag-observability-v1.yml"
permissions:
  contents: read
jobs:
  frozen-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests for source-only criteria
        run: python -m unittest discover -s tests -p test_chinstrap_300tag_observability_v1.py -v
      - name: Install native original pressure reader
        run: python -m pip install numpy 'rasterio>=1.4,<1.6'
      - name: Fetch original BAS GPS and TDR Version 2 directly from publisher
        run: |
          mkdir -p build/tdr_original
          curl -fsSL --retry 4 --retry-delay 7 --max-time 1200 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=da13e049-be2b-4345-bbdd-ab960cb24731&output=zip.tree' -o build/tdr_original/TDR_v2_original.zip
          curl -fsSL --retry 4 --retry-delay 7 --max-time 1200 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=8f8ccba5-01af-4b00-8a3b-c3c85b24bf92&output=zip.tree' -o build/tdr_original/GPS_v2_original.zip
      - name: Reproduce complete 300 source tag sensor/time QA before screening
        run: |
          mkdir -p build/original300
          python research/climate-penguin/work/climate_penguin/chinstrap_300tag_tdr_sensor_census_v1.py --tdr-zip build/tdr_original/TDR_v2_original.zip --gps-zip build/tdr_original/GPS_v2_original.zip --out build/original300 --check
      - name: Verify frozen source content and all 300 decisions
        run: |
          python research/climate-penguin/work/climate_penguin/chinstrap_300tag_observability_v1.py --original-qa build/original300/all_300_original_sensor_QA.csv --out build/operational300 --check
          python -m unittest discover -s tests -p test_chinstrap_300tag_observability_v1.py -v
      - name: Fetch original BAS Freer acoustic-based krill GAM GeoTIFF source
        run: |
          mkdir -p build/freer_krill
          curl -fsSL --retry 4 --retry-delay 7 --max-time 300 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=4fd0a1bf-da1a-4021-82eb-2fc513910e32&output=zip.tree' -o build/freer_krill/bas_published_source.zip
      - name: Rebuild all source Chinstrap GPS krill model grid values
        run: |
          python research/climate-penguin/work/climate_penguin/south_orkney_chinstrap_island_krill_v1.py --chinstrap-gps-zip build/tdr_original/GPS_v2_original.zip --krill-zip build/freer_krill/bas_published_source.zip --out build/island_krill_original --check
      - name: Evaluate modelled island differences with all 300 original TDR/GPS QA groups
        run: |
          python research/climate-penguin/work/climate_penguin/chinstrap_GPS_island_QA_krill_robustness_v1.py --gps-model build/island_krill_original/source_tag_model_exposures.csv --tdr-qa build/original300/all_300_original_sensor_QA.csv --out build/island_krill_qa --check
          python -m unittest discover -s tests -p test_chinstrap_GPS_island_QA_krill_robustness_v1.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chinstrap-300tag-calibration-priority-cohort-v1
          path: |
            build/operational300/all_300_operational_source_tags.csv
            build/operational300/island_coverage.csv
            build/operational300/decision.json
            build/island_krill_qa/source_GPS_TDR_observability_join_253.csv
            build/island_krill_qa/island_matched_year_robustness_24.csv
            build/island_krill_qa/decision.json
