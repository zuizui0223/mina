name: antarctic-island-ecology-paper2-optical-catalog

on:
  push:
    branches: [research/antarctic-island-ecology-v1]
    paths:
      - "scripts/audit_antarctic_island_ecology_optical_catalog.py"
      - "tests/test_antarctic_island_ecology_optical_catalog.py"
      - "contracts/ANTARCTIC_ISLAND_ECOLOGY_PAPER2_SUPPORT_AUDIT_V1.json"
      - ".github/workflows/antarctic-island-ecology-paper2-optical-catalog.yml"
  pull_request:
    paths:
      - "scripts/audit_antarctic_island_ecology_optical_catalog.py"
      - "tests/test_antarctic_island_ecology_optical_catalog.py"
      - "contracts/ANTARCTIC_ISLAND_ECOLOGY_PAPER2_SUPPORT_AUDIT_V1.json"
      - ".github/workflows/antarctic-island-ecology-paper2-optical-catalog.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas pystac-client
      - name: Unit tests
        run: python -m unittest tests.test_antarctic_island_ecology_optical_catalog -v
      - name: Download frozen outcome-blind source artifacts
        run: |
          mkdir -p build/forcing build/options
          gh run download 36517700369 -n paper2-forcing-support-audit-v1 -D build/forcing
          gh run download 36520281872 -n antarctic-breeding-options-hierarchy-v1 -D build/options
          test -f build/forcing/PAPER2_FORCING_SUPPORT_UNITS_V1.csv
          test -f build/options/ANTARCTIC_PENGUIN_BREEDING_OPTIONS_HIERARCHY_V1.csv
      - name: Query public optical scene catalogs
        run: |
          python scripts/audit_antarctic_island_ecology_optical_catalog.py \
            --forcing-csv build/forcing/PAPER2_FORCING_SUPPORT_UNITS_V1.csv \
            --options-csv build/options/ANTARCTIC_PENGUIN_BREEDING_OPTIONS_HIERARCHY_V1.csv \
            --out-json build/ANTARCTIC_ISLAND_ECOLOGY_PAPER2_OPTICAL_CATALOG_RESULT_V1.json \
            --out-csv build/ANTARCTIC_ISLAND_ECOLOGY_PAPER2_OPTICAL_CATALOG_UNITS_V1.csv
      - uses: actions/upload-artifact@v4
        with:
          name: antarctic-island-ecology-paper2-optical-catalog-v1
          path: |
            build/ANTARCTIC_ISLAND_ECOLOGY_PAPER2_OPTICAL_CATALOG_RESULT_V1.json
            build/ANTARCTIC_ISLAND_ECOLOGY_PAPER2_OPTICAL_CATALOG_UNITS_V1.csv
