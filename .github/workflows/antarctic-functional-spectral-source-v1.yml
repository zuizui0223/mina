name: antarctic-functional-spectral-source-v1
on:
  push:
    branches: [analysis/signy-seal-spatial-pressure-20261124]
    paths:
      - 'research/signy_seal_spatial_pressure_v1/spectral_library_source_audit.py'
      - 'research/signy_seal_spatial_pressure_v1/FUNCTIONAL_GROUP_SOURCE_GATE.md'
      - '.github/workflows/antarctic-functional-spectral-source-v1.yml'
  pull_request:
    paths:
      - 'research/signy_seal_spatial_pressure_v1/spectral_library_source_audit.py'
      - 'research/signy_seal_spatial_pressure_v1/FUNCTIONAL_GROUP_SOURCE_GATE.md'
      - '.github/workflows/antarctic-functional-spectral-source-v1.yml'
permissions:
  contents: read
jobs:
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests openpyxl
      - name: Verify original Edinburgh DataShare spectral source and metadata schema only
        run: python research/signy_seal_spatial_pressure_v1/spectral_library_source_audit.py --out build/antarctic_spectral_source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: antarctic-functional-spectral-source-v1
          path: build/antarctic_spectral_source/
          retention-days: 60
