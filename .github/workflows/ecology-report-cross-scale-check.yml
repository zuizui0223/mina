name: ecology-report-cross-scale-check

on:
  push:
    branches: [analysis/mapppd-regional-concentration-v1]
    paths:
      - "submission/MANUSCRIPT_ECOLOGY_REPORT_CROSS_SCALE_V1.md"
      - "submission/TITLE_PAGE_ECOLOGY_REPORT_CROSS_SCALE_TEMPLATE_V1.md"
      - "submission/COVER_LETTER_ECOLOGY_REPORT_CROSS_SCALE_V1.md"
      - "submission/APPENDIX_S1_ECOLOGY_REPORT_CROSS_SCALE_V1.md"
      - "submission/FIGURE_CAPTIONS_ECOLOGY_REPORT_CROSS_SCALE_V1.md"
      - "submission/ECOLOGY_SUBMISSION_COPY_FIELDS_CROSS_SCALE_V1.md"
      - "submission/SUBMISSION_READINESS_ECOLOGY_REPORT_CROSS_SCALE_V1.md"
      - "contracts/ECOLOGY_REPORT_CROSS_SCALE_SUBMISSION_V1.json"
      - "tests/test_ecology_report_cross_scale_submission.py"
      - ".github/workflows/ecology-report-cross-scale-check.yml"
  pull_request:
    paths:
      - "submission/MANUSCRIPT_ECOLOGY_REPORT_CROSS_SCALE_V1.md"
      - "submission/TITLE_PAGE_ECOLOGY_REPORT_CROSS_SCALE_TEMPLATE_V1.md"
      - "submission/COVER_LETTER_ECOLOGY_REPORT_CROSS_SCALE_V1.md"
      - "submission/APPENDIX_S1_ECOLOGY_REPORT_CROSS_SCALE_V1.md"
      - "submission/FIGURE_CAPTIONS_ECOLOGY_REPORT_CROSS_SCALE_V1.md"
      - "contracts/ECOLOGY_REPORT_CROSS_SCALE_SUBMISSION_V1.json"
      - "tests/test_ecology_report_cross_scale_submission.py"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Validate Ecology Report package
        run: pytest -q tests/test_ecology_report_cross_scale_submission.py
