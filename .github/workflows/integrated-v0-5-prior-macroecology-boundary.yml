name: integrated-v0-5-prior-macroecology-boundary

on:
  push:
    branches:
      - manuscript/integrated-v0.5-prior-macroecology-boundary
    paths:
      - "docs/MANUSCRIPT_INTEGRATED_V0_5.md"
      - "docs/REFERENCES_V8.bib"
      - "contracts/INTEGRATED_PALMER_ANTARCTIC_MANUSCRIPT_V0_5.json"
      - "scripts/check_integrated_manuscript_v0_5.py"
      - ".github/workflows/integrated-v0-5-prior-macroecology-boundary.yml"
  workflow_dispatch:

jobs:
  literature-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard v0.5 novelty boundary
        run: |
          python scripts/check_integrated_manuscript_v0_5.py \
            --repo-root . \
            --out build/integrated_v0_5_prior_macroecology_guard.json
      - uses: actions/upload-artifact@v4
        with:
          name: integrated-v0-5-prior-macroecology-boundary
          path: build/integrated_v0_5_prior_macroecology_guard.json
