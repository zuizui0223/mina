name: Penguin same-year three-species breeding-niche SIC macro subpanel
on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - 'research/climate-penguin/macro_panantarctic_v1/co_census_three_pair_niche.py'
      - 'research/climate-penguin/macro_panantarctic_v1/COCENSUS_THREE_PAIR_NICHE_CONTRACT_20261110.md'
      - '.github/workflows/penguin-co-census-3species-SIC-niche.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fixed-three-pair-site-year-macro:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical source and Antarctic polar georeferencing
        run: python -m pip install --disable-pip-version-check numpy pyproj==3.7.1
      - name: Verify code contracts
        run: |
          python -m py_compile research/climate-penguin/macro_panantarctic_v1/build.py
          python -m py_compile research/climate-penguin/macro_panantarctic_v1/co_census_three_pair_niche.py
      - name: Reproduce all 595 original sites and same-year 303 true species co-censuses
        run: python research/climate-penguin/macro_panantarctic_v1/build.py
      - name: Retrieve original complete 595-site 30-year monthly OSI source
        uses: actions/download-artifact@v4
        with:
          name: penguin-panantarctic-595site-original-1991-2020-monthly-ice
          run-id: 42612067836
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/source_595_30year_ice
      - name: Fixed same-year climate vs observed colony pairwise breeding ratio analysis
        run: |
          python research/climate-penguin/macro_panantarctic_v1/co_census_three_pair_niche.py \
            --full-ice-csv build/source_595_30year_ice/ice_595_outputs/original_595_site_months_120_source_QA.csv \
            --full-ice-summary build/source_595_30year_ice/ice_595_outputs/original_595_native_monthly_SIC_30year_summary.json
      - name: Preserve original 3-pair co-census and marine niche statistical support
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: penguin-macro-3species-true-cocensus-ice-niche-1991to2020
          path: |
            research/climate-penguin/macro_panantarctic_v1/outputs/macro_original_coverage.json
            research/climate-penguin/macro_panantarctic_v1/cocensus_niche_outputs/*.csv
            research/climate-penguin/macro_panantarctic_v1/cocensus_niche_outputs/*.json
          if-no-files-found: warn
