name: concentration-dominance-descriptives

on:
  push:
    branches: [analysis/two-species-concentration-synthesis-v1]
    paths:
      - "contracts/CONCENTRATION_DOMINANCE_DESCRIPTIVE_V1.json"
      - "scripts/describe_concentration_dominance.py"
      - ".github/workflows/concentration-dominance-descriptives.yml"
  workflow_dispatch:

jobs:
  describe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev]" pandas lxml html5lib beautifulsoup4
      - name: Download frozen sources
        run: |
          mkdir -p build
          python scripts/fetch_lter_census.py build/adelie_census.csv
          curl -L --fail --retry 4 --retry-delay 5             'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=daf2c4fd-c1e3-4e65-851f-d11f02c5b69d&output=zip.tree'             -o build/signy_adelie.zip
          curl -L --fail --retry 4 --retry-delay 5             'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=d0633a9b-8c56-4ae5-88bf-6ec6ba9017b9&output=zip.tree'             -o build/signy_chinstrap.zip
      - name: Run descriptive decomposition
        run: |
          python -m scripts.describe_concentration_dominance             --palmer-census build/adelie_census.csv             --signy-adelie-zip build/signy_adelie.zip             --signy-chinstrap-zip build/signy_chinstrap.zip             --out build/CONCENTRATION_DOMINANCE_DESCRIPTIVE_RESULT_V1.json
      - name: Print compact summary
        run: |
          python - <<'PY'
          import json
          x=json.load(open("build/CONCENTRATION_DOMINANCE_DESCRIPTIVE_RESULT_V1.json"))
          for key,p in x["populations"].items():
              print(key)
              print(" initial=",p["initial_dominant"])
              print(" final=",p["final_dominant"])
              print(" turnover=",p["dominant_identity_turnover"])
              print(" rho=",p["spearman_rho_initial_share_vs_log1p_count_slope"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: concentration-dominance-descriptive-v1
          path: build/CONCENTRATION_DOMINANCE_DESCRIPTIVE_RESULT_V1.json
