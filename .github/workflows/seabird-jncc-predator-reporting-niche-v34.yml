name: JNCC V34 source-only UK island mink and rat reported niche

on:
  push:
    branches: [research/jncc-v32-mechanism-contract]
    paths:
      - 'scripts/model_jncc_predator_reported_niche_v34.py'
      - 'scripts/audit_jncc_predator_island_source_v33.py'
      - 'tests/test_jncc_predator_reported_niche_v34.py'
      - '.github/workflows/seabird-jncc-predator-reporting-niche-v34.yml'
  pull_request:
    paths:
      - 'scripts/model_jncc_predator_reported_niche_v34.py'
      - 'scripts/audit_jncc_predator_island_source_v33.py'
      - 'tests/test_jncc_predator_reported_niche_v34.py'
      - '.github/workflows/seabird-jncc-predator-reporting-niche-v34.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source_only_predator_status:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original-source readers and strictly source-only GLM
        run: python -m pip install requests pytest numpy scipy scikit-learn
      - name: Test source statuses never imply verified predator absence
        run: |
          python -m pytest -q tests/test_jncc_predator_island_source_v33.py tests/test_jncc_predator_reported_niche_v34.py
      - name: Independently join original RSPB 9688 islands to official Stanbury XLSX and validate reported status predictors
        run: |
          python scripts/model_jncc_predator_reported_niche_v34.py \
            --out /tmp/JNCC_PREDATOR_REPORTED_ISLAND_NICHE_V34.json
      - name: Archive original-source model fit and sampling limitations
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jncc-original-predator-status-niche-v34-no-bird-responses
          path: /tmp/JNCC_PREDATOR_REPORTED_ISLAND_NICHE_V34.json
          if-no-files-found: warn
