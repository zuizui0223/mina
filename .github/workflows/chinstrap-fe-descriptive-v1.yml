name: chinstrap-fe-descriptive-v1
on:
  push:
    branches: [analysis/signy-seal-spatial-pressure-20261124]
    paths:
      - 'research/signy_seal_spatial_pressure_v1/chinstrap_fe_descriptive.py'
      - '.github/workflows/chinstrap-fe-descriptive-v1.yml'
  pull_request:
    paths:
      - 'research/signy_seal_spatial_pressure_v1/chinstrap_fe_descriptive.py'
      - '.github/workflows/chinstrap-fe-descriptive-v1.yml'
permissions:
  contents: read
jobs:
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests openpyxl
      - run: python research/signy_seal_spatial_pressure_v1/chinstrap_fe_descriptive.py
      - uses: actions/upload-artifact@v4
        with:
          name: chinstrap-fe-descriptive-v1
          path: build/chinstrap_fe_descriptive/result.json
          if-no-files-found: error
          retention-days: 60
