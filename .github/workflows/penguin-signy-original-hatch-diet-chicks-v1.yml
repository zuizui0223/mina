name: penguin-signy-original-hatch-diet-chicks-v1
on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - 'research/climate-penguin/work/signy_hatching_diet_chick_v1/**'
      - 'research/climate-penguin/outputs/signy_hatching_diet_chick_v1/**'
      - 'tests/test_signy_hatching_diet_chick_v1.py'
      - '.github/workflows/penguin-signy-original-hatch-diet-chicks-v1.yml'
  pull_request:
    paths:
      - 'research/climate-penguin/work/signy_hatching_diet_chick_v1/**'
      - 'research/climate-penguin/outputs/signy_hatching_diet_chick_v1/**'
      - 'tests/test_signy_hatching_diet_chick_v1.py'
      - '.github/workflows/penguin-signy-original-hatch-diet-chicks-v1.yml'
permissions:
  contents: read
jobs:
  original-hatching-trophic-productivity:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source parser dependencies
        run: python -m pip install pandas lxml html5lib beautifulsoup4
      - name: Synthetic source join checks
        run: python -m unittest discover -s tests -p test_signy_hatching_diet_chick_v1.py -v
      - name: Retrieve seven original BAS publisher archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/signy_hatch_diet_original /tmp/signy_hatch_stage_original
          curl -L --fail --retry 2 --max-time 120 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=274b49bd-40a4-4e5d-bd5f-69a1ba09d403&output=zip.tree' -o /tmp/signy_mean_hatching_original.zip
          curl -L --fail --retry 2 --max-time 120 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=eb421e6d-b93b-4174-904b-9a7b0b401403&output=zip.tree' -o /tmp/signy_hatch_diet_original/adelie.zip
          curl -L --fail --retry 2 --max-time 120 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=95e38251-797c-495a-abc0-40a613599759&output=zip.tree' -o /tmp/signy_hatch_diet_original/chinstrap.zip
          curl -L --fail --retry 2 --max-time 120 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=fb9bd975-e6fe-406c-84be-01e57d612b5e&output=zip.tree' -o /tmp/signy_hatch_diet_original/gentoo.zip
          curl -L --fail --retry 2 --max-time 120 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=daf2c4fd-c1e3-4e65-851f-d11f02c5b69d&output=zip.tree' -o /tmp/signy_hatch_stage_original/adelie.zip
          curl -L --fail --retry 2 --max-time 120 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=d0633a9b-8c56-4ae5-88bf-6ec6ba9017b9&output=zip.tree' -o /tmp/signy_hatch_stage_original/chinstrap.zip
          curl -L --fail --retry 2 --max-time 120 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=883c6b40-024e-41e8-9c3e-2668a44b5751&output=zip.tree' -o /tmp/signy_hatch_stage_original/gentoo.zip
      - name: Reconstruct original annual hatching dates and time-matched sea ice
        run: |
          python research/climate-penguin/work/signy_original_hatching_source_v1/inspect.py --source /tmp/signy_mean_hatching_original.zip --out /tmp/derived_hatch
          python research/climate-penguin/work/signy_diet_climate_v1/analyze.py --source-dir /tmp/signy_hatch_diet_original --out /tmp/derived_diet
          python research/climate-penguin/work/climate_penguin/signy_trispecies_stage_source_v1.py --source-dir /tmp/signy_hatch_stage_original --out /tmp/derived_stage
      - name: Verify real 14-year matched hatching-diet-chick source
        run: |
          SIGNY_HATCH_DATA=/tmp/derived_hatch SIGNY_DIET_DATA=/tmp/derived_diet SIGNY_STAGE_DATA=/tmp/derived_stage python -m unittest discover -s tests -p test_signy_hatching_diet_chick_v1.py -v
          python research/climate-penguin/work/signy_hatching_diet_chick_v1/join.py --hatch-dir /tmp/derived_hatch --diet-dir /tmp/derived_diet --stage-dir /tmp/derived_stage --out /tmp/signy_hatching_diet_chicks
      - uses: actions/upload-artifact@v4
        with:
          name: penguin-signy-original-hatch-diet-chicks-v1
          path: /tmp/signy_hatching_diet_chicks/
          retention-days: 30
