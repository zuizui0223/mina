name: Antarctic integrated main figures
on:
  push:
    branches: [analysis/unified-breeding-reorganization-20261125]
    paths:
      - 'research/unified_breeding_reorganization_v1/render_antarctic_figures_v03.py'
      - '.github/workflows/unified-antarctic-main-figures.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy matplotlib pillow
      - run: python research/unified_breeding_reorganization_v1/render_antarctic_figures_v03.py --out build/antarctic-main-figures
      - uses: actions/upload-artifact@v4
        with:
          name: antarctic-integrated-six-figures-v03
          path: build/antarctic-main-figures/
