name: Emperor public archive schema gate
on:
  push:
    branches:
      - analysis/emperor-access-archive-schema-gate-v1
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/audit_emperor_public_archive_headers.py'
      - 'tests/test_emperor_public_archive_headers.py'
      - 'contracts/EMPEROR_ACCESS_PUBLIC_ARCHIVE_SCHEMA_GATE_V1.json'
      - 'contracts/EMPEROR_ACCESS_PUBLIC_ARCHIVE_SCHEMA_GATE_V2.json'
      - '.github/workflows/emperor-access-archive-schema-v1.yml'
jobs:
  source-schema:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic parser integrity / no-outcome-leak tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_emperor_public_archive_headers.py
      - name: Verify public Zenodo workbooks and header candidates ONLY
        run: |
          python scripts/audit_emperor_public_archive_headers.py --out /tmp/emperor_schema_receipt.json
      - name: Assert schema receipt keeps biological outcomes sealed
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/emperor_schema_receipt.json'))
          assert d['outcome_rows_read'] == 0
          assert d['effect_fitted'] is False
          assert len(d['files']) == 3
          if d['record_metadata']['status'] != 'MANIFEST_VERIFIED':
              print('SOURCE_BLOCKED: pinned Zenodo v3 record manifest not available')
          for slot, file in d['files'].items():
              if file['status'] != 'VERIFIED':
                  print('SOURCE_OR_HEADER_NOT_VERIFIED:', slot, file['status'])
          print('STRICT_OUTCOME_BLIND_AUDIT_PASS')
          print('verified',sum(v['status']=='VERIFIED' for v in d['files'].values()),'of',len(d['files']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emperor-public-archive-schema-receipt
          path: /tmp/emperor_schema_receipt.json
          if-no-files-found: ignore
          retention-days: 14
