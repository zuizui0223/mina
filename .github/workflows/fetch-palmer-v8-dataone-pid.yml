name: Fetch Palmer v8 via DataONE PID

on:
  pull_request:
    paths:
      - ".github/workflows/fetch-palmer-v8-dataone-pid.yml"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch entity by URL PID
        run: |
          mkdir -p build/dataone_v8
          python - <<'PY'
          from urllib.parse import quote
          from pathlib import Path
          pid='https://pasta.lternet.edu/package/data/eml/knb-lter-pal/87/8/c64b0c7ef7fd2ff4404dd22c204239de'
          Path('build/dataone_v8/pid.txt').write_text(pid)
          Path('build/dataone_v8/encoded.txt').write_text(quote(pid,safe=''))
          print(quote(pid,safe=''))
          PY
          enc=$(cat build/dataone_v8/encoded.txt)
          for kind in meta object; do
            url="https://cn.dataone.org/cn/v2/$kind/$enc"
            echo "=== $url ==="
            curl -A 'Mozilla/5.0' -L -D "build/dataone_v8/$kind.headers" \
              --retry 5 --retry-delay 2 "$url" -o "build/dataone_v8/$kind.body" || true
            tail -30 "build/dataone_v8/$kind.headers" || true
            file "build/dataone_v8/$kind.body" || true
            head -20 "build/dataone_v8/$kind.body" || true
          done
      - name: Query exact entity PID in DataONE Solr
        run: |
          pid=$(cat build/dataone_v8/pid.txt)
          curl -A 'Mozilla/5.0' -L --fail --retry 5 --retry-delay 2 \
            --get \
            --data-urlencode "q=id:\"$pid\"" \
            --data-urlencode 'fl=*' \
            --data-urlencode 'rows=10' \
            --data-urlencode 'wt=json' \
            'https://cn.dataone.org/cn/v2/query/solr/' \
            -o build/dataone_v8/solr.json || true
          cat build/dataone_v8/solr.json || true
      - name: Summarize recovered CSV
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv,json
          p=Path('build/dataone_v8/object.body')
          out={}
          if p.exists():
              raw=p.read_bytes()
              try: text=raw.decode('utf-8-sig')
              except Exception: text=''
              if text and ',' in text.splitlines()[0]:
                  rows=list(csv.DictReader(text.splitlines()))
                  out={'n_rows':len(rows),'header':list(rows[0]) if rows else []}
                  if rows and {'island_name','num_breeding_pairs'}.issubset(rows[0]):
                      for y in (1991,1992,1993,2021):
                          rr=[r for r in rows if str(r.get('island_name','')).strip()=='TOR' and str(r.get('time','')).startswith(str(y))]
                          vals=[]
                          for r in rr:
                              try: vals.append(float(r['num_breeding_pairs']))
                              except: pass
                          out[f'TOR_{y}']={'n':len(rr),'sum':sum(vals),'values':vals}
          Path('build/dataone_v8/summary.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: palmer-v8-dataone-pid
          path: build/dataone_v8
