name: climate-penguin-p0-local-qa
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/climate-penguin/work/abandonment/palmer_landsat_local_qa_pilot.py'
      - 'tests/test_palmer_landsat_local_qa_pilot.py'
      - '.github/workflows/climate-penguin-p0-local-qa.yml'
jobs:
  original-landsat-qa-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate QA flags using stdlib only
        run: |
          python - <<'PY'
          import runpy
          ns=runpy.run_path("tests/test_palmer_landsat_local_qa_pilot.py")
          ns["test_landsat_qa_flags"]()
          print("PASS QA_PIXEL fill/cloud/snow/water bit contract")
          PY
      - name: Install published Python GIS drivers
        run: python -m pip install --disable-pip-version-check -q rasterio==1.4.3 pyproj==3.7.1 planetary-computer==1.0.0
      - name: Inspect actual QA_PIXEL of three fixed source summers
        run: |
          python research/climate-penguin/work/abandonment/palmer_landsat_local_qa_pilot.py \
            --out /tmp/palmer_landsat_qa_p0
      - name: Preserve original-scene outcomes including read errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: palmer-p0-landsat-qa-pilot
          path: /tmp/palmer_landsat_qa_p0/
          if-no-files-found: warn
          retention-days: 30
