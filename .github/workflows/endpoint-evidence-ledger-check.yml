name: endpoint-evidence-ledger-check

on:
  push:
    branches: [analysis/mapppd-regional-concentration-v1]
    paths:
      - "contracts/ENDPOINT_EVIDENCE_LEDGER_V1.json"
      - "docs/ENDPOINT_EVIDENCE_LEDGER_V1.md"
      - "docs/HIERARCHY_STORY_FROM_66_ENDPOINTS_V1.md"
      - "docs/ENDPOINT_EVIDENCE_MATRIX_MAIN_TEXT_V1.md"
      - "tests/test_endpoint_evidence_ledger.py"
      - ".github/workflows/endpoint-evidence-ledger-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/test_endpoint_evidence_ledger.py
