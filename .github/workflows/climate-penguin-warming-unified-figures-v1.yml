name: climate-penguin-warming-unified-figures-v1

on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - "research/climate-penguin/warming_unified_v1/render_warming_figures.py"
      - ".github/workflows/climate-penguin-warming-unified-figures-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plot-verified-warming:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/climate-penguin-progress
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact plotting dependencies
        run: |
          python -m pip install matplotlib==3.10.7 numpy==2.2.6 Pillow==11.3.0
          python -m py_compile research/climate-penguin/warming_unified_v1/render_warming_figures.py
      - name: Plot exactly the verified original-site climate, Signy common years and future physical exposure
        run: python research/climate-penguin/warming_unified_v1/render_warming_figures.py
      - name: Validate source counts, figure bytes and physical-only label
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          b=Path("research/climate-penguin/warming_unified_v1")
          r=json.loads((b/"outputs/WARMING_FIGURES_QA.json").read_text())
          assert r["status"]=="WARMING_FIGURES_FROM_LOCKED_OBSERVATIONAL_AND_PHYSICAL_INPUTS"
          assert (r["sample_six_sites"],r["same_year_climate_n"],r["stomach_data_n"],r["future_scenarios"],r["future_marine_sites"])==(6,9,422,4,4)
          assert r["new_inference"] is False and len(r["figures"])==3
          for f in r["figures"]:
            assert (b/"figures"/(f["stem"]+".png")).is_file()
            assert (b/"figures"/(f["stem"]+".svg")).is_file()
          print("PASS: original source climate/biology and image validity")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mina-warming-figures-original-source
          retention-days: 90
          path: |
            research/climate-penguin/warming_unified_v1/figures/*.png
            research/climate-penguin/warming_unified_v1/figures/*.svg
            research/climate-penguin/warming_unified_v1/outputs/WARMING_FIGURES_QA.json
      - name: Commit only derived original-source manuscript figures to Draft PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/climate-penguin/warming_unified_v1/figures \
            research/climate-penguin/warming_unified_v1/outputs/WARMING_FIGURES_QA.json
          if git diff --cached --quiet; then
            echo "Plots unchanged"
          else
            git commit -m "Warming unified: plot verified six-site, same-year niche and CMIP6 physical evidence"
            git push origin HEAD:codex/climate-penguin-progress
          fi
