name: mapppd-macro-geography-audit

on:
  push:
    branches:
      - analysis/mapppd-macro-geography-v1
    paths:
      - "scripts/audit_mapppd_candidate_geography.py"
      - "contracts/MAPPPD_MACRO_GEOGRAPHY_AUDIT_V1.json"
      - ".github/workflows/mapppd-macro-geography-audit.yml"
  pull_request:
    paths:
      - "scripts/audit_mapppd_candidate_geography.py"
      - "contracts/MAPPPD_MACRO_GEOGRAPHY_AUDIT_V1.json"
      - ".github/workflows/mapppd-macro-geography-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas pyreadr
      - name: Fetch pinned mapppdr source
        run: |
          git clone --quiet https://github.com/CCheCastaldo/mapppdr.git build/mapppdr
          git -C build/mapppdr checkout --quiet 88c73a507e0921b2541c218c71eaf16721bc6502
      - name: Audit macro geographic coverage
        run: |
          python scripts/audit_mapppd_candidate_geography.py \
            --mapppdr-dir build/mapppdr \
            --out build/mapppd_macro_geography_audit_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: mapppd-macro-geography-audit-v1
          path: build/mapppd_macro_geography_audit_v1.json
