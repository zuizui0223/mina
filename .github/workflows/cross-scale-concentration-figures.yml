name: cross-scale-concentration-figures

on:
  push:
    branches: [analysis/mapppd-regional-concentration-v1]
    paths:
      - "docs/MANUSCRIPT_CROSS_SCALE_CONCENTRATION_V0_1.md"
      - "results/MAPPPD_REGIONAL_CONCENTRATION_RECEIPT_V2.json"
      - "scripts/plot_cross_scale_concentration_figures.py"
      - ".github/workflows/cross-scale-concentration-figures.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev]" matplotlib

      - name: Reuse frozen Palmer-Signy figure data
        run: |
          mkdir -p build/reused build/figure_data build/figures
          gh run download 36953934301             -n replicated-concentration-figures-v1             -D build/reused
          test -s build/reused/figure_data/FIGURE_DATA_RECEIPT_V1.json
          test -s build/reused/figure_data/figure1_trajectories.csv
          test -s build/reused/figure_data/figure2_summary.csv
          test -s build/reused/figure_data/figure3_dominance_routes.csv
          cp build/reused/figure_data/* build/figure_data/

      - name: Render cross-scale figures
        run: |
          python -m scripts.plot_cross_scale_concentration_figures             --local-data-dir build/figure_data             --regional-receipt results/MAPPPD_REGIONAL_CONCENTRATION_RECEIPT_V2.json             --out-dir build/figures
          test -s build/figures/figure1_replicated_trajectories.pdf
          test -s build/figures/figure2_cross_scale_transfer.pdf
          test -s build/figures/figure3_regional_endpoint_context.pdf
          test -s build/figures/figureS1_nominal_dominance_routes.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: cross-scale-concentration-figures-v1
          path: |
            build/figure_data/*
            build/figures/*
