name: climate-penguin-original-91-matched-species-climate-v1
on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - ".github/workflows/climate-penguin-original-91-matched-species-climate-v1.yml"
      - "research/climate-penguin/work/climate_penguin/fit_MAPPPD5_matched_species_ERA5_v1.py"
      - "research/climate-penguin/contracts/MAPPPD5_MATCHED_SPECIES_CLIMATE_V1.md"
      - "tests/test_MAPPPD5_matched_species_climate_v1.py"
      - "tests/test_matched_climate_residual_df_v2.py"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-original-shared-source-species-temperature-contrasts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pytest
      - run: pytest -q tests/test_MAPPPD5_matched_species_climate_v1.py tests/test_matched_climate_residual_df_v2.py
      - uses: actions/download-artifact@v4
        with:
          name: climate-penguin-original-MAPPPD5-381-ERA5-exploratory-v1
          run-id: 40868420083
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/original_381
      - uses: actions/download-artifact@v4
        with:
          name: climate-penguin-MAPPPD5-same-source-species-gate-v1
          run-id: 40868942984
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/same_source_species
      - name: Fit rank-guarded exploratory matched species relative growth
        run: |
          python research/climate-penguin/work/climate_penguin/fit_MAPPPD5_matched_species_ERA5_v1.py \
            --original-381-dir "${{ runner.temp }}/original_381" \
            --matched-species-dir "${{ runner.temp }}/same_source_species" \
            --out "${{ runner.temp }}/matched_91_species"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: climate-penguin-original-91-matched-species-climate-v1
          path: ${{ runner.temp }}/matched_91_species/
          retention-days: 30
          if-no-files-found: warn
