name: V29b common seasonal coastal polynya axes
on:
  push:
    branches: [analysis/pygoscelis-count-functional-sensitivity-20261126]
    paths: ['.github/workflows/macro-coastal-common-polynya-v29b.yml']
permissions:
  contents: read
  actions: read
jobs:
  common:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - name: Verify all original-source artifacts and run fixed calendar physical comparisons
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15171205908/zip" > ice.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15170756736/zip" > hydro.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15171167651/zip" > polynya.zip
          python research/macro_marine_land_footprint_v1/common_polynya_v29b.py ice.zip hydro.zip polynya.zip v29b_result dd2865ab2b3de3821138a8c48bdaa5381a5be923ec22d4d521a7dc02144ab84a
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro-coastal-common-polynya-v29b
          path: v29b_result/
          retention-days: 30
          if-no-files-found: warn
