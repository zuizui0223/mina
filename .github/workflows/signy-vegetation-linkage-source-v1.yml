name: signy-vegetation-linkage-source-v1
on:
  push:
    branches: [analysis/signy-seal-spatial-pressure-20261124]
    paths:
      - 'research/signy_seal_spatial_pressure_v1/vegetation_source_audit.py'
      - 'research/signy_seal_spatial_pressure_v1/VEGETATION_LINKAGE_GATE.md'
      - '.github/workflows/signy-vegetation-linkage-source-v1.yml'
  pull_request:
    paths:
      - 'research/signy_seal_spatial_pressure_v1/vegetation_source_audit.py'
      - 'research/signy_seal_spatial_pressure_v1/VEGETATION_LINKAGE_GATE.md'
      - '.github/workflows/signy-vegetation-linkage-source-v1.yml'
permissions:
  contents: read
jobs:
  publisher-source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests openpyxl xlrd pymupdf pyshp
      - name: Inventory original plant data and seal geographic reference, without joining outcomes
        run: python research/signy_seal_spatial_pressure_v1/vegetation_source_audit.py --out build/signy_vegetation_source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signy-vegetation-linkage-source-v1
          path: build/signy_vegetation_source/
          if-no-files-found: warn
          retention-days: 60
