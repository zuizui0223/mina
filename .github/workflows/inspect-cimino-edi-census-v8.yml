name: Inspect Cimino EDI census v8

on:
  pull_request:
    paths:
      - ".github/workflows/inspect-cimino-edi-census-v8.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve DOI and inspect landing page
        run: |
          mkdir -p build
          curl -A 'Mozilla/5.0' -L --fail --retry 8 --retry-delay 5 --retry-all-errors \
            -D build/headers.txt \
            'https://doi.org/10.6073/pasta/805f6b97593c60cfdfd02266db9ab4b6' \
            -o build/landing
          echo '--- final file type ---'
          file build/landing
          echo '--- headers ---'
          cat build/headers.txt
          echo '--- first 300 lines ---'
          sed -n '1,300p' build/landing
          echo '--- candidate URLs ---'
          grep -Eo 'https?://[^"<> ]+' build/landing | sort -u | grep -E 'pasta|lternet|package|data|csv|txt' || true
      - uses: actions/upload-artifact@v4
        with:
          name: inspect-cimino-edi-census-v8
          path: |
            build/headers.txt
            build/landing
