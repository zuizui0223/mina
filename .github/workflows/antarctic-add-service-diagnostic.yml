name: antarctic-add-service-diagnostic

on:
  push:
    branches:
      - analysis/antarctic-breeding-island-atlas-v1
    paths:
      - "scripts/diagnose_add_service.py"
      - ".github/workflows/antarctic-add-service-diagnostic.yml"
  pull_request:
    paths:
      - "scripts/diagnose_add_service.py"
      - ".github/workflows/antarctic-add-service-diagnostic.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyreadr requests pandas
      - name: Fetch pinned mapppdr source
        run: |
          git clone --quiet https://github.com/CCheCastaldo/mapppdr.git build/mapppdr
          git -C build/mapppdr checkout --quiet 88c73a507e0921b2541c218c71eaf16721bc6502
      - name: Diagnose SCAR ADD FeatureServer
        run: |
          python scripts/diagnose_add_service.py \
            --mapppdr-dir build/mapppdr \
            --out build/add_service_diagnostic_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: antarctic-add-service-diagnostic-v1
          path: build/add_service_diagnostic_v1.json
