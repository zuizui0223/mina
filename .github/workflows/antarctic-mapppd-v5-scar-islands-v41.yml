name: Antarctic V41 original MAPPPD5 matched-method land polygon continuity sample
on:
  push:
    branches: [research/antarctic-penguin-island-macro-v1]
    paths: ['contracts/MAPPPD_V5_LAND_CONTINUITY_V41.md','scripts/audit_mapppd_v5_scar_land_continuity_v41.py','tests/test_mapppd_v5_scar_land_continuity_v41.py','.github/workflows/antarctic-mapppd-v5-scar-islands-v41.yml']
  pull_request:
    paths: ['contracts/MAPPPD_V5_LAND_CONTINUITY_V41.md','scripts/audit_mapppd_v5_scar_land_continuity_v41.py','tests/test_mapppd_v5_scar_land_continuity_v41.py','.github/workflows/antarctic-mapppd-v5-scar-islands-v41.yml']
  workflow_dispatch:
jobs:
  original_SCAR_polygon_network:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest requests shapely pyshp pyproj
      - run: python -m pytest -q tests/test_mapppd_v5_scar_land_continuity_v41.py
      - run: python scripts/audit_mapppd_v5_scar_land_continuity_v41.py --out /tmp/MAPPPD5_SCAR_LAND_SOURCE_V41.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-mapppd-v5-scar-land-source-v41
          path: /tmp/MAPPPD5_SCAR_LAND_SOURCE_V41.json
