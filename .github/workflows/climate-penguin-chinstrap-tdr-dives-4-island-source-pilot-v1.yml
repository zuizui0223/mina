name: climate-penguin-chinstrap-tdr-dives-4-island-source-pilot-v1

on:
  workflow_dispatch:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - "research/climate-penguin/work/climate_penguin/chinstrap_tdr_pressure_gps_pilot_v1.py"
      - "tests/test_chinstrap_tdr_pressure_gps_pilot_v1.py"
      - ".github/workflows/climate-penguin-chinstrap-tdr-dives-4-island-source-pilot-v1.yml"

jobs:
  original-four:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install numerical routines only
        run: python -m pip install numpy
      - name: Run source-independent pressure/GPS temporal event unit tests
        run: python -m unittest discover -s tests -p test_chinstrap_tdr_pressure_gps_pilot_v1.py -v
      - name: Download original BAS Chinstrap Version2 source GPS and pressure
        run: |
          mkdir -p build/chinstrap_original_pilot
          curl -L --fail --retry 4 --retry-delay 6 --max-time 1200 \
            'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=8f8ccba5-01af-4b00-8a3b-c3c85b24bf92&output=zip.tree' \
            -o build/chinstrap_original_pilot/GPS.zip
          curl -L --fail --retry 4 --retry-delay 6 --max-time 1200 \
            'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=da13e049-be2b-4345-bbdd-ab960cb24731&output=zip.tree' \
            -o build/chinstrap_original_pilot/TDR.zip
      - name: Audit raw pressure and candidate events in four pre-fixed same-source deployments
        run: |
          python research/climate-penguin/work/climate_penguin/chinstrap_tdr_pressure_gps_pilot_v1.py \
            --tdr-zip build/chinstrap_original_pilot/TDR.zip \
            --gps-zip build/chinstrap_original_pilot/GPS.zip \
            --out build/chinstrap_original_pilot/derived
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chinstrap-original-TDR-pressure-four-island-pilot-v1
          path: |
            build/chinstrap_original_pilot/derived/pilot_4source_deployments.csv
            build/chinstrap_original_pilot/derived/pilot_decision.json
