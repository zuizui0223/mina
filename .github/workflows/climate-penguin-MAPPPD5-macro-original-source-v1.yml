name: climate-penguin-MAPPPD5-macro-original-source-v1
on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - ".github/workflows/climate-penguin-MAPPPD5-macro-original-source-v1.yml"
      - "research/climate-penguin/work/climate_penguin/derive_MAPPPD5_original_macro_source_v1.py"
      - "research/climate-penguin/contracts/MAPPPD5_THREE_TAXA_MACRO_SOURCE_BRIDGE_V1.md"
      - "tests/test_climate_penguin_MAPPPD5_macro_source_v1.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-2026-macro-source-paired-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests pytest
      - name: Synthetic source ancestry and exclusion tests
        run: pytest -q tests/test_climate_penguin_MAPPPD5_macro_source_v1.py
      - name: Fetch SHA-pinned publisher MAPPPD5 and reproduce 771 exact same-source pair identifiers
        run: |
          python research/climate-penguin/work/climate_penguin/derive_MAPPPD5_original_macro_source_v1.py \
            --out "${{ runner.temp }}/MAPPPD5_three_taxa_original_macro"
      - name: Archive original provenance and reproducible 771-row source-only panel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: climate-penguin-MAPPPD5-original-771-macro-source-v1
          path: ${{ runner.temp }}/MAPPPD5_three_taxa_original_macro/
          retention-days: 30
          if-no-files-found: warn
