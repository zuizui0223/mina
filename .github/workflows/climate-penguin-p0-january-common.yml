name: climate-penguin-p0-january-spatial-common
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/climate-penguin/work/abandonment/palmer_january_common_qa.py'
      - 'tests/test_palmer_january_common_qa.py'
      - '.github/workflows/climate-penguin-p0-january-common.yml'
jobs:
  january-common-source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run offline QA-matching design test
        run: |
          python - <<'PY'
          import runpy
          test=runpy.run_path("tests/test_palmer_january_common_qa.py")
          test["test_same_epsg3031_grid_and_qa_choice"]()
          print("PASS deterministic common geographic sample point selection")
          PY
      - name: Install fixed GIS source readers
        run: python -m pip install --disable-pip-version-check -q rasterio==1.4.3 pyproj==3.7.1 planetary-computer==1.0.0
      - name: Audit original January pre and post QA at identical ground points
        run: |
          python research/climate-penguin/work/abandonment/palmer_january_common_qa.py \
            --out /tmp/palmer_january_common_qa
      - name: Preserve full 2007 x 2008 scene pair matrix and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: palmer-p0-january-common-ground-QA
          path: /tmp/palmer_january_common_qa/
          if-no-files-found: warn
          retention-days: 30
