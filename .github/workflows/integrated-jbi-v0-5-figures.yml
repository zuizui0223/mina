name: integrated-jbi-v0-5-figures

on:
  push:
    branches:
      - submission/jbi-v0.5-current
    paths:
      - "scripts/build_jbi_figure1_data_v0_5.py"
      - "scripts/build_integrated_figure_data_v0_3.py"
      - "scripts/render_integrated_figures_v0_3.py"
      - "scripts/render_integrated_figures_jbi_v0_5.py"
      - "docs/INTEGRATED_FIGURE_CAPTIONS_JBI_V0_5.md"
      - "contracts/INTEGRATED_JBI_FIGURE_PACKAGE_V0_5.json"
      - ".github/workflows/integrated-jbi-v0-5-figures.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rendering dependencies
        run: python -m pip install -e ".[dev,figures]" pandas pyreadr
      - name: Fetch frozen Palmer census
        run: python scripts/fetch_lter_census.py build/adelie_census.csv
      - name: Fetch pinned MAPPPD source
        run: |
          git clone --quiet https://github.com/CCheCastaldo/mapppdr.git build/mapppdr
          git -C build/mapppdr checkout --quiet 88c73a507e0921b2541c218c71eaf16721bc6502
      - name: Build minimal frozen Figure 1 data
        run: |
          python scripts/build_jbi_figure1_data_v0_5.py \
            --census build/adelie_census.csv \
            --mapppdr-dir build/mapppdr \
            --out-dir build/jbi_figure1_data
      - name: Build latest frozen Figures 2-4 data
        run: |
          python scripts/build_integrated_figure_data_v0_3.py \
            --out-dir build/integrated_figure_data
      - name: Render JBI Figures 1-4
        run: |
          python scripts/render_integrated_figures_jbi_v0_5.py \
            --repo-root . \
            --palmer-data build/jbi_figure1_data \
            --integrated-data build/integrated_figure_data \
            --out-dir build/jbi_figures
      - name: Verify outputs
        run: |
          for stem in \
            figure1_shared_decline_jbi_v0_5 \
            figure2_palmer_dynamic_history_jbi_v0_5 \
            figure3_antarctic_interaction_jbi_v0_5 \
            figure4_scale_and_detectability_jbi_v0_5
          do
            test -s "build/jbi_figures/${stem}.pdf"
            test -s "build/jbi_figures/${stem}.png"
          done
          test -s build/jbi_figure1_data/figure1_manifest.json
          test -s build/integrated_figure_data/figure_data_manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: integrated-jbi-v0-5-figures
          path: |
            build/jbi_figures
            build/jbi_figure1_data/figure1_manifest.json
            build/integrated_figure_data/figure_data_manifest.json
            docs/INTEGRATED_FIGURE_CAPTIONS_JBI_V0_5.md
