name: climate-penguin-fixed-precensus-lag-v3
on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - '.github/workflows/climate-penguin-fixed-precensus-lag-v3.yml'
      - 'research/climate-penguin/work/climate_penguin/lagged_climate_v3.py'
      - 'tests/test_lagged_chronology_v3.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-year-bounded-lag:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pytest
      - run: python -m pytest -q tests/test_lagged_chronology_v3.py
      - uses: actions/download-artifact@v4
        with:
          name: climate-penguin-original-MAPPPD5-381-ERA5-exploratory-v1
          run-id: 40868420083
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/cohort
      - uses: actions/download-artifact@v4
        with:
          name: climate-penguin-mapppd-matched-species-growth-v1
          run-id: 40868828790
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/observations
      - uses: actions/download-artifact@v4
        with:
          name: climate-penguin-era5-1991-2020-source-full
          run-id: 40856645581
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/era5
      - uses: actions/download-artifact@v4
        with:
          name: climate-penguin-mapppd-matched-species-land-v1
          run-id: 40869812618
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/land
      - name: Recompute unchanged common cohort and prior-window chronology
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python research/climate-penguin/work/climate_penguin/lagged_climate_v3.py \
            --cohort inputs/cohort/original_MAPPPD5_381_pairs_count_ERA5_join.csv \
            --observations-p1 inputs/observations/source/observations_p1.csv \
            --observations-p2 inputs/observations/source/observations_p2.csv \
            --era5 inputs/era5/era5_monthly_1991_2020.csv \
            --land-result inputs/land/matched_species_land_result.json \
            --out outputs/fixed_lag_v3
      - uses: actions/upload-artifact@v4
        with:
          name: climate-penguin-fixed-precensus-lag-v3
          path: outputs/fixed_lag_v3/
          retention-days: 30
          if-no-files-found: error
