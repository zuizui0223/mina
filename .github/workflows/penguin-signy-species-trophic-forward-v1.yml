name: penguin-signy-species-trophic-forward-v1
on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - 'research/climate-penguin/work/signy_species_trophic_forward_v1/**'
      - 'tests/test_signy_species_trophic_forward_v1.py'
      - '.github/workflows/penguin-signy-species-trophic-forward-v1.yml'
  pull_request:
    paths:
      - 'research/climate-penguin/work/signy_species_trophic_forward_v1/**'
      - 'tests/test_signy_species_trophic_forward_v1.py'
      - '.github/workflows/penguin-signy-species-trophic-forward-v1.yml'
permissions:
  contents: read
jobs:
  chronological:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_signy_species_trophic_forward_v1.py' -v
      - name: Download original pinned BAS stomach records
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/signy_three_original
          curl -L --fail --retry 2 --max-time 120 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=eb421e6d-b93b-4174-904b-9a7b0b401403&output=zip.tree' -o /tmp/signy_three_original/adelie.zip
          curl -L --fail --retry 2 --max-time 120 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=95e38251-797c-495a-abc0-40a613599759&output=zip.tree' -o /tmp/signy_three_original/chinstrap.zip
          curl -L --fail --retry 2 --max-time 120 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=fb9bd975-e6fe-406c-84be-01e57d612b5e&output=zip.tree' -o /tmp/signy_three_original/gentoo.zip
      - name: Reconstruct original stomach and nine-year triple species proportions
        run: |
          python research/climate-penguin/work/signy_diet_climate_v1/analyze.py --source-dir /tmp/signy_three_original --out /tmp/signy_original_derived
          python research/climate-penguin/work/signy_marine_niche_robustness_v2/analyze.py --derived /tmp/signy_original_derived --out /tmp/signy_nine_seasons
      - name: Run independent chronological 2006-2009 validation
        run: |
          SIGNY_NINE_YEAR_SOURCE=/tmp/signy_nine_seasons/nine_year_fish_gap.csv python -m unittest discover -s tests -p 'test_signy_species_trophic_forward_v1.py' -v
          python research/climate-penguin/work/signy_species_trophic_forward_v1/analyze.py --nine-year /tmp/signy_nine_seasons/nine_year_fish_gap.csv --out /tmp/signy_species_four_year
      - uses: actions/upload-artifact@v4
        with:
          name: penguin-signy-species-trophic-forward-v1
          path: /tmp/signy_species_four_year/
          retention-days: 30
