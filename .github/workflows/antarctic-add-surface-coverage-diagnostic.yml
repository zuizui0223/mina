name: antarctic-add-surface-coverage-diagnostic

on:
  push:
    branches:
      - analysis/antarctic-atlas-geometry-debug-v1
    paths:
      - "scripts/diagnose_add_surface_coverage.py"
      - ".github/workflows/antarctic-add-surface-coverage-diagnostic.yml"
  pull_request:
    paths:
      - "scripts/diagnose_add_surface_coverage.py"
      - ".github/workflows/antarctic-add-surface-coverage-diagnostic.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Diagnose SCAR ADD surface coverage
        run: |
          python scripts/diagnose_add_surface_coverage.py \
            --out build/add_surface_coverage_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: antarctic-add-surface-coverage-v1
          path: build/add_surface_coverage_v1.json
