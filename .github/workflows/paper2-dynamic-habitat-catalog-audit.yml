name: paper2-dynamic-habitat-catalog-audit

on:
  push:
    branches: [research/antarctic-island-ecology-v1]
    paths:
      - "contracts/PAPER2_DYNAMIC_HABITAT_CATALOG_AUDIT_V1.json"
      - "scripts/audit_paper2_dynamic_habitat_catalog.py"
      - "tests/test_paper2_dynamic_habitat_catalog.py"
      - ".github/workflows/paper2-dynamic-habitat-catalog-audit.yml"
  pull_request:
    paths:
      - "contracts/PAPER2_DYNAMIC_HABITAT_CATALOG_AUDIT_V1.json"
      - "scripts/audit_paper2_dynamic_habitat_catalog.py"
      - "tests/test_paper2_dynamic_habitat_catalog.py"
      - ".github/workflows/paper2-dynamic-habitat-catalog-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas requests
      - name: Run unit tests
        run: python -m unittest tests.test_paper2_dynamic_habitat_catalog -v
      - name: Download frozen outcome-blind support artifacts
        run: |
          mkdir -p build/forcing build/options build/output
          gh run download 36517700369 -n paper2-forcing-support-audit-v1 -D build/forcing
          gh run download 36520281872 -n antarctic-breeding-options-hierarchy-v1 -D build/options
          test -f build/forcing/PAPER2_FORCING_SUPPORT_UNITS_V1.csv
          test -f build/options/ANTARCTIC_PENGUIN_BREEDING_OPTIONS_HIERARCHY_V1.csv
      - name: Audit Earth Search optical catalog support
        run: |
          python scripts/audit_paper2_dynamic_habitat_catalog.py \
            --forcing-csv build/forcing/PAPER2_FORCING_SUPPORT_UNITS_V1.csv \
            --habitat-csv build/options/ANTARCTIC_PENGUIN_BREEDING_OPTIONS_HIERARCHY_V1.csv \
            --out-seed build/output/PAPER2_DYNAMIC_HABITAT_SUPPORT_SEED_V1.csv \
            --out-csv build/output/PAPER2_DYNAMIC_HABITAT_CATALOG_AUDIT_V1.csv \
            --out-json build/output/PAPER2_DYNAMIC_HABITAT_CATALOG_AUDIT_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: paper2-dynamic-habitat-catalog-audit-v1
          path: |
            build/output/PAPER2_DYNAMIC_HABITAT_SUPPORT_SEED_V1.csv
            build/output/PAPER2_DYNAMIC_HABITAT_CATALOG_AUDIT_V1.csv
            build/output/PAPER2_DYNAMIC_HABITAT_CATALOG_AUDIT_RESULT_V1.json
