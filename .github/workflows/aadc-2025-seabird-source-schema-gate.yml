name: AADC 2025 8 seabirds and habitat-atlas original file schema

on:
  push:
    branches: [analysis/postglacial-glims-sourcegate-20261119]
    paths:
      - scripts/audit_aadc_2025_seabird_riskset_original_schema.py
      - tests/test_aadc_2025_seabird_riskset_original_schema.py
      - .github/workflows/aadc-2025-seabird-source-schema-gate.yml
  workflow_dispatch:

concurrency:
  group: aadc-2025-original-species-schema-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-file-schemas:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests openpyxl xlrd
      - name: Source schema parser tests
        run: |
          python -m py_compile scripts/audit_aadc_2025_seabird_riskset_original_schema.py
          python -m unittest discover -s tests -p test_aadc_2025_seabird_riskset_original_schema.py -v
      - name: Download five AADC publisher original files and record schema without animal outcomes
        run: |
          python -m scripts.audit_aadc_2025_seabird_riskset_original_schema \
            --out-json build/AADC_2025_EIGHT_SPECIES_ORIGINAL_SCHEMA_20261119.json
      - name: Keep original complete SHA and schema receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aadc-2025-eight-species-and-atlas-original-source-schema
          path: build/AADC_2025_EIGHT_SPECIES_ORIGINAL_SCHEMA_20261119.json
          retention-days: 30
