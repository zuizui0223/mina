name: paper2-forcing-support-audit

on:
  push:
    branches: [analysis/paper2-forcing-support-v1]
    paths:
      - "scripts/audit_paper2_forcing_support.py"
      - "tests/test_paper2_forcing_support.py"
      - "contracts/PAPER2_FORCING_SUPPORT_AUDIT_V1.json"
      - "contracts/PAPER2_FORCING_MODEL_ELIGIBILITY_V1.json"
      - ".github/workflows/paper2-forcing-support-audit.yml"
  pull_request:
    paths:
      - "scripts/audit_paper2_forcing_support.py"
      - "tests/test_paper2_forcing_support.py"
      - "contracts/PAPER2_FORCING_SUPPORT_AUDIT_V1.json"
      - "contracts/PAPER2_FORCING_MODEL_ELIGIBILITY_V1.json"
      - ".github/workflows/paper2-forcing-support-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas pyreadr
      - name: Run forcing-support unit tests
        run: python -m unittest tests.test_paper2_forcing_support -v
      - name: Fetch pinned mapppdr
        run: |
          git clone --quiet https://github.com/CCheCastaldo/mapppdr.git build/mapppdr
          git -C build/mapppdr checkout --quiet 88c73a507e0921b2541c218c71eaf16721bc6502
      - name: Audit forcing support
        run: |
          python scripts/audit_paper2_forcing_support.py \
            --mapppdr-dir build/mapppdr \
            --out-json build/PAPER2_FORCING_SUPPORT_AUDIT_RESULT_V1.json \
            --out-csv build/PAPER2_FORCING_SUPPORT_UNITS_V1.csv
      - uses: actions/upload-artifact@v4
        with:
          name: paper2-forcing-support-audit-v1
          path: |
            build/PAPER2_FORCING_SUPPORT_AUDIT_RESULT_V1.json
            build/PAPER2_FORCING_SUPPORT_UNITS_V1.csv
