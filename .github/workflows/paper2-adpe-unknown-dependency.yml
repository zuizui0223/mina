name: paper2-adpe-unknown-dependency
on:
  push:
    branches: [analysis/paper2-adpe-unknown-dependency]
  pull_request:
    paths:
      - "scripts/audit_paper2_adpe_unknown_dependency.py"
      - ".github/workflows/paper2-adpe-unknown-dependency.yml"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-22.04
    permissions: {actions: read, contents: read}
    env: {GH_TOKEN: "${{ github.token }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pandas numpy pyreadr
      - run: |
          git clone --quiet https://github.com/CCheCastaldo/mapppdr.git build/mapppdr
          git -C build/mapppdr checkout --quiet 88c73a507e0921b2541c218c71eaf16721bc6502
          mkdir -p build/forcing build/options
          gh run download 36517700369 -n paper2-forcing-support-audit-v1 -D build/forcing
          gh run download 36520281872 -n antarctic-breeding-options-hierarchy-v1 -D build/options
          python -m scripts.audit_paper2_adpe_unknown_dependency \
            --forcing-json build/forcing/PAPER2_FORCING_SUPPORT_AUDIT_RESULT_V1.json \
            --forcing-csv build/forcing/PAPER2_FORCING_SUPPORT_UNITS_V1.csv \
            --breeding-csv build/options/ANTARCTIC_PENGUIN_BREEDING_OPTIONS_HIERARCHY_V1.csv \
            --mapppdr-dir build/mapppdr --out-json build/PAPER2_ADPE_UNKNOWN_DEPENDENCY_RESULT.json
      - uses: actions/upload-artifact@v4
        with: {name: paper2-adpe-unknown-dependency, path: build/PAPER2_ADPE_UNKNOWN_DEPENDENCY_RESULT.json}
