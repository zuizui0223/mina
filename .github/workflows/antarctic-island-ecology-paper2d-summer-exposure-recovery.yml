name: antarctic-island-ecology-paper2d-summer-exposure-recovery

on:
  push:
    branches: [research/antarctic-island-ecology-v1]
    paths:
      - "contracts/ANTARCTIC_ISLAND_ECOLOGY_PAPER2D_SUMMER_EXPOSURE_RECOVERY_V1.json"
      - "scripts/recover_paper2d_summer_exposure_beaufort.py"
      - "tests/test_paper2d_summer_exposure_recovery.py"
      - ".github/workflows/antarctic-island-ecology-paper2d-summer-exposure-recovery.yml"
  pull_request:
    paths:
      - "contracts/ANTARCTIC_ISLAND_ECOLOGY_PAPER2D_SUMMER_EXPOSURE_RECOVERY_V1.json"
      - "scripts/recover_paper2d_summer_exposure_beaufort.py"
      - "tests/test_paper2d_summer_exposure_recovery.py"
      - ".github/workflows/antarctic-island-ecology-paper2d-summer-exposure-recovery.yml"
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy requests rasterio pyproj planetary-computer
      - run: python -m unittest tests.test_paper2d_summer_exposure_recovery -v
      - name: Download frozen full pixel-QA artifact
        run: |
          mkdir -p build/qa build/aei build/out
          gh run download 37189507445 -n antarctic-island-ecology-paper2d-full-pixel-qa-v1 -D build/qa
          test -f build/qa/ANTARCTIC_ISLAND_ECOLOGY_PAPER2D_FULL_PIXEL_QA_SITES_V1.csv
          test -f build/qa/ANTARCTIC_ISLAND_ECOLOGY_PAPER2D_FULL_PIXEL_QA_SCENES_V1.csv
      - name: Download frozen Antarctic Ecosystem Inventory raster
        run: |
          curl -L --fail --retry 5 --retry-delay 5 \
            'https://zenodo.org/records/11629115/files/AntarcticaEcosystemInventory_IceFreeLands_v1_int.tif?download=1' \
            -o build/aei/AntarcticaEcosystemInventory_IceFreeLands_v1_int.tif
          echo 'cde880d73f7f18b44aecf5690aa2dc92  build/aei/AntarcticaEcosystemInventory_IceFreeLands_v1_int.tif' | md5sum -c -
      - name: Recover Beaufort positive direction
        run: |
          python scripts/recover_paper2d_summer_exposure_beaufort.py \
            --sites-csv build/qa/ANTARCTIC_ISLAND_ECOLOGY_PAPER2D_FULL_PIXEL_QA_SITES_V1.csv \
            --scenes-csv build/qa/ANTARCTIC_ISLAND_ECOLOGY_PAPER2D_FULL_PIXEL_QA_SCENES_V1.csv \
            --aei-raster build/aei/AntarcticaEcosystemInventory_IceFreeLands_v1_int.tif \
            --out-json build/out/PAPER2D_SUMMER_EXPOSURE_BEAUFORT_RECOVERY_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper2d-summer-exposure-beaufort-recovery-v1
          path: build/out/*
          if-no-files-found: warn
