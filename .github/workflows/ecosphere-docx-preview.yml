name: ecosphere-docx-preview

on:
  push:
    branches:
      - submission/ecosphere-v0.8-package-v1
    paths:
      - "scripts/build_ecosphere_submission_docx.py"
      - "tests/test_ecosphere_submission_metadata.py"
      - "submission/ECOSPHERE_METADATA_TEMPLATE.json"
      - "src/mina/ecosphere_submission_metadata.py"
      - "tests/test_ecosphere_docx_builder.py"
      - ".github/workflows/ecosphere-docx-preview.yml"
      - "pyproject.toml"
      - "docs/MANUSCRIPT_ECOSPHERE_V0_8.md"
      - "docs/REFERENCES_V6.bib"
      - "docs/FIGURE_CAPTIONS_V7.md"
  pull_request:
    paths:
      - "scripts/build_ecosphere_submission_docx.py"
      - "tests/test_ecosphere_submission_metadata.py"
      - "submission/ECOSPHERE_METADATA_TEMPLATE.json"
      - "src/mina/ecosphere_submission_metadata.py"
      - "tests/test_ecosphere_docx_builder.py"
      - ".github/workflows/ecosphere-docx-preview.yml"
      - "pyproject.toml"
      - "docs/MANUSCRIPT_ECOSPHERE_V0_8.md"
      - "docs/REFERENCES_V6.bib"
      - "docs/FIGURE_CAPTIONS_V7.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,submission]"
      - name: Install pandoc
        run: |
          if ! command -v pandoc >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y pandoc
          fi
          pandoc --version | head -1
      - name: Run builder and metadata tests
        run: |
          python -m pytest \
            tests/test_ecosphere_docx_builder.py \
            tests/test_ecosphere_submission_metadata.py
      - name: Audit public metadata template
        run: |
          mina-ecosphere-submission-metadata \
            --metadata submission/ECOSPHERE_METADATA_TEMPLATE.json \
            --out build/ecosphere_metadata_template_audit.json
      - name: Build Word submission preview
        run: |
          python scripts/build_ecosphere_submission_docx.py \
            --manuscript docs/MANUSCRIPT_ECOSPHERE_V0_8.md \
            --bibliography docs/REFERENCES_V6.bib \
            --captions docs/FIGURE_CAPTIONS_V7.md \
            --out build/Ecosphere_v0_8_SUBMISSION_PREVIEW.docx
      - name: Build synthetic author-complete Word path
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data={
              "authors":[
                  {
                      "name":"Example Author",
                      "affiliation_ids":["1"],
                      "corresponding":True,
                      "email":"author@example.org",
                  }
              ],
              "affiliations":{
                  "1":"Example Department, Example University, City, Country"
              },
              "present_addresses":[],
              "funding_acknowledgments":"Synthetic CI funding text",
              "additional_acknowledgments":"",
              "author_contributions":"Example Author: Conceptualization, analysis, writing.",
              "conflict_of_interest":"Synthetic CI conflict-of-interest text.",
              "ai_tool_inventory_confirmed":True,
              "additional_ai_tools":[],
              "dual_publication_statement":"Synthetic CI overlap statement.",
              "review_code_url":"https://github.com/zuizui0223/mina",
              "permanent_archive_doi":None,
          }
          Path("build/synthetic_submission_metadata.json").write_text(
              json.dumps(data,indent=2)+"\n",encoding="utf-8"
          )
          PY
          mina-ecosphere-submission-metadata \
            --metadata build/synthetic_submission_metadata.json \
            --require-complete
          python scripts/build_ecosphere_submission_docx.py \
            --manuscript docs/MANUSCRIPT_ECOSPHERE_V0_8.md \
            --bibliography docs/REFERENCES_V6.bib \
            --captions docs/FIGURE_CAPTIONS_V7.md \
            --metadata build/synthetic_submission_metadata.json \
            --require-complete-metadata \
            --out build/Ecosphere_v0_8_SYNTHETIC_COMPLETE.docx
      - uses: actions/upload-artifact@v4
        with:
          name: ecosphere-v0-8-docx-preview
          path: |
            build/Ecosphere_v0_8_SUBMISSION_PREVIEW.docx
            build/Ecosphere_v0_8_SYNTHETIC_COMPLETE.docx
            build/ecosphere_metadata_template_audit.json
