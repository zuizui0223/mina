name: ecosphere-submission-readiness

on:
  push:
    branches:
      - submission/ecosphere-v0.8-package-v1
    paths:
      - "src/mina/ecosphere_submission_guard.py"
      - "tests/test_ecosphere_submission_guard.py"
      - "contracts/PALMER_ECOSPHERE_SUBMISSION_PACKAGE_V0_8.json"
      - "docs/TITLE_PAGE_ECOSPHERE_V0_8_TEMPLATE.md"
      - "docs/SUBMISSION_READINESS_ECOSPHERE_V0_8.md"
      - "docs/COVER_LETTER_ECOSPHERE_V0_8.md"
      - ".github/workflows/ecosphere-submission-readiness.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/mina/ecosphere_submission_guard.py"
      - "tests/test_ecosphere_submission_guard.py"
      - "contracts/PALMER_ECOSPHERE_SUBMISSION_PACKAGE_V0_8.json"
      - "docs/TITLE_PAGE_ECOSPHERE_V0_8_TEMPLATE.md"
      - "docs/SUBMISSION_READINESS_ECOSPHERE_V0_8.md"
      - "docs/COVER_LETTER_ECOSPHERE_V0_8.md"
      - ".github/workflows/ecosphere-submission-readiness.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Run submission guard tests
        run: python -m pytest tests/test_ecosphere_submission_guard.py
      - name: Audit frozen v0.8 submission shell
        run: |
          mina-ecosphere-submission-guard \
            --manuscript docs/MANUSCRIPT_ECOSPHERE_V0_8.md \
            --title-page docs/TITLE_PAGE_ECOSPHERE_V0_8_TEMPLATE.md \
            --contract contracts/PALMER_ECOSPHERE_SUBMISSION_PACKAGE_V0_8.json \
            --out build/ecosphere_submission_readiness.json \
            --expect-blocked
      - uses: actions/upload-artifact@v4
        with:
          name: ecosphere-v0-8-submission-readiness
          path: build/ecosphere_submission_readiness.json
