name: Ross Dryad browser download

on:
  push:
    branches: [analysis/ross-failure-switch-v1]
    paths:
      - ".github/workflows/ross-dryad-browser-download.yml"

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Selenium
        run: python -m pip install -q selenium
      - name: Download public Dryad file through browser session
        shell: bash
        run: |
          mkdir -p build/ross_dryad_browser
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          out = Path("build/ross_dryad_browser").resolve()
          opts = webdriver.ChromeOptions()
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--window-size=1280,900")
          opts.add_experimental_option("prefs", {
              "download.default_directory": str(out),
              "download.prompt_for_download": False,
              "download.directory_upgrade": True,
              "safebrowsing.enabled": True,
          })
          driver = webdriver.Chrome(options=opts)
          report = {}
          try:
              url = "https://datadryad.org/dataset/doi:10.5061/dryad.s7h44j15w"
              driver.get(url)
              WebDriverWait(driver, 30).until(
                  EC.presence_of_element_located((By.TAG_NAME, "body"))
              )
              report["landing_title"] = driver.title
              report["landing_url"] = driver.current_url
              report["cookies_before"] = [c["name"] for c in driver.get_cookies()]

              links = driver.find_elements(By.TAG_NAME, "a")
              target = None
              for link in links:
                  txt = (link.text or "").strip()
                  href = link.get_attribute("href") or ""
                  if txt == "BreedingSuccess.csv" or "file_stream/532106" in href:
                      target = link
                      report["target_text"] = txt
                      report["target_href"] = href
                      break
              if target is None:
                  raise RuntimeError("BreedingSuccess.csv link not found")

              driver.execute_script("arguments[0].click();", target)
              deadline = time.time() + 90
              candidate = out / "BreedingSuccess.csv"
              while time.time() < deadline:
                  files = [p for p in out.iterdir() if p.is_file() and not p.name.endswith(".crdownload")]
                  good = [p for p in files if p.stat().st_size > 300000]
                  if good:
                      candidate = max(good, key=lambda p: p.stat().st_size)
                      break
                  time.sleep(1)
              if not candidate.exists():
                  raise RuntimeError(f"download did not materialize; files={list(out.iterdir())}")
              data = candidate.read_bytes()
              report["download_name"] = candidate.name
              report["download_bytes"] = len(data)
              report["sha256"] = hashlib.sha256(data).hexdigest()
              report["first_100"] = data[:100].decode("utf-8", errors="replace")
              report["cookies_after"] = [c["name"] for c in driver.get_cookies()]
              if candidate.name != "BreedingSuccess.csv":
                  candidate.rename(out / "BreedingSuccess.csv")
          finally:
              (out / "browser_report.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
              driver.quit()
          PY
          cat build/ross_dryad_browser/browser_report.json
          test "$(wc -c < build/ross_dryad_browser/BreedingSuccess.csv)" -gt 300000
          echo "dbe58bd219ea752b2300017c783fef6073a4e3a548d0a0817e9e1f3512dde5cb  build/ross_dryad_browser/BreedingSuccess.csv" | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: ross-dryad-browser
          path: build/ross_dryad_browser
          if-no-files-found: error
