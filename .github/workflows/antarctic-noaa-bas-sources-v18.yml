name: Antarctic V18 original NOAA/BAS island time series source gate
on:
  push:
    branches: [research/antarctic-penguin-island-macro-v1]
    paths:
      - 'contracts/NOAA_BAS_MULTI_ISLAND_SOURCE_V18.md'
      - 'scripts/audit_noaa_bas_independent_island_sources_v18.py'
      - 'tests/test_noaa_bas_independent_island_sources_v18.py'
      - '.github/workflows/antarctic-noaa-bas-sources-v18.yml'
  pull_request:
    paths:
      - 'contracts/NOAA_BAS_MULTI_ISLAND_SOURCE_V18.md'
      - 'scripts/audit_noaa_bas_independent_island_sources_v18.py'
      - 'tests/test_noaa_bas_independent_island_sources_v18.py'
      - '.github/workflows/antarctic-noaa-bas-sources-v18.yml'
  workflow_dispatch:
jobs:
  original_noaa_bas_download_schema:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install published source readers and tests
        run: python -m pip install pytest requests openpyxl
      - name: Synthetic original-source identity and no count magnitude release
        run: python -m pytest -q tests/test_noaa_bas_independent_island_sources_v18.py
      - name: Fetch original NOAA and BAS source bytes and inspect schema only
        run: |
          python scripts/audit_noaa_bas_independent_island_sources_v18.py \
            --out /tmp/NOAA_BAS_ISLAND_STAGE_SOURCE_QA_V18.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-noaa-bas-two-island-and-signy-source-metadata-only-v18
          path: /tmp/NOAA_BAS_ISLAND_STAGE_SOURCE_QA_V18.json
