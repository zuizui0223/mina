name: Beaufort founder ceiling audit
on:
  push:
    branches:
      - research/antarctic-island-source-retention-gate-v1
  pull_request:
    paths:
      - 'scripts/audit_beaufort_founder_ceiling.py'
      - 'scripts/audit_source_rescue_structural_support.py'
      - 'tests/test_beaufort_founder_ceiling.py'
      - 'tests/test_source_rescue_structural_support.py'
      - '.github/workflows/beaufort-founder-ceiling-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused unit tests (no resight outcomes)
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_beaufort_founder_ceiling.py tests/test_source_rescue_structural_support.py
      - name: Published north-shore founder ceiling
        run: |
          python scripts/audit_beaufort_founder_ceiling.py --out /tmp/beaufort_founder_ceiling.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/beaufort_founder_ceiling.json'))
          assert r['closed_founder_ceiling_below_2005_06_even_if_assigned_to_2006']
          assert not r['decision']['external_origin_proven']
          PY
      - name: Audit previously frozen Ross census, not individual encounters
        env:
          FROZEN_ROSS_RAW: https://raw.githubusercontent.com/zuizui0223/mina/0aa685f64999c450036787505fcb7df08673c8ec/external/ross_island_v2_frozen_counts.csv
        run: |
          curl -fL --retry 3 "$FROZEN_ROSS_RAW" -o /tmp/ross_island_v2_frozen_counts.csv
          python scripts/audit_source_rescue_structural_support.py --ross-csv /tmp/ross_island_v2_frozen_counts.csv --out /tmp/ross_receiver_gate.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/ross_receiver_gate.json'))
          assert r['ross']['observed_years'] == 26
          assert r['ross']['colony_zero_to_positive_observed_transitions'] == 0
          assert r['ross']['six_component_zero_to_positive_observed_transitions'] == 0
          PY
