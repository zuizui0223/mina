name: climate-penguin-mapppd-matched-species-growth-v1
on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - '.github/workflows/climate-penguin-mapppd-matched-species-growth-v1.yml'
      - 'research/climate-penguin/work/climate_penguin/mapppd_matched_species_growth_v1.py'
      - 'research/climate-penguin/contracts/MAPPPD_MATCHED_SPECIES_GROWTH_V1.md'
      - 'tests/test_mapppd_matched_species_growth_v1.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-matched-species-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_mapppd_matched_species_growth_v1.py
      - name: Retrieve pinned original MAPPPD source and compare identical site-year species pairs
        run: python research/climate-penguin/work/climate_penguin/mapppd_matched_species_growth_v1.py --out '${{ runner.temp }}/matched_species_growth'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: climate-penguin-mapppd-matched-species-growth-v1
          path: ${{ runner.temp }}/matched_species_growth/
          retention-days: 30
          if-no-files-found: warn
