name: paper2-dynamic-habitat-imagery-support

on:
  push:
    branches: [research/antarctic-island-ecology-v1]
    paths:
      - "scripts/audit_dynamic_habitat_imagery_support.py"
      - "tests/test_dynamic_habitat_imagery_support.py"
      - "contracts/ANTARCTIC_ISLAND_ECOLOGY_PAPER2_SUPPORT_AUDIT_V1.json"
      - ".github/workflows/paper2-dynamic-habitat-imagery-support.yml"
  pull_request:
    paths:
      - "scripts/audit_dynamic_habitat_imagery_support.py"
      - "tests/test_dynamic_habitat_imagery_support.py"
      - "contracts/ANTARCTIC_ISLAND_ECOLOGY_PAPER2_SUPPORT_AUDIT_V1.json"
      - ".github/workflows/paper2-dynamic-habitat-imagery-support.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas pyreadr requests
      - name: Unit tests
        run: python -m unittest tests.test_dynamic_habitat_imagery_support -v
      - name: Fetch pinned MAPPPD source
        run: |
          git clone --quiet https://github.com/CCheCastaldo/mapppdr.git build/mapppdr
          git -C build/mapppdr checkout --quiet 88c73a507e0921b2541c218c71eaf16721bc6502
      - name: Fetch frozen outcome-blind support roster
        run: |
          mkdir -p build/forcing
          gh run download 36517700369 -n paper2-forcing-support-audit-v1 -D build/forcing
          test -f build/forcing/PAPER2_FORCING_SUPPORT_UNITS_V1.csv
      - name: Audit public optical-imagery metadata
        run: |
          python scripts/audit_dynamic_habitat_imagery_support.py \
            --forcing-csv build/forcing/PAPER2_FORCING_SUPPORT_UNITS_V1.csv \
            --mapppdr-dir build/mapppdr \
            --out-csv build/PAPER2_DYNAMIC_HABITAT_IMAGERY_SUPPORT_V1.csv \
            --out-json build/PAPER2_DYNAMIC_HABITAT_IMAGERY_SUPPORT_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: paper2-dynamic-habitat-imagery-support-v1
          path: |
            build/PAPER2_DYNAMIC_HABITAT_IMAGERY_SUPPORT_V1.csv
            build/PAPER2_DYNAMIC_HABITAT_IMAGERY_SUPPORT_RESULT_V1.json
