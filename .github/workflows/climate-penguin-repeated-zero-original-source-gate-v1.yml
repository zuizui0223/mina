name: climate-penguin-repeated-zero-original-source-gate-v1
on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - "research/climate-penguin/work/climate_penguin/audit_penguin_repeated_zero_macro_support_v1.py"
      - "research/climate-penguin/contracts/PENGUIN_REPEATED_ZERO_MACRO_SOURCE_GATE_V1.md"
      - "tests/test_penguin_repeated_zero_macro_support_v1.py"
      - ".github/workflows/climate-penguin-repeated-zero-original-source-gate-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-zero-source-support:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_penguin_repeated_zero_macro_support_v1.py
      - run: |
          python research/climate-penguin/work/climate_penguin/audit_penguin_repeated_zero_macro_support_v1.py \
            --out "${{ runner.temp }}/penguin_zero_original"
      - uses: actions/upload-artifact@v4
        with:
          name: climate-penguin-original-repeated-zero-support-v1
          path: ${{ runner.temp }}/penguin_zero_original/
          retention-days: 30
          if-no-files-found: error
