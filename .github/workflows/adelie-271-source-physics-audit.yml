name: adelie-271-original-nests-vs-source-physics-audit
on:
  push:
    branches: [analysis/adelie-deepaa-2003-2022-demography-20261123]
    paths:
      - scripts/audit_ad_2004_2022_271_matched_source_physics.py
      - .github/workflows/adelie-271-source-physics-audit.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  original-source-physics-no-ecological-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          name: adelie-DEEPAA-2003-2022-native-coastal-open-100km-physical
          run-id: 45098580921
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/deep
      - uses: actions/download-artifact@v4
        with:
          name: adelie-2003-2022-NSIDC-v4-25km-continuous-100km-SIC
          run-id: 45098221668
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/sic
      - uses: actions/download-artifact@v4
        with:
          name: adelie-duffy2024-mapppd-v5-original-sources
          run-id: 45095395698
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/author_source
      - name: Install data-only QR/distance libraries
        run: python -m pip install --no-cache-dir 'pandas>=2' 'numpy>=1.24' 'scipy>=1.11'
      - name: Recompute original source census 284 to 271 row lineage and physical-only residuals
        shell: bash
        run: |
          python scripts/audit_ad_2004_2022_271_matched_source_physics.py \
            --deepaa build/deep/DEEPAA_2003_2022_43sites_100km_physical_by_winter.csv \
            --sic build/sic/NSIDC_V4_CDR_annual_43site_JunOct_2003_2022_100km.csv \
            --site-support build/deep/site_support_43_source_only.csv \
            --census build/deep/census_43_sites_2003_2022_source_only.csv \
            --original-mapppd build/author_source/raw/mapppd_v5_all_counts.csv \
            --out build/independent_physical_gate
      - name: Persist auditable original-census and physical-only receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adelie-271-year-matched-source-physical-audit
          path: build/independent_physical_gate
          if-no-files-found: warn
          retention-days: 90
