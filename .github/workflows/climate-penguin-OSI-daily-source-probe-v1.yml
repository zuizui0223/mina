name: climate-penguin-OSI-SAF-daily-original-catalog-probe-v1
on:
  workflow_dispatch:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - "research/climate-penguin/work/climate_penguin/osi_daily_source_catalog_probe_v1.py"
      - "tests/test_osi_daily_source_catalog_probe_v1.py"
      - ".github/workflows/climate-penguin-OSI-daily-source-probe-v1.yml"
jobs:
  publisher-source:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install original NetCDF source metadata decoder
        run: python -m pip install xarray netCDF4
      - name: Validate publisher-only source lookup
        run: python -m unittest discover -s tests -p test_osi_daily_source_catalog_probe_v1.py -v
      - name: Retrieve original publisher daily catalogue and two source daily NetCDFs
        run: |
          mkdir -p build/osi_daily_original
          python research/climate-penguin/work/climate_penguin/osi_daily_source_catalog_probe_v1.py --out build/osi_daily_original
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osi-original-daily-source-catalog-v1
          path: |
            build/osi_daily_original/daily_source_discovery.json
