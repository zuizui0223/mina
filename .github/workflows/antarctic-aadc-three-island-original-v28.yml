name: Antarctic V28 original AADC three islands and population demography original-data schema
on:
  push:
    branches: [research/antarctic-penguin-island-macro-v1]
    paths:
      - 'contracts/AADC_THREE_ISLAND_DEMOGRAPHY_SOURCE_V28.md'
      - 'scripts/audit_aadc_three_island_original_v28.py'
      - 'tests/test_aadc_three_island_original_v28.py'
      - '.github/workflows/antarctic-aadc-three-island-original-v28.yml'
  pull_request:
    paths:
      - 'contracts/AADC_THREE_ISLAND_DEMOGRAPHY_SOURCE_V28.md'
      - 'scripts/audit_aadc_three_island_original_v28.py'
      - 'tests/test_aadc_three_island_original_v28.py'
      - '.github/workflows/antarctic-aadc-three-island-original-v28.yml'
  workflow_dispatch:
jobs:
  original_AADC_Mawson_3_islands_demography:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original AADC workbook readers
        run: python -m pip install pytest requests openpyxl xlrd
      - name: Test exact official dataset IDs and outcome-blind original sheet parsing
        run: python -m pytest -q tests/test_aadc_three_island_original_v28.py
      - name: Retrieve AADC original 1103/5516 publisher files with official source SHA and headers only
        run: python scripts/audit_aadc_three_island_original_v28.py --json /tmp/AADC_THREE_ISLAND_SOURCE_V28.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-aadc-1103-5516-three-island-source-v28-headers-only
          path: /tmp/AADC_THREE_ISLAND_SOURCE_V28.json
