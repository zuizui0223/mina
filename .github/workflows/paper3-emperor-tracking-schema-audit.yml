name: paper3-emperor-tracking-schema-audit

on:
  push:
    branches: [research/emperor-mobile-islands-v1]
    paths:
      - "contracts/PAPER3_MOBILE_NODE_SCHEMA_AUDIT_V1.json"
      - "scripts/audit_emperor_tracking_schema.py"
      - "tests/test_emperor_tracking_schema.py"
      - ".github/workflows/paper3-emperor-tracking-schema-audit.yml"
  pull_request:
    paths:
      - "contracts/PAPER3_MOBILE_NODE_SCHEMA_AUDIT_V1.json"
      - "scripts/audit_emperor_tracking_schema.py"
      - "tests/test_emperor_tracking_schema.py"
      - ".github/workflows/paper3-emperor-tracking-schema-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas requests pyshp pyproj
      - run: python -m unittest tests.test_emperor_tracking_schema -v
      - name: Audit public tracking archive schema
        run: |
          mkdir -p build/out
          python scripts/audit_emperor_tracking_schema.py \
            --contract contracts/PAPER3_MOBILE_NODE_SCHEMA_AUDIT_V1.json \
            --out-json build/out/PAPER3_MOBILE_NODE_SCHEMA_AUDIT_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper3-emperor-tracking-schema-audit-v1
          path: build/out/*
          if-no-files-found: warn
