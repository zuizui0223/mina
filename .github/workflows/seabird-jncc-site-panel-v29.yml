name: Seabird V29 JNCC 2024 source ID and comparable-two-census support
on:
  push:
    branches: [research/seabird-island-generality-v1]
    paths:
      - 'contracts/JNCC_SITE_PANEL_ELIGIBILITY_V29.md'
      - 'scripts/audit_jncc_comparable_site_panels_v29.py'
      - 'tests/test_jncc_comparable_site_panels_v29.py'
      - '.github/workflows/seabird-jncc-site-panel-v29.yml'
  pull_request:
    paths:
      - 'contracts/JNCC_SITE_PANEL_ELIGIBILITY_V29.md'
      - 'scripts/audit_jncc_comparable_site_panels_v29.py'
      - 'tests/test_jncc_comparable_site_panels_v29.py'
      - '.github/workflows/seabird-jncc-site-panel-v29.yml'
  workflow_dispatch:
jobs:
  official_JNCC_site_panels_metadata_first:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install publisher source retrieval and fake source tests
        run: python -m pip install pytest requests
      - name: Assert no zero for NA and original unit/date/source duplicate gates
        run: python -m pytest -q tests/test_jncc_comparable_site_panels_v29.py
      - name: Download exact JNCC 2024 revision, qualify original two-census site panels on identity and presence only
        run: |
          python scripts/audit_jncc_comparable_site_panels_v29.py \
            --out /tmp/JNCC_COMPARABLE_TWO_CENSUS_SITE_PANELS_V29.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jncc-original-2024-site-panel-source-structure-v29
          path: /tmp/JNCC_COMPARABLE_TWO_CENSUS_SITE_PANELS_V29.json
