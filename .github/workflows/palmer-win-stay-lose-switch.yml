name: palmer-win-stay-lose-switch

on:
  push:
    branches: [analysis/palmer-win-stay-lose-switch-v1]
    paths:
      - "src/mina/win_stay_lose_switch.py"
      - "tests/test_palmer_win_stay_lose_switch.py"
      - "contracts/PALMER_WIN_STAY_LOSE_SWITCH_V1.json"
      - "scripts/fetch_lter_census.py"
      - "scripts/fetch_lter_chick_counts.py"
      - ".github/workflows/palmer-win-stay-lose-switch.yml"
  pull_request:
    paths:
      - "src/mina/win_stay_lose_switch.py"
      - "tests/test_palmer_win_stay_lose_switch.py"
      - "contracts/PALMER_WIN_STAY_LOSE_SWITCH_V1.json"
      - "scripts/fetch_lter_census.py"
      - "scripts/fetch_lter_chick_counts.py"
      - ".github/workflows/palmer-win-stay-lose-switch.yml"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Run frozen synthetic tests
        run: pytest -q tests/test_palmer_win_stay_lose_switch.py
      - name: Fetch frozen Palmer sources
        run: |
          python scripts/fetch_lter_census.py build/adelie_census.csv
          python scripts/fetch_lter_chick_counts.py build/adelie_chicks.csv
      - name: Run P1-P3 fixed-specification mechanism audit
        run: |
          python -m mina.win_stay_lose_switch \
            --adult-census build/adelie_census.csv \
            --chicks build/adelie_chicks.csv \
            --out build/PALMER_WIN_STAY_LOSE_SWITCH_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: palmer-win-stay-lose-switch-v1
          path: build/PALMER_WIN_STAY_LOSE_SWITCH_RESULT_V1.json
