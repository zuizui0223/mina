name: ross-island-mechanism-readiness

on:
  push:
    branches:
      - validation/ross-island-resight-gate-v1
    paths:
      - "contracts/ROSS_ISLAND_*.json"
      - "results/ROSS_ISLAND_*.json"
      - "results/ROSS_MAPPPD_CHICK_COVERAGE_RESULT_V1.json"
      - "results/ROSS_INDEPENDENT_PERFORMANCE_SOURCE_AUDIT_V1.json"
      - "scripts/audit_ross_mechanism_readiness.py"
      - ".github/workflows/ross-island-mechanism-readiness.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit frozen pre-outcome readiness
        run: |
          python scripts/audit_ross_mechanism_readiness.py             --repo-root .             --out build/ross_mechanism_readiness.json
      - uses: actions/upload-artifact@v4
        with:
          name: ross-island-mechanism-readiness
          path: build/ross_mechanism_readiness.json
