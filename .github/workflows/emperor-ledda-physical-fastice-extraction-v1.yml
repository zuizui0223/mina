name: Ledda independent physical fast-ice 2011-2014
on:
  push:
    branches:
      - research/emperor-unused-refuge-temporal-test-v1
    paths:
      - 'scripts/extract_fraser_ledda_frozen_2011_2014_fastice_v1.py'
      - 'tests/test_fraser_ledda_frozen_fastice_extract_v1.py'
      - 'contracts/EMPEROR_LEDDA_2011_2014_INDEPENDENT_FASTICE_PIXELS_V1.json'
      - '.github/workflows/emperor-ledda-physical-fastice-extraction-v1.yml'
  pull_request:
    paths:
      - 'scripts/extract_fraser_ledda_frozen_2011_2014_fastice_v1.py'
      - 'tests/test_fraser_ledda_frozen_fastice_extract_v1.py'
      - 'contracts/EMPEROR_LEDDA_2011_2014_INDEPENDENT_FASTICE_PIXELS_V1.json'
      - '.github/workflows/emperor-ledda-physical-fastice-extraction-v1.yml'
jobs:
  source-physical-ice:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and run frozen outcome blind selection tests
        run: |
          python -m pip install pytest numpy pyproj h5py
          python -m pytest -q tests/test_fraser_ledda_frozen_fastice_extract_v1.py
      - name: Extract precommitted, independently classified Ledda landfast ice only
        run: |
          python scripts/extract_fraser_ledda_frozen_2011_2014_fastice_v1.py --out /tmp/ledda_ice_physical_exposure_v1.json
      - name: Assert source and science boundaries; print physical class4 summaries
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ledda_ice_physical_exposure_v1.json'))
          assert d['source_years']==[2011,2014]
          assert d['new_penguin_response_rows_opened']==0
          assert d['causal_effect_or_social_displacement_fitted'] is False
          assert d['total_http_body_bytes'] <= 2*20*1024*1024
          print('PHYSICAL_EXTRACTION_DECISION',d['decision'])
          for x in d['year_results']:
              print('YEAR',x['year'],x['status'],'ORIGINAL_IMAGE_DATE',x['author_image_date'])
              print('NETWORK',x['http_body_bytes'],'REQUESTS',x['http_range_requests'],'PIXELS',x['physical_ice_pixel_values_read'])
              if x['status'] == 'EXPLORATORY_INDEPENDENT_FASTICE_GRID_EXTRACTED':
                  print('PRIMARY_3KM',next(z for z in x['composite_records'] if z['primary_preimage'])['radius_summaries_km']['3'])
                  print('SEASON_3KM',x['preimage_season_summaries']['3'])
                  print('OVERLAP_3KM',next(z for z in x['composite_records'] if z['overlaps_or_follows_original_image'])['radius_summaries_km']['3'])
              else:
                  print('ERROR',x.get('error_type'),x.get('error_message'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ledda-independent-2011-2014-physical-fastice-v1
          path: /tmp/ledda_ice_physical_exposure_v1.json
          retention-days: 14
          if-no-files-found: ignore
