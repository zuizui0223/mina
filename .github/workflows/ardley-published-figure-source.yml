name: Ardley published spatial figure source
on:
  pull_request:
    paths:
      - '.github/workflows/ardley-published-figure-source.yml'
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pymupdf
      - name: Retrieve official report and extract fixed figure page
        run: |
          python - <<'PY'
          import fitz,urllib.request,pathlib,hashlib,json
          o=pathlib.Path('/tmp/ardley-report');o.mkdir()
          urls=['https://www.umweltbundesamt.de/system/files/medien/11850/publikationen/63_2025_texte.pdf','https://www.umweltbundesamt.de/sites/default/files/medien/11850/publikationen/63_2025_texte.pdf']
          receipt=[]
          for u in urls:
              a={'url':u}
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'PublicScientificSourceAudit/1.0'}),timeout=35) as f:b=f.read(20000001)
                  a.update(bytes=len(b),sha256=hashlib.sha256(b).hexdigest())
                  assert b.startswith(b'%PDF') and len(b)<20000001
                  d=fitz.open(stream=b,filetype='pdf')
                  assert 'Grämer' in d[2].get_text() or 'Grämer' in d[0].get_text()
                  assert 'Zone 4' in d[61].get_text() and 'Zone 7' in d[61].get_text()
                  a.update(pages=len(d),status='verified_report')
                  # Return the original figure page for verification, not original GIS.
                  p=d[61];p.get_pixmap(matrix=fitz.Matrix(3,3),alpha=False).save(o/'figure6_page.png')
                  (o/'page62.txt').write_text(p.get_text())
                  (o/'page57.txt').write_text(d[56].get_text())
                  (o/'page62_images.json').write_text(json.dumps(p.get_image_info(),default=str,indent=2))
                  (o/'page62_drawings.json').write_text(json.dumps(p.get_drawings(),default=str))
                  d2=fitz.open();d2.insert_pdf(d,from_page=61,to_page=61);d2.save(o/'figure6_page.pdf')
                  receipt.append(a);break
              except Exception as e:a.update(status='failed',error=repr(e)[:350]);receipt.append(a)
          (o/'receipt.json').write_text(json.dumps(receipt,indent=2));print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ardley-published-figure-source
          path: /tmp/ardley-report/
          retention-days: 14
