name: palmer-island-coherence-regimes

on:
  push:
    branches:
      - validation/island-coherence-regimes-v1
    paths:
      - "src/mina/island_coherence_regimes.py"
      - "tests/test_island_coherence_regimes.py"
      - "contracts/PALMER_ISLAND_COHERENCE_REGIME_VALIDATION_V1.json"
      - ".github/workflows/palmer-island-coherence-regimes.yml"
  pull_request:
    paths:
      - "src/mina/island_coherence_regimes.py"
      - "tests/test_island_coherence_regimes.py"
      - "contracts/PALMER_ISLAND_COHERENCE_REGIME_VALIDATION_V1.json"
      - ".github/workflows/palmer-island-coherence-regimes.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Run frozen synthetic tests
        run: pytest -q tests/test_island_coherence_regimes.py
      - name: Fetch frozen LTER census
        run: python scripts/fetch_lter_census.py build/adelie_census.csv
      - name: Run frozen regime validation
        run: |
          python -m mina.island_coherence_regimes \
            --census build/adelie_census.csv \
            --out build/island_coherence_regimes.json \
            --permutations 20000 \
            --seed 20260927
      - name: Print validation receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("build/island_coherence_regimes.json").read_text())
          for section in ("five_island_phase_replication","four_extant_island_sensitivity"):
              print(section)
              for phase,v in x[section].items():
                  print(
                      phase,
                      "valid=",v["validity_pass"],
                      "sizes=",v["eligible_group_sizes"],
                      "retention=",v["retention_fraction"],
                      "contrast=",v["observed"]["partition_contrast_r"],
                      "p=",v["null"]["two_sided_p"],
                  )
          print("decision=",json.dumps(x["decision"],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: palmer-island-coherence-regimes
          path: |
            build/adelie_census.csv
            build/island_coherence_regimes.json
