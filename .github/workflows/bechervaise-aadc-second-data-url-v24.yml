name: Bechervaise second publisher original RFID data link 5849 V24
on:
  push:
    branches:
      - research/island-recovery-stage-mechanism-gate-v1
    paths:
      - 'contracts/BECHERVAISE_AADC_5849_RAW_LINK_SOURCE_V24.json'
      - 'scripts/probe_bechervaise_second_5849_official_download_v24.py'
      - 'tests/test_bechervaise_second_5849_official_download_v24.py'
      - '.github/workflows/bechervaise-aadc-second-data-url-v24.yml'
  pull_request:
    paths:
      - 'contracts/BECHERVAISE_AADC_5849_RAW_LINK_SOURCE_V24.json'
      - 'scripts/probe_bechervaise_second_5849_official_download_v24.py'
      - 'tests/test_bechervaise_second_5849_official_download_v24.py'
      - '.github/workflows/bechervaise-aadc-second-data-url-v24.yml'
jobs:
  publisher-source-link:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic source link and protected wildlife data field tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_bechervaise_second_5849_official_download_v24.py
      - name: Probe original AAS4086 second 5849 publisher link versus guide 5228 and resights 5516
        run: |
          python scripts/probe_bechervaise_second_5849_official_download_v24.py \
            --out /tmp/bechervaise_AADC_5849_source_links_only_v24.json
      - name: Assert original RFID identity and breeding effect NOT claimed
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/bechervaise_AADC_5849_source_links_only_v24.json'))
          assert d['status']=='SECOND_AADC_ORIGINAL_LINK_FOUND_BUT_RAW_TAG_TO_EGG_IDENTIFICATION_HOLD'
          assert d['AAS4086_5849_additional_official_link_exists_in_browser_metadata']
          assert not d['AAS4086_5849_confirmed_to_contain_real_weighbridge_tag_records']
          assert d['AAS4086_5228_guide_not_the_same_as_5849_link']
          assert d['AAS4518_5516_nest_resight_is_a_separate_archive']
          assert d['no_source_penguin_tag_rows_opened']
          assert d['no_email_or_download_credentials_submitted']
          assert d['2019_published_gate_plus_nest_status_individual_link_PRIOR_ART']
          assert d['2026_Ross_prebreeder_prospecting_and_out_of_colony_recruitment_PRIOR_ART']
          assert not d['new_postarrival_breeding_first_egg_effect']
          assert not d['cross_island_recolonization_cause_estimated']
          assert d['Ecology_PR189_frozen'] and d['USAP_PR142_frozen'] and d['emperor_PR195_frozen']
          for name,s in d['source_only_download_probes'].items():
              print('ORIGINAL_PUBLISHER_SOURCE_LINK',name,'STATUS',s['source_retrieval'])
          print('V24_SOURCE_LINK_GATE_PASS_NO_ORIGINAL_BIRD_ROWS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bechervaise-AADC-original-5849-data-vs-5228-guide-source-manifest-v24
          path: /tmp/bechervaise_AADC_5849_source_links_only_v24.json
          retention-days: 21
