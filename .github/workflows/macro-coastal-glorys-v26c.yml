name: V26c same-frame original GLORYS source pilot
on:
  push:
    branches: [analysis/pygoscelis-count-functional-sensitivity-20261126]
    paths: ['.github/workflows/macro-coastal-glorys-v26c.yml']
permissions:
  contents: read
  actions: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-compatible dependencies
        run: python -m pip install --disable-pip-version-check "numpy>=1.26,<2.1" "pandas>=2.1,<3" "xarray>=2024.5,<2025" "zarr>=2.17,<3" "numcodecs<0.16" "fsspec>=2024.1,<2025" "dask[array]>=2024.3,<2025" "aiohttp>=3.9" scipy pyproj==3.7.1
      - name: Verify original wet-grid geometry and pilot values
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15169338322/zip" > frame.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13827273691/zip" > oldgeo.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13827762271/zip" > oldmonthly.zip
          python research/macro_marine_land_footprint_v1/glorys_tile_gate_v26c.py frame.zip oldgeo.zip oldmonthly.zip v26c_result 3745bb530266fc9504c4e213519c964d94ff2f998eafb804f2a3e2d64a0a6c15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro-coastal-glorys-v26c
          path: v26c_result/
          retention-days: 30
          if-no-files-found: warn
