name: climate-seaice-regional-v5
on:
  push:
    branches: ['codex/climate-penguin-progress']
    paths:
      - 'research/climate-penguin/work/climate_penguin/seaice_regional_v5.py'
      - 'tests/test_seaice_regional_v5.py'
      - '.github/workflows/climate-seaice-regional-v5.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original44-regional-identification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core project and tests
        run: python -m pip install -e '.[dev]'
      - name: Full repository test suite
        run: python -m pytest
      - uses: actions/download-artifact@v4
        with:
          name: climate-seaice-fixed44-original96-v4
          run-id: 40881769676
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/seaice-v4-source
      - name: Replay fixed44 and original unique marine cells without new retrieval
        run: python research/climate-penguin/work/climate_penguin/seaice_regional_v5.py --source-dir /tmp/seaice-v4-source --out /tmp/seaice-regional-v5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: climate-seaice-regional-v5
          path: /tmp/seaice-regional-v5/
          retention-days: 30
          if-no-files-found: error
