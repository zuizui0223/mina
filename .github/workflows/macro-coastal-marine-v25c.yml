name: V25c native sea ice on independent coastal rock frame
on:
  push:
    branches: [analysis/pygoscelis-count-functional-sensitivity-20261126]
    paths: ['.github/workflows/macro-coastal-marine-v25c.yml']
permissions:
  contents: read
  actions: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original netCDF and geodesic readers
        run: python -m pip install --disable-pip-version-check numpy scipy pyproj==3.7.1 xarray netCDF4
      - name: Verify archived frame and original monthly SHA receipts, extract 12 source scenes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15169338322/zip" > frame.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13671496095/zip" > ice_reference.zip
          python research/macro_marine_land_footprint_v1/macro_rock_marine_pilot_v25.py frame.zip ice_reference.zip v25c_result 13bfe5866a27f6fbfad681ed4a44d834f6019c663f94193e1039e96b81c22060
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro-coastal-marine-v25c
          path: v25c_result/
          retention-days: 30
          if-no-files-found: warn
