name: pgeo-meheust-original-files
on:
  pull_request:
    paths:
      - '.github/workflows/pgeo-meheust-original-files.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Retrieve public original files against published checksums
        run: |
          python - <<'PY'
          import csv,hashlib,io,json
          from pathlib import Path
          from urllib.parse import urlparse,urljoin
          import requests
          OUT=Path("build/pgeo_meheust_original");OUT.mkdir(parents=True,exist_ok=True)
          EXPECT={
          "raw_109_demo.csv":(39751351,136878,"9c52344440386c3ff848050da6b6809b"),
          "coordinates.csv":(39751354,3172,"360399cb2d51637e02073a90f6543e5d"),
          "env_variables.csv":(39751357,29234,"7d8a7b017ba15202b01e33efad5a245f"),
          "key_bs_zspa.csv":(39751360,19664,"c27d40636f7dd85b235380e9cc6c9ddc"),
          "key_b_s.csv":(39751363,43688,"a531432971b385a0504f4b324e915604"),
          "README.md":(39751366,6267,"e92562a5cf2bf1067b6a1f316d1e9c5b"),
          "main_code.R":(44312453,53110,"8b621b8f64178c9fb1d52a9f3935e1a1")}
          def get(u,limit):
              for hop in range(5):
                  p=urlparse(u);h=p.hostname or ""
                  if p.scheme!="https" or p.username or p.password or not (h=="figshare.com" or h.endswith(".figshare.com") or h.endswith(".amazonaws.com") or h.endswith(".figsh.com")):raise ValueError("unreviewed host")
                  with requests.get(u,timeout=(15,60),allow_redirects=False,stream=True) as r:
                      if r.is_redirect:u=urljoin(u,r.headers.get("Location",""));continue
                      r.raise_for_status()
                      b=bytearray()
                      for x in r.iter_content(32768):
                          b.extend(x)
                          if len(b)>limit:raise ValueError("download limit")
                      return bytes(b)
              raise ValueError("redirect limit")
          R={"status":"BLOCKED","doi":"10.6084/m9.figshare.22341229.v1","paper_doi":"10.1007/s00442-024-05523-0","ecological_fit":False,"files":{}}
          try:
              b=get("https://api.figshare.com/v2/articles/22341229",500000);d=json.loads(b)
              assert d["id"]==22341229 and d["version"]==1 and d["doi"]==R["doi"] and d["is_public"] and not d["is_embargoed"]
              assert d["license"]["name"]=="CC BY 4.0"
              assert any("MEHEUST" in a["full_name"].upper() for a in d["authors"])
              ff={f["name"]:f for f in d["files"]};assert set(ff)==set(EXPECT)
              R["metadata_sha256"]=hashlib.sha256(b).hexdigest();R["license"]=d["license"]
              for name in ["README.md","raw_109_demo.csv","coordinates.csv","env_variables.csv","key_bs_zspa.csv","key_b_s.csv","main_code.R"]:
                  f=ff[name];i,size,md5=EXPECT[name];assert (f["id"],f["size"],f["computed_md5"],f["supplied_md5"])==(i,size,md5,md5)
                  url=f.get("download_url") or "https://api.figshare.com/v2/file/download/"+str(i)
                  raw=get(url,size+1)
                  assert len(raw)==size and hashlib.md5(raw).hexdigest()==md5, name+" content mismatch"
                  (OUT/name).write_bytes(raw)
                  entry={"file_id":i,"bytes":len(raw),"md5":md5,"sha256":hashlib.sha256(raw).hexdigest(),"source_url":url.split("?")[0]}
                  if name.endswith(".csv"):
                      try:
                          t=raw.decode("utf-8-sig")
                      except UnicodeDecodeError:t=raw.decode("latin-1")
                      dialect=csv.Sniffer().sniff(t[:10000],delimiters=",;\t");rows=list(csv.reader(io.StringIO(t),dialect))
                      h=rows[0];body=[r for r in rows[1:] if any(x.strip() for x in r)]
                      entry["schema"]={"headers":h,"n_rows":len(body),"row_widths":sorted(set(map(len,body)))}
                  R["files"][name]=entry
              R["status"]="ALL_SEVEN_ORIGINAL_FILES_MD5_VERIFIED"
          except Exception as e:R["error"]=type(e).__name__+": "+str(e)[:400]
          (OUT/"receipt.json").write_text(json.dumps(R,indent=2,ensure_ascii=False)+"\n")
          print(json.dumps(R,ensure_ascii=False))
          
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pgeo-meheust-original-files
          path: build/pgeo_meheust_original/
          if-no-files-found: error
          retention-days: 30
