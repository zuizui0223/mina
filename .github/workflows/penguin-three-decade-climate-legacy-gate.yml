name: Penguin three-decade original climate legacy vs contemporary and reverse-time placebo
on:
  push:
    branches: [analysis/penguin-decade-redistribution-v1-20261110]
    paths:
      - 'research/climate-penguin/macro_panantarctic_v1/test_three_decade_climate_legacy.py'
      - 'research/climate-penguin/macro_panantarctic_v1/unit_test_three_decade_climate_legacy.py'
      - '.github/workflows/penguin-three-decade-climate-legacy-gate.yml'
  pull_request:
    paths:
      - 'research/climate-penguin/macro_panantarctic_v1/test_three_decade_climate_legacy.py'
      - 'research/climate-penguin/macro_panantarctic_v1/unit_test_three_decade_climate_legacy.py'
      - 'research/climate-penguin/macro_panantarctic_v1/FROZEN_THREE_DECADE_CLIMATE_LEGACY_GATE_20261111.md'
      - '.github/workflows/penguin-three-decade-climate-legacy-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-site-three-decade-climate-lag-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen original site polar projection
        run: python -m pip install --disable-pip-version-check pyproj==3.7.1
      - name: Verify source code and exact source-independent negative tests
        run: |
          python -m py_compile research/climate-penguin/macro_panantarctic_v1/build.py
          python -m py_compile research/climate-penguin/macro_panantarctic_v1/analyze_decadal_fixed_network_reweighting.py
          python -m py_compile research/climate-penguin/macro_panantarctic_v1/test_three_decade_climate_legacy.py
          python research/climate-penguin/macro_panantarctic_v1/unit_test_three_decade_climate_legacy.py -v
      - name: Reconstruct original 595 colony, 2456 fixed-method census and source geography
        run: python research/climate-penguin/macro_panantarctic_v1/build.py
      - name: Reuse all 595 original 1991 to 2020 source site-month sea ice records
        uses: actions/download-artifact@v4
        with:
          name: penguin-panantarctic-595site-original-1991-2020-monthly-ice
          run-id: 42612067836
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/original_595_30yr
      - name: Reuse original gridded 60 percent marine iso-front without new threshold search
        uses: actions/download-artifact@v4
        with:
          name: penguin-original-60pct-isocontour-three-decade-tables-v1
          run-id: 42791019321
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/original_60pct_front
      - name: Compare original earlier vs contemporary site SIC changes and forbidden future negative-time control on identical three-decade rosters
        run: |
          python research/climate-penguin/macro_panantarctic_v1/test_three_decade_climate_legacy.py \
            --census research/climate-penguin/macro_panantarctic_v1/outputs/source_observed_2456.csv \
            --atlas research/climate-penguin/macro_panantarctic_v1/outputs/panantarctic_595_site_inventory.csv \
            --ice build/original_595_30yr/ice_595_outputs/original_595_site_months_120_source_QA.csv \
            --ice-summary build/original_595_30yr/ice_595_outputs/original_595_native_monthly_SIC_30year_summary.json \
            --front build/original_60pct_front/original_60pct_contour_10degree_sector_pairs.csv \
            --out research/climate-penguin/macro_panantarctic_v1/three_decade_legacy_outputs
      - name: Preserve true all-three-period site observations, negative-time control and sensitivity results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: penguin-original-three-decade-climate-legacy-and-negative-time-control-v1
          path: research/climate-penguin/macro_panantarctic_v1/three_decade_legacy_outputs/
          if-no-files-found: warn
