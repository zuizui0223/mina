name: adelie-nsidc-v4-south-monthly-source-preflight
on:
  push:
    branches: [analysis/adelie-deepaa-2003-2022-demography-20261123]
    paths:
      - scripts/audit_NSIDC_v4_monthly_south_preflight.py
      - .github/workflows/adelie-nsidc-v4-south-monthly-source-preflight.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --no-cache-dir 'netCDF4>=1.6'
      - name: Validate independent NOAA/NSIDC monthly SIC files and native coordinates
        run: python scripts/audit_NSIDC_v4_monthly_south_preflight.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adelie-nsidc-v4-south-monthly-preflight
          path: build/nsidc_preflight
          if-no-files-found: warn
          retention-days: 60
