name: antarctic-island-ecology-paper2d-marine-support

on:
  push:
    branches: [research/antarctic-island-ecology-v1]
    paths:
      - "contracts/ANTARCTIC_ISLAND_ECOLOGY_PAPER2D_MARINE_ACCESS_V1.json"
      - "scripts/audit_paper2d_marine_access_support.py"
      - "tests/test_paper2d_marine_access_support.py"
      - ".github/workflows/antarctic-island-ecology-paper2d-marine-support.yml"
  pull_request:
    paths:
      - "contracts/ANTARCTIC_ISLAND_ECOLOGY_PAPER2D_MARINE_ACCESS_V1.json"
      - "scripts/audit_paper2d_marine_access_support.py"
      - "tests/test_paper2d_marine_access_support.py"
      - ".github/workflows/antarctic-island-ecology-paper2d-marine-support.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas requests
      - run: python -m unittest tests.test_paper2d_marine_access_support -v
      - name: Download frozen optical-catalog artifact
        run: |
          mkdir -p build/optical build/out
          gh run download 37186601157 -n antarctic-island-ecology-paper2-optical-catalog-v1 -D build/optical
          test -f build/optical/ANTARCTIC_ISLAND_ECOLOGY_PAPER2_OPTICAL_CATALOG_UNITS_V1.csv
      - name: Audit public NSIDC monthly archive support
        run: |
          python scripts/audit_paper2d_marine_access_support.py \
            --optical-csv build/optical/ANTARCTIC_ISLAND_ECOLOGY_PAPER2_OPTICAL_CATALOG_UNITS_V1.csv \
            --out-json build/out/ANTARCTIC_ISLAND_ECOLOGY_PAPER2D_MARINE_SUPPORT_RESULT_V1.json \
            --out-units-csv build/out/ANTARCTIC_ISLAND_ECOLOGY_PAPER2D_MARINE_SUPPORT_UNITS_V1.csv \
            --out-files-csv build/out/ANTARCTIC_ISLAND_ECOLOGY_PAPER2D_MARINE_SUPPORT_FILES_V1.csv
      - uses: actions/upload-artifact@v4
        with:
          name: antarctic-island-ecology-paper2d-marine-support-v1
          path: build/out/*
