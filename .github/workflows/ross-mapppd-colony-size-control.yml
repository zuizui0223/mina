name: ross-mapppd-colony-size-control

on:
  push:
    branches:
      - validation/ross-island-resight-gate-v1
    paths:
      - "scripts/audit_ross_mapppd_control.py"
      - ".github/workflows/ross-mapppd-colony-size-control.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas pyreadr
      - name: Fetch pinned mapppdr source
        run: |
          git clone --quiet https://github.com/CCheCastaldo/mapppdr.git build/mapppdr
          git -C build/mapppdr checkout --quiet 88c73a507e0921b2541c218c71eaf16721bc6502
      - name: Audit Ross Island colony-size controls
        run: |
          python scripts/audit_ross_mapppd_control.py \
            --mapppdr-dir build/mapppdr \
            --out-dir build/ross_mapppd \
            --out build/ross_mapppd_control.json
      - uses: actions/upload-artifact@v4
        with:
          name: ross-mapppd-colony-size-control
          path: |
            build/ross_mapppd_control.json
            build/ross_mapppd/
