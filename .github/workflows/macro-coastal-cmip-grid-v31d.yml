name: V31d native coordinate diagnosis
on:
  push:
    branches: [analysis/pygoscelis-count-functional-sensitivity-20261126]
    paths: ['.github/workflows/macro-coastal-cmip-grid-v31d.yml']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.5 pandas==2.2.3 xarray==2025.6.1 fsspec==2026.9.0 zarr==2.18.7 'numcodecs<0.16' cftime==1.6.6.1 pyproj==3.8.0 scipy 'aiohttp>=3.10,<4'
      - name: Diagnose coordinates using exact pinned metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15250056990/zip" > gate.zip
          python research/macro_marine_land_footprint_v1/cmip_grid_diagnosis_v31d.py gate.zip v31d_result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro-cmip-grid-v31d
          path: v31d_result/
          retention-days: 30
          if-no-files-found: warn
