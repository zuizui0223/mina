name: Cape Hallett public raster metadata
on:
  push:
    branches: [analysis/unified-breeding-reorganization-20261125]
    paths:
      - 'research/unified_breeding_reorganization_v1/cape_hallett_public_raster_v13.py'
      - '.github/workflows/cape-hallett-public-raster-v13.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests tifffile numpy
      - run: python research/unified_breeding_reorganization_v1/cape_hallett_public_raster_v13.py
      - uses: actions/upload-artifact@v4
        with:
          name: cape-hallett-public-raster-v13
          path: build/cape-hallett-raster-metadata/
