name: AADC source gazetteer UFI physical rock polygon crosswalk
on:
  push:
    branches: [analysis/postglacial-glims-sourcegate-20261119]
    paths:
      - scripts/audit_aadc_gazetteer_UFI_original_crosswalk.py
      - .github/workflows/aadc-original-gazetteer-UFI-crosswalk.yml
  workflow_dispatch:
concurrency:
  group: aadc-gazetteer-ufi-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-lineage:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests openpyxl pyshp xlrd
      - name: Check source schema code
        run: python -m py_compile scripts/audit_aadc_gazetteer_UFI_original_crosswalk.py
      - name: Retrieve immutable AADC source evidence 16/14
        run: |
          mkdir -p build/events
          gh run download 44530909415 -n aadc-eight-species-high-evidence-source-20261119 -D build/events
      - name: Match original 2016 workbook geog site to SHP UFI through author-provided place ID
        run: |
          python -m scripts.audit_aadc_gazetteer_UFI_original_crosswalk \
            --source-events build/events/AADC_2025_EIGHT_SPECIES_HIGH_EVIDENCE_TRANSITION_SOURCE_GATE_20261119.json \
            --out-json build/AADC_ORIGINAL_2016_GAZETTEER_UFI_EVENT_CROSSWALK_20261121.json
      - name: Preserve exact-source identity crosswalk or HOLD
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aadc-original-site-gazetteer-ufi-crosswalk
          path: build/AADC_ORIGINAL_2016_GAZETTEER_UFI_EVENT_CROSSWALK_20261121.json
          retention-days: 30
