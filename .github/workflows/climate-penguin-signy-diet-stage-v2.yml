name: climate-penguin-signy-diet-stage-v2

on:
  workflow_dispatch:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - "research/climate-penguin/work/climate_penguin/signy_prey_fledgling_v2.py"
      - "contracts/SIGNY_DIET_FLEDGLING_V2.json"
      - "tests/test_signy_prey_fledgling_v2.py"
      - ".github/workflows/climate-penguin-signy-diet-stage-v2.yml"

jobs:
  source-coupling:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pandas lxml html5lib beautifulsoup4
      - run: python -m unittest discover -s tests -p test_signy_prey_fledgling_v2.py -v
      - name: Fetch first-party original three diet and three breeding sources
        run: |
          mkdir -p build/signy_prey build/signy_source
          curl -L --fail --retry 4 --retry-delay 5 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=eb421e6d-b93b-4174-904b-9a7b0b401403&output=zip.tree' -o build/signy_prey/adelie.zip
          curl -L --fail --retry 4 --retry-delay 5 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=95e38251-797c-495a-abc0-40a613599759&output=zip.tree' -o build/signy_prey/chinstrap.zip
          curl -L --fail --retry 4 --retry-delay 5 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=fb9bd975-e6fe-406c-84be-01e57d612b5e&output=zip.tree' -o build/signy_prey/gentoo.zip
          curl -L --fail --retry 4 --retry-delay 5 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=daf2c4fd-c1e3-4e65-851f-d11f02c5b69d&output=zip.tree' -o build/signy_source/adelie.zip
          curl -L --fail --retry 4 --retry-delay 5 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=d0633a9b-8c56-4ae5-88bf-6ec6ba9017b9&output=zip.tree' -o build/signy_source/chinstrap.zip
          curl -L --fail --retry 4 --retry-delay 5 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=883c6b40-024e-41e8-9c3e-2668a44b5751&output=zip.tree' -o build/signy_source/gentoo.zip
      - name: Reconstruct dated fledgling stage source from the three original BAS files
        run: python research/climate-penguin/work/climate_penguin/signy_trispecies_stage_source_v1.py --source-dir build/signy_source --out build/signy_stage_derived
      - name: Join diet weight and fledgling stage by species breeding season
        run: python research/climate-penguin/work/climate_penguin/signy_prey_fledgling_v2.py --diet-dir build/signy_prey --stage-dir build/signy_stage_derived --out build/signy_prey_stage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signy-penguin-diet-stage-v2
          path: |
            build/signy_prey_stage/result.json
            build/signy_prey_stage/diet_stage_species_year.csv
            build/signy_stage_derived/source_gate.json
