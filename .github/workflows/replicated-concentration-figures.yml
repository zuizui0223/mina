name: replicated-concentration-figures

on:
  push:
    branches: [manuscript/replicated-concentration-figures-v1, submission/ecology-report-v1]
    paths:
      - "scripts/build_replicated_concentration_figure_data.py"
      - "scripts/plot_replicated_concentration_figures.py"
      - "docs/MANUSCRIPT_REPLICATED_CONCENTRATION_V0_2.md"
      - ".github/workflows/replicated-concentration-figures.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev]" pandas matplotlib lxml html5lib beautifulsoup4
      - name: Download frozen public sources
        run: |
          mkdir -p build/raw build/figure_data build/figures
          python scripts/fetch_lter_census.py build/raw/adelie_census.csv
          curl -L --fail --retry 4 --retry-delay 5             'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=daf2c4fd-c1e3-4e65-851f-d11f02c5b69d&output=zip.tree'             -o build/raw/signy_adelie.zip
          curl -L --fail --retry 4 --retry-delay 5             'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=d0633a9b-8c56-4ae5-88bf-6ec6ba9017b9&output=zip.tree'             -o build/raw/signy_chinstrap.zip
      - name: Build source-checked figure data
        run: |
          python -m scripts.build_replicated_concentration_figure_data             --palmer-census build/raw/adelie_census.csv             --signy-adelie-zip build/raw/signy_adelie.zip             --signy-chinstrap-zip build/raw/signy_chinstrap.zip             --palmer-receipt results/PALMER_BREEDING_PATCH_CONCENTRATION_RESULT_V1.json             --signy-adelie-receipt results/SIGNY_BREEDING_PATCH_CONCENTRATION_RESULT_V1.json             --signy-chinstrap-receipt results/SIGNY_CHINSTRAP_BREEDING_PATCH_CONCENTRATION_RESULT_V1.json             --dominance-receipt results/CONCENTRATION_DOMINANCE_DESCRIPTIVE_SUMMARY_V1.json             --out-dir build/figure_data
          cat build/figure_data/FIGURE_DATA_RECEIPT_V1.json
      - name: Render manuscript figures
        run: |
          python -m scripts.plot_replicated_concentration_figures             --data-dir build/figure_data             --out-dir build/figures
      - uses: actions/upload-artifact@v4
        with:
          name: replicated-concentration-figures-v1
          path: |
            build/figure_data/*
            build/figures/*
