name: Antarctic original Adélie repeated site physical landmass support V12
on:
  push:
    branches: [research/antarctic-functional-archipelago-v1]
    paths:
      - 'contracts/AADC_REPEATED_COLONY_LANDMASS_SUPPORT_V12.md'
      - 'scripts/audit_aadc_repeated_landmass_support_v12.py'
      - 'tests/test_aadc_repeated_landmass_support_v12.py'
      - '.github/workflows/antarctic-aadc-repeated-landmass-v12.yml'
  pull_request:
    paths:
      - 'contracts/AADC_REPEATED_COLONY_LANDMASS_SUPPORT_V12.md'
      - 'scripts/audit_aadc_repeated_landmass_support_v12.py'
      - 'tests/test_aadc_repeated_landmass_support_v12.py'
      - '.github/workflows/antarctic-aadc-repeated-landmass-v12.yml'
  workflow_dispatch:
jobs:
  source_original_repeated_landmass_QA:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original publisher geography, shapefile, and synthetic tests
        run: python -m pip install pytest requests pyproj pyshp 'shapely>=2,<3' openpyxl xlrd numpy
      - name: Test frozen repeated site identities against true physical land features
        run: python -m pytest -q tests/test_aadc_repeated_landmass_support_v12.py
      - name: Recover original AADC 28 site-season compact polygon location QC
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/aadc-original-v10
          gh run download 40257955794 --repo "$GITHUB_REPOSITORY" \
            --name original-AADC-adelie-repeated-colony-boundary-v10 --dir /tmp/aadc-original-v10
      - name: Audit original 13 AADC source site IDs against source-hashed SCAR land
        run: |
          python scripts/audit_aadc_repeated_landmass_support_v12.py \
            --v9 results/ANTARCTIC_SOURCE_BOUNDARY_MANIFEST_V9.json \
            --v10 results/AADC_REPEATED_ADELIE_COLONY_GIS_V10.json \
            --v10-site-metrics /tmp/aadc-original-v10/AADC_ADPE_ORIGINAL_28_SITE_YEAR_V10.csv \
            --out /tmp/AADC_ADPE_REPEAT_PHYSICAL_LANDMASS_V12.json \
            --site-crosswalk /tmp/AADC_ADPE_REPEAT_SOURCE_LANDMASS_V12.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-AADC-13-repeat-landmass-source-v12
          path: |
            /tmp/AADC_ADPE_REPEAT_PHYSICAL_LANDMASS_V12.json
            /tmp/AADC_ADPE_REPEAT_SOURCE_LANDMASS_V12.csv
          if-no-files-found: warn
