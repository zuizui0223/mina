name: Antarctic V21 BAS Bird Island and Maiviken original CSV source gate
on:
  push:
    branches: [research/antarctic-penguin-island-macro-v1]
    paths:
      - 'contracts/BAS_SOUTH_GEORGIA_GENTOO_SOURCE_V21.md'
      - 'scripts/audit_bas_south_georgia_source_v21.py'
      - 'tests/test_bas_south_georgia_source_v21.py'
      - '.github/workflows/antarctic-bas-south-georgia-source-v21.yml'
  pull_request:
    paths:
      - 'contracts/BAS_SOUTH_GEORGIA_GENTOO_SOURCE_V21.md'
      - 'scripts/audit_bas_south_georgia_source_v21.py'
      - 'tests/test_bas_south_georgia_source_v21.py'
      - '.github/workflows/antarctic-bas-south-georgia-source-v21.yml'
  workflow_dispatch:
jobs:
  original_BAS_island_mainland_sources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original-data HTTP read and source-only test dependencies
        run: python -m pip install pytest requests
      - name: Assert sample-only no-count handling and source-version separation
        run: python -m pytest -q tests/test_bas_south_georgia_source_v21.py
      - name: Download verified BAS Bird Island and mainland Maiviken public source tables, report HEADER ONLY
        run: python scripts/audit_bas_south_georgia_source_v21.py --json /tmp/BAS_SOUTH_GEORGIA_GENTOO_V21_SOURCE_QA.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-BAS-gentoo-physical-island-mainland-v21-headers-no-outcomes
          path: /tmp/BAS_SOUTH_GEORGIA_GENTOO_V21_SOURCE_QA.json
