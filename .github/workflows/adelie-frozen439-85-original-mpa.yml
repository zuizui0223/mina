name: adelie-FROZEN439-85-original-MPA-reconstruction
on:
  push:
    branches: [analysis/adelie-polynya-conservation-source-20261122]
    paths:
      - scripts/reconcile_frozen_adelie439_mpa.py
      - .github/workflows/adelie-frozen439-85-original-mpa.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  frozen-85-geo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Draft PR 214 source, not unpinned main
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/mina
          ref: c67e55c9f4f657ef308c02a85c6ff366dce8e1f4
          path: build/frozen
      - uses: actions/download-artifact@v4
        with:
          name: adelie-original-author-site-support
          run-id: 45081645133
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/original_source
      - uses: actions/download-artifact@v4
        with:
          name: adelie-polynya-official-source-ccamlr-mpa-gate
          run-id: 45031126352
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/ccamlr
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --no-cache-dir 'numpy>=1.24' 'pandas>=2' 'matplotlib>=3.8' 'shapely>=2.0' 'pyproj>=3.6'
      - name: Run exact original 439-row manuscript key reconciliation and current 85-site MPA overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C build/frozen rev-parse HEAD)" = "c67e55c9f4f657ef308c02a85c6ff366dce8e1f4"
          python scripts/reconcile_frozen_adelie439_mpa.py \
            --source build/frozen/research/climate-penguin/macro_panantarctic_v1/v07_polynya_20261121/source_inputs \
            --original-author build/original_source/published_author_site_level_support_2004_2010.csv \
            --mpa build/ccamlr/CCAMLR_MPA_EPSG6932.geojson \
            --output build/frozen439_mpa
      - name: Retain inspectable row crosswalk, site metrics, MPA areas, map and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adelie-frozen439-85-ccamlr-mpa-source-audit
          path: build/frozen439_mpa
          if-no-files-found: warn
          retention-days: 90
