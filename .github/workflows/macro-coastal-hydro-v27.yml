name: V27 complete native hydrography on coastal frame
on:
  push:
    branches: [analysis/pygoscelis-count-functional-sensitivity-20261126]
    paths: ['.github/workflows/macro-coastal-hydro-v27.yml']
permissions:
  contents: read
  actions: read
jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original source-compatible packages
        run: python -m pip install --disable-pip-version-check "numpy>=1.26,<2.1" "pandas>=2.1,<3" "xarray>=2024.5,<2025" "zarr>=2.17,<3" "numcodecs<0.16" "fsspec>=2024.1,<2025" "dask[array]>=2024.3,<2025" "aiohttp>=3.9"
      - name: Extract 104 original months and verify previous native values
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15170219473/zip" > native_pilot.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13827762271/zip" > oldmonthly.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15169837655/zip" > icepilot.zip
          python research/macro_marine_land_footprint_v1/hydro_tiles_v27.py native_pilot.zip oldmonthly.zip icepilot.zip v27_result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro-coastal-hydro-v27
          path: v27_result/
          retention-days: 30
          if-no-files-found: warn
