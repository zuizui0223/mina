name: Palmer Torgersen census provenance audit

on:
  pull_request:
    paths:
      - "scripts/audit_torgersen_census_provenance.py"
      - ".github/workflows/torgersen-census-provenance-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          mkdir -p build
          python scripts/fetch_lter_census.py build/adelie_census.csv
          python scripts/audit_torgersen_census_provenance.py --census build/adelie_census.csv --out build/TORGERSEN_CENSUS_PROVENANCE_AUDIT.json
      - uses: actions/upload-artifact@v4
        with:
          name: torgersen-census-provenance-audit
          path: build/TORGERSEN_CENSUS_PROVENANCE_AUDIT.json
