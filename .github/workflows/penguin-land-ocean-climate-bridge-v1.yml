name: penguin-original-land-ocean-climate-bridge-v1
on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - "research/climate-penguin/work/historical_land_ocean_bridge_v1/**"
      - "research/climate-penguin/outputs/historical_land_ocean_bridge_v1/**"
      - ".github/workflows/penguin-land-ocean-climate-bridge-v1.yml"
  pull_request:
    paths:
      - "research/climate-penguin/work/historical_land_ocean_bridge_v1/**"
      - "research/climate-penguin/outputs/historical_land_ocean_bridge_v1/**"
      - ".github/workflows/penguin-land-ocean-climate-bridge-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-matched-land-and-marine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source SHA and same-site land/ocean model and snow integrity tests
        run: node research/climate-penguin/work/historical_land_ocean_bridge_v1/build.mjs --check-receipt
      - name: Archive biological/vegetation source lineage and support diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: penguin-original-land-ocean-climate-bridge-v1
          path: |
            research/climate-penguin/outputs/historical_land_ocean_bridge_v1/*.csv
            research/climate-penguin/outputs/historical_land_ocean_bridge_v1/*.json
          if-no-files-found: error
          retention-days: 60
