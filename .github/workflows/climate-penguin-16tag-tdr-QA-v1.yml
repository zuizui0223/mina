name: climate-penguin-chinstrap-source-16tag-TDR-sensor-QA-v1
on:
  workflow_dispatch:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - "research/climate-penguin/work/climate_penguin/chinstrap_16tag_tdr_sensor_qa_v1.py"
      - "tests/test_chinstrap_16tag_tdr_sensor_qa_v1.py"
      - ".github/workflows/climate-penguin-16tag-tdr-QA-v1.yml"
jobs:
  source-originals:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install only source numeric processing
        run: python -m pip install numpy
      - name: Verify QA contract before opening pressure values
        run: python -m unittest discover -s tests -p test_chinstrap_16tag_tdr_sensor_qa_v1.py -v
      - name: Fetch BAS original 2011–2019 Chinstrap version2 TDR and GPS archives
        run: |
          mkdir -p build/chinstrap_tdr_original
          curl -fsSL --retry 4 --retry-delay 8 --max-time 1200 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=da13e049-be2b-4345-bbdd-ab960cb24731&output=zip.tree' -o build/chinstrap_tdr_original/TDR_v2_original.zip
          curl -fsSL --retry 4 --retry-delay 8 --max-time 1200 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=8f8ccba5-01af-4b00-8a3b-c3c85b24bf92&output=zip.tree' -o build/chinstrap_tdr_original/GPS_v2_original.zip
      - name: Source-frozen 16-tag across-four-offset 5-dbar diagnostic
        run: |
          python research/climate-penguin/work/climate_penguin/chinstrap_16tag_tdr_sensor_qa_v1.py \
            --tdr-zip build/chinstrap_tdr_original/TDR_v2_original.zip \
            --gps-zip build/chinstrap_tdr_original/GPS_v2_original.zip \
            --out build/chinstrap_16tag_QA --check
          python -m unittest discover -s tests -p test_chinstrap_16tag_tdr_sensor_qa_v1.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chinstrap-original-16tag-instrument-QA-v1
          path: |
            build/chinstrap_16tag_QA/source_sensor_methods.csv
            build/chinstrap_16tag_QA/frozen16_source_tag_summary.csv
            build/chinstrap_16tag_QA/decision.json
