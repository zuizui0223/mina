name: Penguin Pan-Antarctic 3-species original count and sea-ice trends
on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - 'research/climate-penguin/macro_panantarctic_v1/test_three_species_count_ice_trends.py'
      - 'research/climate-penguin/macro_panantarctic_v1/THREE_SPECIES_100_TREND_TEST_CONTRACT_20261109.md'
      - '.github/workflows/penguin-panantarctic-3species-ice-count-trends.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fixed-100-site-species-macro-climate-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original spatial source and numerical trend statistics
        run: python -m pip install --disable-pip-version-check numpy pyproj==3.7.1
      - name: Verify full 595-site macro and 100-series scripts
        run: |
          python -m py_compile research/climate-penguin/macro_panantarctic_v1/build.py
          python -m py_compile research/climate-penguin/macro_panantarctic_v1/test_three_species_count_ice_trends.py
      - name: Reproduce full original 2456 count rows, 595 colony sources and spatial blocks
        run: python research/climate-penguin/macro_panantarctic_v1/build.py
      - name: Reuse original completed 595-site 1991-2020 source-only SIC without downloading it again
        uses: actions/download-artifact@v4
        with:
          name: penguin-panantarctic-595site-original-1991-2020-monthly-ice
          run-id: 42612067836
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/original_595_30year_ice
      - name: Compute original 100 site-species nest trends and same-observed-year SIC trends
        run: |
          python research/climate-penguin/macro_panantarctic_v1/test_three_species_count_ice_trends.py             --full-ice-csv build/original_595_30year_ice/ice_595_outputs/original_595_site_months_120_source_QA.csv             --full-ice-summary build/original_595_30year_ice/ice_595_outputs/original_595_native_monthly_SIC_30year_summary.json
      - name: Archive three-species source/count/environment time-alignment and fixed spatial-block associations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: penguin-100-real-colony-species-SIC-count-trend-macro-association
          path: |
            research/climate-penguin/macro_panantarctic_v1/outputs/macro_original_coverage.json
            research/climate-penguin/macro_panantarctic_v1/three_species_100_outputs/*.json
            research/climate-penguin/macro_panantarctic_v1/three_species_100_outputs/*.csv
          if-no-files-found: warn
