name: penguin-temporal-niche-cross-axis-v2
on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - 'research/climate-penguin/work/temporal_niche_cross_axis_v2/**'
      - 'research/climate-penguin/outputs/temporal_niche_cross_axis_v2/**'
      - 'tests/test_temporal_niche_cross_axis_v2.py'
      - '.github/workflows/penguin-temporal-niche-cross-axis-v2.yml'
  pull_request:
    paths:
      - 'research/climate-penguin/work/temporal_niche_cross_axis_v2/**'
      - 'research/climate-penguin/outputs/temporal_niche_cross_axis_v2/**'
      - 'tests/test_temporal_niche_cross_axis_v2.py'
      - '.github/workflows/penguin-temporal-niche-cross-axis-v2.yml'
permissions:
  contents: read
jobs:
  exact-camera-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_temporal_niche_cross_axis_v2.py -q
      - run: python research/climate-penguin/work/temporal_niche_cross_axis_v2/analyze.py --out /tmp/niche-cross-axis-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: temporal-niche-cross-axis-v2
          path: /tmp/niche-cross-axis-result.json
          retention-days: 30
