name: Penguin 3-network source-locked nesting allocation versus lagged local SIC
on:
  push:
    branches: [analysis/penguin-decade-redistribution-v1-20261110]
    paths:
      - 'research/climate-penguin/macro_panantarctic_v1/three_network_allocation_20261117/**'
      - '.github/workflows/penguin-three-network-lagged-sic-allocation-20261117.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  two-original-regions-and-palmer-harmonized-origin:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed arithmetic dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile script and synthetic nonfuture source tests
        run: |
          python -m py_compile research/climate-penguin/macro_panantarctic_v1/three_network_allocation_20261117/three_network_lagged_sic_vs_allocation.py
          python research/climate-penguin/macro_panantarctic_v1/three_network_allocation_20261117/three_network_lagged_sic_vs_allocation.py --self-test
      - name: Fetch real MAPPPD 2456 count artifact and raw-OSI-SAF 71400 original site-months
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p build/three_network_original_sources
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13669533413/zip" > build/three_network_original_sources/original_counts.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13671496095/zip" > build/three_network_original_sources/original_SIC.zip
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import csv,io
          root=Path('build/three_network_original_sources')
          files=[('original_counts.zip','source_observed_2456.csv',2456),
                 ('original_SIC.zip','ice_595_outputs/original_595_site_months_120_source_QA.csv',71400)]
          for fn,member,n in files:
              with ZipFile(root/fn) as z:
                  assert z.testzip() is None
                  rows=list(csv.DictReader(io.StringIO(z.read(member).decode('utf-8-sig'))))
                  assert len(rows)==n,(fn,len(rows))
          print('PASS original publisher-derived 2456 real nests and original 71400 satellite site-months')
          PY
      - name: Source-lock all 32 region-species supports and evaluate 38 true time-forward whole-network tests
        run: |
          python research/climate-penguin/macro_panantarctic_v1/three_network_allocation_20261117/three_network_lagged_sic_vs_allocation.py \
            --original-derived research/climate-penguin/outputs/comparison_audit/mapppd_unambiguous_site_seasons.csv \
            --source-counts-zip build/three_network_original_sources/original_counts.zip \
            --source-ice-zip build/three_network_original_sources/original_SIC.zip \
            --palmer-counts research/climate-penguin/outputs/comparison_audit/palmer_five_island_counts.csv \
            --palmer-sic research/climate-penguin/outputs/palmer_ice_nesting_concentration/annual.csv \
            --out build/penguin_three_network_origin_forward_20261117
      - name: Independent chronology, real site-roster and no-leakage source audit
        run: |
          python - <<'PY'
          import json,csv,io
          from pathlib import Path
          from zipfile import ZipFile
          import numpy as np
          root=Path('build/penguin_three_network_origin_forward_20261117')
          rec=json.loads((root/'three_network_lag1_sic_allocation_receipt.json').read_text())
          ps=json.loads((root/'three_network_time_forward_predictions.json').read_text())
          audit=json.loads((root/'network_support_audit_32_region_species.json').read_text())
          assert rec["status"]=="PASS_OBSERVED_THREE_NETWORK_LAGGED_SIC_VS_PREVIOUS_ALLOCATION"
          assert len(audit)==32 and sum(z["eligible"] for z in audit)==2
          assert rec["n_original_mapppd_count_rows"]==2456
          assert rec["n_original_satellite_SIC_site_months"]==71400
          assert rec["n_true_year_network_holdouts"]==38 and len(ps)==38
          assert rec["held_out_target_year_climate_used"] is False
          assert rec["held_out_target_year_counts_used_in_training"] is False
          assert rec["all_eligible_cohorts_included_not_outcome_selected"]
          assert len(rec["networks"])==3
          expected={
             "Palmer_ADPE_5physical_island":(5,17,[1991,2017]),
             "Victoria_Land_ADPE_3colony":(3,14,[1996,2019]),
             "South_Shetland_CHPE_4colony":(4,7,[1996,2012])
          }
          assert set(expected)=={x["network"] for x in rec["networks"]}
          for n in rec["networks"]:
              assert (n["n_fixed_original_source_sites"],
                      n["n_true_hidden_next_season_tests"],
                      n["source_season_span"])==expected[n["network"]]
          counts={}
          with ZipFile('build/three_network_original_sources/original_counts.zip') as z:
              rows=list(csv.DictReader(io.StringIO(z.read('source_observed_2456.csv').decode('utf-8-sig'))))
              counts={(r["site_id"],r["species"],int(r["season"])):float(r["observed_nest_count"])
                      for r in rows}
          pal=list(csv.DictReader(open('research/climate-penguin/outputs/comparison_audit/palmer_five_island_counts.csv')))
          palcounts={(r["island_name"],int(r["year"])):float(r["count"]) for r in pal}
          net={x["network"]:x for x in rec["networks"]}
          for y in ps:
              m=net[y["network"]]
              yr=y["target_season"]
              assert y["last_original_count_season"]==yr-1
              assert y["n_training_seasons"]==yr-m["source_season_span"][0]
              sites=m["site_ids"]
              if y["network"]=="Palmer_ADPE_5physical_island":
                  vals=np.asarray([palcounts[(site,yr)] for site in sites])
                  previous=np.asarray([palcounts[(site,yr-1)] for site in sites])
              else:
                  vals=np.asarray([counts[(site,m["species"],yr)] for site in sites])
                  previous=np.asarray([counts[(site,m["species"],yr-1)] for site in sites])
              assert abs(vals.sum()-y["original_total_nest_count"])<1e-9
              assert np.allclose(vals/vals.sum(),y["observed_shares"],atol=1e-12)
              assert np.allclose(previous/previous.sum(),
                  y["models"]["previous_share"]["predicted_shares"],atol=1e-12)
              assert len(y["source_ice_previous_AugOct_site_values"])==len(sites)
              for model,data in y["models"].items():
                  pred=np.asarray(data["predicted_shares"])
                  assert np.all(pred>=0) and abs(pred.sum()-1)<1e-10
                  assert abs(data["TV"]-.5*np.abs(pred-vals/vals.sum()).sum())<1e-12
          print('PASS 3 frozen source cohorts, all 38 true future count allocations and strictly lagged marine input')
          PY
      - name: Archive source QA and paired model scores, not ecological climate causality
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: penguin-3-network-source-locked-lag1-ice-vs-previous-allocation
          path: build/penguin_three_network_origin_forward_20261117/
          if-no-files-found: warn
          retention-days: 30
