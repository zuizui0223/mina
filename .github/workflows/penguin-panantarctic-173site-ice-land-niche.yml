name: Penguin pan-Antarctic 173-site marine-terrestrial niche macro test
on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - 'research/climate-penguin/macro_panantarctic_v1/test_static_land_marine_niche.py'
      - 'research/climate-penguin/macro_panantarctic_v1/STATIC_LAND_173_SITE_MACRO_CONTRACT_20261109.md'
      - '.github/workflows/penguin-panantarctic-173site-ice-land-niche.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-verified-marine-terrestrial-macro:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed source geographic and statistical packages
        run: python -m pip install --disable-pip-version-check numpy pyproj==3.7.1
      - name: Compile original macro panel and fixed 173-site environmental model
        run: |
          python -m py_compile research/climate-penguin/macro_panantarctic_v1/build.py
          python -m py_compile research/climate-penguin/macro_panantarctic_v1/test_static_land_marine_niche.py
      - name: Reproduce original Pan-Antarctic 595-site observed biology and 250km spatial blocks
        run: python research/climate-penguin/macro_panantarctic_v1/build.py
      - name: Retrieve already completed 120 original OSI monthly source scenes at 595 sites
        uses: actions/download-artifact@v4
        with:
          name: penguin-panantarctic-595site-original-1991-2020-monthly-ice
          run-id: 42612067836
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/original_595_30year_ice
      - name: Execute predeclared 173 site ice/vegetation + 197 nest medians spatial macro comparison
        run: |
          python research/climate-penguin/macro_panantarctic_v1/test_static_land_marine_niche.py \
            --full-ice-csv build/original_595_30year_ice/ice_595_outputs/original_595_site_months_120_source_QA.csv \
            --full-ice-summary build/original_595_30year_ice/ice_595_outputs/original_595_native_monthly_SIC_30year_summary.json
      - name: Archive source-linked biology, area, climatic range and block interval receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: penguin-macro-173-site-original-ice-land-niche-covariation
          path: |
            research/climate-penguin/macro_panantarctic_v1/land_173_macro_outputs/*.csv
            research/climate-penguin/macro_panantarctic_v1/land_173_macro_outputs/*.json
            research/climate-penguin/macro_panantarctic_v1/outputs/macro_original_coverage.json
          if-no-files-found: warn
