name: signy-concentration-support

on:
  pull_request:
    paths:
      - "scripts/audit_signy_concentration_support.py"
      - ".github/workflows/signy-concentration-support.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev]" pandas lxml html5lib beautifulsoup4
      - name: Download frozen official Signy source
        run: |
          mkdir -p build
          curl -L --fail --retry 4 --retry-delay 5 \
            'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=daf2c4fd-c1e3-4e65-851f-d11f02c5b69d&output=zip.tree' \
            -o build/signy_official.zip
      - name: Run outcome-blind roster audit
        run: |
          python -m scripts.audit_signy_concentration_support \
            --official-zip build/signy_official.zip \
            --out build/SIGNY_CONCENTRATION_SUPPORT_AUDIT_V2.json
          python - <<'PY'
          import json
          x=json.load(open("build/SIGNY_CONCENTRATION_SUPPORT_AUDIT_V2.json"))
          assert x["effect_computed"] is False
          assert x["numeric_pair_magnitudes_recorded_or_summarized"] is False
          assert x["numeric_parseability_only"] is True
          assert x["support_gate"]["passes"] is True
          assert x["structural_candidates"] == ["A1+A60","A2","A3","A4","A64"]
          assert x["complete_candidate_seasons"] == [
              1996,1998,1999,2000,2001,2002,2003,2004,2005,2006,2007,
              2008,2009,2011,2012,2013,2014,2015,2016,2017,2018,2019,
          ]
          assert x["source"]["selected_csv_sha256"] == "585f87928ed64d8982ef5bd86d8a785c38df65c39223d88ec17425854c786d62"
          print("gate=",x["support_gate"])
          print("candidates=",x["structural_candidates"])
          print("complete_seasons=",x["complete_candidate_seasons"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: signy-concentration-support-v2
          path: build/SIGNY_CONCENTRATION_SUPPORT_AUDIT_V2.json
