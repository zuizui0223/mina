name: antarctic-island-ecology-paper2d-summer-exposure-full

on:
  push:
    branches: [research/antarctic-island-ecology-v1]
    paths:
      - "scripts/run_paper2d_summer_exposure_full.py"
      - "scripts/aggregate_paper2d_summer_exposure_full.py"
      - "tests/test_paper2d_summer_exposure_full.py"
      - ".github/workflows/antarctic-island-ecology-paper2d-summer-exposure-full.yml"
  pull_request:
    paths:
      - "scripts/run_paper2d_summer_exposure_full.py"
      - "scripts/aggregate_paper2d_summer_exposure_full.py"
      - "tests/test_paper2d_summer_exposure_full.py"
      - ".github/workflows/antarctic-island-ecology-paper2d-summer-exposure-full.yml"
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy requests rasterio pyproj planetary-computer
      - run: python -m unittest tests.test_paper2d_summer_exposure_recovery tests.test_paper2d_summer_exposure_full -v
      - name: Require frozen Beaufort positive-control pass
        run: |
          mkdir -p build/recovery
          gh run download 37190107881 -n paper2d-summer-exposure-beaufort-recovery-v1 -D build/recovery
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("build/recovery/PAPER2D_SUMMER_EXPOSURE_BEAUFORT_RECOVERY_RESULT_V1.json")
          x=json.loads(p.read_text())
          assert x["decision"]["positive_control_passed"] is True
          assert x["decision"]["demographic_magnitudes_opened"] is False
          PY

  measure:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy requests rasterio pyproj planetary-computer
      - name: Download frozen full pixel-QA inputs
        run: |
          mkdir -p build/qa build/aei build/shard
          gh run download 37189507445 -n antarctic-island-ecology-paper2d-full-pixel-qa-v1 -D build/qa
      - name: Download frozen Antarctic Ecosystem Inventory raster
        run: |
          curl -L --fail --retry 5 --retry-delay 5 \
            'https://zenodo.org/records/11629115/files/AntarcticaEcosystemInventory_IceFreeLands_v1_int.tif?download=1' \
            -o build/aei/AntarcticaEcosystemInventory_IceFreeLands_v1_int.tif
          echo 'cde880d73f7f18b44aecf5690aa2dc92  build/aei/AntarcticaEcosystemInventory_IceFreeLands_v1_int.tif' | md5sum -c -
      - name: Measure frozen summer exposure
        run: |
          python scripts/run_paper2d_summer_exposure_full.py \
            --sites-csv build/qa/ANTARCTIC_ISLAND_ECOLOGY_PAPER2D_FULL_PIXEL_QA_SITES_V1.csv \
            --scenes-csv build/qa/ANTARCTIC_ISLAND_ECOLOGY_PAPER2D_FULL_PIXEL_QA_SCENES_V1.csv \
            --aei-raster build/aei/AntarcticaEcosystemInventory_IceFreeLands_v1_int.tif \
            --shard-index ${{ matrix.shard }} --n-shards 6 \
            --out-json build/shard/summer_exposure_result_shard${{ matrix.shard }}.json \
            --out-csv build/shard/summer_exposure_sites_shard${{ matrix.shard }}.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper2d-summer-exposure-shard-${{ matrix.shard }}
          path: build/shard/*
          if-no-files-found: warn

  aggregate:
    needs: measure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: paper2d-summer-exposure-shard-*
          path: build/shards
          merge-multiple: true
      - name: Aggregate
        run: |
          mkdir -p build/final
          python scripts/aggregate_paper2d_summer_exposure_full.py \
            --shard-dir build/shards \
            --out-json build/final/PAPER2D_SUMMER_EXPOSURE_FULL_RESULT_V1.json \
            --out-csv build/final/PAPER2D_SUMMER_EXPOSURE_FULL_SITES_V1.csv
      - uses: actions/upload-artifact@v4
        with:
          name: paper2d-summer-exposure-full-v1
          path: build/final/*
