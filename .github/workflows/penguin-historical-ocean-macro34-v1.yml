name: penguin macro GLORYS 1993-2020 original source 34 sites v1
on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - "research/climate-penguin/work/historical_ocean_macro_v1/**"
      - "research/climate-penguin/outputs/historical_ocean_macro_v1/**"
      - ".github/workflows/penguin-historical-ocean-macro34-v1.yml"
  pull_request:
    paths:
      - "research/climate-penguin/work/historical_ocean_macro_v1/**"
      - "research/climate-penguin/outputs/historical_ocean_macro_v1/**"
      - ".github/workflows/penguin-historical-ocean-macro34-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-pinned-original-1993-2020-ocean:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source extraction dependencies
        run: |
          python -m pip install "numpy>=1.26,<2.1" "pandas>=2.1,<3" "xarray>=2024.5,<2025" "zarr>=2.17,<3" "numcodecs<0.16" "fsspec>=2024.1,<2025" "dask[array]>=2024.3,<2025" "aiohttp>=3.9"
      - name: Retrieve fixed 1993-2020 ocean and compare 2011-2020 source values
        run: python research/climate-penguin/work/historical_ocean_macro_v1/extract.py
      - name: Compare 3-species original nest growth with climate and blocked chronological prediction
        run: python research/climate-penguin/work/historical_ocean_macro_v1/evaluate.py
      - name: Save original source and validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: penguin-historical-ocean-macro34-1993-2020-v1
          path: research/climate-penguin/outputs/historical_ocean_macro_v1/
          if-no-files-found: warn
          retention-days: 45
