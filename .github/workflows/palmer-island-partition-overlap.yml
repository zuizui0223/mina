name: palmer-island-partition-overlap

on:
  push:
    branches:
      - analysis/island-partition-v1
    paths:
      - "src/mina/island_partition_overlap.py"
      - "tests/test_island_partition_overlap.py"
      - "contracts/PALMER_ISLAND_PARTITION_OVERLAP_V1.json"
      - ".github/workflows/palmer-island-partition-overlap.yml"
  pull_request:
    paths:
      - "src/mina/island_partition_overlap.py"
      - "tests/test_island_partition_overlap.py"
      - "contracts/PALMER_ISLAND_PARTITION_OVERLAP_V1.json"
      - ".github/workflows/palmer-island-partition-overlap.yml"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Run frozen overlap tests
        run: pytest -q tests/test_island_partition_overlap.py
      - name: Fetch frozen LTER census
        run: python scripts/fetch_lter_census.py build/adelie_census.csv
      - name: Run missingness-aware island-partition test
        run: |
          python -m mina.island_partition_overlap \
            --census build/adelie_census.csv \
            --out build/island_partition_overlap_result.json \
            --permutations 20000 \
            --seed 20260927
      - name: Print overlap decision receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          x=json.loads(Path("build/island_partition_overlap_result.json").read_text())
          print("validity_pass=",x["validity_pass"])
          print("group_sizes=",x["group_sizes"])
          print("n_units=",x["n_units"])
          print("n_informative_pairs=",x["n_informative_pairs"])
          print("observed=",json.dumps(x["observed"],indent=2,sort_keys=True))
          print("null=",json.dumps(x["null"],indent=2,sort_keys=True))
          print("decision=",json.dumps(x["decision"],indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: palmer-island-partition-overlap
          path: |
            build/adelie_census.csv
            build/island_partition_overlap_result.json
