name: climate-penguin-IMR-independent-out-of-training-krill-acoustic-v1
on:
  workflow_dispatch:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - "research/climate-penguin/inputs/IMR_annual_overall_acoustic_2011_2025_v1.csv"
      - "research/climate-penguin/work/climate_penguin/imr_krill_independent_acoustic_2023_2025_v1.py"
      - "tests/test_imr_krill_independent_acoustic_2023_2025_v1.py"
      - ".github/workflows/climate-penguin-IMR-independent-acoustic-v1.yml"
jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install analysis stats
        run: python -m pip install "scipy>=1.11,<2"
      - name: Validate official IMR annual source numbers and uncertainty
        run: python -m unittest discover -s tests -p test_imr_krill_independent_acoustic_2023_2025_v1.py -v
      - name: Recalculate region-level observed krill annual statistics
        run: |
          python research/climate-penguin/work/climate_penguin/imr_krill_independent_acoustic_2023_2025_v1.py --source research/climate-penguin/inputs/IMR_annual_overall_acoustic_2011_2025_v1.csv --out build/imr_out_of_training_acoustic
      - uses: actions/upload-artifact@v4
        with:
          name: IMR-original-official-annual-krill-overall-2011-25-v1
          path: |
            build/imr_out_of_training_acoustic/acoustic_annual_source_summary.json
            build/imr_out_of_training_acoustic/decision.json
