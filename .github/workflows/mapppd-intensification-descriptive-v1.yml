name: MAPPPD intensification descriptive v1

on:
  push:
    branches: [analysis/mapppd-intensification-descriptive-v1]
    paths:
      - "contracts/MAPPPD_INTENSIFICATION_DESCRIPTIVE_V1.md"
      - "scripts/describe_mapppd_intensification.py"
      - ".github/workflows/mapppd-intensification-descriptive-v1.yml"
  pull_request:
    paths:
      - "contracts/MAPPPD_INTENSIFICATION_DESCRIPTIVE_V1.md"
      - "scripts/describe_mapppd_intensification.py"
      - ".github/workflows/mapppd-intensification-descriptive-v1.yml"
  workflow_dispatch:

jobs:
  describe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pandas pyreadr
      - name: Fetch pinned MAPPPD snapshot
        run: |
          git clone --quiet https://github.com/CCheCastaldo/mapppdr.git build/mapppdr
          git -C build/mapppdr checkout --quiet 88c73a507e0921b2541c218c71eaf16721bc6502
      - name: Decompose increasing networks
        run: |
          python -m scripts.describe_mapppd_intensification \
            --mapppdr-dir build/mapppdr \
            --out-json build/MAPPPD_INTENSIFICATION_DESCRIPTIVE_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: mapppd-intensification-descriptive-v1
          path: build/MAPPPD_INTENSIFICATION_DESCRIPTIVE_RESULT_V1.json
