name: ross-island-choice-engine

on:
  push:
    branches:
      - validation/ross-island-resight-gate-v1
    paths:
      - "contracts/ROSS_ISLAND_CHOICE_ENGINE_V1.json"
      - "contracts/ROSS_ISLAND_CHOICE_ENGINE_V2.json"
      - "contracts/ROSS_ISLAND_DETECTION_CONTROL_AMENDMENT_V1.json"
      - "src/mina/ross_choice.py"
      - "tests/test_ross_choice.py"
      - ".github/workflows/ross-island-choice-engine.yml"
  workflow_dispatch:

jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Run outcome-blind synthetic choice-engine tests
        run: pytest -q tests/test_ross_choice.py
