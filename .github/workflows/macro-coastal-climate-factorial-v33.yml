name: V33 fixed-reference climate factorial
on:
  push:
    branches: [analysis/pygoscelis-count-functional-sensitivity-20261126]
    paths: ['.github/workflows/macro-coastal-climate-factorial-v33.yml']
permissions:
  contents: read
  actions: read
jobs:
  factorial:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Retrieve exact V31, V32, V25 archives and run eight anomaly subsets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15249889624/zip" > future.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15249988185/zip" > analogue.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15169338322/zip" > frame.zip
          python research/macro_marine_land_footprint_v1/climate_factorial_v33.py future.zip analogue.zip frame.zip v33_result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro-coastal-climate-factorial-v33
          path: v33_result/
          retention-days: 30
          if-no-files-found: warn
