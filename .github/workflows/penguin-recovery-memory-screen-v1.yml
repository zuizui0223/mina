name: Penguin recovery-memory screen v1

on:
  pull_request:
    paths:
      - 'scripts/screen_penguin_recovery_memory.py'
      - 'docs/PENGUIN_RECOVERY_MEMORY_SCREEN_V1.md'
      - '.github/workflows/penguin-recovery-memory-screen-v1.yml'
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas lxml
      - name: Download frozen sources
        run: |
          mkdir -p build
          python scripts/fetch_lter_census.py build/adelie_census.csv
          curl -L --fail --retry 10 --retry-delay 10 --retry-all-errors \
            'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=daf2c4fd-c1e3-4e65-851f-d11f02c5b69d&output=zip.tree' \
            -o build/signy_adelie.zip
          curl -L --fail --retry 10 --retry-delay 10 --retry-all-errors \
            'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=d0633a9b-8c56-4ae5-88bf-6ec6ba9017b9&output=zip.tree' \
            -o build/signy_chinstrap.zip
      - name: Run exact-zero recovery-memory screen
        run: |
          python -m scripts.screen_penguin_recovery_memory \
            --palmer-census build/adelie_census.csv \
            --signy-adelie-zip build/signy_adelie.zip \
            --signy-chinstrap-zip build/signy_chinstrap.zip \
            --out build/PENGUIN_RECOVERY_MEMORY_SCREEN_RESULT_V1.json
          cat build/PENGUIN_RECOVERY_MEMORY_SCREEN_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: penguin-recovery-memory-screen-v1
          path: build/PENGUIN_RECOVERY_MEMORY_SCREEN_RESULT_V1.json
