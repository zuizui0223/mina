name: palmer-reproductive-denominator-audit

on:
  push:
    branches: [analysis/palmer-reproductive-denominator-audit-v1]
    paths:
      - "scripts/audit_palmer_reproductive_denominator.py"
      - "tests/test_palmer_reproductive_denominator_audit.py"
      - "contracts/PALMER_REPRODUCTIVE_DENOMINATOR_AUDIT_V1.json"
      - "scripts/fetch_lter_chick_counts.py"
      - ".github/workflows/palmer-reproductive-denominator-audit.yml"
  pull_request:
    paths:
      - "scripts/audit_palmer_reproductive_denominator.py"
      - "tests/test_palmer_reproductive_denominator_audit.py"
      - "contracts/PALMER_REPRODUCTIVE_DENOMINATOR_AUDIT_V1.json"
      - "scripts/fetch_lter_chick_counts.py"
      - ".github/workflows/palmer-reproductive-denominator-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install numpy
      - run: python -m unittest tests.test_palmer_reproductive_denominator_audit -v
      - name: Fetch frozen Palmer adult and chick censuses
        run: |
          python scripts/fetch_lter_census.py build/adelie_adults.csv
          python scripts/fetch_lter_chick_counts.py build/adelie_chicks.csv
      - name: Run denominator-resolution audit
        run: |
          python scripts/audit_palmer_reproductive_denominator.py \
            --adult build/adelie_adults.csv \
            --chicks build/adelie_chicks.csv \
            --out build/PALMER_REPRODUCTIVE_DENOMINATOR_AUDIT_RESULT_V1.json \
            --draws 100000
      - uses: actions/upload-artifact@v4
        with:
          name: palmer-reproductive-denominator-audit-v1
          path: build/PALMER_REPRODUCTIVE_DENOMINATOR_AUDIT_RESULT_V1.json
