name: palmer-performance-redistribution-lags

on:
  push:
    branches:
      - analysis/palmer-performance-redistribution-lags-v1
    paths:
      - "src/mina/performance_redistribution_lags.py"
      - "tests/test_performance_redistribution_lags.py"
      - "contracts/PALMER_PERFORMANCE_REDISTRIBUTION_LAGS_V2.json"
      - "contracts/PALMER_CHICK_SEASON_KEY_RESOLUTION_V1.json"
      - "scripts/fetch_lter_census.py"
      - "scripts/fetch_lter_chick_counts.py"
      - ".github/workflows/palmer-performance-redistribution-lags.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Run frozen tests
        run: pytest -q tests/test_performance_redistribution_lags.py
      - name: Fetch frozen Palmer sources
        run: |
          python scripts/fetch_lter_census.py build/adelie_census.csv
          python scripts/fetch_lter_chick_counts.py build/adelie_chicks.csv
      - name: Run fixed-specification lag analysis
        run: |
          python -m mina.performance_redistribution_lags \
            --adult-census build/adelie_census.csv \
            --chicks build/adelie_chicks.csv \
            --out build/performance_redistribution_lags.json \
            --permutations 100000
      - name: Print receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("build/performance_redistribution_lags.json").read_text())
          print("source_counts=",x["source_counts"])
          print("lag_results=")
          for k,v in x["primary"]["lags"].items():
              print(k,"n=",v["n_rows"],"beta=",v["beta"],"p=",v["one_sided_upper_p"])
          print("recruitment_echo=",x["primary"]["recruitment_echo"])
          print("decision=",x["decision"])
          for name in (
              "exclude_litchfield",
              "minimum_prior_size_2",
              "minimum_total_chicks_10",
              "logratio_success_metric",
          ):
              v=x["sensitivities"][name]
              print(
                  name,
                  "beta2=",v["lags"]["2"]["beta"],
                  "p2=",v["lags"]["2"]["one_sided_upper_p"],
                  "C=",v["recruitment_echo"]["contrast"],
                  "Cp=",v["recruitment_echo"]["one_sided_upper_p"],
              )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: palmer-performance-redistribution-lags
          path: |
            build/adelie_census.csv
            build/adelie_chicks.csv
            build/performance_redistribution_lags.json
