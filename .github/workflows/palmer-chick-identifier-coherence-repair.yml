name: palmer-chick-identifier-coherence-repair

on:
  push:
    branches:
      - analysis/palmer-colony-extinction-hazard-v1
    paths:
      - "src/mina/preextinction_chick_repair.py"
      - "tests/test_preextinction_chick_repair.py"
      - "contracts/PALMER_CHICK_IDENTIFIER_COHERENCE_REPAIR_V1.json"
      - ".github/workflows/palmer-chick-identifier-coherence-repair.yml"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/test_preextinction_chick_repair.py tests/test_preextinction_chick.py
      - run: |
          python scripts/fetch_lter_census.py build/adelie_census.csv
          python scripts/fetch_palmer_chick_snapshot.py build/adelie_chicks_snapshot.csv
      - run: |
          python -m mina.preextinction_chick_repair             --adult-census build/adelie_census.csv             --chicks build/adelie_chicks_snapshot.csv             --out build/chick_identifier_repair.json             --simulations 100000 --seed 20260930
      - name: Receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("build/chick_identifier_repair.json").read_text())
          for key in ("primary_2x",):
              print(key,json.dumps(x[key],sort_keys=True))
          print("sens",json.dumps(x["sensitivities"],sort_keys=True))
          print("decision",json.dumps(x["decision"],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: palmer-chick-identifier-coherence-repair
          path: build/chick_identifier_repair.json
