name: Penguin original Landsat8 same-location seasonal spectral source
on:
  push:
    branches: [codex/penguin-nonmaxent-abundance-sdm-20261109]
    paths:
      - 'research/climate-penguin/nonmaxent_sdm/acquire_original_landsat8_seasonal_spectra.py'
      - 'research/climate-penguin/nonmaxent_sdm/LANDSAT_ANNUAL_SOURCE_CONTRACT_20261109.md'
      - '.github/workflows/penguin-l8-25site-annual-spectra.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-c2-qa-spectra:
    runs-on: ubuntu-22.04
    timeout-minutes: 42
    env:
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      GDAL_HTTP_MAX_RETRY: '3'
      GDAL_HTTP_RETRY_DELAY: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source COG/CRS readers
        run: python -m pip install --disable-pip-version-check -q rasterio==1.4.3 pyproj==3.7.1 planetary-computer==1.0.0
      - name: Compile and preflight frozen Landsat source masks
        run: |
          python -m py_compile research/climate-penguin/nonmaxent_sdm/acquire_original_landsat8_seasonal_spectra.py
          python - <<'PY'
          import importlib.util
          p="research/climate-penguin/nonmaxent_sdm/acquire_original_landsat8_seasonal_spectra.py"
          spec=importlib.util.spec_from_file_location("l8_original",p)
          a=importlib.util.module_from_spec(spec);spec.loader.exec_module(a)
          assert len(a.GRID)==77 and len(set(a.GRID))==77
          assert a.qa_clear(0) and not a.qa_clear(1<<5) and not a.qa_clear(1<<7)
          assert not a.qa_clear(1<<3) and not a.qa_clear(1<<4)
          assert a.raw_sr(7273)>0 and a.raw_sr(43636)<1.2
          assert a.raw_sr(0) is None
          print("ORIGINAL_LANDSAT_SOURCE_QA_OFFLINE_PRECHECK=PASS")
          PY
      - name: Reconstruct original 661 census and 197 static mapped vegetation sources
        run: python research/climate-penguin/nonmaxent_sdm/build_source_panels.py
      - name: Reconstruct frozen 63 observed count rows and 25 source site coords
        run: python research/climate-penguin/nonmaxent_sdm/audit_joint_ice_vegetation_support.py
      - name: Retrieve original Landsat8 USGS C2 L2 STAC and QA-gated red and NIR source pixels
        run: python research/climate-penguin/nonmaxent_sdm/acquire_original_landsat8_seasonal_spectra.py
      - name: Archive source receipts, fixed geographic grid and annual NDVI coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: penguin-25site-original-Landsat8-source-spectral-2017to2020
          compression-level: 6
          path: |
            research/climate-penguin/nonmaxent_sdm/landsat_original_outputs/*.json
            research/climate-penguin/nonmaxent_sdm/landsat_original_outputs/*.csv
            research/climate-penguin/nonmaxent_sdm/joint_support_outputs/joint_support.json
          if-no-files-found: warn
