name: penguin-2026-original-emperor-movement-observations-v1
on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - "research/climate-penguin/work/macdonald2026_true_emperor_movement_v1/**"
      - "research/climate-penguin/outputs/macdonald2026_true_emperor_movement_v1/**"
      - ".github/workflows/penguin-2026-original-emperor-movement-observations-v1.yml"
  pull_request:
    paths:
      - "research/climate-penguin/work/macdonald2026_true_emperor_movement_v1/**"
      - "research/climate-penguin/outputs/macdonald2026_true_emperor_movement_v1/**"
      - ".github/workflows/penguin-2026-original-emperor-movement-observations-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-published-2017-2024-colony-shapefile-geometries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download published three-colony 2017-2024 tracking source with SHA receipt
        run: python research/climate-penguin/work/macdonald2026_true_emperor_movement_v1/probe.py
      - name: Decode every original shapefile's geometry and observation date
        run: python research/climate-penguin/work/macdonald2026_true_emperor_movement_v1/inspect.py
      - name: Quantify original dated emperor MultiPoint group-centroid displacement with seasonal matching
        run: python research/climate-penguin/work/macdonald2026_true_emperor_movement_v1/movement_metrics.py --check-receipt
      - name: Archive external source, geometry evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emperor-2026-three-colony-original-track-geometry-v1
          path: |
            research/climate-penguin/outputs/macdonald2026_true_emperor_movement_v1/*.zip
            research/climate-penguin/outputs/macdonald2026_true_emperor_movement_v1/*.json
            research/climate-penguin/outputs/macdonald2026_true_emperor_movement_v1/*.csv
          if-no-files-found: warn
          retention-days: 30
