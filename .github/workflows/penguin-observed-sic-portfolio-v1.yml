name: penguin-observed-seaice-covariance-portfolio-v1
on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - "research/climate-penguin/work/seaice_covariance_portfolio_v1/**"
      - "research/climate-penguin/outputs/seaice_covariance_portfolio_v1/**"
      - ".github/workflows/penguin-observed-sic-portfolio-v1.yml"
  pull_request:
    paths:
      - "research/climate-penguin/work/seaice_covariance_portfolio_v1/**"
      - "research/climate-penguin/outputs/seaice_covariance_portfolio_v1/**"
      - ".github/workflows/penguin-observed-sic-portfolio-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-verified-39-site-observed-climate-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recompute 39 site count-weighted observed SIC covariance and pinned receipt
        run: node research/climate-penguin/work/seaice_covariance_portfolio_v1/build.mjs --check-receipt
      - name: Save all original source annual observations and climate-portfolio comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: penguin-observed-sic-portfolio-v1
          path: |
            research/climate-penguin/outputs/seaice_covariance_portfolio_v1/*.csv
            research/climate-penguin/outputs/seaice_covariance_portfolio_v1/*.json
          if-no-files-found: error
          retention-days: 60
