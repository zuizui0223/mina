name: Antarctic BAS original ten multi-island nest point sources V20
on:
  push:
    branches: [research/antarctic-functional-archipelago-v1]
    paths:
      - 'contracts/BAS_HART_ORIGINAL_NEST_POINT_SPATIAL_TEST_V20_V21.md'
      - 'scripts/validate_bas_hart_original_multiisland_nest_points_v20.py'
      - 'tests/test_bas_hart_original_multiisland_nest_points_v20.py'
      - '.github/workflows/antarctic-bas-original-nest-points-v20.yml'
  pull_request:
    paths:
      - 'contracts/BAS_HART_ORIGINAL_NEST_POINT_SPATIAL_TEST_V20_V21.md'
      - 'scripts/validate_bas_hart_original_multiisland_nest_points_v20.py'
      - 'tests/test_bas_hart_original_multiisland_nest_points_v20.py'
      - '.github/workflows/antarctic-bas-original-nest-points-v20.yml'
  workflow_dispatch:
jobs:
  original_10_species_source_files:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install publisher source and coordinate validation dependencies
        run: python -m pip install requests numpy pyproj pytest
      - name: Test source-frozen nest CSV selection and coordinate uniqueness
        run: python -m pytest -q tests/test_bas_hart_original_multiisland_nest_points_v20.py
      - name: Retrieve the exact successful full original BAS file manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/bas-v16
          gh run download 40261490725 --repo "$GITHUB_REPOSITORY" \
            --name bas-hart-original-all-locality-source-manifest-v16 \
            --dir /tmp/bas-v16
      - name: Fetch ten actual species nest CSVs and validate original count and coordinates
        run: |
          python scripts/validate_bas_hart_original_multiisland_nest_points_v20.py \
            --v16 /tmp/bas-v16/BAS_HART_ALL_ISLANDS_ORIGINAL_MANIFEST_V16.json \
            --v18 results/BAS_HART_2019_20_ORIGINAL_SITE_NEST_LEDGER_V18.json \
            --out /tmp/BAS_HART_ORIGINAL_10_FILE_POINT_QA_V20.json \
            --point-cache /tmp/BAS_HART_4_LOCALITIES_UTM_NESTS_V20.npz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bas-original-four-locality-species-nestpoints-v20
          path: |
            /tmp/BAS_HART_ORIGINAL_10_FILE_POINT_QA_V20.json
            /tmp/BAS_HART_4_LOCALITIES_UTM_NESTS_V20.npz
          if-no-files-found: warn
