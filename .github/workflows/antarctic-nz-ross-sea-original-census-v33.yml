name: Antarctic V33 independent NZ Ross Sea 39-colony original 2026 census support
on:
  push:
    branches: [research/antarctic-penguin-island-macro-v1]
    paths:
      - 'contracts/NZ_ROSS_SEA_AERIAL_CENSUS_SOURCE_V33.md'
      - 'scripts/audit_nz_ross_sea_census_source_v33.py'
      - 'tests/test_nz_ross_sea_census_source_v33.py'
      - '.github/workflows/antarctic-nz-ross-sea-original-census-v33.yml'
  pull_request:
    paths:
      - 'contracts/NZ_ROSS_SEA_AERIAL_CENSUS_SOURCE_V33.md'
      - 'scripts/audit_nz_ross_sea_census_source_v33.py'
      - 'tests/test_nz_ross_sea_census_source_v33.py'
      - '.github/workflows/antarctic-nz-ross-sea-original-census-v33.yml'
  workflow_dispatch:
jobs:
  authentic_NZ_2026_Ross_Sea_39_colonies:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install trusted CKAN retrieval and synthetic fixture test tools
        run: python -m pip install pytest requests
      - name: Verify census orientations, source gaps, and original metadata-only numerical redaction
        run: python -m pytest -q tests/test_nz_ross_sea_census_source_v33.py
      - name: Retrieve 2026 publisher CKAN original 39-colony, colony geography and method resources
        run: python scripts/audit_nz_ross_sea_census_source_v33.py --json /tmp/NZ_ROSS_SEA_2026_ORIGINAL_39_COLONY_SOURCE_V33.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-NZ-RossSea-2026-39-colony-source-year-coverage-v33
          path: /tmp/NZ_ROSS_SEA_2026_ORIGINAL_39_COLONY_SOURCE_V33.json
