name: Zavodovski V13 expected historical-label HOLD
on:
  pull_request:
    paths:
      - 'scripts/compare_zavodovski_lynch2011_digitizations_v13.py'
      - 'tests/test_zavodovski_lynch2011_digitizations_v13.py'
      - '.github/workflows/zavodovski-lynch2011-map-robustness-v13.yml'
  push:
    branches: [research/zavodovski-site-exchange-v1]
    paths:
      - 'scripts/compare_zavodovski_lynch2011_digitizations_v13.py'
      - 'tests/test_zavodovski_lynch2011_digitizations_v13.py'
      - '.github/workflows/zavodovski-lynch2011-map-robustness-v13.yml'
  workflow_dispatch:
jobs:
  expected-scientific-hold:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest requests shapely pyshp pyproj
      - name: Synthetic test of original V13 algorithm
        run: python -m pytest -q tests/test_zavodovski_lynch2011_digitizations_v13.py
      - name: Require original V13 fail-closed HOLD for real 2011 mixed species labels
        run: |
          set +e
          python scripts/compare_zavodovski_lynch2011_digitizations_v13.py \
            --out /tmp/zavodovski_historical_2011_map_v13.json
          exit_code=$?
          set -e
          python - <<'PY'
          import json
          with open('/tmp/zavodovski_historical_2011_map_v13.json') as f:
              r = json.load(f)
          assert r["status"] == "HOLD_SOURCE_LABEL_OR_GEOMETRY_GATE", r
          assert "LABEL_STOP non-CPE/MPE species codes" in r["error"], r
          assert r["historic_2011_rows_opened"] == 0, r
          print("EXPECTED SCIENTIFIC HOLD verified; do not interpret as an alternative map result.")
          PY
          test "$exit_code" -eq 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zavodovski-v13-expected-source-hold
          path: /tmp/zavodovski_historical_2011_map_v13.json
