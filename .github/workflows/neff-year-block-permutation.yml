name: neff-year-block-permutation

on:
  push:
    branches:
      - validation/neff-year-block-permutation-v1
    paths:
      - "contracts/PALMER_NEFF_YEAR_BLOCK_PERMUTATION_V1.json"
      - "src/mina/neff_permutation.py"
      - "tests/test_neff_permutation.py"
      - ".github/workflows/neff-year-block-permutation.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "contracts/PALMER_NEFF_YEAR_BLOCK_PERMUTATION_V1.json"
      - "src/mina/neff_permutation.py"
      - "tests/test_neff_permutation.py"
      - ".github/workflows/neff-year-block-permutation.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Fetch frozen Palmer census
        run: python scripts/fetch_lter_census.py build/adelie_census.csv
      - name: Run frozen N_eff year-block permutation
        run: |
          mina-neff-permutation \
            --census build/adelie_census.csv \
            --out build/neff_year_block_permutation.json \
            --permutations 20000 \
            --seed 20260927
      - name: Print diagnostic
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("build/neff_year_block_permutation.json").read_text())
          print("observed=",json.dumps(x["observed"],indent=2,sort_keys=True))
          print("strata=",json.dumps(x["strata"],indent=2,sort_keys=True))
          print("gain_null=",json.dumps(x["gain_null"],indent=2,sort_keys=True))
          print("coefficient_null=",json.dumps(x["coefficient_null"],indent=2,sort_keys=True))
          print("decision=",x["decision"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: neff-year-block-permutation
          path: build/neff_year_block_permutation.json
