name: Zavodovski 2011 historical mixed-species DBF audit V14
on:
  pull_request:
    paths:
      - 'scripts/audit_zavodovski_lynch2011_categories_v14.py'
      - 'tests/test_zavodovski_lynch2011_categories_v14.py'
      - '.github/workflows/zavodovski-lynch2011-labels-v14.yml'
  push:
    branches: [research/zavodovski-site-exchange-v1]
    paths:
      - 'scripts/audit_zavodovski_lynch2011_categories_v14.py'
      - 'tests/test_zavodovski_lynch2011_categories_v14.py'
      - '.github/workflows/zavodovski-lynch2011-labels-v14.yml'
jobs:
  category-only:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest requests
      - run: python -m pytest -q tests/test_zavodovski_lynch2011_categories_v14.py
      - run: python scripts/audit_zavodovski_lynch2011_categories_v14.py --out /tmp/lynch2011_classes_v14.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zavodovski-original-2011-categories-v14
          path: /tmp/lynch2011_classes_v14.json
