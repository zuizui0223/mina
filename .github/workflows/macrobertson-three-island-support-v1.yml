name: MacRobertson three-island support package v1

on:
  pull_request:
    paths:
      - "contracts/MACROBERTSON_THREE_ISLAND_RECOVERY_ALLOCATION_V1.md"
      - ".github/workflows/macrobertson-three-island-support-v1.yml"
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download AADC three-island occupied-nest workbook
        run: |
          mkdir -p build
          curl -A 'Mozilla/5.0' -L --fail --retry 10 --retry-delay 5 --retry-all-errors             'https://data.aad.gov.au/eds/1103/download'             -o build/macrobertson_three_island_counts.xlsx
          file build/macrobertson_three_island_counts.xlsx
          ls -lh build/macrobertson_three_island_counts.xlsx
      - uses: actions/upload-artifact@v4
        with:
          name: macrobertson-three-island-support-v1
          path: build/macrobertson_three_island_counts.xlsx
