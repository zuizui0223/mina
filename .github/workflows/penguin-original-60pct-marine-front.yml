name: Penguin original OSI SAF 60 percent marine front versus observed nest reweighting
on:
  pull_request:
    paths:
      - 'research/climate-penguin/macro_panantarctic_v1/compute_original_60pct_marine_front.py'
      - 'research/climate-penguin/macro_panantarctic_v1/test_original_60pct_marine_front.py'
      - 'research/climate-penguin/macro_panantarctic_v1/ICE_EDGE_GRIDDED_SOURCE_CONTRACT_20261110.md'
      - '.github/workflows/penguin-original-60pct-marine-front.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-120-publisher-month-ice-isocontour:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native grid, coast and geometry readers
        run: python -m pip install --disable-pip-version-check numpy scipy xarray netCDF4 scikit-image pyproj==3.7.1
      - name: Unit-test 60 percent real contour geometry and missingness without source data
        run: |
          python -m py_compile research/climate-penguin/macro_panantarctic_v1/compute_original_60pct_marine_front.py
          python research/climate-penguin/macro_panantarctic_v1/test_original_60pct_marine_front.py -v
      - name: Rebuild same exact 595 source colony site IDs
        run: python research/climate-penguin/macro_panantarctic_v1/build.py
      - name: Reuse previously verified full 595 site-month SIC, native pixel membership, and 120 original publisher SHA receipts
        uses: actions/download-artifact@v4
        with:
          name: penguin-panantarctic-595site-original-1991-2020-monthly-ice
          run-id: 42612067836
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/original_full_ice
      - name: Reuse last exact original 1990s to 2010s matched observed site and species panel
        uses: actions/download-artifact@v4
        with:
          name: penguin-original-595-colony-decadal-reweighting-v1
          run-id: 42788030834
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/original_decadal_reweighting
      - name: Verify all 120 official NetCDF SHAs and calculate decadal 60 percent front, 10-degree sectors, and strict biological overlap
        run: |
          python research/climate-penguin/macro_panantarctic_v1/compute_original_60pct_marine_front.py \
            --prior-ice build/original_full_ice/ice_595_outputs \
            --prior-matched build/original_decadal_reweighting/observed_balanced_site_pair_rows.csv \
            --atlas research/climate-penguin/macro_panantarctic_v1/outputs/panantarctic_595_site_inventory.csv \
            --output research/climate-penguin/macro_panantarctic_v1/ice_front_60pct_outputs
      - name: Archive original publisher field SHA, physically supported iso-contours and biological overlap audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: penguin-original-60pct-isocontour-three-decade-macro-v1
          path: research/climate-penguin/macro_panantarctic_v1/ice_front_60pct_outputs/*.json
          if-no-files-found: warn
      - name: Archive detailed actual sector and colony overlap tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: penguin-original-60pct-isocontour-three-decade-tables-v1
          path: research/climate-penguin/macro_panantarctic_v1/ice_front_60pct_outputs/*.csv
          if-no-files-found: warn
