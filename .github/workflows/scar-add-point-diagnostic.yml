name: scar-add-point-diagnostic
on:
  push:
    branches: [analysis/scar-add-point-diagnostic-v1]
    paths:
      - "scripts/diagnose_scar_add_points.py"
      - ".github/workflows/scar-add-point-diagnostic.yml"
  pull_request:
    paths:
      - "scripts/diagnose_scar_add_points.py"
      - ".github/workflows/scar-add-point-diagnostic.yml"
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install requests
      - run: python scripts/diagnose_scar_add_points.py --out build/scar_add_point_diagnostic_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: scar-add-point-diagnostic-v1
          path: build/scar_add_point_diagnostic_v1.json
