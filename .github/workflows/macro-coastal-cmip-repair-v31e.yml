name: V31e diagnosed native coordinate repair
on:
  push:
    branches: [analysis/pygoscelis-count-functional-sensitivity-20261126]
    paths: ['.github/workflows/macro-coastal-cmip-repair-v31e.yml']
permissions:
  contents: read
  actions: read
jobs:
  repair:
    strategy:
      fail-fast: false
      matrix:
        task: [ACCESS, CESM-diagnosis]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.5 pandas==2.2.3 xarray==2025.6.1 fsspec==2026.9.0 zarr==2.18.7 'numcodecs<0.16' cftime==1.6.6.1 pyproj==3.8.0 scipy 'aiohttp>=3.10,<4'
      - name: Execute bounded repair and coordinate diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ matrix.task }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15250056990/zip" > gate.zip
          if [ "$TASK" = ACCESS ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15169338322/zip" > frame.zip
            python research/macro_marine_land_footprint_v1/cmip_native_access_v31e.py gate.zip frame.zip result ACCESS-CM2
          else
            python research/macro_marine_land_footprint_v1/cmip_grid_diagnosis_v31e.py gate.zip result
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro-cmip-v31e-${{ matrix.task }}
          path: result/
          retention-days: 30
          if-no-files-found: warn
