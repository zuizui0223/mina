name: Penguin observed decadal redistribution and SIC decomposition
on:
  pull_request:
    paths:
      - 'research/climate-penguin/macro_panantarctic_v1/analyze_decadal_fixed_network_reweighting.py'
      - 'research/climate-penguin/macro_panantarctic_v1/test_decadal_fixed_network_reweighting.py'
      - 'research/climate-penguin/macro_panantarctic_v1/DECADAL_FIXED_NETWORK_REWEIGHTING_CONTRACT_20261110.md'
      - '.github/workflows/penguin-decadal-fixed-network-reweighting.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-fixed-roster-decade-redistribution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source geography projection
        run: python -m pip install --disable-pip-version-check pyproj==3.7.1
      - name: Test arithmetic identity and syntax
        run: |
          python -m py_compile research/climate-penguin/macro_panantarctic_v1/build.py
          python -m py_compile research/climate-penguin/macro_panantarctic_v1/analyze_decadal_fixed_network_reweighting.py
          python research/climate-penguin/macro_panantarctic_v1/test_decadal_fixed_network_reweighting.py -v
      - name: Rebuild all original 595 colony and source count records
        run: python research/climate-penguin/macro_panantarctic_v1/build.py
      - name: Reuse verified complete 30-year OSI SAF 595 colony SIC source
        uses: actions/download-artifact@v4
        with:
          name: penguin-panantarctic-595site-original-1991-2020-monthly-ice
          run-id: 42612067836
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/original_595_30year_ice
      - name: Calculate fixed-site decadal nesting redistribution and exact two-factor decomposition
        run: |
          python research/climate-penguin/macro_panantarctic_v1/analyze_decadal_fixed_network_reweighting.py \
            --census research/climate-penguin/macro_panantarctic_v1/outputs/source_observed_2456.csv \
            --atlas research/climate-penguin/macro_panantarctic_v1/outputs/panantarctic_595_site_inventory.csv \
            --ice build/original_595_30year_ice/ice_595_outputs/original_595_site_months_120_source_QA.csv \
            --ice-summary build/original_595_30year_ice/ice_595_outputs/original_595_native_monthly_SIC_30year_summary.json \
            --output research/climate-penguin/macro_panantarctic_v1/decade_reweighting_outputs
      - name: Archive full source-matched pairs, original decade support and decomposition receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: penguin-original-595-colony-decadal-reweighting-v1
          path: research/climate-penguin/macro_panantarctic_v1/decade_reweighting_outputs/
          if-no-files-found: warn
