name: paper3-sar-2024-within-season-validation

on:
  push:
    branches: [research/emperor-mobile-islands-v1]
    paths:
      - "contracts/PAPER3_SAR_2024_WITHIN_SEASON_VALIDATION_V1.json"
      - "scripts/run_paper3_sar_2024_validation.py"
      - "tests/test_paper3_sar_2024_validation.py"
      - ".github/workflows/paper3-sar-2024-within-season-validation.yml"
  pull_request:
    paths:
      - "contracts/PAPER3_SAR_2024_WITHIN_SEASON_VALIDATION_V1.json"
      - "scripts/run_paper3_sar_2024_validation.py"
      - "tests/test_paper3_sar_2024_validation.py"
      - ".github/workflows/paper3-sar-2024-within-season-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy pyproj
      - run: python -m unittest tests.test_paper3_sar_2024_validation -v
      - name: Fetch pinned independent SAR source
        run: |
          git clone --quiet https://github.com/mla150/SAR-Emperor.git build/SAR-Emperor
          git -C build/SAR-Emperor checkout --quiet dfce78ba83f7878a2697c5e12fdd15d0acd75519
          test -f build/SAR-Emperor/sar_huddles_20250502.csv
      - name: Run frozen within-season aliasing validation
        run: |
          mkdir -p build/out
          python scripts/run_paper3_sar_2024_validation.py \
            --raw-csv build/SAR-Emperor/sar_huddles_20250502.csv \
            --out-json build/out/PAPER3_SAR_2024_WITHIN_SEASON_VALIDATION_RESULT_V1.json \
            --out-standardized-csv build/out/PAPER3_SAR_2024_STANDARDIZED_V1.csv \
            --out-dates-csv build/out/PAPER3_SAR_2024_DATE_STATES_V1.csv
      - uses: actions/upload-artifact@v4
        with:
          name: paper3-sar-2024-within-season-validation-v1
          path: build/out/*
