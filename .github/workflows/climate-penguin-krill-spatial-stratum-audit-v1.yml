name: climate-penguin-krill-spatial-stratum-audit-v1

on:
  workflow_dispatch:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - "research/climate-penguin/work/climate_penguin/krill_spatial_stratum_consistency_v1.py"
      - "tests/test_krill_spatial_stratum_consistency_v1.py"
      - ".github/workflows/climate-penguin-krill-spatial-stratum-audit-v1.yml"

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install rasterio pandas lxml html5lib beautifulsoup4
      - name: Verify source-only logical tests
        run: python -m unittest discover -s tests -p test_krill_spatial_stratum_consistency_v1.py -v
      - name: Retrieve original BAS spatial-GAM and three species' original stage records
        run: |
          mkdir -p build/bas_spatial_krill build/signy_source
          curl -L --fail --retry 4 --retry-delay 5 --max-time 180 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=4fd0a1bf-da1a-4021-82eb-2fc513910e32&output=zip.tree' -o build/bas_spatial_krill/source.zip
          curl -L --fail --retry 4 --retry-delay 5 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=daf2c4fd-c1e3-4e65-851f-d11f02c5b69d&output=zip.tree' -o build/signy_source/adelie.zip
          curl -L --fail --retry 4 --retry-delay 5 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=d0633a9b-8c56-4ae5-88bf-6ec6ba9017b9&output=zip.tree' -o build/signy_source/chinstrap.zip
          curl -L --fail --retry 4 --retry-delay 5 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=883c6b40-024e-41e8-9c3e-2668a44b5751&output=zip.tree' -o build/signy_source/gentoo.zip
      - name: Rebuild all original publisher records and 90 spatial predictions
        run: |
          python research/climate-penguin/work/climate_penguin/signy_trispecies_stage_source_v1.py \
            --source-dir build/signy_source --out build/signy_stage_derived
          python research/climate-penguin/work/climate_penguin/bas_spatial_krill_signy_v2.py \
            --source-zip build/bas_spatial_krill/source.zip --stage-dir build/signy_stage_derived --out build/bas_spatial_krill/breeding_result
      - name: Test 2013 source missingness and non-equivalent geography
        run: |
          python research/climate-penguin/work/climate_penguin/krill_spatial_stratum_consistency_v1.py \
            --band-csv build/bas_spatial_krill/breeding_result/annual_spatial_bands.csv \
            --stage-annual build/signy_stage_derived/species_annual_stage_summary.csv \
            --out build/krill_stratum_consistency --check
          python -m unittest discover -s tests -p test_krill_spatial_stratum_consistency_v1.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: krill-spatial-vs-acoustic-stratum-consistency-v1
          path: |
            build/krill_stratum_consistency/decision.json
            build/krill_stratum_consistency/source_modelled_krill_years.csv
            build/krill_stratum_consistency/stratum_spatial_consistency.csv
            build/krill_stratum_consistency/native_fledgling_stage_overlap.csv
