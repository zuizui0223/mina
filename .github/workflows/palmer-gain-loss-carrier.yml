name: palmer-gain-loss-carrier

on:
  push:
    branches:
      - analysis/palmer-gain-loss-carrier-v1
    paths:
      - "src/mina/gain_loss_carrier.py"
      - "tests/test_gain_loss_carrier.py"
      - "contracts/PALMER_GAIN_LOSS_CARRIER_V1.json"
      - "src/mina/performance_redistribution_lags.py"
      - "src/mina/performance_memory.py"
      - "scripts/fetch_lter_census.py"
      - "scripts/fetch_lter_chick_counts.py"
      - ".github/workflows/palmer-gain-loss-carrier.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Run frozen tests
        run: pytest -q tests/test_gain_loss_carrier.py
      - name: Fetch frozen Palmer sources
        run: |
          python scripts/fetch_lter_census.py build/adelie_census.csv
          python scripts/fetch_lter_chick_counts.py build/adelie_chicks.csv
      - name: Run frozen gain-loss carrier analysis
        run: |
          python -m mina.gain_loss_carrier \
            --adult-census build/adelie_census.csv \
            --chicks build/adelie_chicks.csv \
            --out build/gain_loss_carrier.json \
            --permutations 100000
      - name: Print receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("build/gain_loss_carrier.json").read_text())
          p=x["primary"]
          print("source_counts=",x["source_counts"])
          print("gain=",p["gain"])
          print("avoid=",p["loss_avoidance"])
          print("lplus=",p["net_addition_lower_bound"])
          print("decision=",p["decision"])
          for name in (
              "exclude_litchfield",
              "minimum_prior_size_2",
              "alternate_logratio_performance",
          ):
              v=x["sensitivities"][name]
              print(
                  name,
                  "gain=",v["gain"]["coefficient"],
                  "gain_p=",v["gain"]["one_sided_upper_p"],
                  "gain_holm=",v["gain"]["holm_p"],
                  "avoid=",v["loss_avoidance"]["coefficient"],
                  "avoid_p=",v["loss_avoidance"]["one_sided_upper_p"],
                  "avoid_holm=",v["loss_avoidance"]["holm_p"],
                  "pattern=",v["decision"]["pattern"],
              )
          print("loo=",json.dumps(
              x["sensitivities"]["leave_one_island_out_observed"],
              sort_keys=True
          ))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: palmer-gain-loss-carrier
          path: |
            build/adelie_census.csv
            build/adelie_chicks.csv
            build/gain_loss_carrier.json
