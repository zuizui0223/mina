name: signy-seal-spatial-pressure-v1
on:
  push:
    branches: [analysis/signy-seal-spatial-pressure-20261124]
    paths:
      - 'research/signy_seal_spatial_pressure_v1/**'
      - '.github/workflows/signy-seal-spatial-pressure-v1.yml'
  pull_request:
    paths:
      - 'research/signy_seal_spatial_pressure_v1/**'
      - '.github/workflows/signy-seal-spatial-pressure-v1.yml'
permissions:
  contents: read
jobs:
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python research/signy_seal_spatial_pressure_v1/analyze.py --selftest
      - name: Fetch pinned BAS original and compute fixed descriptive panel
        run: |
          mkdir -p build/signy_seal_spatial
          curl -fLSs --retry 2 --connect-timeout 20 --max-time 120 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=8e910ac8-6f52-4548-bbcb-78474b559294&output=zip.tree' -o build/signy_seal_spatial/source.zip
          python research/signy_seal_spatial_pressure_v1/analyze.py --source build/signy_seal_spatial/source.zip --out build/signy_seal_spatial/output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signy-seal-spatial-pressure-v1
          path: build/signy_seal_spatial/output/
          if-no-files-found: warn
          retention-days: 60
