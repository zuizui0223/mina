name: signy-matched-summer-space-v1
on:
  push:
    branches: [analysis/signy-seal-spatial-pressure-20261124]
    paths:
      - 'research/signy_seal_spatial_pressure_v1/matched_summer.py'
      - '.github/workflows/signy-matched-summer-space-v1.yml'
  pull_request:
    paths:
      - 'research/signy_seal_spatial_pressure_v1/matched_summer.py'
      - '.github/workflows/signy-matched-summer-space-v1.yml'
permissions:
  contents: read
jobs:
  fixed-summer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas requests
      - run: python research/signy_seal_spatial_pressure_v1/matched_summer.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signy-matched-summer-space-v1
          path: build/signy_matched_summer/result.json
          if-no-files-found: error
          retention-days: 60
