name: ecology-report-submission-bundle

on:
  push:
    branches:
      - submission/ecology-final-positioning-v1
      - submission/ecology-abstract-clarity-fix-v1
      - submission/ecology-final-limitations-v1
    paths:
      - "submission/MANUSCRIPT_ECOLOGY_REPORT_V0_5.md"
      - "submission/COVER_LETTER_ECOLOGY_REPORT_V3.md"
      - "submission/ECOLOGY_SUBMISSION_COPY_FIELDS_V2.md"
      - "submission/ECOLOGY_REPORT_SUBMISSION_MANIFEST_V1.md"
      - "submission/ECOLOGY_METADATA_TEMPLATE.json"
      - "submission/FIGURE_CAPTIONS_ECOLOGY_REPORT_V0_4.md"
      - "submission/SUPPLEMENT_ECOLOGY_REPORT_V0_4.md"
      - "scripts/build_ecology_submission_docx.py"
      - "scripts/build_replicated_concentration_figure_data.py"
      - "scripts/plot_replicated_concentration_figures.py"
      - "docs/REFERENCES_V6.bib"
      - ".github/workflows/ecology-report-submission-bundle.yml"
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,submission]" pandas matplotlib lxml html5lib beautifulsoup4
      - name: Install pandoc
        run: |
          if ! command -v pandoc >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y pandoc
          fi
      - name: Fetch frozen public sources
        run: |
          mkdir -p build/raw build/figure_data build/figures build/submission_bundle
          python scripts/fetch_lter_census.py build/raw/adelie_census.csv
          curl -L --fail --retry 4 --retry-delay 5             'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=daf2c4fd-c1e3-4e65-851f-d11f02c5b69d&output=zip.tree'             -o build/raw/signy_adelie.zip
          curl -L --fail --retry 4 --retry-delay 5             'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=d0633a9b-8c56-4ae5-88bf-6ec6ba9017b9&output=zip.tree'             -o build/raw/signy_chinstrap.zip
      - name: Rebuild source-checked figures
        run: |
          python -m scripts.build_replicated_concentration_figure_data             --palmer-census build/raw/adelie_census.csv             --signy-adelie-zip build/raw/signy_adelie.zip             --signy-chinstrap-zip build/raw/signy_chinstrap.zip             --palmer-receipt results/PALMER_BREEDING_PATCH_CONCENTRATION_RESULT_V1.json             --signy-adelie-receipt results/SIGNY_BREEDING_PATCH_CONCENTRATION_RESULT_V1.json             --signy-chinstrap-receipt results/SIGNY_CHINSTRAP_BREEDING_PATCH_CONCENTRATION_RESULT_V1.json             --dominance-receipt results/CONCENTRATION_DOMINANCE_DESCRIPTIVE_SUMMARY_V1.json             --out-dir build/figure_data
          python -m scripts.plot_replicated_concentration_figures             --data-dir build/figure_data             --out-dir build/figures
      - name: Build public Word review preview
        run: |
          python scripts/build_ecology_submission_docx.py             --manuscript submission/MANUSCRIPT_ECOLOGY_REPORT_V0_5.md             --bibliography docs/REFERENCES_V6.bib             --captions submission/FIGURE_CAPTIONS_ECOLOGY_REPORT_V0_4.md             --out build/submission_bundle/Ecology_Report_v0_5_SUBMISSION_PREVIEW.docx
      - name: Audit public metadata template
        run: |
          python -m mina.ecosphere_submission_metadata             --metadata submission/ECOLOGY_METADATA_TEMPLATE.json             --out build/submission_bundle/ECOLOGY_METADATA_TEMPLATE_AUDIT.json
      - name: Assemble canonical review bundle
        run: |
          cp build/figures/figure1_replicated_trajectories.pdf build/submission_bundle/
          cp build/figures/figure2_cross_population_summary.pdf build/submission_bundle/
          cp build/figures/figureS1_nominal_dominance_routes.pdf build/submission_bundle/
          cp submission/COVER_LETTER_ECOLOGY_REPORT_V3.md build/submission_bundle/
          cp submission/ECOLOGY_SUBMISSION_COPY_FIELDS_V2.md build/submission_bundle/
          cp submission/ECOLOGY_REPORT_SUBMISSION_MANIFEST_V1.md build/submission_bundle/
          cp submission/ECOLOGY_METADATA_TEMPLATE.json build/submission_bundle/
          cp submission/SUPPLEMENT_ECOLOGY_REPORT_V0_4.md build/submission_bundle/
          cp build/figure_data/FIGURE_DATA_RECEIPT_V1.json build/submission_bundle/
      - name: Bundle audit
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              "Ecology_Report_v0_5_SUBMISSION_PREVIEW.docx",
              "figure1_replicated_trajectories.pdf",
              "figure2_cross_population_summary.pdf",
              "figureS1_nominal_dominance_routes.pdf",
              "COVER_LETTER_ECOLOGY_REPORT_V3.md",
              "ECOLOGY_SUBMISSION_COPY_FIELDS_V2.md",
              "ECOLOGY_REPORT_SUBMISSION_MANIFEST_V1.md",
              "ECOLOGY_METADATA_TEMPLATE.json",
              "ECOLOGY_METADATA_TEMPLATE_AUDIT.json",
              "FIGURE_DATA_RECEIPT_V1.json",
          ]
          root=Path("build/submission_bundle")
          missing=[name for name in required if not (root/name).exists()]
          assert not missing, missing
          print("bundle_audit=PASS")
          for name in required:
              print(name, (root/name).stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ecology-report-v0-5-review-bundle
          path: build/submission_bundle/*
