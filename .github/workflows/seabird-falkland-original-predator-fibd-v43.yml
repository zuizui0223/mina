name: FIG V43 native Falkland island mammal status x survey visits ORIGINAL source-only QA

on:
  push:
    branches: [research/jncc-v32-mechanism-contract]
    paths:
      - 'contracts/ISLAND_PREDATOR_FALKLAND_FIBD_V43_SOURCE_GATE.md'
      - 'scripts/audit_falkland_fibd_original_predator_v43.py'
      - 'tests/test_falkland_fibd_original_predator_v43.py'
      - '.github/workflows/seabird-falkland-original-predator-fibd-v43.yml'
  pull_request:
    paths:
      - 'contracts/ISLAND_PREDATOR_FALKLAND_FIBD_V43_SOURCE_GATE.md'
      - 'scripts/audit_falkland_fibd_original_predator_v43.py'
      - 'tests/test_falkland_fibd_original_predator_v43.py'
      - '.github/workflows/seabird-falkland-original-predator-fibd-v43.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original_FIG_source_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded FIG CKAN original-source XLS reader
        run: python -m pip install requests xlrd xlwt pytest
      - name: Verify first-party licence, public-data access, source identifiers, uncertain absence semantics
        run: python -m pytest -q tests/test_falkland_fibd_original_predator_v43.py
      - name: Read five first-party public FIBD invasive-mammal, island-geography, visit, eradication and bird XLS SCHEMAS ONLY
        run: |
          python scripts/audit_falkland_fibd_original_predator_v43.py \
            --out /tmp/FIBD_V43_ORIGINAL_MAMMAL_VISIT_LOCATION_SOURCE_QA.json
      - name: Store SHA-backed original metadata and non-personal source status
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: falkland-v43-original-island-predator-FIBD-public-source-schemas-no-bird-effects
          path: /tmp/FIBD_V43_ORIGINAL_MAMMAL_VISIT_LOCATION_SOURCE_QA.json
          if-no-files-found: warn
