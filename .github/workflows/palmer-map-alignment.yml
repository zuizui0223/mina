name: palmer-map-alignment
on:
  push:
    branches: ['codex/climate-penguin-progress']
    paths:
      - 'research/climate-penguin/work/abandonment/litchfield_map_alignment.py'
      - 'tests/test_litchfield_map_alignment.py'
      - '.github/workflows/palmer-map-alignment.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-map-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 PyMuPDF==1.26.7 pyproj==3.7.2 shapely==2.1.2 pytest==9.0.2
      - run: python -m pytest -q tests/test_litchfield_map_alignment.py tests/test_palmer_footprint_source_recovery.py
      - uses: actions/download-artifact@v4
        with:
          name: palmer-footprint-original-maps
          run-id: 40872056244
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/original-maps
      - name: Extract map-derived candidates and diagnose original probe positions
        run: |
          python research/climate-penguin/work/abandonment/litchfield_map_alignment.py \
            --pdf /tmp/original-maps/era_litchfield_v3.pdf --out /tmp/map-alignment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: litchfield-original-map-alignment
          path: /tmp/map-alignment/
          if-no-files-found: error
          retention-days: 30
