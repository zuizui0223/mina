name: ecosphere-manuscript-check

on:
  push:
    branches:
      - manuscript/ecosphere-reframe-v0.4
    paths:
      - "docs/MANUSCRIPT_ECOSPHERE_V0_4.md"
      - "docs/FIGURE_CAPTIONS_V3.md"
      - "docs/REFERENCES_V3.bib"
      - "docs/JOURNAL_FIT_V2.md"
      - "contracts/PALMER_ECOSPHERE_MANUSCRIPT_V0_4.json"
      - "src/mina/synthesis.py"
      - "src/mina/figure_data.py"
      - "src/mina/figures.py"
      - "tests/test_manuscript_guard.py"
      - "tests/test_synthesis.py"
      - "tests/test_figure_data.py"
      - ".github/workflows/ecosphere-manuscript-check.yml"
  pull_request:
    paths:
      - "docs/MANUSCRIPT_ECOSPHERE_V0_4.md"
      - "docs/FIGURE_CAPTIONS_V3.md"
      - "docs/REFERENCES_V3.bib"
      - "docs/JOURNAL_FIT_V2.md"
      - "contracts/PALMER_ECOSPHERE_MANUSCRIPT_V0_4.json"
      - "src/mina/synthesis.py"
      - "src/mina/figure_data.py"
      - "src/mina/figures.py"
      - "tests/test_manuscript_guard.py"
      - "tests/test_synthesis.py"
      - "tests/test_figure_data.py"
      - ".github/workflows/ecosphere-manuscript-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,figures]"
      - name: Run test suite
        run: pytest
      - name: Guard Ecosphere manuscript
        run: |
          mina-manuscript-guard \
            --manuscript docs/MANUSCRIPT_ECOSPHERE_V0_4.md \
            --captions docs/FIGURE_CAPTIONS_V3.md \
            --bibliography docs/REFERENCES_V3.bib \
            --results results | tee build-ecosphere-manuscript-check.json
      - name: Build synthesis v3
        run: |
          mina-synthesis \
            --results results \
            --out-json build/synthesis-v3.json \
            --out-md build/synthesis-v3.md
      - uses: actions/upload-artifact@v4
        with:
          name: ecosphere-v0-4-check
          path: |
            docs/MANUSCRIPT_ECOSPHERE_V0_4.md
            docs/FIGURE_CAPTIONS_V3.md
            docs/REFERENCES_V3.bib
            docs/JOURNAL_FIT_V2.md
            build-ecosphere-manuscript-check.json
            build/synthesis-v3.json
            build/synthesis-v3.md
