name: Antarctic V20 original NOAA/BAS Gentoo within-series growth synchrony
on:
  push:
    branches: [research/antarctic-penguin-island-macro-v1]
    paths:
      - 'contracts/NOAA_BAS_GENTOO_GROWTH_SYNCHRONY_V20.md'
      - 'scripts/audit_noaa_bas_gentoo_growth_synchrony_v20.py'
      - 'tests/test_noaa_bas_gentoo_growth_synchrony_v20.py'
      - '.github/workflows/antarctic-noaa-bas-gentoo-synchrony-v20.yml'
  pull_request:
    paths:
      - 'contracts/NOAA_BAS_GENTOO_GROWTH_SYNCHRONY_V20.md'
      - 'scripts/audit_noaa_bas_gentoo_growth_synchrony_v20.py'
      - 'tests/test_noaa_bas_gentoo_growth_synchrony_v20.py'
      - '.github/workflows/antarctic-noaa-bas-gentoo-synchrony-v20.yml'
  workflow_dispatch:
jobs:
  original_three_island_yearly_changes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source transport module and synthetic tests
        run: python -m pip install pytest requests openpyxl
      - name: Verify isolated source strict-year, original OOXML and positive log ratio rules
        run: python -m pytest -q tests/test_noaa_bas_gentoo_growth_synchrony_v20.py
      - name: Retrieve SHA-pinned NOAA and BAS actual observations and fit source-normalized annual changes
        run: |
          python scripts/audit_noaa_bas_gentoo_growth_synchrony_v20.py \
            --out /tmp/NOAA_BAS_GENTOO_GROWTH_SYNCHRONY_V20.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noaa-bas-source-normalized-original-gentoo-yearly-v20
          path: /tmp/NOAA_BAS_GENTOO_GROWTH_SYNCHRONY_V20.json
