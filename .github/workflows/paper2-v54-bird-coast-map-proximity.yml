name: Paper2 V54 BAS three-island official coast-map proximity species transfer (exploratory)

on:
  push:
    branches: [research/antarctic-functional-archipelago-v1]
    paths:
      - 'contracts/PAPER2_V54_ORIGINAL_COAST_MAP_PROXIMITY_EXPLORATORY.md'
      - 'scripts/analyze_paper2_penguin_official_coast_map_proximity_v54.py'
      - 'tests/test_paper2_penguin_official_coast_map_proximity_v54.py'
      - '.github/workflows/paper2-v54-bird-coast-map-proximity.yml'
  pull_request:
    paths:
      - 'contracts/PAPER2_V54_ORIGINAL_COAST_MAP_PROXIMITY_EXPLORATORY.md'
      - 'scripts/analyze_paper2_penguin_official_coast_map_proximity_v54.py'
      - 'tests/test_paper2_penguin_official_coast_map_proximity_v54.py'
      - '.github/workflows/paper2-v54-bird-coast-map-proximity.yml'

permissions:
  contents: read
  actions: read

jobs:
  original_BAS_three_island_coast_proximity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original BAS geometry/source and model dependencies
        run: python -m pip install requests 'pyshp==2.3.1' 'shapely>=2.0' pyproj numpy scikit-learn pytest
      - name: Test unchanged original physical island keys, coast-map proximity and nested source 3-island holdout
        run: python -m pytest -q tests/test_paper2_penguin_official_coast_map_proximity_v54.py
      - name: Reuse independent original BAS penguin nests and terrain source artifact
        uses: actions/download-artifact@v4
        with:
          name: bas-original-nest-independent-CopDEM-terrain-v26
          run-id: 40279185790
          github-token: ${{ github.token }}
          path: /tmp/PAPER2_V54_BAS_V26_original_source
      - name: Measure same original 2020 coast proximity and test NEW incremental source information only
        run: |
          python scripts/analyze_paper2_penguin_official_coast_map_proximity_v54.py \
            --v26-npz /tmp/PAPER2_V54_BAS_V26_original_source/BAS_HART_PUBLIC_GLO30_NEST_TERRAIN_V26.npz \
            --out /tmp/PAPER2_V54_ORIGINAL_TWO_PENGUIN_SPECIES_COAST_MAP_RESULT.json
      - name: Archive original source SHA and aggregate 3-island-only post-result model outcome
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper2-v54-original-BAS-coast-map-proximity-only-not-true-walking-route
          path: /tmp/PAPER2_V54_ORIGINAL_TWO_PENGUIN_SPECIES_COAST_MAP_RESULT.json
          if-no-files-found: warn
