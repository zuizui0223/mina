name: ecology-article-cross-scale-check

on:
  push:
    branches: [analysis/mapppd-regional-concentration-v1]
    paths:
      - "submission/MANUSCRIPT_ECOLOGY_ARTICLE_CROSS_SCALE_V0_1.md"
      - "submission/COVER_LETTER_ECOLOGY_ARTICLE_CROSS_SCALE_V0_1.md"
      - "submission/TITLE_PAGE_ECOLOGY_ARTICLE_CROSS_SCALE_TEMPLATE.md"
      - "submission/ECOLOGY_ARTICLE_CROSS_SCALE_COPY_FIELDS_V0_1.md"
      - "submission/FIGURE_CAPTIONS_ECOLOGY_ARTICLE_CROSS_SCALE_V0_1.md"
      - "submission/SUPPLEMENT_ECOLOGY_ARTICLE_CROSS_SCALE_V0_1.md"
      - "submission/SUPPLEMENTARY_FIGURE_CAPTION_ECOLOGY_ARTICLE_CROSS_SCALE_V0_1.md"
      - "submission/ECOLOGY_ARTICLE_CROSS_SCALE_DOCX_QA_RECEIPT_V0_1.json"
      - "submission/ECOLOGY_ARTICLE_CROSS_SCALE_FINAL_GATE_V0_1.json"
      - "submission/ECOLOGY_ARTICLE_CROSS_SCALE_SUBMISSION_MANIFEST_V0_1.md"
      - "submission/SUBMISSION_READINESS_ECOLOGY_ARTICLE_CROSS_SCALE_V0_1.md"
      - "contracts/ECOLOGY_ARTICLE_CROSS_SCALE_SUBMISSION_V1.json"
      - "contracts/ECOLOGY_CROSS_SCALE_CANONICAL_TARGET_V1.json"
      - "contracts/ECOLOGY_REPORT_CROSS_SCALE_SUBMISSION_V1.json"
      - "tests/test_ecology_article_cross_scale_submission.py"
      - "tests/test_ecology_cross_scale_canonical_target.py"
      - "tests/test_ecology_article_cross_scale_final_gate.py"
      - "tests/test_ecology_article_cross_scale_si.py"
      - "scripts/build_ecology_cross_scale_si.py"
      - ".github/workflows/ecology-article-cross-scale-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Run focused submission tests
        run: |
          pytest -q             tests/test_ecology_article_cross_scale_submission.py             tests/test_ecology_cross_scale_canonical_target.py             tests/test_ecology_article_cross_scale_final_gate.py \
            tests/test_ecology_article_cross_scale_si.py
