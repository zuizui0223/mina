name: palmer-colony-extinction-hazard

on:
  push:
    branches:
      - analysis/palmer-colony-extinction-hazard-v1
    paths:
      - "src/mina/colony_extinction_hazard.py"
      - "tests/test_colony_extinction_hazard.py"
      - "contracts/PALMER_COLONY_EXTINCTION_HAZARD_V1.json"
      - "contracts/PALMER_COLONY_EXTINCTION_NEUTRAL_NULL_V1.json"
      - ".github/workflows/palmer-colony-extinction-hazard.yml"
  pull_request:
    paths:
      - "src/mina/colony_extinction_hazard.py"
      - "tests/test_colony_extinction_hazard.py"
      - "contracts/PALMER_COLONY_EXTINCTION_HAZARD_V1.json"
      - "contracts/PALMER_COLONY_EXTINCTION_NEUTRAL_NULL_V1.json"
      - ".github/workflows/palmer-colony-extinction-hazard.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Run frozen tests
        run: pytest -q tests/test_colony_extinction_hazard.py
      - name: Fetch frozen Palmer census
        run: python scripts/fetch_lter_census.py build/adelie_census.csv
      - name: Run durable-extinction analysis
        run: |
          python -m mina.colony_extinction_hazard \
            --census build/adelie_census.csv \
            --out build/palmer_colony_extinction_hazard.json \
            --permutations 100000 \
            --seed 20260929
      - name: Print result receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(
              Path("build/palmer_colony_extinction_hazard.json").read_text()
          )
          p = x["primary_exchangeable_risk_set_test"]
          n = x["size_conditioned_neutral_gate"]["poisson_primary"]
          h = x["secondary_discrete_time_logistic"]
          print(
              "exchangeable",
              "raw_events=", p["raw_durable_events"],
              "risksets=", p["n_event_risk_sets"],
              "contrast=", p["observed_contrast"],
              "p=", p["one_sided_lower_p"],
          )
          print(
              "neutral",
              "null_mean=", n["null_mean"],
              "excess=", n["observed_minus_null_mean"],
              "p=", n["one_sided_lower_p"],
              "gate=", n["mechanism_gate_pass"],
          )
          print(
              "hazard",
              "beta_size=", h["size_coefficient"],
              "OR=", h["odds_ratio_per_1sd_larger_prior_size"],
          )
          print("decision=", json.dumps(x["decision"], sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: palmer-colony-extinction-hazard
          path: |
            build/adelie_census.csv
            build/palmer_colony_extinction_hazard.json
