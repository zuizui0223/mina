name: integrated-v0-5-geb-build

on:
  push:
    branches:
      - manuscript/integrated-v0.5-geb
    paths:
      - "docs/MANUSCRIPT_INTEGRATED_V0_4.md"
      - "docs/MANUSCRIPT_INTEGRATED_V0_5_GEB.md"
      - "docs/GEB_COVER_LETTER_INTEREST_PARAGRAPH_V0_5.md"
      - "contracts/INTEGRATED_V0_5_GEB_SUBMISSION_V1.json"
      - "scripts/build_integrated_v0_5_geb.py"
      - "scripts/check_integrated_v0_5_geb.py"
      - ".github/workflows/integrated-v0-5-geb-build.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate GEB manuscript from frozen v0.4
        run: |
          python scripts/build_integrated_v0_5_geb.py \
            --source docs/MANUSCRIPT_INTEGRATED_V0_4.md \
            --out build/MANUSCRIPT_INTEGRATED_V0_5_GEB.md
      - name: Verify committed manuscript is reproducible
        run: |
          cmp build/MANUSCRIPT_INTEGRATED_V0_5_GEB.md \
              docs/MANUSCRIPT_INTEGRATED_V0_5_GEB.md
      - name: Guard GEB formatting and scientific boundaries
        run: |
          python scripts/check_integrated_v0_5_geb.py \
            --repo-root . \
            --out build/integrated_v0_5_geb_guard.json
      - uses: actions/upload-artifact@v4
        with:
          name: integrated-v0-5-geb-submission-audit
          path: |
            build/MANUSCRIPT_INTEGRATED_V0_5_GEB.md
            build/integrated_v0_5_geb_guard.json
