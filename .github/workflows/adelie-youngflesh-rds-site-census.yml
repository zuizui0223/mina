name: adelie-youngflesh-rds-site-census
on:
  push:
    branches: [analysis/adelie-polynya-conservation-source-20261122]
    paths: [.github/workflows/adelie-youngflesh-rds-site-census.yml]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          name: adelie-polynya-official-source-ccamlr-mpa-gate
          run-id: 45031126352
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/source
      - name: Parse author RDS and produce geocoding audit
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v Rscript >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq r-base-core
          fi
          mkdir -p build/out
          Rscript --vanilla - <<'RS'
          src <- "build/source/source_files/src00_landsat_reflectance_L457-2025-07-16.rds"
          if (!file.exists(src)) stop("Landsat publisher RDS missing")
          x <- readRDS(src)
          writeLines(capture.output(str(x, max.level=2, vec.len=5)), "build/out/native_rds_structure.txt")
          writeLines(paste("class:", paste(class(x),collapse=","), "length:",length(x)),
                     "build/out/native_rds_identity.txt")
          cat("RDS class:",paste(class(x),collapse=","),"\n")
          if (!is.data.frame(x)) stop("RDS is not a data frame; refer to saved RDS structure")
          cols <- names(x)
          usable <- cols[vapply(x, function(z) is.atomic(z) && length(z)==nrow(x), logical(1))]
          schema <- data.frame(name=cols,
             class=vapply(x,function(z)paste(class(z),collapse=";"), character(1)),
             nonmissing=vapply(x,function(z)sum(!is.na(z)),numeric(1)))
          write.csv(schema,"build/out/native_rds_column_schema.csv",row.names=FALSE)
          write.csv(utils::head(x[usable],5),"build/out/native_rds_first5.csv",row.names=FALSE)
          cat("RDS rows:",nrow(x),"columns:",length(cols),"atomic:",length(usable),"\n")
          cat("Columns:",paste(cols,collapse=", "),"\n")
          findcol <- function(options) {
            z <- options[options %in% cols]
            if (length(z)) z[[1]] else NA_character_
          }
          site <- findcol(c("site_id","site","Site","SiteID"))
          lat <- findcol(c("latitude","lat","Latitude","site_lat"))
          lon <- findcol(c("longitude","lon","Longitude","site_lon"))
          day <- findcol(c("date","Date","img_date","datetime"))
          year <- findcol(c("year","Year","img_year"))
          if (!is.na(site)&&!is.na(lat)&&!is.na(lon)) {
            f <- c(site,lat,lon)
            if(!is.na(day))f<-c(f,day)
            if(!is.na(year))f<-c(f,year)
            sub <- unique(x[,f,drop=FALSE])
            write.csv(sub,"build/out/publisher_unique_geocoded_site_dates.csv",row.names=FALSE)
            cat("Original unique site ids:",length(unique(x[[site]])),"\n")
          }
          crs <- attr(x$geometry,"crs")
          writeLines(capture.output(str(crs,max.level=2)),"build/out/native_geometry_crs.txt")
          stopifnot(is.list(x$geometry),length(x$geometry)==nrow(x))
          pxy <- vapply(x$geometry,function(v)as.numeric(v[1:2]),numeric(2))
          tab <- data.frame(site_id=x$site_id,season=as.integer(x$season),
                calendar_year=as.integer(x$year),month=as.integer(x$month),
                day=as.integer(x$day),x_m=pxy[1,],y_m=pxy[2,],
                bad=x$bad,guano_bin=x$guano_bin)
          tab <- tab[!is.na(tab$bad)&tab$bad==0&!is.na(tab$guano_bin)&tab$guano_bin==1,]
          tab$date_key <- paste(tab$calendar_year,tab$month,tab$day,sep="-")
          annual <- tab[tab$season>=2004 & tab$season<=2010,]
          px <- aggregate(date_key~site_id+season,data=annual,FUN=length)
          names(px)[3] <- "guano_pixels"
          days <- aggregate(date_key~site_id+season,data=unique(annual[,c("site_id","season","date_key")]),FUN=length)
          names(days)[3] <- "n_image_days"
          pos <- aggregate(cbind(x_m,y_m)~site_id+season,data=annual,FUN=median)
          support <- merge(merge(px,days,by=c("site_id","season")),pos,by=c("site_id","season"))
          support$avg_pixels_per_image_day <- support$guano_pixels/support$n_image_days
          write.csv(support,"build/out/raw_2004_2010_site_year_support.csv",row.names=FALSE)
          write.csv(aggregate(cbind(x_m,y_m)~site_id,data=annual,FUN=median),
                 "build/out/raw_site_centroids_projected.csv",row.names=FALSE)
          print(c(pixels=nrow(annual),sites=length(unique(annual$site_id)),site_years=nrow(support)))
          print(table(support$season))
          print(head(support,5))
          RS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adelie-youngflesh-rds-site-census
          path: build/out
          if-no-files-found: warn
          retention-days: 60
