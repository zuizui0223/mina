name: palmer-neutral-attrition

on:
  push:
    branches:
      - analysis/palmer-colony-extinction-hazard-v1
    paths:
      - "src/mina/neutral_attrition.py"
      - "tests/test_neutral_attrition.py"
      - "contracts/PALMER_NEUTRAL_ATTRITION_V1.json"
      - ".github/workflows/palmer-neutral-attrition.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/test_neutral_attrition.py
      - run: python scripts/fetch_lter_census.py build/adelie_census.csv
      - run: |
          python -m mina.neutral_attrition \
            --census build/adelie_census.csv \
            --out build/palmer_neutral_attrition.json \
            --simulations 100000 \
            --seed 20260930
      - name: Print receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("build/palmer_neutral_attrition.json").read_text())
          for island,v in x["per_island"].items():
              print(island, "obs=",v["observed_slope"],
                    "null=",v["neutral_slope"]["mean"],
                    "p=",v["one_sided_probability_slope_le_observed"])
          print("joint=",x["joint_all_three_slopes_le_observed"])
          print("decision=",x["decision"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: palmer-neutral-attrition
          path: |
            build/adelie_census.csv
            build/palmer_neutral_attrition.json
