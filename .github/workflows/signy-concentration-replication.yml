name: signy-concentration-replication

on:
  push:
    branches: [analysis/signy-concentration-replication-v1]
    paths:
      - "contracts/SIGNY_CONCENTRATION_REPLICATION_V1.json"
      - "src/mina/signy_concentration.py"
      - ".github/workflows/signy-concentration-replication.yml"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev]" pandas lxml html5lib beautifulsoup4
      - name: Download frozen official Signy source
        run: |
          mkdir -p build
          curl -L --fail --retry 4 --retry-delay 5 \
            'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=daf2c4fd-c1e3-4e65-851f-d11f02c5b69d&output=zip.tree' \
            -o build/signy_official.zip
      - name: Run frozen concentration replication
        run: |
          python -m mina.signy_concentration \
            --official-zip build/signy_official.zip \
            --out build/SIGNY_CONCENTRATION_REPLICATION_RESULT_V1.json \
            --simulations 100000
      - name: Print primary result
        run: |
          python - <<'PY'
          import json
          x=json.load(open("build/SIGNY_CONCENTRATION_REPLICATION_RESULT_V1.json"))
          print("primary=", json.dumps(x["primary"], sort_keys=True))
          print("p=", {k:v["one_sided_probability_le_observed"] for k,v in x["error_models"].items()})
          print("decision=", json.dumps(x["decision"], sort_keys=True))
          print("secondary=", json.dumps(x["secondary_later_epoch"], sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: signy-concentration-replication-v1
          path: build/SIGNY_CONCENTRATION_REPLICATION_RESULT_V1.json
