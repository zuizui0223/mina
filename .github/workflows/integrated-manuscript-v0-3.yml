name: integrated-manuscript-v0-3

on:
  push:
    branches:
      - manuscript/integrated-v0.3
    paths:
      - "docs/MANUSCRIPT_INTEGRATED_V0_3.md"
      - "docs/INTEGRATED_FIGURE_CAPTIONS_V0_3.md"
      - "contracts/INTEGRATED_PALMER_ANTARCTIC_MANUSCRIPT_V0_3.json"
      - "scripts/check_integrated_manuscript_v0_3.py"
      - "scripts/build_integrated_figure_data_v0_3.py"
      - "scripts/render_integrated_figures_v0_3.py"
      - "tests/test_integrated_figure_data_v0_3.py"
      - "results/PALMER_BREEDING_PATCH_CONCENTRATION_RESULT_V1.json"
      - "results/PALMER_PERFORMANCE_REDISTRIBUTION_LAGS_RESULT_V2.json"
      - "results/PALMER_PERFORMANCE_MEMORY_RESULT_V1.json"
      - "results/PALMER_REPRO_REDISTRIBUTION_RESULT_V1.json"
      - "results/PALMER_REPRO_SAME_PANEL_METRIC_DIAGNOSTIC_RESULT_V1.json"
      - "results/PAPER2_V3_PERMUTATION_INFERENCE_RESULT_V1.json"
      - "results/PAPER2_FIRST_REAL_V3_FIT_RESULT_V1.json"
      - "results/PAPER2_SCALE_TRAIT_SENSITIVITY_RESULT_V1.json"
      - "results/PAPER2_DETECTABLE_EFFECT_RESULT_V1.json"
      - "results/PAPER2_RADIUS_SIGN_SWITCH_NULL_RESULT_V1.json"
      - ".github/workflows/integrated-manuscript-v0-3.yml"
  workflow_dispatch:

jobs:
  guard-and-figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install figure dependencies
        run: python -m pip install pandas pytest matplotlib
      - name: Test frozen v0.3 figure data
        run: python -m pytest -q tests/test_integrated_figure_data_v0_3.py
      - name: Guard v0.3 claims and key receipt values
        run: |
          python scripts/check_integrated_manuscript_v0_3.py \
            --repo-root . \
            --out build/integrated_manuscript_v0_3_guard.json
      - name: Build frozen v0.3 figure-data package
        run: |
          python scripts/build_integrated_figure_data_v0_3.py \
            --out-dir build/integrated-v0-3-figures/data
      - name: Render submission figures 2-4
        run: |
          python scripts/render_integrated_figures_v0_3.py \
            --data-dir build/integrated-v0-3-figures/data \
            --out-dir build/integrated-v0-3-figures/rendered
      - name: Verify rendered figure package
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("build/integrated-v0-3-figures/rendered")
          expected = [
              "figure2_palmer_dynamic_history_v0_3.pdf",
              "figure2_palmer_dynamic_history_v0_3.png",
              "figure3_antarctic_interaction_v0_3.pdf",
              "figure3_antarctic_interaction_v0_3.png",
              "figure4_scale_and_detectability_v0_3.pdf",
              "figure4_scale_and_detectability_v0_3.png",
          ]
          for name in expected:
              path = root / name
              assert path.exists(), name
              assert path.stat().st_size > 5000, (name, path.stat().st_size)
          print("rendered_figures=", len(expected))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: integrated-manuscript-v0-3
          path: |
            build/integrated_manuscript_v0_3_guard.json
            build/integrated-v0-3-figures/
