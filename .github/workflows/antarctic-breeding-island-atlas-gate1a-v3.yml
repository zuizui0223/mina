name: antarctic-breeding-island-atlas-gate1a-v3

on:
  push:
    branches: [analysis/antarctic-breeding-island-atlas-v3]
    paths:
      - "scripts/audit_add_site_matching_v3.py"
      - "contracts/ANTARCTIC_BREEDING_ISLAND_ATLAS_GATE1A_V3.json"
      - ".github/workflows/antarctic-breeding-island-atlas-gate1a-v3.yml"
  pull_request:
    paths:
      - "scripts/audit_add_site_matching_v3.py"
      - "contracts/ANTARCTIC_BREEDING_ISLAND_ATLAS_GATE1A_V3.json"
      - ".github/workflows/antarctic-breeding-island-atlas-gate1a-v3.yml"
  workflow_dispatch:

jobs:
  gate1a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas pyreadr requests
      - name: Fetch pinned mapppdr
        run: |
          git clone --quiet https://github.com/CCheCastaldo/mapppdr.git build/mapppdr
          git -C build/mapppdr checkout --quiet 88c73a507e0921b2541c218c71eaf16721bc6502
      - name: Run service-native Gate 1A v3
        run: |
          python scripts/audit_add_site_matching_v3.py \
            --mapppdr-dir build/mapppdr \
            --out build/add_site_match_audit_v3.json \
            --delay-s 0.10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: antarctic-add-site-match-audit-v3
          path: build/add_site_match_audit_v3.json
      - name: Enforce frozen Gate 1A rule
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("build/add_site_match_audit_v3.json").read_text())
          print("distance_summaries=",json.dumps(x["distance_summaries"],sort_keys=True))
          if not x["gate1a_passed"]:
              raise SystemExit("Gate 1A v3 failed the frozen 95% match / 5% multiple rule")
          print("selected_distance_m=",x["selected_distance_m"])
          PY
