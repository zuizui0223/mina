name: climate-penguin-original-observed-SIC-vs-Skaret-acoustics-v1
on:
  workflow_dispatch:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - "research/climate-penguin/work/climate_penguin/observed_SIC_prior_to_primary_krill_acoustic_v1.py"
      - "tests/test_observed_SIC_prior_to_primary_krill_acoustic_v1.py"
      - ".github/workflows/climate-penguin-original-SIC-vs-primary-acoustic-v1.yml"
jobs:
  original-primary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimum numeric tests
        run: python -m pip install numpy "scipy>=1.11,<2"
      - name: Verify source SHA, chronology, and fixed nine-year results
        run: python -m unittest discover -s tests -p test_observed_SIC_prior_to_primary_krill_acoustic_v1.py -v
      - name: Estimate original direct observed physical-ice and acoustic relation
        run: |
          python research/climate-penguin/work/climate_penguin/observed_SIC_prior_to_primary_krill_acoustic_v1.py \
            --ice research/climate-penguin/outputs/climate_penguin/macro_monthly_seaice_1991_2020.csv \
            --sites research/climate-penguin/outputs/climate_penguin/daily_ice_locations.csv \
            --acoustic research/climate-penguin/inputs/skaret_2023_krill_stratum_table3_reconciled_v2.csv \
            --corrected research/climate-penguin/inputs/IMR_annual_overall_acoustic_2011_2025_v1.csv \
            --out build/original_ice_acoustic
      - uses: actions/upload-artifact@v4
        with:
          name: Antarctic-Signy-original-antecedent-ice-vs-Skaret-acoustic-v1
          path: |
            build/original_ice_acoustic/joined_original_9year_ice_acoustic.csv
            build/original_ice_acoustic/rolling_origin_source_ice_predictions.csv
            build/original_ice_acoustic/decision.json
