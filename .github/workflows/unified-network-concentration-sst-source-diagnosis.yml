name: unified-network-concentration-sst-source-diagnosis

on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - ".github/workflows/unified-network-concentration-sst-source-diagnosis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-noaa-sst-access:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Test exact NOAA OISST source on tiny September 1983 grid subsets
        run: |
          python - <<'PY'
          import requests,hashlib,json
          psl="https://psl.noaa.gov/thredds/ncss/grid/Datasets/noaa.oisst.v2.highres/sst.mon.mean.nc"
          er="https://comet.nefsc.noaa.gov/erddap/griddap/noaa_psl_2d74_d418_a6fb"
          urls=[
            ("psl_tiny_single_month",psl,{"var":"sst","north":-61,"south":-67,"west":295,"east":303,"time_start":"1983-09-01T00:00:00Z","time_end":"1983-09-30T23:59:59Z","accept":"netcdf4"}),
            ("psl_tiny_three_months",psl,{"var":"sst","north":-61,"south":-67,"west":295,"east":303,"time_start":"1983-09-01T00:00:00Z","time_end":"1983-11-30T23:59:59Z","accept":"netcdf4"}),
            ("erddap_single_point",er+".csv",None),
            ("erddap_tiny_three_months",er+".nc",None),
          ]
          er_query={
            "erddap_single_point":"sst[(1983-09-01T00:00:00Z)][(-65.125)][(301.125)]",
            "erddap_tiny_three_months":"sst[(1983-09-01T00:00:00Z):1:(1983-11-01T00:00:00Z)][(-66.875):1:(-61.125)][(295.125):1:(302.875)]",
          }
          for name,url,params in urls:
            try:
              if name.startswith("erddap"):
                r=requests.get(url+"?"+er_query[name],timeout=90)
              else:
                r=requests.get(url,params=params,timeout=90)
              print(json.dumps({"test":name,"status":r.status_code,"bytes":len(r.content),
                  "sha256":hashlib.sha256(r.content).hexdigest(),
                  "content_type":r.headers.get("Content-Type",""),
                  "retry_after":r.headers.get("Retry-After",""),
                  "response_snippet_if_error":r.text[:200] if r.status_code>=400 or len(r.content)<300 else ""}),flush=True)
            except Exception as exc:
              print(json.dumps({"test":name,"exception":str(exc)[:240]}),flush=True)
          PY
