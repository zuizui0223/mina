name: Antarctic BAS Hart original 2019-20 all island archive V16
on:
  push:
    branches: [research/antarctic-functional-archipelago-v1]
    paths:
      - 'contracts/BAS_HART_ORIGINAL_MULTIISLAND_MANIFEST_V16.md'
      - 'scripts/inventory_bas_hart_all_island_folders_v16.py'
      - 'tests/test_bas_hart_all_island_folders_v16.py'
      - '.github/workflows/antarctic-hart-all-islands-v16.yml'
  pull_request:
    paths:
      - 'contracts/BAS_HART_ORIGINAL_MULTIISLAND_MANIFEST_V16.md'
      - 'scripts/inventory_bas_hart_all_island_folders_v16.py'
      - 'tests/test_bas_hart_all_island_folders_v16.py'
      - '.github/workflows/antarctic-hart-all-islands-v16.yml'
  workflow_dispatch:
jobs:
  original_publisher_manifest_only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original publisher manifest reader and tests
        run: python -m pip install requests pytest
      - name: Test exact nested publisher group traversal without biological data
        run: python -m pytest -q tests/test_bas_hart_all_island_folders_v16.py
      - name: Reconstruct 31 original census and coordinate CSV plus 127 original TIFF records
        run: |
          python scripts/inventory_bas_hart_all_island_folders_v16.py \
            --out /tmp/BAS_HART_ALL_ISLANDS_ORIGINAL_MANIFEST_V16.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bas-hart-original-all-locality-source-manifest-v16
          path: /tmp/BAS_HART_ALL_ISLANDS_ORIGINAL_MANIFEST_V16.json
          if-no-files-found: warn
