name: Penguin ONE frozen direct DEEP-AA coastal polynya isotope source test
on:
  push:
    branches: [analysis/penguin-decade-redistribution-v1-20261110]
    paths:
      - 'research/climate-penguin/macro_panantarctic_v1/diet_salinity_source_20261117/fit_one_frozen_DEEPAA_100km_optical_d15N_20261119.py'
      - '.github/workflows/penguin-20261119-DEEPAA-one-frozen-100km-isotope-test.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  final_one_original_observed_polynya_model:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm direct polynya overlap PASS and model frozen before source isotope outcome open
        run: |
          test -f research/climate-penguin/macro_panantarctic_v1/diet_salinity_source_20261117/POLYNYA_DIRECT_SOURCE_SUPPORT_GATE_20261119_JA.md
          test -f research/climate-penguin/macro_panantarctic_v1/diet_salinity_source_20261117/DIRECT_POLYNYA_OPTICAL_ISOTOPE_MODEL_FROZEN_20261119_JA.md
          python -m py_compile research/climate-penguin/macro_panantarctic_v1/diet_salinity_source_20261117/fit_one_frozen_DEEPAA_100km_optical_d15N_20261119.py
      - name: Install numerical tools for frozen fixed-effect/region cluster comparison
        run: python -m pip install --disable-pip-version-check 'numpy<3' 'pandas>=2.2,<3' 'scipy<2' 'statsmodels>=0.14,<1'
      - name: Retrieve source-verified original author optical isotope site panel AND source-only DEEPAA exposed 439
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p build/deepaa_once_final
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14328755565/zip" > build/deepaa_once_final/isotope860_original.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14539723210/zip" > build/deepaa_once_final/DEEPAA_native100km_source439.zip
          echo 'dfbbe281e50e7d802c43f69255c02878a4c49c14185804acb7e15048189af205  build/deepaa_once_final/isotope860_original.zip' | sha256sum --check
          echo '702ab3eeff9ed953c19a9e696492ba9bf5cddce204d40a9c7d9b1234d98f9f96  build/deepaa_once_final/DEEPAA_native100km_source439.zip' | sha256sum --check
      - name: Fit exactly preregistered M0/M_S/M_P/M_SP on same real original 439 site-seasons only
        run: |
          python research/climate-penguin/macro_panantarctic_v1/diet_salinity_source_20261117/fit_one_frozen_DEEPAA_100km_optical_d15N_20261119.py \
            --isotope-zip build/deepaa_once_final/isotope860_original.zip \
            --polynya-source-zip build/deepaa_once_final/DEEPAA_native100km_source439.zip \
            --out build/deepaa_once_final/frozen_results
      - name: Check single-site geometry, sources and no fish fraction inference
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("build/deepaa_once_final/frozen_results")
          r=json.loads((p/"DEEPAA100km_FROZEN_DIRECT_COASTAL_POLYNYA_OPTICAL_ISOTOPE_VERDICT.json").read_text())
          assert r['status'] in ('PASS_DIRECT_POLYNYA_EXPLORATORY_ASSOCIATION_NOT_CAUSAL',
                                 'NO_GO_DIRECT_POLYNYA_ASSOCIATION')
          assert r['source_outcome_gate_was_passed_before_Y_open']
          assert r['same_observations_all_four_comparisons']==439
          assert r['same_original_sites_all_four']==85 and r['source_regions']==11
          assert all(len(v['region']['coefficients'])>=4 for v in r['models'].values())
          assert r['cannot_claim_direct_diet_baseline_or_causality']
          assert r['response_measures_satellite_optical_delta15N_proxy_NOT_fish_fraction']
          print('FROZEN_DIRECT_DEEPAA_ISOTOPE_VERDICT',r['status'])
          print('M_P_REGION_CI',[x for x in r['models']['M_P']['region']['coefficients'] if 'polynya' in x['feature']])
          PY
      - name: Preserve exploratory one-test fitted coefficient/region omits/actual holdout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: penguin-original439-DEEPAA-100km-FROZEN-one-only-optical-d15N-result
          path: build/deepaa_once_final/frozen_results/
          if-no-files-found: warn
          retention-days: 30
