name: V21c chronology PDF extraction dependency repair
on:
  push:
    branches: [analysis/pygoscelis-count-functional-sensitivity-20261126]
    paths: ['.github/workflows/legacy-chronology-v21c.yml']
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install PDF text and render dependency
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.6
      - name: Verify exact source bytes and extract candidate metadata tables
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,pathlib,hashlib,json,re,fitz
          url='https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41467-025-56925-4/MediaObjects/41467_2025_56925_MOESM1_ESM.pdf'
          req=urllib.request.Request(url,headers={'User-Agent':'mina-research-source-audit/1.0'})
          with urllib.request.urlopen(req,timeout=45) as r:
              b=r.read(50000001);status=r.status
          assert len(b)==14251706 and hashlib.sha256(b).hexdigest()=='67c49dc76b140deedaf83ade9a5ec3d7216463de984e7ca2b91358144fefa36d'
          p=pathlib.Path('v21c_source');p.mkdir()
          (p/'publisher_supplement.pdf').write_bytes(b)
          doc=fitz.open(stream=b,filetype='pdf')
          hits=[]
          for i,page in enumerate(doc):
              t=page.get_text(sort=True)
              if re.search(r'Supplementary\s+Table\s*[12]\b',t,re.I) and re.search(r'latitude|longitude|GPS|radiocarbon|calibrated|coordinates',t,re.I):
                  hits.append(i+1)
                  print('METADATA TABLE PAGE',i+1)
                  print(t[:12000])
                  (p/f'metadata_p{i+1}.txt').write_text(t)
                  page.get_pixmap(matrix=fitz.Matrix(1.5,1.5)).save(p/f'metadata_p{i+1}.png')
          result={'status':status,'sha256':hashlib.sha256(b).hexdigest(),'pdf_pages':len(doc),'candidate_pages':hits,'visual_inspection_completed':False}
          (p/'receipt.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v21c-chronology-pdf
          path: v21c_source
          retention-days: 7
