name: Antarctic V24 original NOAA ERSSTv6 prebreeding SST versus BAS Gentoo growth
on:
  push:
    branches: [research/antarctic-penguin-island-macro-v1]
    paths:
      - 'contracts/NOAA_ERSSTV6_GENTOO_WINTER_V24.md'
      - 'scripts/model_noaa_ersstv6_gentoo_winter_v24.py'
      - 'tests/test_noaa_ersstv6_gentoo_winter_v24.py'
      - '.github/workflows/antarctic-noaa-ersstv6-gentoo-v24.yml'
  pull_request:
    paths:
      - 'contracts/NOAA_ERSSTV6_GENTOO_WINTER_V24.md'
      - 'scripts/model_noaa_ersstv6_gentoo_winter_v24.py'
      - 'tests/test_noaa_ersstv6_gentoo_winter_v24.py'
      - '.github/workflows/antarctic-noaa-ersstv6-gentoo-v24.yml'
  workflow_dispatch:
jobs:
  NOAA_original_SST_and_verified_BAS_growth:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NOAA source readers and synthetic guards
        run: python -m pip install pytest requests numpy netCDF4
      - name: Verify fixed source months and original eight-window guards
        run: python -m pytest -q tests/test_noaa_ersstv6_gentoo_winter_v24.py
      - name: Download SHA checked BAS sources and NOAA ERSSTv6 regional SST to test exploratory environmental compatibility
        run: |
          python scripts/model_noaa_ersstv6_gentoo_winter_v24.py \
            --json /tmp/NOAA_ERSSTV6_BAS_GENTOO_WINTER_V24.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-noaa-ersstv6-bas-gentoo-winter-environment-v24
          path: /tmp/NOAA_ERSSTV6_BAS_GENTOO_WINTER_V24.json
