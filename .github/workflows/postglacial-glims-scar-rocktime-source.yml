name: postglacial-GLIMS-rockdate-SCAR-land-three-source

on:
  push:
    branches: [analysis/postglacial-glims-sourcegate-20261119]
    paths:
      - scripts/audit_glims_scar_rocktime_source_support.py
      - tests/test_glims_scar_rocktime_source_support.py
      - .github/workflows/postglacial-glims-scar-rocktime-source.yml
  workflow_dispatch:

concurrency:
  group: postglacial-glims-rocktime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-three-official-sources:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas pyreadr shapely pyproj pyshp requests
      - name: Compile and run original-source logic tests
        run: |
          python -m py_compile scripts/audit_glims_scar_rocktime_source_support.py
          python -m unittest discover -s tests -p test_glims_scar_rocktime_source_support.py -v
      - name: Clone immutable mapppdr database (locations only)
        run: |
          git clone --quiet https://github.com/CCheCastaldo/mapppdr.git build/mapppdr
          git -C build/mapppdr checkout --quiet 88c73a507e0921b2541c218c71eaf16721bc6502
          test -f build/mapppdr/data/sites.rda
          test -f build/mapppdr/data/site_species.rda
      - name: Overlay dated original bare rock and ice changes on exact source land
        run: |
          python -m scripts.audit_glims_scar_rocktime_source_support \
            --mapppdr-dir build/mapppdr \
            --out-json build/GLIMS_SCAR_ROCKTIME_SOURCE_SUPPORT_20261119.json \
            --out-csv build/GLIMS_SCAR_ROCKTIME_SITE_SUPPORT_20261119.csv
      - name: Preserve complete source receipt or HOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glims-scar-rocktime-source-support-20261119
          path: |
            build/GLIMS_SCAR_ROCKTIME_SOURCE_SUPPORT_20261119.json
            build/GLIMS_SCAR_ROCKTIME_SITE_SUPPORT_20261119.csv
          retention-days: 30
