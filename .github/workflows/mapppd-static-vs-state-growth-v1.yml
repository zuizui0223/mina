name: MAPPPD static versus state growth v1

on:
  push:
    branches: [analysis/mapppd-intensification-descriptive-v1]
    paths:
      - "contracts/MAPPPD_STATIC_VS_STATE_GROWTH_V1.md"
      - "data/MAPPPD_INCREASING_SITE_STATIC_TRAITS_V1.csv"
      - "scripts/describe_mapppd_static_vs_state_growth.py"
      - "results/MAPPPD_INTENSIFICATION_DESCRIPTIVE_RESULT_V1.json"
      - ".github/workflows/mapppd-static-vs-state-growth-v1.yml"
  pull_request:
    paths:
      - "contracts/MAPPPD_STATIC_VS_STATE_GROWTH_V1.md"
      - "data/MAPPPD_INCREASING_SITE_STATIC_TRAITS_V1.csv"
      - "scripts/describe_mapppd_static_vs_state_growth.py"
      - "results/MAPPPD_INTENSIFICATION_DESCRIPTIVE_RESULT_V1.json"
      - ".github/workflows/mapppd-static-vs-state-growth-v1.yml"
  workflow_dispatch:

jobs:
  describe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas
      - name: Compare static place and demographic state
        run: |
          mkdir -p build
          python scripts/describe_mapppd_static_vs_state_growth.py \
            --intensification-json results/MAPPPD_INTENSIFICATION_DESCRIPTIVE_RESULT_V1.json \
            --traits-csv data/MAPPPD_INCREASING_SITE_STATIC_TRAITS_V1.csv \
            --out-json build/MAPPPD_STATIC_VS_STATE_GROWTH_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: mapppd-static-vs-state-growth-v1
          path: build/MAPPPD_STATIC_VS_STATE_GROWTH_RESULT_V1.json
