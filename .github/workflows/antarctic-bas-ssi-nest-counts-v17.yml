name: Antarctic BAS original SSI nest count table V17
on:
  push:
    branches: [research/antarctic-functional-archipelago-v1]
    paths:
      - 'contracts/BAS_HART_ORIGINAL_NEST_COUNTS_V17.md'
      - 'scripts/audit_bas_hart_ssi_count_source_v17.py'
      - 'tests/test_bas_hart_ssi_count_source_v17.py'
      - '.github/workflows/antarctic-bas-ssi-nest-counts-v17.yml'
  pull_request:
    paths:
      - 'contracts/BAS_HART_ORIGINAL_NEST_COUNTS_V17.md'
      - 'scripts/audit_bas_hart_ssi_count_source_v17.py'
      - 'tests/test_bas_hart_ssi_count_source_v17.py'
      - '.github/workflows/antarctic-bas-ssi-nest-counts-v17.yml'
  workflow_dispatch:
jobs:
  original_small_SSI_source_count_table:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install BAS original-count parser test dependencies
        run: python -m pip install requests pytest
      - name: Test literal original nest count CSV schema and missingness
        run: python -m pytest -q tests/test_bas_hart_ssi_count_source_v17.py
      - name: Recover current original BAS 164-file nested publisher manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/bas-source-v16
          gh run download 40261490725 --repo "$GITHUB_REPOSITORY" \
            --name bas-hart-original-all-locality-source-manifest-v16 \
            --dir /tmp/bas-source-v16
      - name: Inspect actual first-party SSI_count_results original rows and data dictionary
        run: |
          python scripts/audit_bas_hart_ssi_count_source_v17.py \
            --publisher-manifest /tmp/bas-source-v16/BAS_HART_ALL_ISLANDS_ORIGINAL_MANIFEST_V16.json \
            --out /tmp/BAS_HART_SSI_COUNT_SOURCE_SCHEMA_V17.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-bas-hart-ssi-site-count-schema-v17
          path: /tmp/BAS_HART_SSI_COUNT_SOURCE_SCHEMA_V17.json
          if-no-files-found: warn
