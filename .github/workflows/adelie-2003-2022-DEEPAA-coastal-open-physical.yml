name: adelie-2003-2022-DEEPAA-coastal-open-physical
on:
  push:
    branches: [analysis/adelie-deepaa-2003-2022-demography-20261123]
    paths:
      - scripts/extract_adelie_2003_2022_DEEPAA_coastal_and_open.py
      - .github/workflows/adelie-2003-2022-DEEPAA-coastal-open-physical.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  genuine-native-physical-exposure:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          name: adelie-duffy2024-mapppd-v5-original-sources
          run-id: 45095395698
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/originals
      - name: Install exact native geometry readers
        run: python -m pip install --no-cache-dir 'numpy>=1.24' 'pandas>=2.0' 'scipy>=1.11' 'netCDF4>=1.6' 'pyproj>=3.6'
      - name: Fetch the only recommended original 6.25km DEEP-AA physical source (MD5 gate)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/raw build/ad_deepaa
          curl -fLSs --retry 5 --retry-all-errors --connect-timeout 60 --max-time 1500 \
            'https://zenodo.org/records/13358042/files/SIC60_6.25km_20d.zip?download=1' \
            -o build/raw/SIC60_6.25km_20d.zip
          echo 'f3f958389cc5e67ac1c4e3a6ee164318  build/raw/SIC60_6.25km_20d.zip' | md5sum -c -
      - name: Extract native physical-only 100km coastal, other open sea and landfast classes
        shell: bash
        run: |
          python scripts/extract_adelie_2003_2022_DEEPAA_coastal_and_open.py \
            --deepaa build/raw/SIC60_6.25km_20d.zip \
            --mapppd build/originals/raw/mapppd_v5_all_counts.csv \
            --out build/ad_deepaa
      - name: Preserve physical daily/monthly/yearly masks, source-support years and hashes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adelie-DEEPAA-2003-2022-native-coastal-open-100km-physical
          path: build/ad_deepaa
          if-no-files-found: warn
          retention-days: 90
