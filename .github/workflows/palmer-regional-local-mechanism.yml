name: palmer-regional-local-mechanism

on:
  push:
    branches:
      - analysis/regional-local-mechanism-v1
  pull_request:
    paths:
      - "src/mina/mechanism.py"
      - "scripts/fetch_seaice_edi.py"
      - "contracts/PALMER_REGIONAL_LOCAL_MECHANISM_V1.json"
      - ".github/workflows/palmer-regional-local-mechanism.yml"
  workflow_dispatch:

jobs:
  mechanism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mina
        run: python -m pip install -e .

      - name: Reproduce static island-habitat validation
        run: |
          mina-mechanism \
            --lter-receipt results/PALMER_LTER_FIVE_ISLAND_SYNCHRONY_RESULT_V1.json \
            --out build/static_habitat_result.json
          cat build/static_habitat_result.json

      - name: Fetch frozen EDI sea-ice entity
        run: python scripts/fetch_seaice_edi.py build/seaice_raw.txt

      - name: Inspect sea-ice schema
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("build/seaice_raw.txt")
          text = p.read_text(encoding="utf-8", errors="replace")
          lines = text.splitlines()
          print("line_count=", len(lines))
          print("first_lines=")
          for line in lines[:5]:
              print(line)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: palmer-regional-local-mechanism
          path: |
            build/static_habitat_result.json
            build/seaice_raw.txt
