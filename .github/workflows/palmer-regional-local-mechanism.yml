name: palmer-regional-local-mechanism

on:
  push:
    branches:
      - analysis/regional-local-mechanism-v1
  pull_request:
    paths:
      - "src/mina/mechanism.py"
      - "scripts/fetch_seaice_edi.py"
      - "contracts/PALMER_REGIONAL_LOCAL_MECHANISM_V1.json"
      - ".github/workflows/palmer-regional-local-mechanism.yml"
  workflow_dispatch:

jobs:
  mechanism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mina
        run: python -m pip install -e .

      - name: Reproduce static island-habitat validation
        run: |
          mina-mechanism \
            --lter-receipt results/PALMER_LTER_FIVE_ISLAND_SYNCHRONY_RESULT_V1.json \
            --out build/static_habitat_result.json
          cat build/static_habitat_result.json

      - name: Fetch frozen sea-ice source
        run: python scripts/fetch_seaice_edi.py build/seaice_source.bin

      - name: Inspect sea-ice source schema
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          import xml.etree.ElementTree as ET

          p = Path("build/seaice_source.bin")
          data = p.read_bytes()
          print("magic=", data[:8])
          if data.startswith(b"PK"):
              with zipfile.ZipFile(p) as zf:
                  names = zf.namelist()
                  print("xlsx_zip_members=", len(names))
                  workbook = ET.fromstring(zf.read("xl/workbook.xml"))
                  ns = {"m": "http://schemas.openxmlformats.org/spreadsheetml/2006/main"}
                  sheets = [
                      el.attrib["name"]
                      for el in workbook.findall("m:sheets/m:sheet", ns)
                  ]
                  print("workbook_sheets=", sheets)
          else:
              text = data.decode("utf-8", errors="replace")
              print("first_lines=")
              for line in text.splitlines()[:8]:
                  print(line)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: palmer-regional-local-mechanism
          path: |
            build/static_habitat_result.json
            build/seaice_source.bin
