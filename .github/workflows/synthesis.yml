name: synthesis

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - manuscript/ecosphere-reframe-v0.4
    paths:
      - "src/mina/synthesis.py"
      - "contracts/PALMER_ISLAND_ECOLOGY_SYNTHESIS_V3.json"
      - "docs/MANUSCRIPT_SPINE_V3.md"
      - "results/*.json"
      - ".github/workflows/synthesis.yml"
  pull_request:
    paths:
      - "src/mina/synthesis.py"
      - "contracts/PALMER_ISLAND_ECOLOGY_SYNTHESIS_V3.json"
      - "docs/MANUSCRIPT_SPINE_V3.md"
      - "results/*.json"
      - ".github/workflows/synthesis.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: |
          mina-synthesis \
            --results results \
            --out-json build/PALMER_ISLAND_ECOLOGY_SYNTHESIS_V3.json \
            --out-md build/PALMER_ISLAND_ECOLOGY_SYNTHESIS_V3.md
      - run: cat build/PALMER_ISLAND_ECOLOGY_SYNTHESIS_V3.md
      - uses: actions/upload-artifact@v4
        with:
          name: palmer-island-ecology-synthesis-v3
          path: build/PALMER_ISLAND_ECOLOGY_SYNTHESIS_V3.*
