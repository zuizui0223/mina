name: synthesis
on:
  push:
    branches: [synthesis/island-ecology-paper-v1]
  pull_request:
    paths:
      - "src/mina/synthesis.py"
      - "contracts/PALMER_ISLAND_ECOLOGY_SYNTHESIS_V1.json"
      - "docs/MANUSCRIPT_SPINE_V1.md"
      - "results/*.json"
      - ".github/workflows/synthesis.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: |
          mina-synthesis \
            --results results \
            --out-json build/PALMER_ISLAND_ECOLOGY_SYNTHESIS_V1.json \
            --out-md build/PALMER_ISLAND_ECOLOGY_SYNTHESIS_V1.md
      - run: cat build/PALMER_ISLAND_ECOLOGY_SYNTHESIS_V1.md
      - uses: actions/upload-artifact@v4
        with:
          name: palmer-island-ecology-synthesis
          path: build/PALMER_ISLAND_ECOLOGY_SYNTHESIS_V1.*
