name: synthesis

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - validation/neff-circular-shift-v1
    paths:
      - "src/mina/synthesis.py"
      - "contracts/PALMER_ISLAND_ECOLOGY_SYNTHESIS_V4.json"
      - "docs/MANUSCRIPT_SPINE_V4.md"
      - "results/*.json"
      - ".github/workflows/synthesis.yml"
  pull_request:
    paths:
      - "src/mina/synthesis.py"
      - "contracts/PALMER_ISLAND_ECOLOGY_SYNTHESIS_V4.json"
      - "docs/MANUSCRIPT_SPINE_V4.md"
      - "results/*.json"
      - ".github/workflows/synthesis.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: |
          mina-synthesis \
            --results results \
            --out-json build/PALMER_ISLAND_ECOLOGY_SYNTHESIS_V4.json \
            --out-md build/PALMER_ISLAND_ECOLOGY_SYNTHESIS_V4.md
      - run: cat build/PALMER_ISLAND_ECOLOGY_SYNTHESIS_V4.md
      - uses: actions/upload-artifact@v4
        with:
          name: palmer-island-ecology-synthesis-v4
          path: build/PALMER_ISLAND_ECOLOGY_SYNTHESIS_V4.*
