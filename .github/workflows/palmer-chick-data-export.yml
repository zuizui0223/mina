name: palmer-chick-data-export

on:
  push:
    branches:
      - analysis/palmer-colony-extinction-hazard-v1
    paths:
      - ".github/workflows/palmer-chick-data-export.yml"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch adult and chick censuses
        run: |
          python scripts/fetch_lter_census.py build/adelie_census.csv
          python scripts/fetch_lter_chick_counts.py build/adelie_chicks.csv
      - name: Basic receipt
        run: |
          python - <<'PY'
          import csv
          for path in ("build/adelie_census.csv","build/adelie_chicks.csv"):
              with open(path,encoding="utf-8-sig",newline="") as f:
                  rows=list(csv.DictReader(f))
              print(path,len(rows),rows[0] if rows else None)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: palmer-chick-data-export
          path: |
            build/adelie_census.csv
            build/adelie_chicks.csv
