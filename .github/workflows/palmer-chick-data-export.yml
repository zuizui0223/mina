name: palmer-chick-data-export
on:
  push:
    branches: [analysis/palmer-colony-extinction-hazard-v1]
    paths: [".github/workflows/palmer-chick-data-export.yml"]
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe EDI package
        run: |
          mkdir -p build
          curl -L --fail --max-time 90 -o build/metadata.xml "https://pasta.lternet.edu/package/metadata/eml/knb-lter-pal/88/9" || true
          curl -L --fail --max-time 90 -o build/data_index.txt "https://pasta.lternet.edu/package/data/eml/knb-lter-pal/88/9" || true
          wc -c build/* || true
          head -c 3000 build/data_index.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: palmer-chick-data-probe
          path: build/*
