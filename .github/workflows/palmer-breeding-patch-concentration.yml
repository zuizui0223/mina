name: palmer-breeding-patch-concentration

on:
  push:
    branches:
      - analysis/breeding-patch-concentration-v1
    paths:
      - "src/mina/breeding_patch_concentration.py"
      - "tests/test_breeding_patch_concentration.py"
      - "contracts/PALMER_BREEDING_PATCH_CONCENTRATION_V1.json"
      - ".github/workflows/palmer-breeding-patch-concentration.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/mina/breeding_patch_concentration.py"
      - "tests/test_breeding_patch_concentration.py"
      - "contracts/PALMER_BREEDING_PATCH_CONCENTRATION_V1.json"
      - ".github/workflows/palmer-breeding-patch-concentration.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Run concentration unit tests
        run: python -m pytest tests/test_breeding_patch_concentration.py
      - name: Fetch frozen Palmer census
        run: python scripts/fetch_lter_census.py build/adelie_census.csv
      - name: Run 100k concentration null
        run: |
          mina-breeding-patch-concentration \
            --census build/adelie_census.csv \
            --out build/breeding_patch_concentration_result.json \
            --simulations 100000 \
            --seed 20260928 \
            --batch-size 2000
      - name: Print key result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(
              Path("build/breeding_patch_concentration_result.json").read_text()
          )
          print("observed=",json.dumps(x["observed"],sort_keys=True))
          for name,model in x["error_models"].items():
              print(
                  name,
                  "joint_p=",
                  model["joint_all_three_as_or_more_negative_probability"],
              )
              for island,item in model["island_slopes"].items():
                  print(
                      " ",
                      island,
                      "obs=",item["observed_slope"],
                      "p=",item["one_sided_probability_le_observed"],
                  )
          print("decision=",json.dumps(x["decision"],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: palmer-breeding-patch-concentration
          path: |
            build/adelie_census.csv
            build/breeding_patch_concentration_result.json
