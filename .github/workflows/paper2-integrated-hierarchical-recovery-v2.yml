name: paper2-integrated-hierarchical-recovery-v2

concurrency:
  group: paper2-integrated-hierarchical-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [analysis/paper2-integrated-hierarchical-v2]
    paths:
      - "scripts/simulate_paper2_integrated_hierarchical_recovery.py"
      - "tests/test_paper2_integrated_hierarchical_recovery.py"
      - "contracts/PAPER2_INTEGRATED_HIERARCHICAL_RECOVERY_V2.json"
      - ".github/workflows/paper2-integrated-hierarchical-recovery-v2.yml"
  pull_request:
    paths:
      - "scripts/simulate_paper2_integrated_hierarchical_recovery.py"
      - "tests/test_paper2_integrated_hierarchical_recovery.py"
      - "contracts/PAPER2_INTEGRATED_HIERARCHICAL_RECOVERY_V2.json"
      - ".github/workflows/paper2-integrated-hierarchical-recovery-v2.yml"
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pandas pyreadr
      - name: Run hierarchical integrated recovery tests
        run: python -m unittest tests.test_paper2_integrated_hierarchical_recovery -v
      - name: Fetch pinned mapppdr
        run: |
          git clone --quiet https://github.com/CCheCastaldo/mapppdr.git build/mapppdr
          git -C build/mapppdr checkout --quiet 88c73a507e0921b2541c218c71eaf16721bc6502
      - name: Download frozen outcome-blind inputs
        run: |
          mkdir -p build/forcing build/options
          gh run download 36517700369 -n paper2-forcing-support-audit-v1 -D build/forcing
          gh run download 36520281872 -n antarctic-breeding-options-hierarchy-v1 -D build/options
          test -f build/forcing/PAPER2_FORCING_SUPPORT_AUDIT_RESULT_V1.json
          test -f build/forcing/PAPER2_FORCING_SUPPORT_UNITS_V1.csv
          test -f build/options/ANTARCTIC_PENGUIN_BREEDING_OPTIONS_HIERARCHY_V1.csv
      - name: Run hierarchical integrated recovery confirmation
        run: |
          set +e
          python -m scripts.simulate_paper2_integrated_hierarchical_recovery \
            --forcing-json build/forcing/PAPER2_FORCING_SUPPORT_AUDIT_RESULT_V1.json \
            --forcing-csv build/forcing/PAPER2_FORCING_SUPPORT_UNITS_V1.csv \
            --breeding-csv build/options/ANTARCTIC_PENGUIN_BREEDING_OPTIONS_HIERARCHY_V1.csv \
            --latent-recovery-json results/PAPER2_LATENT_FACTOR_RECOVERY_RESULT_V1.json \
            --mapppdr-dir build/mapppdr \
            --out-json build/PAPER2_INTEGRATED_HIERARCHICAL_RECOVERY_RESULT_V2.json \
            --replicates 100
          status=$?
          echo "$status" > build/hierarchical_status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper2-integrated-hierarchical-recovery-v2
          path: |
            build/PAPER2_INTEGRATED_HIERARCHICAL_RECOVERY_RESULT_V2.json
            build/hierarchical_status.txt
      - name: Enforce hierarchical recovery gate
        run: |
          python - <<'PY'
          import json
          result=json.load(open("build/PAPER2_INTEGRATED_HIERARCHICAL_RECOVERY_RESULT_V2.json"))
          assert result["decision"]["hierarchical_core_passed"] is True, result["decision"]
          assert result["decision"]["no_real_demographic_count_magnitudes_opened"] is True
          print("Hierarchical Gate 2E-C v2 core passed; counts remain locked pending observation-source sensitivity.")
          PY
