name: V29 direct native DEEP-AA coastal opportunity atlas
on:
  push:
    branches: [analysis/pygoscelis-count-functional-sensitivity-20261126]
    paths: ['.github/workflows/macro-coastal-polynya-v29.yml']
permissions:
  contents: read
  actions: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native daily map and geodesic libraries
        run: python -m pip install --disable-pip-version-check numpy scipy netCDF4 pyproj==3.7.1
      - name: Retrieve exact frozen frame and old validation archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15169338322/zip" > frame.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13669533413/zip" > atlas.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14926710177/zip" > oldwinter.zip
      - name: Download original recommended publisher archive
        run: |
          set -euo pipefail
          curl -fL --retry 2 --retry-delay 3 --connect-timeout 40 --max-time 600 --max-filesize 310000000 --user-agent 'Mozilla/5.0 (compatible; AntarcticScientificResearch/1.0)' --output deepaa.zip 'https://zenodo.org/records/13358042/files/SIC60_6.25km_20d.zip?download=1'
          echo "b05a36aa4e775d69c06e2ffa897a8de8a20318b65f6478298167f73cc9f7c3f9  deepaa.zip" | sha256sum -c
          echo "f3f958389cc5e67ac1c4e3a6ee164318  deepaa.zip" | md5sum -c
      - name: Extract direct daily coastal polynya exposure on fixed grid
        run: python research/macro_marine_land_footprint_v1/native_polynya_tiles_v29.py frame.zip atlas.zip oldwinter.zip deepaa.zip v29_result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro-coastal-polynya-v29
          path: v29_result/
          retention-days: 30
          if-no-files-found: warn
