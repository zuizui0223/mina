name: paper3-emperor-zenodo-longterm-support

on:
  push:
    branches: [research/emperor-mobile-islands-v1]
    paths:
      - "contracts/PAPER3_ZENODO_LONGTERM_SUPPORT_V1.json"
      - "scripts/audit_emperor_zenodo_longterm_support.py"
      - "tests/test_emperor_zenodo_longterm_support.py"
      - ".github/workflows/paper3-emperor-zenodo-longterm-support.yml"
  pull_request:
    paths:
      - "contracts/PAPER3_ZENODO_LONGTERM_SUPPORT_V1.json"
      - "scripts/audit_emperor_zenodo_longterm_support.py"
      - "tests/test_emperor_zenodo_longterm_support.py"
      - ".github/workflows/paper3-emperor-zenodo-longterm-support.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas openpyxl requests pyshp pyproj remotezip
      - run: python -m unittest tests.test_emperor_zenodo_longterm_support -v
      - name: Audit Zenodo catalog and remote shapefile archive
        run: |
          mkdir -p build/out
          python scripts/audit_emperor_zenodo_longterm_support.py \
            --contract contracts/PAPER3_ZENODO_LONGTERM_SUPPORT_V1.json \
            --out-json build/out/PAPER3_ZENODO_LONGTERM_SUPPORT_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper3-emperor-zenodo-longterm-support-v1
          path: build/out/*
          if-no-files-found: warn
