name: paper2-integrated-recovery

concurrency:
  group: paper2-integrated-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [analysis/paper2-integrated-recovery-v2]
    paths:
      - "scripts/simulate_paper2_integrated_recovery.py"
      - "tests/test_paper2_integrated_recovery.py"
      - "contracts/PAPER2_INTEGRATED_RECOVERY_V1.json"
      - "results/PAPER2_LATENT_FACTOR_RECOVERY_RESULT_V1.json"
      - ".github/workflows/paper2-integrated-recovery.yml"
  pull_request:
    paths:
      - "scripts/simulate_paper2_integrated_recovery.py"
      - "tests/test_paper2_integrated_recovery.py"
      - "contracts/PAPER2_INTEGRATED_RECOVERY_V1.json"
      - "results/PAPER2_LATENT_FACTOR_RECOVERY_RESULT_V1.json"
      - ".github/workflows/paper2-integrated-recovery.yml"
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pandas pyreadr
      - name: Run integrated-recovery tests
        run: python -m unittest tests.test_paper2_integrated_recovery -v
      - name: Fetch pinned mapppdr
        run: |
          git clone --quiet https://github.com/CCheCastaldo/mapppdr.git build/mapppdr
          git -C build/mapppdr checkout --quiet 88c73a507e0921b2541c218c71eaf16721bc6502
      - name: Download frozen outcome-blind inputs
        run: |
          mkdir -p build/forcing build/options
          gh run download 36517700369 -n paper2-forcing-support-audit-v1 -D build/forcing
          gh run download 36520281872 -n antarctic-breeding-options-hierarchy-v1 -D build/options
          test -f build/forcing/PAPER2_FORCING_SUPPORT_AUDIT_RESULT_V1.json
          test -f build/forcing/PAPER2_FORCING_SUPPORT_UNITS_V1.csv
          test -f build/options/ANTARCTIC_PENGUIN_BREEDING_OPTIONS_HIERARCHY_V1.csv
      - name: Reproduce frozen Gate 2E-C v1 failure
        run: |
          set +e
          python -m scripts.simulate_paper2_integrated_recovery \
            --forcing-json build/forcing/PAPER2_FORCING_SUPPORT_AUDIT_RESULT_V1.json \
            --forcing-csv build/forcing/PAPER2_FORCING_SUPPORT_UNITS_V1.csv \
            --breeding-csv build/options/ANTARCTIC_PENGUIN_BREEDING_OPTIONS_HIERARCHY_V1.csv \
            --latent-recovery-json results/PAPER2_LATENT_FACTOR_RECOVERY_RESULT_V1.json \
            --mapppdr-dir build/mapppdr \
            --out-json build/PAPER2_INTEGRATED_RECOVERY_RESULT_V1.json \
            --replicates 100
          status=$?
          set -e
          test "$status" -ne 0
          python - <<'PY'
          import json
          result=json.load(open("build/PAPER2_INTEGRATED_RECOVERY_RESULT_V1.json"))
          assert result["decision"]["counts_may_be_opened"] is False
          assert result["decision"]["primary_observation_gate_passed"] is True
          assert result["decision"]["all_species_have_integrated_scale"] is False
          print("Gate 2E-C v1 failure reproduced; real outcomes remain locked.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paper2-integrated-recovery-v1
          path: build/PAPER2_INTEGRATED_RECOVERY_RESULT_V1.json
