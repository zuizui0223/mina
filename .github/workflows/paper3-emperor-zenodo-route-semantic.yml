name: paper3-emperor-zenodo-route-semantic

on:
  push:
    branches: [research/emperor-mobile-islands-v1]
    paths:
      - "contracts/PAPER3_ZENODO_ROUTE_POINT_SEMANTIC_V1.json"
      - "scripts/validate_emperor_zenodo_route_points.py"
      - "tests/test_emperor_zenodo_route_points.py"
      - ".github/workflows/paper3-emperor-zenodo-route-semantic.yml"
  pull_request:
    paths:
      - "contracts/PAPER3_ZENODO_ROUTE_POINT_SEMANTIC_V1.json"
      - "scripts/validate_emperor_zenodo_route_points.py"
      - "tests/test_emperor_zenodo_route_points.py"
      - ".github/workflows/paper3-emperor-zenodo-route-semantic.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas pyshp pyproj remotezip
      - run: python -m unittest tests.test_emperor_zenodo_route_points -v
      - name: Validate route-point semantics
        run: |
          mkdir -p build/out
          python scripts/validate_emperor_zenodo_route_points.py \
            --contract contracts/PAPER3_ZENODO_ROUTE_POINT_SEMANTIC_V1.json \
            --out-json build/out/PAPER3_ZENODO_ROUTE_POINT_SEMANTIC_RESULT_V1.json \
            --out-csv build/out/PAPER3_ZENODO_ROUTE_COLONY_POINTS_V1.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper3-emperor-zenodo-route-semantic-v1
          path: build/out/*
          if-no-files-found: warn
