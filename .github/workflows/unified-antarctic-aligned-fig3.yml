name: Antarctic aligned change field figure
on:
  push:
    branches: [analysis/unified-breeding-reorganization-20261125]
    paths:
      - 'research/unified_breeding_reorganization_v1/render_aligned_fig3_v06.py'
      - 'research/unified_breeding_reorganization_v1/GEOGRAPHIC_COVERAGE_FIG3_V0_6.csv'
      - '.github/workflows/unified-antarctic-aligned-fig3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy matplotlib pillow
      - run: python research/unified_breeding_reorganization_v1/render_aligned_fig3_v06.py --out build/antarctic-aligned-fig3
      - uses: actions/upload-artifact@v4
        with:
          name: antarctic-aligned-fig3-v06
          path: build/antarctic-aligned-fig3/
