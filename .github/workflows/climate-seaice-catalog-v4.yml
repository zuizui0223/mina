name: climate-seaice-catalog-v4
on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - 'research/climate-penguin/work/climate_penguin/seaice_catalog_probe_v4.py'
      - 'tests/test_seaice_catalog_probe_v4.py'
      - '.github/workflows/climate-seaice-catalog-v4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: pytest -q tests/test_seaice_catalog_probe_v4.py
      - run: python research/climate-penguin/work/climate_penguin/seaice_catalog_probe_v4.py --out /tmp/seaice-catalog
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seaice-original-monthly-catalog-v4
          path: /tmp/seaice-catalog/
          retention-days: 30
          if-no-files-found: error
