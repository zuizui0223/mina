name: climate-penguin-nonoverlap-decade-benchmark-v1
on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - "research/climate-penguin/work/seaice_nonoverlap_decade_v1/**"
      - "research/climate-penguin/outputs/seaice_nonoverlap_decade_v1/**"
      - ".github/workflows/climate-penguin-nonoverlap-decade-v1.yml"
  pull_request:
    paths:
      - "research/climate-penguin/work/seaice_nonoverlap_decade_v1/**"
      - "research/climate-penguin/outputs/seaice_nonoverlap_decade_v1/**"
      - ".github/workflows/climate-penguin-nonoverlap-decade-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independently-benchmarked-decade-climate-novelty:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce 3 independent historical decades and 39-site projected SIC benchmark
        run: node research/climate-penguin/work/seaice_nonoverlap_decade_v1/build.mjs --check-receipt
      - name: Archive all site×model×margin and source decade diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: penguin-seaice-independent-decade-benchmark-v1
          path: |
            research/climate-penguin/outputs/seaice_nonoverlap_decade_v1/*.csv
            research/climate-penguin/outputs/seaice_nonoverlap_decade_v1/*.json
          if-no-files-found: error
          retention-days: 60
