name: Antarctic original Hart cross-island CopDEM terrain transfer V27
on:
  push:
    branches: [research/antarctic-functional-archipelago-v1]
    paths:
      - 'contracts/BAS_HART_DEM_SPECIES_TRANSFER_V27.md'
      - 'scripts/evaluate_hart_species_copdem_transfer_v27.py'
      - 'tests/test_hart_species_copdem_transfer_v27.py'
      - '.github/workflows/antarctic-hart-terrain-transfer-v27.yml'
  pull_request:
    paths:
      - 'contracts/BAS_HART_DEM_SPECIES_TRANSFER_V27.md'
      - 'scripts/evaluate_hart_species_copdem_transfer_v27.py'
      - 'tests/test_hart_species_copdem_transfer_v27.py'
      - '.github/workflows/antarctic-hart-terrain-transfer-v27.yml'
  workflow_dispatch:
jobs:
  original_geographical_parent_island_holdout_terrain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original nest, terrain statistics and tests
        run: python -m pip install numpy scipy scikit-learn pytest
      - name: Test source-locality-normalized terrain and three island holdouts
        run: python -m pytest -q tests/test_hart_species_copdem_transfer_v27.py
      - name: Retrieve original signed CopDEM 122139 penguin nest terrain source arrays
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/copdem-verified-v26
          gh run download 40279185790 --repo "$GITHUB_REPOSITORY" \
            --name bas-original-nest-independent-CopDEM-terrain-v26 \
            --dir /tmp/copdem-verified-v26
      - name: Evaluate source-frozen leave-one-physical-island-candidate-out species terrain transfer
        run: |
          python scripts/evaluate_hart_species_copdem_transfer_v27.py \
            --v26 /tmp/copdem-verified-v26/BAS_HART_PUBLIC_GLO30_NEST_TERRAIN_V26.json \
            --point-terrain /tmp/copdem-verified-v26/BAS_HART_PUBLIC_GLO30_NEST_TERRAIN_V26.npz \
            --out /tmp/BAS_HART_ORIGINAL_ISLAND_TERRAIN_SPECIES_TRANSFER_V27.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bas-hart-original-cross-island-source-dem-transfer-v27
          path: /tmp/BAS_HART_ORIGINAL_ISLAND_TERRAIN_SPECIES_TRANSFER_V27.json
          if-no-files-found: warn
