name: neff-momentum

on:
  push:
    branches:
      - analysis/neff-momentum-v1
    paths:
      - "src/mina/neff_momentum.py"
      - "tests/test_neff_momentum.py"
      - "contracts/PALMER_NEFF_MOMENTUM_V1.json"
      - ".github/workflows/neff-momentum.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/mina/neff_momentum.py"
      - "tests/test_neff_momentum.py"
      - "contracts/PALMER_NEFF_MOMENTUM_V1.json"
      - ".github/workflows/neff-momentum.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Run momentum unit tests
        run: python -m pytest tests/test_neff_momentum.py
      - name: Fetch frozen Palmer census
        run: python scripts/fetch_lter_census.py build/adelie_census.csv
      - name: Run demographic-momentum sensitivity
        run: |
          mina-neff-momentum \
            --census build/adelie_census.csv \
            --out build/neff_momentum_result.json \
            --simulations 100000 \
            --seed 20260927
      - name: Print key results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          x=json.loads(Path("build/neff_momentum_result.json").read_text())
          for key in ("lag1","lag1_lag2"):
              m=x["momentum_models"][key]
              s=x["structured_null_reuse"][key]
              print(
                  key,
                  "n=",m["n_rows"],
                  "beta=",m["standardized_neff_beta"],
                  "gain=",m["loyo"]["mse_gain_C0_minus_C1"],
                  "independent_p=",s["independent_full_series_circular_shift"]["one_sided_p"],
                  "joint_p=",s["joint_full_series_exact_shift"]["exact_one_sided_p"],
              )
          print("effect_retention=",json.dumps(x["effect_retention"],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: palmer-neff-momentum
          path: |
            build/adelie_census.csv
            build/neff_momentum_result.json
