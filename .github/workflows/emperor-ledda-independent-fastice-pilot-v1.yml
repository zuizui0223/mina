name: Ledda independent fast-ice physical context pilot
on:
  push:
    branches:
      - research/emperor-unused-refuge-temporal-test-v1
    paths:
      - 'contracts/EMPEROR_LEDDA_INDEPENDENT_FASTICE_2011_PILOT_V1.json'
      - 'scripts/audit_ledda_independent_fastice_2011_v1.py'
      - 'tests/test_ledda_independent_fastice_2011_v1.py'
      - '.github/workflows/emperor-ledda-independent-fastice-pilot-v1.yml'
  workflow_dispatch:
jobs:
  independent-ice-source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install science reader
        run: python -m pip install numpy pytest netCDF4 pyproj
      - name: Verify synthetic gates before reading any physical data
        run: python -m pytest -q tests/test_ledda_independent_fastice_2011_v1.py
      - name: Download exact independent v2.2 2011 fast-ice annual source
        env:
          FASTICE_2011: https://public.services.aad.gov.au/datasets/science/AAS_4116_Fraser_fastice_circumantarctic/fastice_v2_2/FastIce_70_2011.nc
        run: |
          set -e
          if curl -fL -sS --retry 1 --connect-timeout 20 --max-time 600 "$FASTICE_2011" -o /tmp/FastIce_70_2011.nc; then
            printf 'SOURCE_HTTP_OK size_bytes=%s\n' "$(wc -c </tmp/FastIce_70_2011.nc)"
          else
            rm -f /tmp/FastIce_70_2011.nc
            echo 'HOLD_PHYSICAL_SOURCE_NOT_DOWNLOADED' | tee /tmp/ledda_fastice_source_hold.txt
          fi
      - name: Extract fixed-centroid context only if file verified
        run: |
          set -e
          if [ -s /tmp/FastIce_70_2011.nc ]; then
            python scripts/audit_ledda_independent_fastice_2011_v1.py \
              --input /tmp/FastIce_70_2011.nc \
              --out /tmp/ledda_independent_fastice_2011_receipt.json
            python - <<'PY'
          import json
          d=json.load(open('/tmp/ledda_independent_fastice_2011_receipt.json'))
          assert d["site"]=="LEDD" and d["image_date"]=="2011-09-23"
          assert d["radii_km_frozen_before_raster_result"]==[1,3,5]
          assert len(d["source_sha256"])==64
          assert d["map_count"]>=20
          assert d["map_bracketing"]["latest_label_on_or_before_image"] is not None
          assert d["map_bracketing"]["first_label_after_image"] is not None
          assert not d["season_long_breeding_ice_confirmed"]
          assert not d["penguin_recruitment_or_causal_social_effect_identified"]
          print("INDEPENDENT_FASTICE_MAP_CONTEXT_PASS_BUT_NOT_CAUSAL_RESULT")
          PY
          else
            echo 'HOLD_NO_VALID_INDEPENDENT_NETCDF__NO_PHYSICAL_RESULT'
          fi
      - name: Upload only compact physical receipt or honest HOLD
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ledda-independent-fastice-2011-pilot
          path: |
            /tmp/ledda_independent_fastice_2011_receipt.json
            /tmp/ledda_fastice_source_hold.txt
          if-no-files-found: ignore
          retention-days: 30
