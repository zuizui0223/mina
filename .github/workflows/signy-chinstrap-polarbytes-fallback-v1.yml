name: Signy Chinstrap PolarBytes fallback v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "contracts/SIGNY_CHINSTRAP_OUTPUT_TO_ALLOCATION_V1.md"
      - ".github/workflows/signy-chinstrap-polarbytes-fallback-v1.yml"

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve public PolarBytes mirror and extract Chinstrap table
        run: |
          set -euo pipefail
          python - <<'PY'
          import pandas as pd
          import requests
          from pathlib import Path

          url = "https://polarbytes.umk.edu.my/chinstrap"
          html = requests.get(url, timeout=60)
          html.raise_for_status()
          Path("build").mkdir(exist_ok=True)
          Path("build/chinstrap.html").write_bytes(html.content)

          tables = pd.read_html(html.text)
          matches = []
          for df in tables:
              cols = [str(c).strip() for c in df.columns]
              if "Species" in cols and "Colony" in cols and "Season" in cols and "Total number of fledglings" in cols:
                  matches.append(df)
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one Chinstrap table, found {len(matches)}")
          df = matches[0]
          if len(df) != 466:
              raise SystemExit(f"expected 466 rows, found {len(df)}")
          if set(df["Species"].dropna().astype(str)) != {"Chinstrap penguin"}:
              raise SystemExit("unexpected species labels")
          expected = {
              "Colony","Season","Total number of pairs","Total number of fledglings","Comments"
          }
          missing = expected - set(map(str, df.columns))
          if missing:
              raise SystemExit(f"missing expected columns: {sorted(missing)}")
          df.to_csv("build/signy_chinstrap_polarbytes.csv", index=False)
          print("rows",len(df))
          print("columns",list(df.columns))
          print("colonies",sorted(df["Colony"].dropna().astype(str).unique()))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: signy-chinstrap-polarbytes-fallback-v1
          path: |
            build/signy_chinstrap_polarbytes.csv
            build/chinstrap.html
