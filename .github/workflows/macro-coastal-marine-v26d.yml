name: V26d exact original sea ice source route recovery
on:
  push:
    branches: [analysis/pygoscelis-count-functional-sensitivity-20261126]
    paths: ['.github/workflows/macro-coastal-marine-v26d.yml']
permissions:
  contents: read
  actions: read
jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native satellite data readers
        run: python -m pip install --disable-pip-version-check numpy scipy pyproj==3.7.1 xarray netCDF4
      - name: Recover all pinned original months using documented source routes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15169338322/zip" > frame.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13671496095/zip" > ice_reference.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15169837655/zip" > pilot.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15170577277/zip" > routes.zip
          python research/macro_marine_land_footprint_v1/macro_rock_marine_30yr_v26d.py frame.zip ice_reference.zip v26d_result 13bfe5866a27f6fbfad681ed4a44d834f6019c663f94193e1039e96b81c22060 pilot.zip routes.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro-coastal-marine-v26d
          path: v26d_result/
          retention-days: 30
          if-no-files-found: warn
