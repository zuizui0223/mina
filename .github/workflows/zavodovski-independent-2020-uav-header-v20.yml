name: Zavodovski 2020 independent UAV nest source headers V20
on:
  push:
    branches: [research/zavodovski-site-exchange-v1]
    paths:
      - 'scripts/audit_zavodovski_2020_uav_nest_headers_v20.py'
      - 'tests/test_zavodovski_2020_uav_nest_headers_v20.py'
      - '.github/workflows/zavodovski-independent-2020-uav-header-v20.yml'
  pull_request:
    paths:
      - 'scripts/audit_zavodovski_2020_uav_nest_headers_v20.py'
      - 'tests/test_zavodovski_2020_uav_nest_headers_v20.py'
      - '.github/workflows/zavodovski-independent-2020-uav-header-v20.yml'
  workflow_dispatch:
jobs:
  source-schema-only:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema-only dependencies
        run: python -m pip install requests pytest
      - name: Prove first-header-only source and year identity logic on invented CSV
        run: python -m pytest -q tests/test_zavodovski_2020_uav_nest_headers_v20.py
      - name: Retrieve authentic publisher CSV headers without bird rows
        run: python scripts/audit_zavodovski_2020_uav_nest_headers_v20.py --out /tmp/zavodovski_2020_uav_source_v20.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zavodovski-2020-uav-header-only-v20
          path: /tmp/zavodovski_2020_uav_source_v20.json
