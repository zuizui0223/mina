name: Antarctic original Adélie mapped colony DBF count-field source QA V14
on:
  push:
    branches: [research/antarctic-functional-archipelago-v1]
    paths:
      - 'contracts/AADC_V14_POLYGON_COUNT_SOURCE_ELIGIBILITY.md'
      - 'scripts/audit_aadc_v10_original_count_dbf_schema_v14.py'
      - 'tests/test_aadc_v10_original_count_dbf_schema_v14.py'
      - '.github/workflows/antarctic-aadc-colony-count-source-v14.yml'
  pull_request:
    paths:
      - 'contracts/AADC_V14_POLYGON_COUNT_SOURCE_ELIGIBILITY.md'
      - 'scripts/audit_aadc_v10_original_count_dbf_schema_v14.py'
      - 'tests/test_aadc_v10_original_count_dbf_schema_v14.py'
      - '.github/workflows/antarctic-aadc-colony-count-source-v14.yml'
  workflow_dispatch:
jobs:
  publisher_original_fields_only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source field schema test tool
        run: python -m pip install pytest
      - name: Confirm nest-count semantic field versus footprint attribute distinctions
        run: python -m pytest -q tests/test_aadc_v10_original_count_dbf_schema_v14.py
      - name: Recover original AADC georeferenced colony DBF attribute names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/aadc-original-dbfs
          gh run download 40257955794 --repo "$GITHUB_REPOSITORY" \
            --name original-AADC-adelie-repeated-colony-boundary-v10 --dir /tmp/aadc-original-dbfs
      - name: Count original site-year pairs with independently measurable nest count fields
        run: |
          python scripts/audit_aadc_v10_original_count_dbf_schema_v14.py \
            --v10-source-siteyears /tmp/aadc-original-dbfs/AADC_ADPE_ORIGINAL_28_SITE_YEAR_V10.csv \
            --out /tmp/AADC_ORIGINAL_GIS_COUNT_FIELDS_V14.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-aadc-colony-dbf-count-field-v14
          path: /tmp/AADC_ORIGINAL_GIS_COUNT_FIELDS_V14.json
          if-no-files-found: warn
