name: palmer-seaice-timescale-separation

on:
  push:
    branches:
      - analysis/seaice-timescale-separation-v1
  pull_request:
    paths:
      - "src/mina/timescale.py"
      - "tests/test_timescale.py"
      - "contracts/PALMER_SEAICE_TIMESCALE_SEPARATION_V1.json"
      - ".github/workflows/palmer-seaice-timescale-separation.yml"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python scripts/fetch_lter_census.py build/adelie_census.csv
      - run: python scripts/fetch_seaice_mirror.py build/seaice.csv
      - name: Run frozen timescale-separation test
        run: |
          python -m mina.timescale \
            --census build/adelie_census.csv \
            --seaice build/seaice.csv \
            --out build/timescale_result.json
      - name: Print result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("build/timescale_result.json").read_text())
          print("decision=",x["decision"])
          print("primary=",json.dumps(x["primary"],indent=2,sort_keys=True))
          for k,v in x["robustness"].items():
              print(k,"gain=",v["validation"]["gain_T0_minus_T1"],
                    "beta=",v["full_fit"]["seaice_beta_T1"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: palmer-seaice-timescale-separation
          path: build/timescale_result.json
