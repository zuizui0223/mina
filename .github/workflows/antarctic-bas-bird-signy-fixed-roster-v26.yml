name: Antarctic V26 original BAS Bird-Signy fixed colony roster temporal QA
on:
  push:
    branches: [research/antarctic-penguin-island-macro-v1]
    paths:
      - 'contracts/BAS_BIRD_SIGNY_FIXED_ROSTER_V26.md'
      - 'scripts/check_bas_bird_signy_fixed_roster_v26.py'
      - 'tests/test_bas_bird_signy_fixed_roster_v26.py'
      - '.github/workflows/antarctic-bas-bird-signy-fixed-roster-v26.yml'
  pull_request:
    paths:
      - 'contracts/BAS_BIRD_SIGNY_FIXED_ROSTER_V26.md'
      - 'scripts/check_bas_bird_signy_fixed_roster_v26.py'
      - 'tests/test_bas_bird_signy_fixed_roster_v26.py'
      - '.github/workflows/antarctic-bas-bird-signy-fixed-roster-v26.yml'
  workflow_dispatch:
jobs:
  original_BAS_frozen_baseline_roster_source_effect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official BAS source readers and synthetic tests
        run: python -m pip install pytest requests
      - name: Check anchored colony roster and no-contaminated missing count rules
        run: python -m pytest -q tests/test_bas_bird_signy_fixed_roster_v26.py
      - name: Original BAS SHA files, exact V25 numerical replay and fixed-roster sensitivity
        run: |
          python scripts/check_bas_bird_signy_fixed_roster_v26.py \
            --json /tmp/BAS_BIRD_SIGNY_FIXED_SOURCE_ROSTER_V26.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-bas-bird-signy-fixed-baseline-roster-v26
          path: /tmp/BAS_BIRD_SIGNY_FIXED_SOURCE_ROSTER_V26.json
