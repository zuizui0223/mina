name: climate-penguin-palmer-furseal-original-source-v1
on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - ".github/workflows/climate-penguin-palmer-furseal-original-source-v1.yml"
      - "research/climate-penguin/work/climate_penguin/audit_palmer_dryad_furseal_source_v1.py"
      - "research/climate-penguin/contracts/PALMER_DRYAD_FURSEAL_ORIGINAL_SOURCE_V1.md"
      - "tests/test_palmer_dryad_furseal_source_v1.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-published-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pytest
      - run: python -m pytest -q tests/test_palmer_dryad_furseal_source_v1.py
      - name: Retrieve official Dryad public wildlife and survey shapefile sources
        run: |
          python research/climate-penguin/work/climate_penguin/audit_palmer_dryad_furseal_source_v1.py \
            --output "${{ runner.temp }}/palmer_2020_furseal_original"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: climate-penguin-palmer-original-dryad-furseal-source-v1
          path: ${{ runner.temp }}/palmer_2020_furseal_original/
          retention-days: 30
          if-no-files-found: warn
