name: penguin-signy-chinstrap-arrival-multiaxis-v1
on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - 'research/climate-penguin/work/signy_chinstrap_arrival_multiaxis_v1/**'
      - 'research/climate-penguin/outputs/signy_chinstrap_arrival_multiaxis_v1/**'
      - 'tests/test_signy_chinstrap_arrival_multiaxis_v1.py'
      - '.github/workflows/penguin-signy-chinstrap-arrival-multiaxis-v1.yml'
  pull_request:
    paths:
      - 'research/climate-penguin/work/signy_chinstrap_arrival_multiaxis_v1/**'
      - 'research/climate-penguin/outputs/signy_chinstrap_arrival_multiaxis_v1/**'
      - 'tests/test_signy_chinstrap_arrival_multiaxis_v1.py'
      - '.github/workflows/penguin-signy-chinstrap-arrival-multiaxis-v1.yml'
permissions:
  contents: read
jobs:
  original-island-year-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas lxml html5lib beautifulsoup4
      - run: python -m unittest discover -s tests -p test_signy_chinstrap_arrival_multiaxis_v1.py -v
      - name: Download seven BAS publisher archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/signy_arrival_diet_original /tmp/signy_arrival_stage_original
          curl -L --fail --retry 2 --max-time 120 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=64a8291f-8c23-4e5d-9085-c36c8d83b09a&output=zip.tree' -o /tmp/signy_arrival_original.zip
          curl -L --fail --retry 2 --max-time 120 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=eb421e6d-b93b-4174-904b-9a7b0b401403&output=zip.tree' -o /tmp/signy_arrival_diet_original/adelie.zip
          curl -L --fail --retry 2 --max-time 120 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=95e38251-797c-495a-abc0-40a613599759&output=zip.tree' -o /tmp/signy_arrival_diet_original/chinstrap.zip
          curl -L --fail --retry 2 --max-time 120 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=fb9bd975-e6fe-406c-84be-01e57d612b5e&output=zip.tree' -o /tmp/signy_arrival_diet_original/gentoo.zip
          curl -L --fail --retry 2 --max-time 120 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=daf2c4fd-c1e3-4e65-851f-d11f02c5b69d&output=zip.tree' -o /tmp/signy_arrival_stage_original/adelie.zip
          curl -L --fail --retry 2 --max-time 120 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=d0633a9b-8c56-4ae5-88bf-6ec6ba9017b9&output=zip.tree' -o /tmp/signy_arrival_stage_original/chinstrap.zip
          curl -L --fail --retry 2 --max-time 120 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=883c6b40-024e-41e8-9c3e-2668a44b5751&output=zip.tree' -o /tmp/signy_arrival_stage_original/gentoo.zip
      - name: Rebuild independent source-pinned arrival, diet and recorded chick stages
        run: |
          python research/climate-penguin/work/signy_chinstrap_arrival_effort_v2/analyze.py --original-zip /tmp/signy_arrival_original.zip --out /tmp/signy_arrival_effort
          python research/climate-penguin/work/signy_diet_climate_v1/analyze.py --source-dir /tmp/signy_arrival_diet_original --out /tmp/signy_arrival_diet
          python research/climate-penguin/work/climate_penguin/signy_trispecies_stage_source_v1.py --source-dir /tmp/signy_arrival_stage_original --out /tmp/signy_arrival_stage
      - name: Verify 13-year effective date and marine/chick data source alignment
        run: |
          SIGNY_ARRIVAL_EFFORT=/tmp/signy_arrival_effort SIGNY_DIET_DERIVED=/tmp/signy_arrival_diet SIGNY_STAGE_DERIVED=/tmp/signy_arrival_stage python -m unittest discover -s tests -p test_signy_chinstrap_arrival_multiaxis_v1.py -v
          python research/climate-penguin/work/signy_chinstrap_arrival_multiaxis_v1/analyze.py --arrival-dir /tmp/signy_arrival_effort --diet-dir /tmp/signy_arrival_diet --stage-dir /tmp/signy_arrival_stage --out /tmp/signy_arrival_multiaxis
      - uses: actions/upload-artifact@v4
        with:
          name: penguin-signy-chinstrap-arrival-multiaxis-v1
          path: /tmp/signy_arrival_multiaxis/
          retention-days: 30
