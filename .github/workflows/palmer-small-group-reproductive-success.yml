name: palmer-small-group-reproductive-success

on:
  push:
    branches:
      - analysis/palmer-small-group-reproductive-success-v1
    paths:
      - "scripts/fetch_lter_chick_counts.py"
      - "src/mina/small_group_reproductive_success.py"
      - "tests/test_small_group_reproductive_success.py"
      - "contracts/PALMER_SMALL_GROUP_REPRODUCTIVE_SUCCESS_V1.json"
      - ".github/workflows/palmer-small-group-reproductive-success.yml"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Run frozen synthetic tests
        run: pytest -q tests/test_small_group_reproductive_success.py
      - name: Fetch frozen Palmer chick census
        run: python scripts/fetch_lter_chick_counts.py build/adelie_chicks.csv
      - name: Run frozen small-group reproductive-success test
        run: |
          python -m mina.small_group_reproductive_success \
            --chicks build/adelie_chicks.csv \
            --out build/palmer_small_group_reproductive_success.json \
            --draws 100000 \
            --seed 20260929
      - name: Print receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("build/palmer_small_group_reproductive_success.json").read_text())
          p=x["primary_equal_per_pair_null"]
          e=x["effect_size"]
          print("frame=",json.dumps(x["analysis_frame"],sort_keys=True))
          print("Z=",p["observed_z"],"p=",p["one_sided_upper_p"],"supported=",p["supported"])
          print("beta=",e["beta_per_within_group_sd_log1p_pairs"])
          print("multiplier=",e["multiplicative_per_pair_success_per_1sd_larger_group"])
          print("decision=",json.dumps(x["decision"],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: palmer-small-group-reproductive-success
          path: |
            build/adelie_chicks.csv
            build/palmer_small_group_reproductive_success.json
