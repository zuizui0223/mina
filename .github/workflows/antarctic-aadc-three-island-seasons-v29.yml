name: Antarctic V29 real Mawson island colony-year structural matched-season support
on:
  push:
    branches: [research/antarctic-penguin-island-macro-v1]
    paths:
      - 'contracts/AADC_THREE_ISLAND_SEASON_PANEL_V29.md'
      - 'scripts/audit_aadc_three_island_season_v29.py'
      - 'tests/test_aadc_three_island_season_v29.py'
      - '.github/workflows/antarctic-aadc-three-island-seasons-v29.yml'
  pull_request:
    paths:
      - 'contracts/AADC_THREE_ISLAND_SEASON_PANEL_V29.md'
      - 'scripts/audit_aadc_three_island_season_v29.py'
      - 'tests/test_aadc_three_island_season_v29.py'
      - '.github/workflows/antarctic-aadc-three-island-seasons-v29.yml'
  workflow_dispatch:
jobs:
  three_original_islands_seasonal_source_metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original AADC spreadsheet read and synthetic source QA
        run: python -m pip install pytest requests openpyxl xlrd
      - name: Test exact original year parsing and count value blinding
        run: python -m pytest -q tests/test_aadc_three_island_season_v29.py
      - name: Download publisher pinned AADC original three-island and weather workbooks and audit season panel
        run: python scripts/audit_aadc_three_island_season_v29.py --json /tmp/AADC_THREE_ISLAND_SEASONS_V29.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-aadc-3-island-matched-seasons-1990-2004-V29
          path: /tmp/AADC_THREE_ISLAND_SEASONS_V29.json
