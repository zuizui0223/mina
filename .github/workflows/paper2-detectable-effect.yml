name: paper2-detectable-effect

concurrency:
  group: paper2-detectable-effect-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [analysis/paper2-detectable-effect-v1]
    paths:
      - "scripts/run_paper2_detectable_effect.py"
      - "tests/test_paper2_detectable_effect.py"
      - "contracts/PAPER2_DETECTABLE_EFFECT_V1.json"
      - ".github/workflows/paper2-detectable-effect.yml"
  pull_request:
    paths:
      - "scripts/run_paper2_detectable_effect.py"
      - "tests/test_paper2_detectable_effect.py"
      - "contracts/PAPER2_DETECTABLE_EFFECT_V1.json"
      - ".github/workflows/paper2-detectable-effect.yml"
  workflow_dispatch:

jobs:
  reference:
    runs-on: ubuntu-22.04
    permissions: {actions: read, contents: read}
    env: {GH_TOKEN: "${{ github.token }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install numpy pandas pyreadr
      - run: python -m unittest tests.test_paper2_detectable_effect -v
      - name: Download frozen primary permutation shards
        run: |
          mkdir -p build/perm
          gh run download 36562405904 -p 'paper2-v3-permutation-shard-*' -D build/perm
      - name: Build exact frozen permutation reference
        run: |
          python -m scripts.run_paper2_detectable_effect \
            --mode reference \
            --perm-shard-glob 'build/perm/**/shard_*.json' \
            --out-json build/PAPER2_DETECTABLE_EFFECT_REFERENCE.json
      - uses: actions/upload-artifact@v4
        with:
          name: paper2-detectable-effect-reference
          path: build/PAPER2_DETECTABLE_EFFECT_REFERENCE.json

  effect:
    needs: reference
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        effect: [-0.20, -0.25, -0.30, -0.35, -0.40, -0.45, -0.50, -0.55, -0.60]
    permissions: {actions: read, contents: read}
    env: {GH_TOKEN: "${{ github.token }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install numpy pandas pyreadr
      - uses: actions/download-artifact@v4
        with:
          name: paper2-detectable-effect-reference
          path: build/ref
      - name: Fetch pinned outcome-blind inputs
        run: |
          git clone --quiet https://github.com/CCheCastaldo/mapppdr.git build/mapppdr
          git -C build/mapppdr checkout --quiet 88c73a507e0921b2541c218c71eaf16721bc6502
          mkdir -p build/forcing build/options
          gh run download 36517700369 -n paper2-forcing-support-audit-v1 -D build/forcing
          gh run download 36520281872 -n antarctic-breeding-options-hierarchy-v1 -D build/options
      - name: Run frozen effect level
        run: |
          tag=$(python - <<'PY'
          x=abs(float("${{ matrix.effect }}"))
          print(f"{int(round(x*1000)):03d}")
          PY
          )
          python -m scripts.run_paper2_detectable_effect \
            --mode effect \
            --effect ${{ matrix.effect }} \
            --replicates 300 \
            --reference-json build/ref/PAPER2_DETECTABLE_EFFECT_REFERENCE.json \
            --forcing-json build/forcing/PAPER2_FORCING_SUPPORT_AUDIT_RESULT_V1.json \
            --forcing-csv build/forcing/PAPER2_FORCING_SUPPORT_UNITS_V1.csv \
            --breeding-csv build/options/ANTARCTIC_PENGUIN_BREEDING_OPTIONS_HIERARCHY_V1.csv \
            --mapppdr-dir build/mapppdr \
            --out-json build/effect_${tag}.json
      - uses: actions/upload-artifact@v4
        with:
          name: paper2-detectable-effect-${{ matrix.effect }}
          path: build/effect_*.json

  aggregate:
    needs: effect
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install numpy pandas pyreadr
      - uses: actions/download-artifact@v4
        with:
          name: paper2-detectable-effect-reference
          path: build/ref
      - uses: actions/download-artifact@v4
        with:
          pattern: paper2-detectable-effect--*
          path: build/effects
          merge-multiple: true
      - name: Aggregate detectable-effect curve
        run: |
          python -m scripts.run_paper2_detectable_effect \
            --mode aggregate \
            --reference-json build/ref/PAPER2_DETECTABLE_EFFECT_REFERENCE.json \
            --effect-glob 'build/effects/effect_*.json' \
            --out-json build/PAPER2_DETECTABLE_EFFECT_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: paper2-detectable-effect-result-v1
          path: build/PAPER2_DETECTABLE_EFFECT_RESULT_V1.json
