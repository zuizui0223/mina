# frozen execution trigger 2026-10-04
name: paper2d-first-real-dynamic-outcome

on:
  push:
    branches: [research/antarctic-island-ecology-v1]
    paths:
      - "contracts/PAPER2D_DYNAMIC_OUTCOME_EXECUTION_V1.json"
      - "results/PAPER2D_DYNAMIC_OUTCOME_RECOVERY_RECEIPT_V1.json"
      - "scripts/run_paper2d_dynamic_outcome.py"
      - "tests/test_paper2d_dynamic_outcome.py"
      - ".github/workflows/paper2d-first-real-dynamic-outcome.yml"
  pull_request:
    paths:
      - "contracts/PAPER2D_DYNAMIC_OUTCOME_EXECUTION_V1.json"
      - "results/PAPER2D_DYNAMIC_OUTCOME_RECOVERY_RECEIPT_V1.json"
      - "scripts/run_paper2d_dynamic_outcome.py"
      - "tests/test_paper2d_dynamic_outcome.py"
      - ".github/workflows/paper2d-first-real-dynamic-outcome.yml"
  workflow_dispatch:

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy pyreadr
      - run: python -m unittest tests.test_paper2d_dynamic_outcome -v
      - name: Download frozen inputs
        run: |
          mkdir -p build/forcing build/exposure build/recovery build/mapppdr build/out
          gh run download 36517700369 -n paper2-forcing-support-audit-v1 -D build/forcing
          gh run download 37190770020 -n paper2d-summer-exposure-full-v1 -D build/exposure
          gh run download 37198822009 -n paper2d-dynamic-outcome-recovery-v1 -D build/recovery
          git clone --quiet https://github.com/CCheCastaldo/mapppdr.git build/mapppdr
          git -C build/mapppdr checkout --quiet 88c73a507e0921b2541c218c71eaf16721bc6502
          test -f build/forcing/PAPER2_FORCING_SUPPORT_UNITS_V1.csv
          test -f build/exposure/PAPER2D_SUMMER_EXPOSURE_FULL_SITES_V1.csv
          test -f build/recovery/PAPER2D_DYNAMIC_OUTCOME_RECOVERY_RESULT_V1.json
      - name: Run frozen real dynamic association
        run: |
          python -m scripts.run_paper2d_dynamic_outcome \
            --unlock-contract contracts/PAPER2D_DYNAMIC_OUTCOME_EXECUTION_V1.json \
            --recovery-json build/recovery/PAPER2D_DYNAMIC_OUTCOME_RECOVERY_RESULT_V1.json \
            --forcing-csv build/forcing/PAPER2_FORCING_SUPPORT_UNITS_V1.csv \
            --exposure-csv build/exposure/PAPER2D_SUMMER_EXPOSURE_FULL_SITES_V1.csv \
            --mapppdr-dir build/mapppdr \
            --out-json build/out/PAPER2D_FIRST_REAL_DYNAMIC_OUTCOME_RESULT_V1.json \
            --out-collapsed-csv build/out/PAPER2D_FIRST_REAL_DYNAMIC_OUTCOME_ROWS_V1.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper2d-first-real-dynamic-outcome-v1
          path: build/out/*
          if-no-files-found: warn
