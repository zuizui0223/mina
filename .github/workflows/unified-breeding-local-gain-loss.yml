name: Unified breeding local gain loss
on:
  push:
    branches: [analysis/unified-breeding-reorganization-20261125]
    paths:
      - 'research/unified_breeding_reorganization_v1/local_gross_gain_loss.py'
      - '.github/workflows/unified-breeding-local-gain-loss.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 58fd7f4d0246c19344098dc5ce309343514346d2
          path: pinned-ross
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]" pandas lxml html5lib beautifulsoup4
      - run: |
          mkdir -p build/raw
          python scripts/fetch_lter_census.py build/raw/adelie_census.csv
          curl --fail -L --retry 3 --max-time 120 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=daf2c4fd-c1e3-4e65-851f-d11f02c5b69d&output=zip.tree' -o build/raw/signy_adelie.zip
          curl --fail -L --retry 3 --max-time 120 'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=d0633a9b-8c56-4ae5-88bf-6ec6ba9017b9&output=zip.tree' -o build/raw/signy_chinstrap.zip
      - run: python research/unified_breeding_reorganization_v1/local_gross_gain_loss.py --palmer build/raw/adelie_census.csv --signy-ad build/raw/signy_adelie.zip --signy-ch build/raw/signy_chinstrap.zip --ross pinned-ross/external/ross_island_v2_frozen_counts.csv --out /tmp/LOCAL_GROSS_GAIN_LOSS.json
      - uses: actions/upload-artifact@v4
        with:
          name: unified-local-gain-loss
          path: /tmp/LOCAL_GROSS_GAIN_LOSS.json
