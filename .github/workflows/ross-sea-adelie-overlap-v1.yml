name: ross-sea-adelie-overlap-v1
on:
  pull_request:
    paths:
      - 'research/signy_seal_spatial_pressure_v1/ross_sea_overlap.py'
      - '.github/workflows/ross-sea-adelie-overlap-v1.yml'
permissions:
  contents: read
  actions: read
jobs:
  overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests openpyxl pymupdf
      - name: Retrieve both pinned prior count archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build/ross_sea_overlap
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13669533413/zip" > build/legacy_counts.zip
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/fc134e364cf38699fa7611d7dee5fbbbcb370c0a" > build/legacy_annual_blob.json
      - run: python research/signy_seal_spatial_pressure_v1/ross_sea_overlap.py build/legacy_counts.zip build/legacy_annual_blob.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ross-sea-adelie-overlap-v1
          path: build/ross_sea_overlap/result.json
          if-no-files-found: error
          retention-days: 60
