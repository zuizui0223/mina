name: palmer-island-year-coherence-robustness

on:
  push:
    branches:
      - validation/island-year-coherence-robustness-v1
    paths:
      - "src/mina/island_year_coherence_robustness.py"
      - "tests/test_island_year_coherence_robustness.py"
      - "contracts/PALMER_ISLAND_YEAR_COHERENCE_ROBUSTNESS_V1.json"
      - ".github/workflows/palmer-island-year-coherence-robustness.yml"
  pull_request:
    paths:
      - "src/mina/island_year_coherence_robustness.py"
      - "tests/test_island_year_coherence_robustness.py"
      - "contracts/PALMER_ISLAND_YEAR_COHERENCE_ROBUSTNESS_V1.json"
      - ".github/workflows/palmer-island-year-coherence-robustness.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Run synthetic robustness test
        run: pytest -q tests/test_island_year_coherence_robustness.py
      - name: Fetch frozen LTER census
        run: python scripts/fetch_lter_census.py build/adelie_census.csv
      - name: Run strict robustness audits
        run: |
          python -m mina.island_year_coherence_robustness \
            --census build/adelie_census.csv \
            --out build/island_year_coherence_robustness.json \
            --permutations 20000 \
            --seed 20260927
      - name: Print robustness receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("build/island_year_coherence_robustness.json").read_text())
          p=x["positive_to_positive_only"]
          for key in ("five_island","four_island_no_litchfield"):
              v=p[key]
              print(
                  "positive_only",key,
                  "contrast=",v["observed"]["island_year_covariance_contrast"],
                  "p=",v["null"]["two_sided_p"],
                  "supported=",v["supported"],
              )
          for dropped,v in x["leave_one_island_out"].items():
              print(
                  "drop",dropped,
                  "contrast=",v["observed"]["island_year_covariance_contrast"],
                  "p=",v["null"]["two_sided_p"],
                  "supported=",v["supported"],
              )
          print("decision=",json.dumps(x["decision"],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: palmer-island-year-coherence-robustness
          path: |
            build/adelie_census.csv
            build/island_year_coherence_robustness.json
