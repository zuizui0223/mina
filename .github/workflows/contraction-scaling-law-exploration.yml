name: contraction-scaling-law-exploration

on:
  push:
    branches:
      - explore/contraction-scaling-law-v1
    paths:
      - "contracts/CONTRACTION_SCALING_LAW_EXPLORATION_V1.json"
      - "contracts/CONTRACTION_SCALING_SHAPE_EXPLORATION_V1.json"
      - "contracts/KAPPA_PREDICTOR_EXPLORATION_V1.json"
      - "contracts/CONTRACTION_MEMORY_EXPLORATION_V1.json"
      - "scripts/explore_contraction_scaling_law.py"
      - "scripts/explore_contraction_scaling_shape.py"
      - "scripts/explore_kappa_predictors.py"
      - "scripts/explore_contraction_memory.py"
      - "scripts/build_replicated_concentration_figure_data.py"
      - ".github/workflows/contraction-scaling-law-exploration.yml"
  workflow_dispatch:

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" pandas lxml html5lib beautifulsoup4
      - name: Fetch frozen public sources
        run: |
          mkdir -p build/raw build/figure_data build/scaling
          python scripts/fetch_lter_census.py build/raw/adelie_census.csv
          curl -L --fail --retry 4 --retry-delay 5             'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=daf2c4fd-c1e3-4e65-851f-d11f02c5b69d&output=zip.tree'             -o build/raw/signy_adelie.zip
          curl -L --fail --retry 4 --retry-delay 5             'https://ramadda.data.bas.ac.uk/repository/entry/show?entryid=d0633a9b-8c56-4ae5-88bf-6ec6ba9017b9&output=zip.tree'             -o build/raw/signy_chinstrap.zip
      - name: Rebuild source-checked trajectories
        run: |
          python -m scripts.build_replicated_concentration_figure_data             --palmer-census build/raw/adelie_census.csv             --signy-adelie-zip build/raw/signy_adelie.zip             --signy-chinstrap-zip build/raw/signy_chinstrap.zip             --palmer-receipt results/PALMER_BREEDING_PATCH_CONCENTRATION_RESULT_V1.json             --signy-adelie-receipt results/SIGNY_BREEDING_PATCH_CONCENTRATION_RESULT_V1.json             --signy-chinstrap-receipt results/SIGNY_CHINSTRAP_BREEDING_PATCH_CONCENTRATION_RESULT_V1.json             --dominance-receipt results/CONCENTRATION_DOMINANCE_DESCRIPTIVE_SUMMARY_V1.json             --out-dir build/figure_data
      - name: Run frozen exploratory rule family
        run: |
          python scripts/explore_contraction_scaling_law.py             --trajectories build/figure_data/figure1_trajectories.csv             --out build/scaling/CONTRACTION_SCALING_LAW_EXPLORATION_RESULT_V1.json
      - name: Run frozen stage-two shape family
        run: |
          python scripts/explore_contraction_scaling_shape.py \
            --trajectories build/figure_data/figure1_trajectories.csv \
            --out build/scaling/CONTRACTION_SCALING_SHAPE_EXPLORATION_RESULT_V1.json
      - name: Run frozen stage-three kappa predictors
        run: |
          python scripts/explore_kappa_predictors.py \
            --stage1 build/scaling/CONTRACTION_SCALING_LAW_EXPLORATION_RESULT_V1.json \
            --palmer-census build/raw/adelie_census.csv \
            --signy-adelie-receipt results/SIGNY_BREEDING_PATCH_CONCENTRATION_RESULT_V1.json \
            --signy-chinstrap-receipt results/SIGNY_CHINSTRAP_BREEDING_PATCH_CONCENTRATION_RESULT_V1.json \
            --out build/scaling/KAPPA_PREDICTOR_EXPLORATION_RESULT_V1.json
      - name: Run frozen stage-four memory family
        run: |
          python scripts/explore_contraction_memory.py \
            --trajectories build/figure_data/figure1_trajectories.csv \
            --out build/scaling/CONTRACTION_MEMORY_EXPLORATION_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: contraction-scaling-law-exploration-v1
          path: |
            build/scaling/*
            build/figure_data/figure1_trajectories.csv
            build/figure_data/figure2_summary.csv
            build/figure_data/FIGURE_DATA_RECEIPT_V1.json
