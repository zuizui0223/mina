name: Antarctic V27 original APBP panregional same-season penguin synchrony
on:
  push:
    branches: [research/antarctic-penguin-island-macro-v1]
    paths:
      - 'contracts/APBP_SPATIAL_SYNCHRONY_V27.md'
      - 'scripts/audit_apbp_panregional_synchrony_v27.py'
      - 'tests/test_apbp_panregional_synchrony_v27.py'
      - '.github/workflows/antarctic-apbp-panregional-synchrony-v27.yml'
  pull_request:
    paths:
      - 'contracts/APBP_SPATIAL_SYNCHRONY_V27.md'
      - 'scripts/audit_apbp_panregional_synchrony_v27.py'
      - 'tests/test_apbp_panregional_synchrony_v27.py'
      - '.github/workflows/antarctic-apbp-panregional-synchrony-v27.yml'
  workflow_dispatch:
jobs:
  original_APBP_multi_region:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source auditing and polar projection tools
        run: python -m pip install pytest pyproj
      - name: Test original month/method and source zero-vs-missing guards
        run: python -m pytest -q tests/test_apbp_panregional_synchrony_v27.py
      - name: Download published APBP derived original DwC source V2
        uses: actions/download-artifact@v4
        with:
          name: apbp-original-six-penguin-records-joined-SCHEMA-NO-EFFECT
          repository: zuizui0223/mina
          run-id: 39091772742
          github-token: ${{ github.token }}
          path: /tmp/apbp
      - name: Check panregional year-site paired support before opening nests
        run: |
          python scripts/audit_apbp_panregional_synchrony_v27.py \
            --source /tmp/apbp/APBP_ALL_ORIGINAL_MEASUREMENTS_V2.csv \
            --out /tmp/APBP_PANREGIONAL_SYNCHRONY_V27.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apbp-original-panregional-same-year-synchrony-v27
          path: /tmp/APBP_PANREGIONAL_SYNCHRONY_V27.json
