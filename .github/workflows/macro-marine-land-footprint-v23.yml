name: V23 MAPPPD5 macro footprint expansion
on:
  push:
    branches: [analysis/pygoscelis-count-functional-sensitivity-20261126]
    paths: ['.github/workflows/macro-marine-land-footprint-v23.yml']
permissions:
  contents: read
  actions: read
jobs:
  macro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: c67e55c9f4f657ef308c02a85c6ff366dce8e1f4
          path: original
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geographic dependencies
        run: python -m pip install --disable-pip-version-check numpy pyproj==3.7.1 shapely==2.1.2 pyshp==2.3.1
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45791422125
          artifact-ids: 15102313119
          path: old_area
      - name: Rebuild frozen V22 atlas and run original v5 comparison
        run: |
          python original/research/climate-penguin/macro_panantarctic_v1/build.py
          python research/macro_marine_land_footprint_v1/macro_footprint_v23.py original v23_result old_area
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro-footprint-v23
          path: v23_result/
          retention-days: 30
          if-no-files-found: warn
