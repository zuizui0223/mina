name: antarctic-breeding-options-atlas

on:
  push:
    branches: [analysis/antarctic-breeding-options-atlas-v1]
    paths:
      - "scripts/extract_breeding_options_atlas.py"
      - "contracts/ANTARCTIC_BREEDING_OPTIONS_ATLAS_V1.json"
      - ".github/workflows/antarctic-breeding-options-atlas.yml"
  pull_request:
    paths:
      - "scripts/extract_breeding_options_atlas.py"
      - "contracts/ANTARCTIC_BREEDING_OPTIONS_ATLAS_V1.json"
      - ".github/workflows/antarctic-breeding-options-atlas.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy pyreadr rasterio pyproj
      - name: Fetch pinned mapppdr
        run: |
          git clone --quiet https://github.com/CCheCastaldo/mapppdr.git build/mapppdr
          git -C build/mapppdr checkout --quiet 88c73a507e0921b2541c218c71eaf16721bc6502
      - name: Download Antarctic Ecosystem Inventory v1.0
        run: |
          mkdir -p build/aei
          curl -L --fail --retry 5 --retry-delay 5             'https://zenodo.org/records/11629115/files/AntarcticaEcosystemInventory_IceFreeLands_v1_int.tif?download=1'             -o build/aei/AntarcticaEcosystemInventory_IceFreeLands_v1_int.tif
          curl -L --fail --retry 5 --retry-delay 5             'https://zenodo.org/records/11629115/files/AntarcticaEcosystemInventory_IceFreeLands_v1_int.tif.vat.dbf?download=1'             -o build/aei/AntarcticaEcosystemInventory_IceFreeLands_v1_int.tif.vat.dbf
          echo 'cde880d73f7f18b44aecf5690aa2dc92  build/aei/AntarcticaEcosystemInventory_IceFreeLands_v1_int.tif' | md5sum -c -
          echo 'fa5363b1c0d882b4343e239d03dc2ba4  build/aei/AntarcticaEcosystemInventory_IceFreeLands_v1_int.tif.vat.dbf' | md5sum -c -
      - name: Build outcome-blind breeding-option atlas traits
        run: |
          python scripts/extract_breeding_options_atlas.py             --mapppdr-dir build/mapppdr             --raster build/aei/AntarcticaEcosystemInventory_IceFreeLands_v1_int.tif             --vat-dbf build/aei/AntarcticaEcosystemInventory_IceFreeLands_v1_int.tif.vat.dbf             --out-json build/BREEDING_OPTIONS_ATLAS_GATE1_RESULT_V1.json             --out-csv build/ANTARCTIC_PENGUIN_BREEDING_OPTIONS_ATLAS_V1.csv
      - uses: actions/upload-artifact@v4
        with:
          name: antarctic-penguin-breeding-options-atlas-v1
          path: |
            build/BREEDING_OPTIONS_ATLAS_GATE1_RESULT_V1.json
            build/ANTARCTIC_PENGUIN_BREEDING_OPTIONS_ATLAS_V1.csv
