name: Crozier early neighbor habitat and detection negative controls
on:
  push:
    branches:
      - research/island-recovery-stage-mechanism-gate-v1
    paths:
      - 'contracts/CROZIER_EARLY_NEIGHBOR_DETECTION_HABITAT_NEGCTRL_V1.json'
      - 'scripts/audit_crozier_neighbor_habitat_detection_sensitivity_v1.py'
      - 'tests/test_crozier_neighbor_habitat_detection_sensitivity_v1.py'
      - '.github/workflows/crozier-neighbor-habitat-negative-controls-v1.yml'
  pull_request:
    paths:
      - 'contracts/CROZIER_EARLY_NEIGHBOR_DETECTION_HABITAT_NEGCTRL_V1.json'
      - 'scripts/audit_crozier_neighbor_habitat_detection_sensitivity_v1.py'
      - 'tests/test_crozier_neighbor_habitat_detection_sensitivity_v1.py'
      - '.github/workflows/crozier-neighbor-habitat-negative-controls-v1.yml'
jobs:
  negcontrol-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce negative control synthetic tests and no p-values
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_crozier_neighbor_habitat_detection_sensitivity_v1.py
      - name: Fetch author original 2023 source commit without unreviewed later revisions
        env:
          ROOT: https://raw.githubusercontent.com/pointblue/solo_nests/04517cedac18950408abd4d0b510f4aae3447f05/data
        run: |
          set -e
          curl -fLsS --retry 2 --max-time 35 "$ROOT/solonest_obs_data_entry_2122.csv" -o /tmp/crozier_source_checks.csv
          curl -fLsS --retry 2 --max-time 35 "$ROOT/solo_outcomes.csv" -o /tmp/crozier_source_outcomes.csv
          curl -fLsS --retry 2 --max-time 35 "$ROOT/solonest_initial_locations.csv" -o /tmp/crozier_source_locations.csv
      - name: Run original 36-nest source habitat, site, effort and outcome detection checks
        run: |
          python scripts/audit_crozier_neighbor_habitat_detection_sensitivity_v1.py \
            --checks /tmp/crozier_source_checks.csv \
            --outcomes /tmp/crozier_source_outcomes.csv \
            --locations /tmp/crozier_source_locations.csv \
            --out /tmp/crozier_social_negative_controls.json
      - name: Check source claim boundary
        run: |
          python - <<'PY'
          import json
          z=json.load(open('/tmp/crozier_social_negative_controls.json'))
          assert z['n_original_breeding_sites']==36
          a=z['main_counts']
          assert (a['early_neighbor']['n'],a['none_detected']['n'])==(9,27)
          assert (a['early_neighbor']['n_directly_confirmed_creche'],a['none_detected']['n_directly_confirmed_creche'])==(5,6)
          assert z['logical_ascertainment_tipping_min_additional_unconfirmed_creche_positive_no_neighbor']==9
          assert not z['causal_social_protection_or_founding_claim_permitted']
          assert not z['p_values_or_confirmatory_estimates_fitted']
          assert not z['frozen_PR189_science_changed']
          print('CROZIER_SOURCE_NEGCTRL_PASS_NO_SOCIAL_CAUSAL_IDENTIFICATION')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crozier-2021-early-social-negative-controls
          path: /tmp/crozier_social_negative_controls.json
          if-no-files-found: ignore
          retention-days: 30
