name: V24b verified annual reallocation replay
on:
  push:
    branches: [analysis/pygoscelis-count-functional-sensitivity-20261126]
    paths: ['.github/workflows/macro-marine-land-v24b.yml']
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - name: Replay exact joined data and verify species aggregates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15168609505/zip" > v24.zip
          python research/macro_marine_land_footprint_v1/macro_marine_land_v24b.py v24.zip v24b_result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro-marine-land-v24b
          path: v24b_result/
          retention-days: 30
          if-no-files-found: warn
