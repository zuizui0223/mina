name: unified-network-concentration-step6-manuscript-facts

on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - "research/network_concentration_unified_v1/audit_step6_manuscript.py"
      - "research/network_concentration_unified_v1/MANUSCRIPT_FULL_DRAFT_V0_1.md"
      - ".github/workflows/unified-network-concentration-step6-manuscript-facts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manuscript-source-fact-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/climate-penguin-progress
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static source and syntax
        run: |
          python -m py_compile research/network_concentration_unified_v1/audit_step6_manuscript.py
          python research/network_concentration_unified_v1/audit_step6_manuscript.py
      - name: Require intact frozen claim and no submission-ready overclaim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/network_concentration_unified_v1/outputs/STEP6_MANUSCRIPT_SOURCE_QA.json")
          a=json.loads(p.read_text())
          assert a["status"]=="PASS_MANUSCRIPT_SOURCE_FACTS_WITH_DISCLOSED_MEASUREMENT_HOLD"
          assert a["frozen_source_cohorts"]=={"JNCC":663,"MAPPPD":12,"species_pairs":378}
          assert a["JNCC"]["positive"]==436
          assert a["full_paper_submission_ready"] is False
          assert set(a["fixed_hypothesis_decisions"])=={"H3","H4D","H4W"}
          print("Verified all externally auditable manuscript numbers")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mina-step6-manuscript-source-qa
          retention-days: 90
          path: research/network_concentration_unified_v1/outputs/STEP6_MANUSCRIPT_SOURCE_QA.json
      - name: Commit source fact QA on Draft PR only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/network_concentration_unified_v1/outputs/STEP6_MANUSCRIPT_SOURCE_QA.json
          if git diff --cached --quiet; then
            echo "Audit unchanged"
          else
            git commit -m "Step6: verify integrated draft against locked original data and hypothesis receipts"
            git push origin HEAD:codex/climate-penguin-progress
          fi
