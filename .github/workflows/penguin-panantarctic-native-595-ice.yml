name: Penguin original pan-Antarctic 595-site OSI SAF sea-ice source pilot
on:
  push:
    branches: [codex/climate-penguin-progress]
    paths:
      - 'research/climate-penguin/macro_panantarctic_v1/extract_original_595_monthly_SIC.py'
      - 'research/climate-penguin/macro_panantarctic_v1/ICE_595_SOURCE_GATE_20261109.md'
      - '.github/workflows/penguin-panantarctic-native-595-ice.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-595-sites-osi-source:
    runs-on: ubuntu-22.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verified original publisher NetCDF and spatial readers
        run: python -m pip install --disable-pip-version-check numpy scipy pyproj==3.7.1 xarray netCDF4
      - name: Check original source macro and SIC extraction scripts
        run: |
          python -m py_compile research/climate-penguin/macro_panantarctic_v1/build.py
          python -m py_compile research/climate-penguin/macro_panantarctic_v1/extract_original_595_monthly_SIC.py
      - name: Rebuild 595 original penguin observed sites and frozen source metadata
        run: python research/climate-penguin/macro_panantarctic_v1/build.py
      - name: Read original 25-km publisher EASE2 sea ice at every Antarctic colony
        run: python research/climate-penguin/macro_panantarctic_v1/extract_original_595_monthly_SIC.py
      - name: Preserve original 595-site source bridge, year-month-SIC and publisher SHA receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: penguin-original-595site-OSI-SAF-marine-ice-macro-source-pilot
          path: |
            research/climate-penguin/macro_panantarctic_v1/outputs/macro_original_coverage.json
            research/climate-penguin/macro_panantarctic_v1/ice_595_outputs/*.csv
            research/climate-penguin/macro_panantarctic_v1/ice_595_outputs/*.json
          if-no-files-found: warn
