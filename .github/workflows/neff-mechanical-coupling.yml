name: neff-mechanical-coupling

on:
  push:
    branches:
      - validation/neff-mechanical-coupling-v1
    paths:
      - "contracts/PALMER_NEFF_MECHANICAL_COUPLING_V1.json"
      - "src/mina/neff_coupling.py"
      - "tests/test_neff_coupling.py"
      - ".github/workflows/neff-mechanical-coupling.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "contracts/PALMER_NEFF_MECHANICAL_COUPLING_V1.json"
      - "src/mina/neff_coupling.py"
      - "tests/test_neff_coupling.py"
      - ".github/workflows/neff-mechanical-coupling.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Fetch frozen Palmer census
        run: python scripts/fetch_lter_census.py build/adelie_census.csv
      - name: Run N_eff mechanical-coupling simulation
        run: |
          mina-neff-coupling \
            --census build/adelie_census.csv \
            --out build/neff_mechanical_coupling.json \
            --simulations 10000 \
            --seed 20260927
      - name: Print diagnostic
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("build/neff_mechanical_coupling.json").read_text())
          print("observed_beta=",x["observed_standardized_beta"])
          for name,result in x["error_models"].items():
              print(name)
              print(" coupled=",json.dumps(result["coupled_beta"],sort_keys=True))
              print(" decoupled=",json.dumps(result["decoupled_beta"],sort_keys=True))
              print(" bias=",json.dumps(result["paired_coupling_bias"],sort_keys=True))
          print("decision=",x["decision"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: neff-mechanical-coupling
          path: build/neff_mechanical_coupling.json
