name: mapppd-intensification-before-expansion-diagnostic

on:
  push:
    branches: [research/intensification-before-expansion-v1]
    paths:
      - "contracts/MAPPPD_INTENSIFICATION_BEFORE_EXPANSION_DIAGNOSTIC_V1.json"
      - "scripts/diagnose_mapppd_intensification_before_expansion.py"
      - "tests/test_mapppd_intensification_before_expansion.py"
      - ".github/workflows/mapppd-intensification-before-expansion.yml"
  pull_request:
    paths:
      - "contracts/MAPPPD_INTENSIFICATION_BEFORE_EXPANSION_DIAGNOSTIC_V1.json"
      - "scripts/diagnose_mapppd_intensification_before_expansion.py"
      - "tests/test_mapppd_intensification_before_expansion.py"
      - ".github/workflows/mapppd-intensification-before-expansion.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pandas pyreadr
      - run: python -m unittest tests.test_mapppd_intensification_before_expansion -v
      - name: Fetch pinned MAPPPD snapshot
        run: |
          git clone --quiet https://github.com/CCheCastaldo/mapppdr.git build/mapppdr
          git -C build/mapppdr checkout --quiet 88c73a507e0921b2541c218c71eaf16721bc6502
          test "$(git -C build/mapppdr rev-parse HEAD)" = "88c73a507e0921b2541c218c71eaf16721bc6502"
      - name: Run post-hoc allocation diagnostic once
        run: |
          mkdir -p build/out
          python -m scripts.diagnose_mapppd_intensification_before_expansion \
            --mapppdr-dir build/mapppdr \
            --out-json build/out/MAPPPD_INTENSIFICATION_BEFORE_EXPANSION_DIAGNOSTIC_RESULT_V1.json \
            --out-csv build/out/MAPPPD_INTENSIFICATION_BEFORE_EXPANSION_TRANSITIONS_V1.csv
      - uses: actions/upload-artifact@v4
        with:
          name: mapppd-intensification-before-expansion-diagnostic-v1
          path: build/out/*
